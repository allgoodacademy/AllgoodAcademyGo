# Deploys the `staging` branch to a persistent Firebase Hosting preview
# channel, separate from the live site (which only deploys from `main`).
name: Deploy to Firebase Hosting Staging Channel
'on':
  push:
    branches:
      - staging
jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALLGOOD_ACADEMY }}'
          channelId: staging
          projectId: allgood-academy
