# Deploys firestore.rules whenever it (or firebase.json) changes on main. Hosting
# deploys automatically on every push (see firebase-hosting-merge.yml), but Firestore
# security rules do NOT — they need this separate step, using the same service
# account already set up for Hosting deploys.
name: Deploy Firestore Rules

on:
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'firebase.json'

jobs:
  deploy_rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write service account credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALLGOOD_ACADEMY }}' > "${{ runner.temp }}/firebase-service-account.json"
      - name: Deploy Firestore rules
        run: npx firebase-tools deploy --only firestore:rules --project allgood-academy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
