# Deploys firestore.rules whenever it (or firebase.json) changes on main. Hosting
# deploys automatically on every push (see firebase-hosting-merge.yml), but Firestore
# security rules do NOT — they need this separate step, using the same service
# account already set up for Hosting deploys.
name: Deploy Firestore Rules

on:
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'firebase.json'

jobs:
  test_rules:
    name: test-rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Run Firestore rules tests (against the emulator)
        run: npm run test:rules

  deploy_rules:
    needs: test_rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write service account credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALLGOOD_ACADEMY }}' > "${{ runner.temp }}/firebase-service-account.json"
      - name: Deploy Firestore rules
        run: npx firebase-tools deploy --only firestore:rules --project allgood-academy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
