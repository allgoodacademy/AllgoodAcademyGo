# Fails the build when the hand-maintained module lists disagree: dashboard MODULE_REGISTRY,
# Insider COURSES, Lab Pack hub cards, each module's Telemetry.init and the docs table.
# See "Publishing a module" in docs/goodblock-integration-checklist.md.
#
# Also runs the Challenge copy validator, which enforces the authored Voice Standard on
# every Challenge's SCENARIO_DATA (setup under 45 words and 3 sentences, options readable
# on their own). Structural checks say nothing about whether the question can be read.
#
# And the brand-token check, which fails when tailwind/theme.js and
# public/assets/css/design-tokens.css disagree about a shared color or font stack. Those
# two files feed different consumers (utility classes vs. hand-written CSS in a page's
# <style> block) and neither can import the other, so nothing but this check stops them
# drifting into rendering two different oranges.
#
# And the nav check, which fails when a page's generated nav region no longer matches
# nav/nav.js. Six public pages carry that bar; when each one was hand-written, a "Games"
# link added to the homepage reached none of the other five and nobody noticed for days.
# Edit nav/nav.js and run `npm run build:nav` — never hand-edit the region in a page.
name: Module registry check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-modules.js
      - run: node scripts/check-challenge-copy.js
      - run: node scripts/check-tokens.js
      - run: node scripts/build-nav.js --check
