# Deploys the Cloud Functions (functions/: the Stripe webhook that turns on Mission Control
# Pro, and espanolIdeaEmail, which emails Español hub ideas to learning@) from GitHub, so the
# founder never needs a terminal.
#
#   - Runs on any push to main that touches functions/ (or this file), after the function
#     tests pass.
#   - Or by hand: GitHub → Actions → "Deploy functions" → Run workflow.
#
# Uses the same service account as the Hosting and Firestore-rules deploys
# (FIREBASE_SERVICE_ACCOUNT_ALLGOOD_ACADEMY). That account needs, in Google Cloud IAM:
# Cloud Functions Admin, Service Account User, Secret Manager Admin, Artifact Registry
# Administrator, Cloud Build Editor and Cloud Run Admin; and the Cloud Functions, Cloud
# Build, Artifact Registry, Cloud Run, Eventarc, Pub/Sub and Secret Manager APIs must be
# enabled. Both were set up by hand in the console on 2026-11-25.
#
# The Stripe signing secret (STRIPE_WEBHOOK_SECRET) lives in Google Secret Manager, never in
# this repo; it must exist there before the first deploy.
name: Deploy functions

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Verbose firebase-tools output (for diagnosing a failed deploy)'
        type: boolean
        default: false
      recreate:
        description: 'Delete stripeWebhook first (only for a function stuck in a failed state)'
        type: boolean
        default: false

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy_functions:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install repo dependencies (pinned firebase-tools)
        run: npm ci
      - name: Install function dependencies
        run: npm ci
        working-directory: functions
      - name: Write service account credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALLGOOD_ACADEMY }}' > "${{ runner.temp }}/firebase-service-account.json"
      - name: Delete a stuck function first
        if: ${{ inputs.recreate }}
        run: node_modules/.bin/firebase functions:delete stripeWebhook --region us-central1 --project allgood-academy --force --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
      # espanolIdeaEmail needs GMAIL_APP_PASSWORD in Secret Manager. The founder pastes the
      # Gmail app password (learning@allgoodacademy.com) into the GitHub secret of the same name;
      # this copies it into Secret Manager on every run (each run adds a secret version).
      # Until the GitHub secret exists, only stripeWebhook is deployed, so Stripe never waits
      # on email setup.
      - name: Store the Gmail app password in Secret Manager
        id: gmail
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ -z "$GMAIL_APP_PASSWORD" ]; then
            echo "GMAIL_APP_PASSWORD GitHub secret not set: deploying stripeWebhook only (no Español idea email)."
            echo "targets=functions:stripeWebhook" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$GMAIL_APP_PASSWORD" | tr -d '[:space:]' > "${{ runner.temp }}/gmail-app-password"
          node_modules/.bin/firebase functions:secrets:set GMAIL_APP_PASSWORD --data-file "${{ runner.temp }}/gmail-app-password" --project allgood-academy --non-interactive --force
          rm -f "${{ runner.temp }}/gmail-app-password"
          echo "targets=functions" >> "$GITHUB_OUTPUT"
      - name: Deploy functions
        # --force accepts the default Artifact Registry cleanup policy, which the CLI would
        # otherwise stop to ask about in a non-interactive run.
        run: node_modules/.bin/firebase deploy --only ${{ steps.gmail.outputs.targets }} --project allgood-academy --non-interactive --force ${{ inputs.debug && '--debug' || '' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
