# Fails a PR when any Español story with recorded voices (every scripts/espanol-audio/<story>.lines.json:
# El Viaje, La selva, …) says a line that has no recorded clip, or its clip folder and manifest drift
# from its lines.json. It only reads committed files: no ElevenLabs key, no network. To fix a failure,
# update <story>.lines.json and run `npm run audio:<story>` from a session on the AllgoodAcademyGo
# environment (see CLAUDE.md and docs/espanol-audio.md).
name: Español audio check

on:
  pull_request:
    paths:
      - 'public/espanol/**'
      - 'public/assets/audio/**'
      - 'scripts/espanol-audio/**'
      - 'scripts/render-espanol-audio.mjs'
      - 'tests/espanol-audio.test.mjs'
      - '.github/workflows/espanol-audio-check.yml'

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:espanol-audio
