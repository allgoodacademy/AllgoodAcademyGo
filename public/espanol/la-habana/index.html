<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Habana · Allgood Academy</title>
<meta name="robots" content="noindex, nofollow">
<!-- A signed-in teacher who opens this story from the /espanol/ hub gets Presentar en clase by
     default (/js/story-tracking.js). Everyone else gets the story. ?mode=solo turns it off. -->
<meta name="ag-presentar-default" content="hub">
<link rel="stylesheet" href="/assets/css/design-tokens.css">
<script src="/js/reduced-motion.js"></script>
<script src="/js/site-config.js"></script>
<script src="/js/story-tracking.js"></script>
<link rel="stylesheet" href="/assets/css/fonts.css">
<style>

/* VOICE: a warm field guide for beginners, calm and clear, never babyish.
   IDEA: a morning rainforest walk; gates are wooden trail markers, progress is the passport.
   PICTURE: layered daylight canopy, real Costa Rican animals drawn flat and accurate.
   COLOUR and TYPE: forest greens and morning sky, bronze signs, one orange action; Gelasio + Atkinson Hyperlegible Next.
   LAYOUT: one centered column of scenes; each scene a framed 15:8 picture with its card under it. */
:root{color-scheme:light;--orange:var(--color-orange);--orange-d:#A8380F;--teal:var(--color-teal);--teal-d:#245866;--bronze:#B0773A;--bronze-d:#7A4E1F;
--cream:var(--color-cream);--paper:#F5E6D3;--ink:#1F2A24;--ink2:#4A5650;--ok:#2E7D4F;--ok-wash:#E3F1E7;--forest:#12343B;--sky:#F3D27C;
--site-h:74px;--nav-h:74px;--nav-fade:var(--forest);--nav-fade-end:var(--forest)}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--site-h) + 56px)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--forest);color:var(--ink);font:17px/1.55 var(--font-ui);overflow-x:clip}
h1,h2,.serif{font-family:var(--font-display)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid #FFB347;outline-offset:3px}
.bar{position:sticky;top:var(--site-h);transition:top .25s ease;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px max(4vw,14px);background:rgba(18,52,59,.95);color:#F4EFE6;font-size:14px}
.bar b{font-weight:700}
.pass{display:flex;align-items:center;gap:8px}
.pass .bk{background:var(--teal-d);border-radius:8px;padding:5px 9px;display:flex;gap:6px;align-items:center}
.slot{width:26px;height:26px;border-radius:50%;border:2px dashed #9FC2B4;display:grid;place-items:center;font-size:12px;font-weight:700;color:transparent}
.slot.on{border:2px solid #fff;background:var(--ok);color:#fff;animation:thunk .5s ease}
@keyframes thunk{0%{transform:scale(2.2) rotate(-20deg);opacity:0}70%{transform:scale(.9)}100%{transform:scale(1)}}
.tools{display:flex;gap:6px;align-items:center}
.tool{display:none;background:var(--bronze);color:#fff;border-radius:999px;padding:4px 10px;font-size:13px}
.tool.on{display:inline-block}
.sec{max-width:1040px;margin:0 auto;padding:28px max(4vw,14px) 40px}
.locked{display:none}
.frame{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 2px 4px rgba(5,20,25,.18),0 14px 34px rgba(10,30,20,.22);background:var(--sky)}
.frame>svg{display:block;width:100%;height:auto}
.card{background:var(--cream);border-radius:16px;padding:20px 24px;margin-top:-28px;position:relative;box-shadow:0 1px 2px rgba(10,30,20,.12),0 10px 24px rgba(10,30,20,.18);border:1px solid #EADFCB;max-width:760px;margin-inline:auto}
.card+.card{margin-top:14px}
.eyebrow{font-size:14px;color:var(--teal-d);font-weight:700}
h1{font-size:clamp(40px,7vw,64px);line-height:1.05;letter-spacing:-.02em;margin:4px 0 2px;color:var(--forest)}
h2{font-size:clamp(26px,4vw,34px);line-height:1.1;letter-spacing:-.02em;margin:0 0 6px;color:var(--forest)}
.sub{font-size:20px;color:var(--ink2);margin:0 0 10px}
.lvl{display:flex;gap:4px;align-items:center;font-size:14px;color:var(--ink2)}
.lvl i{width:34px;height:8px;border-radius:4px;background:#D8D2C6}.lvl i.f{background:var(--bronze)}
.go{background:var(--orange);color:#fff;border:0;border-radius:999px;padding:12px 26px;font-weight:700;font-size:18px;min-height:48px}
.go:hover{background:var(--orange-d)}.go[disabled]{background:#B9B2A6;cursor:not-allowed}
.ghost{background:none;border:2px solid var(--teal);color:var(--teal-d);border-radius:999px;padding:8px 18px;font-weight:700;min-height:44px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:12px}
.start-grid{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:18px;align-items:center}
.polaroid{background:#fff;padding:10px 10px 30px;border-radius:4px;transform:rotate(3deg);box-shadow:0 6px 14px rgba(0,0,0,.25);font-size:13px;color:var(--ink2);text-align:center}
.polaroid div{aspect-ratio:1;background:repeating-linear-gradient(45deg,#E9E2D4 0 10px,#F2ECE0 10px 20px);display:grid;place-items:center;margin-bottom:6px;font-size:12px;padding:8px}
@media(max-width:600px){.start-grid{grid-template-columns:1fr}.polaroid{width:170px;margin:4px auto 0}}
.line{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 12px;align-items:start;margin:10px 0}
.who{grid-column:2;font-size:13px;font-weight:700;color:var(--teal-d)}
.play{grid-row:span 3;width:44px;height:44px;border-radius:50%;border:0;background:var(--teal);color:#fff;display:grid;place-items:center}
.play svg{width:22px;height:22px}
.es{grid-column:2;margin:0;font-size:21px;font-family:var(--font-display);transition:filter .3s}
.es.blur{filter:blur(6px);cursor:pointer;user-select:none}
.en-row{grid-column:2;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.en-btn{background:none;border:1px solid #B9B2A6;border-radius:6px;font-size:13px;padding:1px 8px;color:var(--ink2);min-height:28px}
.en{margin:0;color:var(--ink2);font-size:15px}
.narr{display:flex;gap:12px;align-items:center;font-size:17px}
.narr .play{grid-row:auto;background:var(--bronze);flex:none}
.narr p{margin:0}
.tip{border-bottom:2px dotted var(--teal);cursor:help}
.ficha{display:grid;grid-template-columns:44px minmax(0,1fr);gap:2px 12px;background:#fff;border:2px solid #D9E7DC;border-radius:14px;padding:12px 14px;margin-top:12px}
.ficha .play{grid-row:span 3;background:var(--ok)}.ficha b{font-family:var(--font-display);font-size:19px}.ficha .sci{font-size:13px;color:var(--ink2)}.ficha p{margin:2px 0 0;font-size:15px}
.fichas h3{font:700 15px var(--font-ui);color:var(--teal-d);margin:16px 0 0}
.real-row{grid-column:2;margin-top:6px}
.foto summary,.foto-link{display:inline-block;cursor:pointer;font-weight:700;font-size:14px;color:var(--teal-d);border:2px solid var(--teal);border-radius:999px;padding:5px 14px;text-decoration:none;list-style:none}
.foto summary::-webkit-details-marker{display:none}.foto[open] summary{background:var(--teal);color:#fff}
.foto img{display:block;width:min(320px,100%);border-radius:10px;margin-top:8px;border:4px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.18)}.foto small{display:block;font-size:13px;color:var(--ink2);margin-top:4px}
.pin .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
.pin:hover .disc,.pin:focus-visible .disc{fill:#fff}
.why{background:#FFF8EC;border:2px solid #F0DDBE;border-radius:14px;padding:12px 14px;margin-top:12px;font-size:15px}
.culture{background:#EAF1E4;border-left:0;border-radius:12px;padding:10px 14px;font-size:15px;margin-top:10px}
/* boarding pass */
.bpass{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:760px;margin:0 auto}
.bp-top{background:var(--bronze);color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bp-top b{font-family:var(--font-display);font-size:22px}
.dots{display:flex;gap:6px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #fff}.dots i.d{background:#fff}
.bp-body{padding:16px 18px 20px;border-top:3px dashed #E1D3BE}
.pics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:10px}
.pic{position:relative;background:#F6F1E7;border:3px solid #E1D8C6;border-radius:14px;padding:8px;min-height:120px}
.pic svg{width:100%;height:auto;display:block}
.pic:hover{border-color:var(--teal)}
.pic[aria-pressed=true]{border-color:var(--orange);background:#FFF4EC}
.pic .ab{position:absolute;top:6px;left:8px;font-size:13px;font-weight:700;color:var(--ink2)}
.pic.right{border-color:var(--ok);background:var(--ok-wash)}
.pic[disabled]{cursor:default}
.ready{text-align:center;padding:10px 0 4px}
.ready h2{color:var(--ok)}
/* gate sign */
.sign{background:var(--bronze);color:#fff;border-radius:12px;padding:12px 18px;display:flex;gap:16px;align-items:center;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 6px 14px rgba(0,0,0,.3);max-width:760px;margin:0 auto 16px;flex-wrap:wrap}
.sign .n{font-family:var(--font-display);font-size:44px;line-height:1;font-weight:700}
.sign .t{font-size:14px;letter-spacing:.02em}.sign .t b{display:block;font-size:20px}
.status{margin-left:auto;background:#4A2E12;border-radius:8px;padding:6px 12px;font-weight:700;font-size:15px}
.status.ok{background:var(--ok)}
.binos{max-width:560px;margin:14px auto 0}
.binos svg{width:100%;height:auto;display:block}
.jodi{display:flex;gap:12px;align-items:flex-start;background:#fff;border:2px solid var(--paper);border-radius:14px;padding:12px 14px;margin-top:12px}
.jav{flex:none;width:52px;height:52px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;color:var(--teal-d);font-size:22px}
.jodi p{margin:2px 0 0}
.note{font-size:13px;color:#C9D9CF;text-align:center;margin:8px 0 0}
.hot{cursor:pointer}.hot:focus{outline:none}.hot:focus-visible .ring{stroke:#FFB347;stroke-width:5}
.chip{font:700 18px var(--font-ui)}
.fin{text-align:center;color:#F4EFE6}
.polaroid img{display:block;width:100%;aspect-ratio:1;object-fit:cover;margin-bottom:6px}
.based{font-size:14px;color:var(--ink2);margin:10px 0 0}
.real{display:flex;gap:14px;align-items:center;background:#1F2A24;color:#F4EFE6;border-radius:14px;padding:10px 12px;margin-top:12px;animation:slide .5s ease}
.real img{width:96px;height:96px;object-fit:cover;border-radius:6px;border:4px solid #fff;transform:rotate(-3deg);flex:none}
.real small{display:block;color:#B9D3C4;font-size:13px}
@keyframes slide{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.roll{background:var(--bronze);color:#fff;border-radius:999px;padding:4px 10px;font-size:13px}
.lens{max-width:420px;margin:14px auto 0}.lens svg{width:100%;height:auto;display:block}

/* La Habana additions */
.title-photo{position:relative}
.title-photo img{display:block;width:100%;aspect-ratio:15/8;object-fit:cover}
.title-photo figcaption{position:absolute;right:12px;bottom:40px;background:rgba(18,52,59,.86);color:#F4EFE6;font-size:13px;padding:4px 10px;border-radius:999px}
.rain path{animation:fall .9s linear infinite}
.rain path:nth-child(3n){animation-delay:-.3s}.rain path:nth-child(3n+1){animation-delay:-.6s}
@keyframes fall{from{transform:translateY(-40px)}to{transform:translateY(40px)}}
.says{display:grid;gap:12px;margin-top:12px}
.say-opt{display:grid;grid-template-columns:34px 44px minmax(0,1fr);gap:10px;align-items:center;text-align:left;background:#fff;border:3px solid #E1D8C6;border-radius:16px;padding:10px 14px;min-height:64px}
.say-opt .ab{font-weight:700;color:var(--ink2);font-size:15px}
.say-opt .q{font-family:var(--font-display);font-size:21px;color:var(--ink)}
.say-opt .mini{width:40px;height:40px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center}
.say-opt .mini svg{width:20px;height:20px}
.say-opt:hover{border-color:var(--teal)}
.say-opt[aria-pressed=true]{border-color:var(--orange);background:#FFF4EC}
.say-opt.right{border-color:var(--ok);background:var(--ok-wash)}
.say-opt.wrongpick{border-color:#C8553D}
.say-opt[disabled]{cursor:default}
.jodi img{width:64px;height:64px;flex:none}
.kate{background:#EEF5F6;border-radius:12px;padding:8px 12px;font-size:15px;margin-top:8px}
.vb{font-weight:700;color:var(--orange-d)}.vb2{font-weight:700;color:var(--teal-d)}
.coming{color:#F4EFE6;max-width:760px;margin:0 auto}
.coming ol{padding-left:22px;line-height:1.8}
.coming img{width:100%;border-radius:14px;margin-top:10px;aspect-ratio:16/7;object-fit:cover}
@media(max-width:560px){.bar>span:first-child{display:none}.bar{justify-content:flex-end}.roll,.pass .bk{white-space:nowrap}}
.title-photo img{object-position:30% 60%}
.pic{color:var(--ink)}.pic small{color:var(--ink2)}.pic[disabled]{color:var(--ink)}.pic[disabled] small{color:var(--ink2)}
/* Kate's lines (English): a ▶ like every other line */
.kline{display:flex;gap:12px;align-items:center}.kline .play{grid-row:auto;flex:none}.kline p{margin:0}
/* The site nav (generated, nav/nav.js) sits above the story bar and slides away on scroll-down,
   as on La selva. --site-h is how much of it shows; the script after the nav keeps it exact. */
body .nav-shell{z-index:61;transition:transform .25s ease}
body .nav-shell.nav-away{transform:translateY(-100%)}
.tools>*,.pass .bk>*{flex:none}.roll{white-space:nowrap}
/* A Puerta's scene and its gate are two sections that open together: keep them as close as one. */
section.gate{padding-top:0}
/* Presentar en clase (/js/story-presentar.js): each Puerta's class-vote box lives in .cv, which
   only shows there. Its stylesheet sizes .opt / .slot for a projector; keep this page's. */
.cv{display:none}
body.presentar .cv{display:block;margin-top:12px}
body.presentar .pic.opt,body.presentar .say-opt.opt{padding:10px 14px;font-size:inherit}
body.presentar .bar .slot{font-size:12px}
</style>
</head>

<style>

.nav-shell .nav-link:hover{background:var(--color-teal-wash);color:var(--color-teal-deep)}
.nav-shell .nav-link.here{background:var(--color-teal-wash);color:var(--color-teal-deep);font-weight:700}

<style>
.site-nav .nav-links{display:flex;align-items:center;gap:4px}
.nav-shell .nav-menu{display:none}

  .site-nav .nav-cta{padding-left:12px;padding-right:12px}

});

<script>
{
const $=s=>document.querySelector(s);
/* telemetry: the shared Telemetry API through /js/story-tracking.js, stream 'espanol', as on La
   selva. Only fixed keys, item ids (p1:ser) and 0/1 scores are sent: this page has no name entry
   and no text input. #debug logs every call to the console. */
const DBG=location.hash==='#debug';
function dlog(k,o){if(!DBG)return;try{console.log('[la-habana]',k,o)}catch(e){}}
const ST=window.StoryTrack||null;
if(ST&&DBG)ST.setDebug(dlog);
const TM=ST?ST.TM:{init:o=>dlog('init',o),step:n=>dlog('step',{n}),choice:o=>dlog('choice',o),complete:o=>dlog('complete',o),summary:o=>dlog('summary',o),track:(e,m)=>dlog('track:'+e,m||{})};
TM.init({module:'la-habana',gameName:'La Habana',stream:'espanol',stepsTotal:14});
const T=(e,d)=>TM.track(e,Object.assign({v:'1.0'},d||{}));
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait=ms=>new Promise(r=>setTimeout(r,reduce?Math.min(ms,60):ms));
/* ---------- audio: recorded voices, as in La selva (docs/espanol-audio.md) ----------
   Every spoken line is an ElevenLabs clip pre-rendered to /assets/audio/espanol/la-habana/ and
   looked up in its manifest by its text (curly quotes stripped, spaces collapsed). One shared
   Audio element: each say() stops whatever was playing. The manifest is fetched as the page
   loads, so the first ▶ plays at once. A line missing from the manifest, or a clip that fails,
   falls back to the browser's speech voice. */
let voices=[];const hasTTS='speechSynthesis' in window;const loadV=()=>{try{voices=speechSynthesis.getVoices()}catch(e){}};loadV();try{speechSynthesis.onvoiceschanged=loadV}catch(e){}
function utter(t,lang){const u=new SpeechSynthesisUtterance(t);const pref=lang==='en'?['en-GB','en-US','en']:['es-US','es-MX','es-419','es'];
  let v=null;for(const p of pref){v=voices.find(x=>x.lang&&x.lang.replace('_','-').startsWith(p));if(v)break}
  u.lang=lang==='en'?'en-US':'es-MX';if(v)u.voice=v;u.rate=lang==='en'?1:.85;return u}
function sayTTS(t,lang){if(!hasTTS)return;try{speechSynthesis.cancel();speechSynthesis.speak(utter(t,lang))}catch(e){}}
const AUD={m:null,p:null,el:null,n:0,end:null};
function audManifest(){return AUD.p||(AUD.p=fetch('/assets/audio/espanol/la-habana/manifest.json').then(r=>r.ok?r.json():{}).catch(()=>({})).then(m=>AUD.m=m||{}))}
audManifest();
/* say() resolves when the line is over: the clip ended, a newer line replaced it, or a time cap. */
function say(t,lang){const k=String(t).replace(/[“”]/g,'').replace(/\s+/g,' ').trim(),n=++AUD.n,est=900+k.length*75;
  let done;const p=new Promise(r=>{done=r});
  const tts=()=>{sayTTS(t,lang);setTimeout(done,est)};
  if(hasTTS)try{speechSynthesis.cancel()}catch(e){}
  if(AUD.end)AUD.end();AUD.end=done;
  if(typeof Audio!=='function'){tts();return p}
  let a=AUD.el;if(!a){a=AUD.el=new Audio();a.preload='none'}
  try{a.pause()}catch(e){}
  const go=m=>{if(n!==AUD.n){done();return}const u=m[k];if(!u){tts();return}
    const fail=()=>{if(n===AUD.n){AUD.n++;tts()}};
    a.onerror=fail;a.onended=()=>{if(n===AUD.n)done()};a.src=u;setTimeout(done,est+4000);
    try{const q=a.play();if(q&&q.catch)q.catch(e=>{if(!e||e.name!=='AbortError')fail()})}catch(e){fail()}};
  if(AUD.m)go(AUD.m);else audManifest().then(go);
  return p}
const spk='<svg aria-hidden="true"><use href="#speaker"/></svg>';
const PH='/assets/espanol/la-habana/';
const S={emb:[],adu:[],tr:[],gates:[],photos:[],fork:null,mode:'solo'};

/* ---------- progress, summary, Presentar ---------- */
/* Steps: a section counts once it crosses the middle of the screen (as on La selva). */
const seen=new Set();
const io=('IntersectionObserver' in window)?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const n=+e.target.dataset.step;if(n&&!seen.has(n)){seen.add(n);TM.step(n)}}}),{rootMargin:'-45% 0px -45% 0px',threshold:0}):null;
function watch(el){if(io&&el&&el.dataset.step)io.observe(el)}
document.querySelectorAll('[data-step]').forEach(el=>{if(!el.classList.contains('locked'))watch(el)});
/* first try 0|1 per Puerta, the fork, solo|class, and Embarque → Aduana (+ the transfer) */
function gatesNow(){const g={};S.gates.forEach(x=>{g[x.n]=x.ok?1:0});return g}
const checksNow=()=>({form:'A',emb:S.emb.slice(),adu:S.adu.slice(),tr:S.tr.slice()});
function pushSummary(){TM.summary({gates:gatesNow(),path:{f1:S.fork||null},mode:S.mode,checks:checksNow()})}
/* module_progress/la-habana: the dashboard's In progress pill and Mission Control's fallback.
   `checks` is the shape Mission Control's growth view reads (public/espanol/la-habana/checks.json):
   four Embarque items, four Aduana items, and the two transfer sentences (`tr`). Never written in
   Presentar. */
function saveProgress(fin){const st={done:{},choice:{},conf:{},path:{f1:S.fork||null}};S.gates.forEach(x=>{st.done[x.n]=1;st.choice[x.n]=x.k;st.conf[x.n]=x.ok?1:0});
  const d={v:'1.0',finished:!!fin,state:JSON.stringify(st),checks:{v:1,form:'A',emb:S.emb.slice(),adu:S.adu.slice(),tr:S.tr.slice(),embDone:S.emb.length>=4,aduDone:S.adu.length>=4,trDone:S.tr.length>=2}};
  if(ST)ST.saveProgress('la-habana',d);else dlog('saveModuleProgress',d)}
/* Presentar en clase: the teacher taps the picture (and the verb) the class chose at Embarque,
   Aduana and the transfer; those picks (never a count) go into the presented session through
   window.StoryChecks. */
const PRES={on:false,emb:[],adu:[],tr:[]};
if(ST&&ST.presentar)ST.presentar.then(v=>{if(v){PRES.on=true;S.mode='class'}}).catch(()=>{});
window.StoryChecks={presentedResults:()=>PRES.on&&PRES.emb.length?{v:1,form:'A',emb:PRES.emb.slice(),adu:PRES.adu.slice(),tr:PRES.tr.slice()}:null};
const pmRefresh=()=>{if(window.StoryPresentar)window.StoryPresentar.refresh()};
/* Embarque, Aduana and the transfer: Presentar's Siguiente waits (pmWait) until the class has answered. */
const pmWait=(el,msg)=>{if(msg){el.dataset.pmWait='1';el.dataset.pmMsg=msg}else{delete el.dataset.pmWait;delete el.dataset.pmMsg}pmRefresh()};
const PM_PICS='Primero las cuatro preguntas: toquen la imagen que eligió la clase.',PM_TR='Primero las dos frases: toquen el verbo que eligió la clase.';

/* ---------- small builders ---------- */
const L=(who,es,en,blur=true)=>`<div class="line"><button class="play say" aria-label="Escuchar" data-es="${es}">${spk}</button><span class="who">${who}</span><p class="es${blur?' blur':''}" tabindex="0" data-es="${es}">${es}</p>${en?`<span class="en-row"><button class="en-btn" aria-expanded="false">EN</button><p class="en" hidden>${en}</p></span>`:''}</div>`;
const N=t=>`<div class="narr"><button class="play say" data-say="${t.replace(/<[^>]+>/g,'')}" aria-label="Listen">${spk}</button><p>${t}</p></div>`;
/* Kate speaks English: her line gets a ▶ like every other line. A stage direction in brackets,
   "(crying laughing)", is shown but not spoken. */
const K=t=>`<div class="kate kline"><button class="play say" data-say="${t.replace(/^\([^)]*\)\s*/,'').replace(/"/g,'&quot;')}" aria-label="Listen">${spk}</button><p><b>Kate:</b> ${t}</p></div>`;
const frame=(id,label)=>`<div class="frame"><svg viewBox="0 0 1200 560" id="${id}" role="img" aria-label="${label}"></svg></div>`;
const sign=(n,t,b,id)=>`<div class="sign"><span class="n">${n}</span><span class="t">${t}<b>${b}</b></span><span class="status" id="${id}-st">EN CAMINO</span></div>`;
const jodi=(t,ok)=>`<div class="jodi"><img src="/assets/jodi/jodi-${ok?'happy':'thinking'}.svg" alt="Jodi" width="64" height="64"><div><b>Jodi's take</b><p>${t}</p></div></div>`;
const go=(id,txt)=>`<div class="row next"><button class="go" id="${id}" data-unlock>${txt}</button></div>`;
document.addEventListener('click',e=>{
  const p=e.target.closest('.line .play,.line .es');if(p){const es=p.closest('.line').querySelector('.es');es.classList.remove('blur');say(es.dataset.es,'es');T('ev_audio_play');return}
  const b=e.target.closest('.en-btn');if(b){const en=b.nextElementSibling;en.hidden=!en.hidden;b.setAttribute('aria-expanded',String(!en.hidden));return}
  const n=e.target.closest('.narr .play,.kline .play');if(n){say(n.dataset.say,'en');T('ev_audio_play');return}
  const f=e.target.closest('.ficha .play');if(f){say(f.dataset.es,'es');T('ev_audio_play')}});
document.addEventListener('keydown',e=>{const es=e.target.closest&&e.target.closest('.line .es');if(es&&(e.key==='Enter'||e.key===' ')){e.preventDefault();es.click()}});
function unlock(...ids){ids.forEach(id=>{const el=$('#'+id);el.classList.remove('locked');watch(el)});setTimeout(()=>{sizePins();$('#'+ids[0]).scrollIntoView({block:'start'})},60);pmRefresh()}
/* Pins are at least 44 px to tap at any width: the invisible hit circle grows as the picture shrinks. */
function sizePins(){document.querySelectorAll('.frame>svg').forEach(svg=>{const w=svg.getBoundingClientRect().width;if(!w)return;
  const vb=svg.viewBox&&svg.viewBox.baseVal,sc=w/((vb&&vb.width)||1200),r=Math.max(40,Math.ceil(23/sc));svg.querySelectorAll('.hot>.hit').forEach(c=>c.setAttribute('r',r))})}
addEventListener('resize',sizePins);
function stamp(n){const s=$('#s'+n);s.classList.add('on');s.setAttribute('aria-label','Puerta '+n+' stamped')}
function photo(box,src,alt,cap){S.photos.push(src);$('#roll').textContent='Tus fotos: '+S.photos.length;
  box.insertAdjacentHTML('beforeend',`<div class="real"><img src="${PH}${src}" alt="${alt}"><div><b>${cap}</b><small>William's photo · Havana, 2016 · saved to Tus fotos</small></div></div>`)}

/* ---------- field cards ---------- */
window.F={
 maleta:{es:'la maleta',en:'the suitcase',fact:'Lots of Cuban travelers wrap their suitcases in plastic at the airport so nothing falls out (or gets taken).'},
 tele:{es:'el televisor',en:'the TV',fact:'New TVs, phones and car parts were hard to buy in Cuba, so families flying home carried them back as luggage.'},
 llanta:{es:'la llanta',en:'the tire',fact:'Cubans keep 1950s cars running for 60+ years. Parts like tires travel home in suitcases… or just like this.'},
 parachoques:{es:'el parachoques',en:'the car bumper',fact:'"Parachoques" is para (stops) + choques (crashes). A whole bumper on the luggage belt is a very Havana sight.'},
 patio:{es:'el patio',en:'the courtyard',fact:'Old Havana houses are built around an open patio. The rooms stay cool and the rain falls in the middle.',both:['El patio <span class="vb">es</span> bonito. <i>(what it is like)</i>','El patio <span class="vb2">está</span> mojado. <i>(how it is right now)</i>']},
 lluvia:{es:'la lluvia',en:'the rain',fact:'Summer in Havana means short, heavy afternoon rain. Ten minutes later the sun is back.'},
 mecedora:{es:'la mecedora',en:'the rocking chair',fact:'Almost every Cuban home has rocking chairs. Evenings are for rocking, talking and catching a breeze.'},
 tinajon:{es:'el tinajón',en:'the big clay pot',fact:'Giant clay pots like this one catch rainwater. The city of Camagüey is famous for them.'},
 arroz:{es:'el arroz blanco',en:'white rice',fact:'Rice is on the table at almost every Cuban meal.'},
 frijoles:{es:'los frijoles negros',en:'black beans',fact:'Black beans and rice cooked together are called "moros y cristianos."'},
 ropavieja:{es:'la ropa vieja',en:'shredded beef',fact:'The name means "old clothes," because the shredded beef looks like torn-up rags. It is one of Cuba\'s national dishes.'},
 almendron:{es:'el almendrón',en:'the old American car',fact:'Cubans call their old American cars almendrones (big almonds) because of their round shape. Most are from the 1950s, but a few, like this one, are from around 1930. Many still work as taxis.',both:['El carro <span class="vb">es</span> viejo. <i>(what it is like: it\'s an old car)</i>','El carro <span class="vb2">está</span> limpio. <i>(how it is right now: freshly washed)</i>']},
 malecon:{es:'el Malecón',en:'the seawall',fact:'An 8-kilometer seawall along Havana\'s coast. At night it becomes the city\'s living room.'},

 agua:{es:'el agua',en:'the water',fact:'The water on Cuba\'s north coast is clear enough to see fish from the surface.',both:['El agua <span class="vb">es</span> azul. <i>(what it is like)</i>','El agua <span class="vb2">está</span> tibia. <i>(how it feels today: warm)</i>']},
 pinacolada:{es:'la piña colada',en:'piña colada (no alcohol)',fact:'Pineapple, coconut and ice. William\'s cost 50 cents: cincuenta centavos.'},
 snorkel:{es:'el esnórquel',en:'the snorkel',fact:'Cuba has one of the largest coral reef systems in the Caribbean.'},
 tarjeta:{es:'la tarjeta de wifi',en:'the wifi card',fact:'In 2016 you bought a scratch card (about $2 for 2 hours) and could only use it in a few wifi parks and hotels.'},
 parquewifi:{es:'el parque wifi',en:'the wifi park',fact:'When wifi parks opened, they filled up with people video-calling family abroad, day and night.'},
 malecon2:{es:'el Malecón de noche',en:'the Malecón at night',fact:'Thousands of people sit on the wall at night: talking, fishing, playing music, dancing… and chasing a wifi signal.'},
 guitarra:{es:'la guitarra',en:'the guitar',fact:'Cuban son music grew from the guitar, the bongos and the maracas. You\'ll hear it all along the Malecón.'},

function ficha(k){const f=F[k];return `<div class="ficha"><button class="play" aria-label="Escuchar: ${f.es}" data-es="${f.es}">${spk}</button><b>${f.es}</b><span class="sci">${f.en}</span><p>${f.fact}</p>${f.both?`<div class="real-row"><div class="kate">${f.both.join('<br>')}</div></div>`:''}</div>`}
function wireHot(svg,box){svg.querySelectorAll('.hot').forEach(g=>{const act=()=>{const k=g.dataset.f;say(F[k].es,'es');box.innerHTML=ficha(k);g.querySelector('.ring').setAttribute('stroke','#2E7D4F');g.querySelector('.ring').setAttribute('stroke-width','6');T('explore',{k})};
  g.onclick=act;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act()}}});sizePins()}

/* ---------- Puerta engine: pick a sentence, say it, then hear how it lands ---------- */
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
/* Presentar's class-vote box for a Puerta (hidden unless presenting): one row, the sentences in
   the order the page shows them. */
const cvBox=(n,opts)=>`<div class="cv" data-g="${n}"><button class="cv-link" type="button" aria-expanded="false">¿Juegan en clase?</button><div class="cv-panel" hidden><div class="cv-row" data-r="0">${opts.map((x,i)=>`<span class="cv-o" data-o="${x.v}"><span class="cv-w">${'AB'[i]} · ${x.es}</span></span>`).join('')}</div></div></div>`;
document.addEventListener('click',e=>{const l=e.target.closest('.cv-link');if(!l||l.getAttribute('aria-expanded')==='true')return;l.setAttribute('aria-expanded','true');if(S.mode!=='class'){S.mode='class';T('class_mode',{gate:+l.parentNode.dataset.g})}});
function puerta(o){let pick=null,done=false;const box=$('#'+o.id+'-opts'),btn=$('#'+o.id+'go'),out=$('#'+o.id+'-out');
  const opts=shuffle(o.opts);
  opts.forEach((op,i)=>{const b=document.createElement('button');b.className='say-opt opt';b.dataset.k=op.v;b.setAttribute('aria-pressed','false');
    b.innerHTML=`<span class="ab">${'AB'[i]}</span><span class="mini">${spk}</span><span class="q">${op.es}</span>`;
    b.onclick=()=>{if(done)return;say(op.es,'es');pick=op;box.querySelectorAll('.say-opt').forEach(x=>{x.setAttribute('aria-pressed',x===b?'true':'false');x.classList.toggle('sel',x===b)});btn.disabled=false};box.appendChild(b)});
  box.insertAdjacentHTML('afterend',cvBox(o.n,opts));
  btn.onclick=async()=>{if(!pick||done)return;done=true;btn.hidden=true;const bs=[...box.querySelectorAll('.say-opt')];bs.forEach(x=>x.disabled=true);
    const ok=!!pick.ok;
    /* the pick as its item id only, p1:ser / p1:estar; choiceIndex is its place in report.json */
    S.gates.push({n:o.n,k:pick.v,ok});
    TM.choice({scenarioIndex:o.n,choiceIndex:o.opts.indexOf(pick),score:ok?1:0,category:'gate',choice:'p'+o.n+':'+pick.v});pushSummary();saveProgress();
    out.innerHTML=L(o.who,ok?o.yes[0]:o.no[0],ok?o.yes[1]:o.no[1],false);say(ok?o.yes[0]:o.no[0],'es');
    if(!ok&&o.kate){await wait(900);out.insertAdjacentHTML('beforeend',K(o.kate))}
    await wait(700);bs.forEach((x,i)=>{if(opts[i].ok)x.classList.add('right');else if(x.getAttribute('aria-pressed')==='true')x.classList.add('wrongpick')});
    out.insertAdjacentHTML('beforeend',jodi(o.jodi(ok),ok));
    if(o.photo)photo(out,o.photo.src,o.photo.alt,o.photo.cap);
    out.insertAdjacentHTML('beforeend',go(o.id+'-next','Sigue ↓'));
    const st=$('#'+o.id+'-st');st.textContent='¡SELLADO!';st.classList.add('ok');stamp(o.n);
    $('#'+o.id+'-next').onclick=()=>o.next()}}

/* ---------- build the page ---------- */
/* The sections are static so the build checks can read them: data-step is the section number
   TM.step() reports (14 in all), and a scored Puerta is <section class="gate…" id="g<n>">.
   pm-step / gate / fork / carta tell Presentar en clase how to step through them. A Puerta's
   scene (casa, cena, wifi, noche) and its gate open together. */
const fill=(id,html)=>{$('#'+id).innerHTML=html};
fill('intro',`
 <figure class="frame title-photo" style="margin:0"><img src="${PH}car-row.jpg" alt="A long row of colorful classic cars parked by Parque Central in Havana"><figcaption>William's photo · Parque Central, 2016</figcaption></figure>
 <div class="card"><div class="start-grid"><div class="in">
  <span class="eyebrow">Allgood Academy · Español · Novato</span>
  <h1>La Habana</h1><p class="sub">Two verbs for "to be." One very confusing dinner.</p>
  <div class="lvl"><i class="f"></i><i class="f"></i><i></i><i></i><span>Novato · ser vs. estar · 15–20 min</span></div>
  ${N('Summer 2016. You and your friend Kate land in Havana, Cuba. Americans have only just started visiting again.')}
  <div class="row"><button class="go" id="start">Empezar ↓</button></div></div>

 <div class="bp-body"><p style="margin:0 0 4px">Before you fly: listen, then tap the picture that matches. Listen closely to the verb. No score, just packing your Spanish.</p>
 <div id="emb-box"></div></div></div>`);
fill('aeropuerto',`
 ${frame('art-airport','The baggage claim at Havana airport. A TV, a tire and a car bumper ride the belt between the suitcases.')}
 <div class="card">${N('You land at José Martí airport. At baggage claim, the belt starts moving… and it is not just suitcases.')}
 <p style="margin:10px 0 0;font-size:15px">Tap the pins to explore.</p><div id="ficha-air" aria-live="polite"></div>
 ${K('Is that… a car bumper?!')}
 ${go('b-air','Vamos a la casa ↓')}</div>`);
fill('casa',`
 ${frame('art-casa','The courtyard of an old Havana house. Rain falls into the open patio; covered hallways run around it. Doña Caridad waves from a blue doorway.')}
 <div class="card">${N('Your <i>casa particular</i> is an old house built around an open courtyard. It starts to rain. Doña Caridad comes out to meet you.')}

fill('g1',`
 ${sign('1','PUERTA 1 · LA CASA','¿De dónde son?','g1')}

 <p style="margin:12px 0 0"><b>What do you say?</b> Tap a sentence to hear it, then say it.</p>
 <div class="says opts" id="g1-opts"></div><div class="row"><button class="go" id="g1go" disabled>¡Dilo!</button></div><div id="g1-out" aria-live="polite"></div></div>`);
fill('cena',`
 ${frame('art-cena','Dinner at Doña Caridad\'s table: white rice, black beans, shredded beef and fried plantains. Doña Caridad stands with a pot; Kate is ready to eat.')}
 <div class="card">${N('That night, Doña Caridad cooks for you. Rice, black beans, and the best meat you have ever tasted.')}
 <p style="margin:10px 0 0;font-size:15px">Tap the pins to see what's for dinner.</p><div id="ficha-cena" aria-live="polite"></div></div>`);
fill('g2',`
 ${sign('2','PUERTA 2 · LA CENA','¿Qué tal la comida?','g2')}
 <div class="card">${L('Doña Caridad','¿Y qué tal? ¿Les gusta?','So? Do you like it?')}
 <p style="margin:12px 0 0"><b>You want to say the food is delicious.</b> Pick your sentence.</p>
 <div class="says opts" id="g2-opts"></div><div class="row"><button class="go" id="g2go" disabled>¡Dilo!</button></div><div id="g2-out" aria-live="polite"></div></div>`);
fill('f1',`
 <div class="card" style="margin-top:0"><span class="eyebrow">TU DECISIÓN</span><h2>Mañana libre</h2>
 ${N('Tomorrow is a free day. Kate wants the beach. Doña Caridad says you have to ride in an old car at least once. You can only do one.')}
 <div class="pics opts" id="fork-pics" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
  <button class="pic opt" id="f-carro" data-k="carro" aria-pressed="false" aria-label="Ride in an old car along the Malecón"><img src="${PH}car-red.jpg" alt="" style="width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:8px"><b style="display:block;margin-top:6px">Un paseo en carro viejo</b><small>A ride along the Malecón</small></button>
  <button class="pic opt" id="f-playa" data-k="playa" aria-pressed="false" aria-label="Take the bus to the beach"><img src="${PH}beach.jpg" alt="" style="width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:8px"><b style="display:block;margin-top:6px">El autobús a la playa</b><small>Snorkeling and piña coladas</small></button>
 </div><div id="f1body"></div></div>`);
fill('wifi',`
 ${frame('art-wifi','A wifi park in Havana. People sit on benches looking at their phones under a WIFI sign. Yoel holds up a scratch card.')}
 <div class="card">${N('Kate needs to message her mum in England. Doña Caridad\'s nephew, Yoel, knows exactly what to do.')}
 ${L('Yoel','¡Mira! Una tarjeta de wifi. Dos dólares, dos horas.','Look! A wifi card. Two dollars, two hours.')}
 <p style="margin:10px 0 0;font-size:15px">Tap the pins to explore.</p><div id="ficha-wifi" aria-live="polite"></div></div>`);
fill('g3',`
 ${sign('3','PUERTA 3 · EL WIFI','¿Dónde?','g3')}
 <div class="card"><p style="margin:0"><b>You have the card. Now ask Yoel where the wifi is.</b></p>
 <div class="says opts" id="g3-opts"></div><div class="row"><button class="go" id="g3go" disabled>¡Dilo!</button></div><div id="g3-out" aria-live="polite"></div></div>`);
fill('noche',`
 ${frame('art-noche','The Malecón at night. Hundreds of people sit along the seawall under the stars, phones glowing. A man plays guitar, a couple dances. Yoel stares at his phone.')}
 <div class="card">${N('That night, it seems like all of Havana is on the Malecón. Music, dancing, the lighthouse sweeping across the bay. Yoel has been staring at a loading screen for ten minutes.')}
 <p style="margin:10px 0 0;font-size:15px">Tap the pins to explore.</p><div id="ficha-noche" aria-live="polite"></div>
 ${K('What\'s up with Yoel? He hasn\'t said a word. Tell me in Spanish, I want to practice!')}</div>`);
fill('g4',`
 ${sign('4','PUERTA 4 · EL MALECÓN','¿Qué le pasa a Yoel?','g4')}
 <div class="card"><p style="margin:0"><b>Yoel looks bored. Tell Kate.</b> (He can hear you.)</p>
 <div class="says opts" id="g4-opts"></div><div class="row"><button class="go" id="g4go" disabled>¡Dilo!</button></div><div id="g4-out" aria-live="polite"></div></div>`);
fill('aduana',`
 <div class="bpass"><div class="bp-top"><b>ADUANA · HAV → ATL</b><span class="dots" id="adu-dots" aria-hidden="true"><i></i><i></i><i></i><i></i></span></div>
 <div class="bp-body"><p style="margin:0 0 4px">On the way home: same idea as Embarque. Listen closely to the verb, then tap the picture.</p>
 <div id="adu-box"></div></div></div>`);
fill('fin',`
 <div class="card gin" style="margin-top:0;text-align:center"><span class="eyebrow">LA HABANA · 2016</span><h2>¡Hasta pronto, Habana!</h2>
 ${L('Doña Caridad','¡Vuelvan pronto, mis niños! Aquí siempre están en casa.','Come back soon, kids! Here you are always at home.',false)}
 <div id="fin-score"></div>
 <h3 style="font:700 16px var(--font-ui);color:var(--teal-d);margin:18px 0 6px;text-align:left">Tus fotos</h3>
 <div id="fin-photos" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px"></div>

/* start */
$('#start').onclick=()=>{if(!$('#embarque').classList.contains('locked'))return;unlock('embarque');buildEmb()};

/* Embarque (Form A) and Aduana (Form B): four picture taps each, the same four skills in the
   same order (slot i of checks.json), no score shown */
const EMB=[{es:'Kate está lista.',opts:[{svg:P.lista,ok:1,label:'Kate ready to go, with her bags packed'},{svg:P.lista2,label:'Kate holding an A plus test, smart'}]},
 {es:'La comida está rica.',opts:[{svg:P.comida,ok:1,label:'a plate of delicious food'},{svg:P.rica,label:'a rich person with a big house and money'}]},
 {es:'El perro es malo.',opts:[{svg:P.perroMalo,ok:1,label:'a mean dog, growling'},{svg:P.perroEnfermo,label:'a sick dog in bed with a thermometer'}]},
 {es:'El chico está aburrido.',opts:[{svg:P.chicoAburrido,ok:1,label:'a bored boy, yawning'},{svg:P.chicoEsAburrido,label:'a boring boy talking while others fall asleep'}]}];
const ADU=[{es:'Kate es lista.',opts:[{svg:P.lista2,ok:1,label:'Kate holding an A plus test, smart'},{svg:P.lista,label:'Kate ready to go, with her bags packed'}]},
 {es:'La señora es rica.',opts:[{svg:P.rica,ok:1,label:'a rich person with a big house and money'},{svg:P.comida,label:'a plate of delicious food'}]},
 {es:'El perro está malo.',opts:[{svg:P.perroEnfermo,ok:1,label:'a sick dog in bed with a thermometer'},{svg:P.perroMalo,label:'a mean dog, growling'}]},
 {es:'El chico es aburrido.',opts:[{svg:P.chicoEsAburrido,ok:1,label:'a boring boy talking while others fall asleep'},{svg:P.chicoAburrido,label:'a bored boy, yawning'}]}];
function buildEmb(){pmWait($('#embarque'),PM_PICS);T('ev_embarque',{phase:'start',form:'A'});
  taps(EMB,'emb',S.emb,PRES.emb,()=>{T('ev_embarque',{phase:'done',form:'A',res:S.emb});pmWait($('#embarque'),null);
   $('#emb-box').innerHTML=`<div class="ready"><h2>¡Listo para el viaje!</h2></div>${go('b-emb','Aterrizar en La Habana ↓')}`;$('#b-emb').onclick=()=>{unlock('aeropuerto');buildAir()}})}
function taps(LIST,pre,store,pres,done){let k=0;const box=$('#'+pre+'-box');
  const step=()=>{if(k>=LIST.length){done();return}
    const it=LIST[k];const opts=shuffle(it.opts);
    box.innerHTML=`<div class="line" style="margin-top:12px"><button class="play say" id="${pre}-play" aria-label="Escuchar">${spk}</button><span class="who">${k+1} de ${LIST.length}</span><p class="es" style="grid-column:2">${it.es}</p></div><div class="pics" id="${pre}-pics"></div>`;
    $('#'+pre+'-play').onclick=e=>{e.stopPropagation();say(it.es,'es')};
    opts.forEach((o,i)=>{const b=document.createElement('button');b.className='pic';b.setAttribute('aria-label',o.label);b.innerHTML=`<span class="ab" aria-hidden="true">${'AB'[i]}</span>${o.svg}`;
      b.onclick=()=>{store.push(o.ok?1:0);if(PRES.on)pres.push({pick:it.opts.indexOf(o),right:!!o.ok});saveProgress();pushSummary();b.setAttribute('aria-pressed','true');box.querySelectorAll('.pic').forEach(x=>x.disabled=true);$('#'+pre+'-dots').children[k].classList.add('d');k++;setTimeout(step,reduce?50:450)};$('#'+pre+'-pics').appendChild(b)});
    say(it.es,'es')};step()}

/* airport */
function buildAir(){const svg=$('#art-airport');svg.innerHTML=ART.airport();wireHot(svg,$('#ficha-air'));
  $('#b-air').onclick=()=>{unlock('casa','g1');buildCasa()}}

/* casa + Puerta 1 */
function buildCasa(){const svg=$('#art-casa');svg.innerHTML=ART.casa();wireHot(svg,$('#ficha-casa'));
  puerta({id:'g1',n:1,who:'Doña Caridad',
    opts:[{v:'ser',ok:1,es:'Soy de Georgia. Kate es de Inglaterra.'},{v:'estar',es:'Estoy de Georgia. Kate está de Inglaterra.'}],
    yes:['¡Georgia! ¡Qué lejos! Y tú, Kate, ¿de Inglaterra? ¡Bienvenidas las dos visitas!','Georgia! So far away! And you, Kate, from England? Welcome, both of you!'],
    no:['¿Están de Inglaterra? ¿Como de vacaciones? Ah… ¡son de Georgia y de Inglaterra! Bienvenidos.','You\'re "being" from England? Like, on vacation? Oh… you ARE from Georgia and England! Welcome.'],
    kate:'She\'s smiling, but I think we said it a bit oddly.',
    jodi:ok=>`${ok?'':'She got it, and she was sweet about it. '}Where you're <b>from</b> never changes, so it takes <span class="vb">ser</span>: <i>soy de Georgia, es de Inglaterra</i>. <span class="vb2">Estar</span> is for where you are and how you are <i>right now</i>.`,
    photo:{src:'cathedral.jpg',alt:'The stone cathedral of Old Havana on a sunny plaza',cap:'La Catedral, around the corner'},
    next:()=>{unlock('cena','g2');buildCena()}})}

/* cena + Puerta 2 */
function buildCena(){const svg=$('#art-cena');svg.innerHTML=ART.cena();wireHot(svg,$('#ficha-cena'));
  puerta({id:'g2',n:2,who:'Doña Caridad',
    opts:[{v:'estar',ok:1,es:'¡Está rica!'},{v:'ser',es:'¡Es rica!'}],
    yes:['¡Ay, qué bueno! Coman, coman, que hay más.','Oh, good! Eat, eat, there\'s more.'],
    no:['¿Rica yo? ¡Ay, no, mi niño! Rica está la comida.','Me, rich? Oh no, honey! The FOOD is delicious.'],
    kate:'(crying laughing) You just told her she\'s RICH.',
    jodi:ok=>`${ok?'Perfect compliment. ':'Funny, and now you\'ll never forget it. '}<span class="vb2">Está rica</span> = it tastes delicious (right now, this plate). <span class="vb">Es rica</span> = she's rich. Same word, a different verb, a totally different compliment.`,
    next:()=>{unlock('f1');buildFork()}})}

/* fork (never scored) */
function buildFork(){const out=$('#f1body');
  const pick=k=>{if(S.fork)return;S.fork=k;TM.choice({scenarioIndex:'f1',choiceIndex:['carro','playa'].indexOf(k),category:'fork',choice:k});pushSummary();saveProgress();
   $('#f-carro').disabled=$('#f-playa').disabled=true;$('#f-'+k).setAttribute('aria-pressed','true');$('#f-'+k).classList.add('sel');
   if(k==='carro'){out.innerHTML=`<div style="height:16px"></div>${frame('art-carro','A cream-colored 1930s convertible on the Malecón at sunset, people sitting along the seawall behind it.')}${N('You flag down a convertible from about 1930, older than your grandparents. The driver takes you all the way down the Malecón, past the fortress, with the top down.')}<p style="margin:10px 0 0;font-size:15px">Tap the pins to explore.</p><div id="ficha-carro" aria-live="polite"></div>`;
     const svg=$('#art-carro');svg.innerHTML=ART.carro();wireHot(svg,$('#ficha-carro'));photo(out,'car-red.jpg','A red 1950s convertible parked on an Old Havana street','Un almendrón rojo, Habana Vieja')}
   else{out.innerHTML=`<div style="height:16px"></div>${N('You take the bus east, over a bridge high above a green valley, to the beach. The water is so clear you can see your feet.')}`;
     photo(out,'bridge.jpg','A long bridge over a deep green valley','El puente, on the way to the beach');
     out.insertAdjacentHTML('beforeend',`<div style="height:12px"></div>${frame('art-playa','A white-sand beach with turquoise water, a palm tree, a beach umbrella and two piña coladas. Kate snorkels in the water.')}<p style="margin:10px 0 0;font-size:15px">Tap the pins to explore.</p><div id="ficha-playa" aria-live="polite"></div>`);
     const svg=$('#art-playa');svg.innerHTML=ART.playa();wireHot(svg,$('#ficha-playa'))}
   out.insertAdjacentHTML('beforeend',go('fork-next','Sigue ↓'));$('#fork-next').onclick=()=>{unlock('wifi','g3');buildWifi()};pmRefresh()};
  $('#f-carro').onclick=()=>pick('carro');$('#f-playa').onclick=()=>pick('playa')}

/* Puerta 3 */
function buildWifi(){const svg=$('#art-wifi');svg.innerHTML=ART.wifi();wireHot(svg,$('#ficha-wifi'));
  puerta({id:'g3',n:3,who:'Yoel',
    opts:[{v:'estar',ok:1,es:'¿Dónde está el wifi?'},{v:'ser',es:'¿Dónde es el wifi?'}],
    yes:['¡En el Malecón! Esta noche vamos todos.','On the Malecón! Tonight we\'re all going.'],
    no:['¿Dónde es? Ah… ¿dónde está? ¡En el Malecón! Esta noche vamos todos.','Where "is" it? Oh… where is it located? On the Malecón! Tonight we\'re all going.'],
    kate:'He got there. Eventually.',
    jodi:ok=>`${ok?'':'Yoel worked it out, but he had to fix it first. '}Asking <b>where</b> something is? Always <span class="vb2">estar</span>: <i>¿Dónde está el wifi? ¿Dónde está el baño?</i>`,
    photo:{src:'morro-view.jpg',alt:'Havana across the bay, seen from the El Morro fortress',cap:'La Habana from El Morro'},
    next:()=>{unlock('noche','g4');buildNoche()}})}

/* Puerta 4 */
function buildNoche(){const svg=$('#art-noche');svg.innerHTML=ART.noche();wireHot(svg,$('#ficha-noche'));
  puerta({id:'g4',n:4,who:'Yoel',
    opts:[{v:'estar',ok:1,es:'Yoel está aburrido.'},{v:'ser',es:'Yoel es aburrido.'}],
    yes:['Sí, estoy aburrido… ¡el wifi no funciona! Bueno, ¡vamos a bailar!','Yeah, I\'m bored… the wifi isn\'t working! OK, let\'s dance!'],
    no:['¿¡Yo soy aburrido!? No, no… ¡estoy aburrido porque el wifi no funciona! Bueno, ¡vamos a bailar!','I\'M boring!? No, no… I\'m BORED because the wifi isn\'t working! OK, let\'s dance!'],
    kate:'Oof. He heard you. Good thing he\'s laughing.',
    jodi:ok=>`${ok?'Kind and correct. ':'He forgave you, and he pulled you in to dance. '}<span class="vb2">Está aburrido</span> = he's bored right now. <span class="vb">Es aburrido</span> = he's a boring person. That one little verb is the difference between a fact and an insult.`,
    photo:{src:'convertible-night.jpg',alt:'William beside an old cream convertible on the Malecón at night, crowds on the seawall behind',cap:'El Malecón de noche'},
    next:()=>{unlock('aduana');pmWait($('#aduana'),PM_PICS);T('ev_aduana',{phase:'start',form:'B'});
      taps(ADU,'adu',S.adu,PRES.adu,()=>{T('ev_aduana',{phase:'done',form:'B',res:S.adu});transfer()})}})}

/* Aduana transfer: describe the house. Tapping a verb says the sentence you built. */
const TR=[{q:'La casa de Doña Caridad ___ bonita.',ok:'es',why:'what it is like'},{q:'Hoy el patio ___ mojado.',ok:'está',why:'how it is right now'}];
function transfer(){const box=$('#adu-box'),sec=$('#aduana');let k=0;pmWait(sec,PM_TR);T('ev_transfer',{phase:'start'});
  const step=()=>{if(k>=TR.length){T('ev_transfer',{phase:'done',res:S.tr});pmWait(sec,null);box.innerHTML=`<div class="ready"><h2>¡Bienvenidos a casa!</h2></div>${go('b-adu','Ver tu pasaporte ↓')}`;$('#b-adu').onclick=()=>{unlock('fin');buildFin()};return}
    const it=TR[k];box.innerHTML=`<p style="margin:14px 0 4px"><b>Last thing:</b> describe Doña Caridad's house. Pick the verb.</p><p class="es" style="font-size:24px;margin:6px 0">${it.q}</p><div class="row" id="tr-row"></div>`;
    ['es','está'].forEach((v,i)=>{const b=document.createElement('button');b.className='ghost tr-v';b.style.fontSize='20px';b.textContent=v;
      b.onclick=()=>{const ok=v===it.ok;S.tr.push(ok?1:0);if(PRES.on)PRES.tr.push({pick:i,right:ok});say(it.q.replace('___',v),'es');T('transfer',{item:k,choice:v,score:ok?1:0});saveProgress();pushSummary();k++;step()};$('#tr-row').appendChild(b)})};step()}

/* ending */
function buildFin(){const E=S.emb.reduce((a,b)=>a+b,0),A=S.adu.reduce((a,b)=>a+b,0),t=S.tr.reduce((a,b)=>a+b,0);
  $('#fin-score').innerHTML=`<div class="bpass" style="margin-top:14px;text-align:left"><div class="bp-top"><b>PASAPORTE · HAV</b><span>${S.gates.length} de 4 Puertas</span></div><div class="bp-body">
   <p style="margin:0;font-size:18px">Al embarcar: <b>${E} de 4</b>. En la aduana: <b>${A} de 4</b>. La casa: <b>${t} de 2</b>.</p>
   ${jodi(A>=E&&A>=3?'You heard the difference. <span class="vb">Ser</span> tells you what something <b>is</b>; <span class="vb2">estar</span> tells you where it is and how it is <b>right now</b>. Doña Caridad would be proud, and she\'d feed you again.':'Ser and estar trip up everyone at first. Here\'s the trick: <span class="vb">ser</span> = what it <b>is</b>, <span class="vb2">estar</span> = how it is <b>right now</b> or where it is. Try the story again and listen for the verb.',A>=E&&A>=3)}</div></div>`;
  const all=['car-row.jpg','gran-teatro.jpg',...S.photos,'malecon-sunset.jpg'];
  $('#fin-photos').innerHTML=[...new Set(all)].map(src=>`<img src="${PH}${src}" alt="" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:4px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.2)">`).join('');
  const c=S.gates.filter(g=>g.ok).length;
  TM.complete({finalScore:c,percentage:c*25,summary:{gates:gatesNow(),path:{f1:S.fork||null},mode:S.mode,score:c,checks:checksNow()}});
  if(ST)ST.logCompletion('La Habana',{score:c,finalScore:c,maxScore:4});else dlog('game_scores',{gameName:'La Habana',completed:true,score:c});saveProgress(true)}
}
</script>
