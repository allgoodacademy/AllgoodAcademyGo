<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La selva · Allgood Academy</title>
<meta name="robots" content="noindex, nofollow">
<!-- A signed-in teacher who opens this story from the /espanol/ hub gets Presentar en clase by
     default (/js/story-tracking.js). Everyone else gets the story. ?mode=solo turns it off. -->
<meta name="ag-presentar-default" content="hub">
<link rel="stylesheet" href="/assets/css/design-tokens.css">
<script src="/js/reduced-motion.js"></script>
<script src="/js/site-config.js"></script>
<script src="/js/story-tracking.js"></script>
<link rel="stylesheet" href="/assets/css/fonts.css">
<style>
/* VOICE: a warm field guide for beginners, calm and clear, never babyish.
   IDEA: a morning rainforest walk; gates are wooden trail markers, progress is the passport.
   PICTURE: layered daylight canopy, real Costa Rican animals drawn flat and accurate.
   COLOUR and TYPE: forest greens and morning sky, bronze signs, one orange action; Gelasio + Atkinson Hyperlegible Next.
   LAYOUT: one centered column of scenes; each scene a framed 15:8 picture with its card under it. */
:root{color-scheme:light;--orange:var(--color-orange);--orange-d:#A8380F;--teal:var(--color-teal);--teal-d:#245866;--bronze:#B0773A;--bronze-d:#7A4E1F;
--cream:var(--color-cream);--paper:#F5E6D3;--ink:#1F2A24;--ink2:#4A5650;--ok:#2E7D4F;--ok-wash:#E3F1E7;--forest:#173F2B;--sky:#F7E3BF;
--site-h:74px;--nav-h:74px;--nav-fade:var(--forest);--nav-fade-end:var(--forest)}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--site-h) + 56px)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--forest);color:var(--ink);font:17px/1.55 var(--font-ui);overflow-x:clip}
h1,h2,.serif{font-family:var(--font-display)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid #FFB347;outline-offset:3px}
.bar{position:sticky;top:var(--site-h);transition:top .25s ease;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px max(4vw,14px);background:rgba(23,63,43,.94);color:#F4EFE6;font-size:14px}
.bar b{font-weight:700}
.pass{display:flex;align-items:center;gap:8px}
.pass .bk{background:var(--teal-d);border-radius:8px;padding:5px 9px;display:flex;gap:6px;align-items:center}
.slot{width:26px;height:26px;border-radius:50%;border:2px dashed #9FC2B4;display:grid;place-items:center;font-size:12px;font-weight:700;color:transparent}
.slot.on{border:2px solid #fff;background:var(--ok);color:#fff;animation:thunk .5s ease}
@keyframes thunk{0%{transform:scale(2.2) rotate(-20deg);opacity:0}70%{transform:scale(.9)}100%{transform:scale(1)}}
.tools{display:flex;gap:6px;align-items:center}
.tool{display:none;background:var(--bronze);color:#fff;border-radius:999px;padding:4px 10px;font-size:13px}
.tool.on{display:inline-block}
.sec{max-width:1040px;margin:0 auto;padding:28px max(4vw,14px) 40px}
.locked{display:none}
.frame{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 2px 4px rgba(10,30,20,.18),0 14px 34px rgba(10,30,20,.22);background:var(--sky)}
.frame>svg{display:block;width:100%;height:auto}
.card{background:var(--cream);border-radius:16px;padding:20px 24px;margin-top:-28px;position:relative;box-shadow:0 1px 2px rgba(10,30,20,.12),0 10px 24px rgba(10,30,20,.18);border:1px solid #EADFCB;max-width:760px;margin-inline:auto}
.card+.card{margin-top:14px}
.eyebrow{font-size:14px;color:var(--teal-d);font-weight:700}
h1{font-size:clamp(40px,7vw,64px);line-height:1.05;letter-spacing:-.02em;margin:4px 0 2px;color:var(--forest)}
h2{font-size:clamp(26px,4vw,34px);line-height:1.1;letter-spacing:-.02em;margin:0 0 6px;color:var(--forest)}
.sub{font-size:20px;color:var(--ink2);margin:0 0 10px}
.lvl{display:flex;gap:4px;align-items:center;font-size:14px;color:var(--ink2)}
.lvl i{width:34px;height:8px;border-radius:4px;background:#D8D2C6}.lvl i.f{background:var(--bronze)}
.go{background:var(--orange);color:#fff;border:0;border-radius:999px;padding:12px 26px;font-weight:700;font-size:18px;min-height:48px}
.go:hover{background:var(--orange-d)}.go[disabled]{background:#B9B2A6;cursor:not-allowed}
.ghost{background:none;border:2px solid var(--teal);color:var(--teal-d);border-radius:999px;padding:8px 18px;font-weight:700;min-height:44px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:12px}
.start-grid{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:18px;align-items:center}
.polaroid{background:#fff;padding:10px 10px 30px;border-radius:4px;transform:rotate(3deg);box-shadow:0 6px 14px rgba(0,0,0,.25);font-size:13px;color:var(--ink2);text-align:center}
.polaroid div{aspect-ratio:1;background:repeating-linear-gradient(45deg,#E9E2D4 0 10px,#F2ECE0 10px 20px);display:grid;place-items:center;margin-bottom:6px;font-size:12px;padding:8px}
@media(max-width:600px){.start-grid{grid-template-columns:1fr}.polaroid{width:170px;margin:4px auto 0}}
.line{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 12px;align-items:start;margin:10px 0}
.who{grid-column:2;font-size:13px;font-weight:700;color:var(--teal-d)}
.play{grid-row:span 3;width:44px;height:44px;border-radius:50%;border:0;background:var(--teal);color:#fff;display:grid;place-items:center}
.play svg{width:22px;height:22px}
.es{grid-column:2;margin:0;font-size:21px;font-family:var(--font-display);transition:filter .3s}
.es.blur{filter:blur(6px);cursor:pointer;user-select:none}
.en-row{grid-column:2;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.en-btn{background:none;border:1px solid #B9B2A6;border-radius:6px;font-size:13px;padding:1px 8px;color:var(--ink2);min-height:28px}
.en{margin:0;color:var(--ink2);font-size:15px}
.narr{display:flex;gap:12px;align-items:center;font-size:17px}
.narr .play{grid-row:auto;background:var(--bronze);flex:none}
.narr p{margin:0}
.tip{border-bottom:2px dotted var(--teal);cursor:help}
.ficha{display:grid;grid-template-columns:44px minmax(0,1fr);gap:2px 12px;background:#fff;border:2px solid #D9E7DC;border-radius:14px;padding:12px 14px;margin-top:12px}
.ficha .play{grid-row:span 3;background:var(--ok)}.ficha b{font-family:var(--font-display);font-size:19px}.ficha .sci{font-size:13px;color:var(--ink2)}.ficha p{margin:2px 0 0;font-size:15px}
.fichas h3{font:700 15px var(--font-ui);color:var(--teal-d);margin:16px 0 0}
.cerca{background:#F6F1E7;border-radius:12px;padding:10px;margin-top:8px;max-width:340px}.cerca svg{display:block;width:100%;height:auto}
.real-row{grid-column:2;margin-top:6px}
.foto summary,.foto-link{display:inline-block;cursor:pointer;font-weight:700;font-size:14px;color:var(--teal-d);border:2px solid var(--teal);border-radius:999px;padding:5px 14px;text-decoration:none;list-style:none}
.foto summary::-webkit-details-marker{display:none}.foto[open] summary{background:var(--teal);color:#fff}
.foto img{display:block;width:min(320px,100%);border-radius:10px;margin-top:8px;border:4px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.18)}.foto small{display:block;font-size:13px;color:var(--ink2);margin-top:4px}
.pin .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
.pin:hover .disc,.pin:focus-visible .disc{fill:#fff}
.why{background:#FFF8EC;border:2px solid #F0DDBE;border-radius:14px;padding:12px 14px;margin-top:12px;font-size:15px}
.culture{background:#EAF1E4;border-left:0;border-radius:12px;padding:10px 14px;font-size:15px;margin-top:10px}
/* boarding pass */
.bpass{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:760px;margin:0 auto}
.bp-top{background:var(--bronze);color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bp-top b{font-family:var(--font-display);font-size:22px}
.dots{display:flex;gap:6px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #fff}.dots i.d{background:#fff}
.bp-body{padding:16px 18px 20px;border-top:3px dashed #E1D3BE}
.pics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:10px}
.pic{position:relative;background:#F6F1E7;border:3px solid #E1D8C6;border-radius:14px;padding:8px;min-height:120px}
.pic svg{width:100%;height:auto;display:block}
.pic:hover{border-color:var(--teal)}
.pic[aria-pressed=true]{border-color:var(--orange);background:#FFF4EC}
.pic .ab{position:absolute;top:6px;left:8px;font-size:13px;font-weight:700;color:var(--ink2)}
.pic.right{border-color:var(--ok);background:var(--ok-wash)}
.pic[disabled]{cursor:default}
.ready{text-align:center;padding:10px 0 4px}
.ready h2{color:var(--ok)}
/* gate sign */
.sign{background:var(--bronze);color:#fff;border-radius:12px;padding:12px 18px;display:flex;gap:16px;align-items:center;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 6px 14px rgba(0,0,0,.3);max-width:760px;margin:0 auto 16px;flex-wrap:wrap}
.sign .n{font-family:var(--font-display);font-size:44px;line-height:1;font-weight:700}
.sign .t{font-size:14px;letter-spacing:.02em}.sign .t b{display:block;font-size:20px}
.status{margin-left:auto;background:#4A2E12;border-radius:8px;padding:6px 12px;font-weight:700;font-size:15px}
.status.ok{background:var(--ok)}
.binos{max-width:560px;margin:14px auto 0}
.binos svg{width:100%;height:auto;display:block}
.jodi{display:flex;gap:12px;align-items:flex-start;background:#fff;border:2px solid var(--paper);border-radius:14px;padding:12px 14px;margin-top:12px}
.jav{flex:none;width:52px;height:52px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;color:var(--teal-d);font-size:22px}
.jodi p{margin:2px 0 0}
.note{font-size:13px;color:#C9D9CF;text-align:center;margin:8px 0 0}
.hot{cursor:pointer}.hot:focus{outline:none}.hot:focus-visible .ring{stroke:#FFB347;stroke-width:5}
.tchip{font:700 18px var(--font-ui)}
.fin{text-align:center;color:#F4EFE6}
.polaroid img{display:block;width:100%;aspect-ratio:1;object-fit:cover;margin-bottom:6px}
.based{font-size:14px;color:var(--ink2);margin:10px 0 0}
.real{display:flex;gap:14px;align-items:center;background:#1F2A24;color:#F4EFE6;border-radius:14px;padding:10px 12px;margin-top:12px;animation:slide .5s ease}
.real img{width:96px;height:96px;object-fit:cover;border-radius:6px;border:4px solid #fff;transform:rotate(-3deg);flex:none}
.real small{display:block;color:#B9D3C4;font-size:13px}
@keyframes slide{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.roll{background:var(--bronze);color:#fff;border-radius:999px;padding:4px 10px;font-size:13px}
.lens{max-width:420px;margin:14px auto 0}.lens svg{width:100%;height:auto;display:block}

.ask{margin:8px 0 0;font-weight:700}
.tip-line{margin:12px 0 0;font-size:15px;background:#EAF1E4;border-radius:12px;padding:10px 14px}
.card.wide{max-width:960px;margin-top:0}
.road{max-width:760px;margin:0 auto 18px;text-align:center}
.road-board{display:inline-block;background:var(--bronze);color:#fff;font:700 30px var(--font-display);padding:12px 28px;border-radius:12px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 6px 14px rgba(0,0,0,.3)}
.road-arrows{display:flex;justify-content:center;gap:14px;margin-top:8px}.road-arrows span{background:#8F5F2C;color:#fff;font-weight:700;padding:8px 16px;border-radius:8px}
.bronze-sign .status{display:none}
.counter{font:700 34px var(--font-display);color:var(--forest);text-align:center;min-height:44px;margin-top:10px}
.dev{background:#fff;padding:12px 12px 34px;border-radius:4px;width:min(360px,100%);margin:14px auto 0;transform:rotate(-2deg);box-shadow:0 8px 20px rgba(0,0,0,.25);text-align:center;font-size:14px;color:var(--ink2)}
.dev-img svg{display:block;width:100%;height:auto;animation:develop 1.8s ease forwards}
@keyframes develop{from{filter:brightness(2.4) blur(6px)}to{filter:none}}
.feed{margin-top:12px}.feed svg{width:100%;height:auto;display:block;border-radius:14px}
.hum-in{animation:fly .6s ease}@keyframes fly{from{transform:translateY(-40px);opacity:0}to{transform:none;opacity:1}}
.roll-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;margin-top:12px}
.roll-grid .polaroid{margin:0;transform:rotate(-1.5deg)}.roll-grid .polaroid:nth-child(even){transform:rotate(1.5deg)}
.recap{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:10px}
.tile{background:#fff;border:2px solid #E1D8C6;border-radius:14px;padding:12px 14px;font-size:15px;display:flex;flex-direction:column;gap:4px}
.tile.ok{border-color:var(--ok);background:var(--ok-wash)}.tile .tn{font-size:13px;font-weight:700;color:var(--teal-d)}
.pass-book{max-width:760px;margin:22px auto 0;background:#21384A;color:#F4EFE6;border-radius:18px;padding:22px 24px;box-shadow:0 14px 34px rgba(0,0,0,.35)}
.pb-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #3E5A70;padding-bottom:8px}.pb-head b{font:700 28px var(--font-display)}
.pb-score{font-size:19px;margin:14px 0}
.pb-row{display:flex;gap:14px;align-items:center;background:var(--cream);color:var(--ink);border-radius:12px;padding:10px 14px;margin-top:10px}.pb-row p{margin:2px 0 0;font-size:15px}
.stamp{flex:none;font:700 13px var(--font-ui);border:3px solid;border-radius:8px;padding:6px 10px;transform:rotate(-6deg)}
.stamp.new{color:var(--ok);border-color:var(--ok)}.stamp.had{color:var(--teal-d);border-color:var(--teal-d)}.stamp.try{color:#8F5F2C;border-color:#8F5F2C}
.pass-book .jodi{color:var(--ink)}
/* The site nav (generated, nav/nav.js) sits above the story bar and slides away on scroll-down,
   as on El Mundial. --site-h is how much of it shows; the script after the nav keeps it exact. */
body .nav-shell{z-index:61;transition:transform .25s ease}
body .nav-shell.nav-away{transform:translateY(-100%)}
/* Presentar en clase (/js/story-presentar.js): each Puerta's class-vote box lives in .cv, which
   only shows there. Its stylesheet sizes .opt / .slot / .chip for a projector; keep this page's. */
/* Narrow screens: the site nav above already names Allgood Academy, so the bar keeps just the photo
   count and the passport, and neither pill is squeezed (at 375 px they wrapped and overlapped). */
.tools>*,.pass .bk>*{flex:none}.roll{white-space:nowrap}
@media(max-width:520px){.bar>span:first-child{display:none}.bar{justify-content:flex-end}}
.cv{display:none}
body.presentar .cv{display:block;margin-top:12px}
body.presentar .pic.opt{padding:8px;font-size:inherit}
body.presentar .bar .slot{font-size:12px}
</style>
</head>

<style>

<style>

function dlog(k,o){if(!DBG)return;try{console.log('[la-selva]',k,o)}catch(e){}}
const ST=window.StoryTrack||null;
if(ST&&DBG)ST.setDebug(dlog);
const TM=ST?ST.TM:{init:o=>dlog('init',o),step:n=>dlog('step',{n}),choice:o=>dlog('choice',o),complete:o=>dlog('complete',o),summary:o=>dlog('summary',o),track:(e,m)=>dlog('track:'+e,m||{})};

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait=ms=>new Promise(r=>setTimeout(r,reduce?Math.min(ms,60):ms));
/* ---------- audio: recorded voices, as in El Viaje (docs/espanol-audio.md) ----------
   Every spoken line is an ElevenLabs clip pre-rendered to /assets/audio/espanol/la-selva/ and
   looked up in its manifest by its text (curly quotes stripped, spaces collapsed). One shared
   Audio element: each say() stops whatever was playing. The manifest is fetched as the page
   loads, so the first ▶ plays at once. A line missing from the manifest, or a clip that fails,
   falls back to the browser's speech voice. sayQ() waits for the line before it (the toucan's
   count), and any say() drops what is still queued. */
let voices=[];const hasTTS='speechSynthesis' in window;const loadV=()=>{try{voices=speechSynthesis.getVoices()}catch(e){}};loadV();try{speechSynthesis.onvoiceschanged=loadV}catch(e){}
function utter(t,lang){const u=new SpeechSynthesisUtterance(t);const pref=lang==='en'?['en-US','en']:['es-CR','es-MX','es-US','es-419','es'];
  let v=null;for(const p of pref){v=voices.find(x=>x.lang&&x.lang.replace('_','-').startsWith(p));if(v)break}
  u.lang=lang==='en'?'en-US':'es-MX';if(v)u.voice=v;u.rate=lang==='en'?1:.82;return u}
function sayTTS(t,lang){if(!hasTTS)return;try{speechSynthesis.cancel();speechSynthesis.speak(utter(t,lang))}catch(e){}}
const AUD={m:null,p:null,el:null,n:0,end:null,q:Promise.resolve(),qn:0};
function audManifest(){return AUD.p||(AUD.p=fetch('/assets/audio/espanol/la-selva/manifest.json').then(r=>r.ok?r.json():{}).catch(()=>({})).then(m=>AUD.m=m||{}))}
audManifest();
/* play() resolves when the line is over: the clip ended, a newer line replaced it, or a time cap. */
function play(t,lang){const k=String(t).replace(/[“”]/g,'').replace(/\s+/g,' ').trim(),n=++AUD.n,est=900+k.length*75;
  let done;const p=new Promise(r=>{done=r});
  const tts=()=>{sayTTS(t,lang);setTimeout(done,est)};
  if(hasTTS)try{speechSynthesis.cancel()}catch(e){}
  if(AUD.end)AUD.end();AUD.end=done;
  if(typeof Audio!=='function'){tts();return p}
  let a=AUD.el;if(!a){a=AUD.el=new Audio();a.preload='none'}
  try{a.pause()}catch(e){}
  const go=m=>{if(n!==AUD.n){done();return}const u=m[k];if(!u){tts();return}
    const fail=()=>{if(n===AUD.n){AUD.n++;tts()}};
    a.onerror=fail;a.onended=()=>{if(n===AUD.n)done()};a.src=u;setTimeout(done,est+4000);
    try{const q=a.play();if(q&&q.catch)q.catch(e=>{if(!e||e.name!=='AbortError')fail()})}catch(e){fail()}};
  if(AUD.m)go(AUD.m);else audManifest().then(go);
  return p}
function say(t,lang){AUD.qn++;return play(t,lang)}
function sayQ(t,lang){const g=AUD.qn;return AUD.q=AUD.q.then(()=>g===AUD.qn?play(t,lang||'es'):null)}
function hush(){AUD.qn++;AUD.n++;if(AUD.end)AUD.end();AUD.end=null;try{if(AUD.el)AUD.el.pause()}catch(e){}if(hasTTS)try{speechSynthesis.cancel()}catch(e){}}

/* ---------- ART ---------- */
/* ===== ART (Art Director pass v1.1b): detailed flat, one shade tone per color, gradients only for sky, light and mist ===== */
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
function crownPath(cx,cy,r,n){let pts=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2,rr=r*(.84+.16*rnd());pts.push([cx+Math.cos(a)*rr,cy+Math.sin(a)*rr*.82])}
  let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n],a=(i+.5)/n*Math.PI*2,k=r*1.12;
  d+=` Q${(cx+Math.cos(a)*k).toFixed(1)} ${(cy+Math.sin(a)*k*.82).toFixed(1)} ${q[0].toFixed(1)} ${q[1].toFixed(1)}`}return d+'Z'}
function crown(cx,cy,r,base,shade,light){return `<path d="${crownPath(cx,cy+r*.1,r,9)}" fill="${shade}"/><path d="${crownPath(cx-r*.04,cy-r*.04,r*.9,9)}" fill="${base}"/>${light?`<path d="${crownPath(cx-r*.28,cy-r*.3,r*.38,7)}" fill="${light}"/>`:''}`}
function row(y,r,count,base,shade,light,jit){let s='';const step=1300/count;for(let i=0;i<=count;i++){s+=crown(-50+i*step+rnd()*jit,y+rnd()*jit*.5,r*(.8+.4*rnd()),base,shade,light)}return s}
function fern(x,y,s,c,c2){let f='';for(let i=0;i<9;i++){const a=-160+i*17.5;f+=`<g transform="translate(${x} ${y}) rotate(${a}) scale(${s})"><path d="M0 0 Q50 -14 100 6 Q50 4 0 0Z" fill="${i%2?c:c2}"/></g>`}
  return `<path d="M${x} ${y} L${x+4} ${y+260}" stroke="#4A3828" stroke-width="${10*s}" stroke-linecap="round"/>${f}`}

  :f.art?`<details class="foto"><summary>Ver de cerca</summary><div class="cerca">${fichaArt(f.art)}</div></details>`:'';
  return `<div class="ficha"><button class="play" aria-label="Escuchar: ${f.es}" data-es="${f.es}">${spk}</button><b>${f.es}</b><span class="sci">${f.en}</span><p>${f.fact}</p><div class="real-row">${real}</div></div>`}

<circle class="disc ring" cx="${x}" cy="${y}" r="20" fill="#FBF6EE" stroke="#B0773A" stroke-width="4"/><circle cx="${x-3}" cy="${y-3}" r="7" fill="none" stroke="#245866" stroke-width="3.4"/><path d="M${x+2} ${y+2} l7 7" stroke="#245866" stroke-width="3.6" stroke-linecap="round"/>
<rect x="${lx-w/2}" y="${ly-18}" width="${w}" height="34" rx="17" fill="#173F2B" opacity=".86"/><text x="${lx}" y="${ly+5}" text-anchor="middle" style="font:700 17px 'Atkinson Hyperlegible Next',Verdana,sans-serif" fill="#FBF6EE">${lab}</text></g>`}
function wireHot(svg,box){svg.querySelectorAll('.hot').forEach(g=>{const act=()=>{const k=g.dataset.f;say(F[k].es,'es');box.innerHTML=ficha(k);g.querySelector('.ring').setAttribute('stroke','#2E7D4F');g.querySelector('.ring').setAttribute('stroke-width','6');T('explore',{k})};

   $('#b-aqui').onclick=()=>{const l2='¡Ahí están! Una roja y azul, y una verde y negra. ¡Dos ranas!';$('#lview').innerHTML=lens('roca');$('#b-aqui').parentNode.outerHTML=L('Marisol',l2,'There they are! A red-and-blue one and a green-and-black one. Two frogs!',false);say(l2,'es');res()};$('#b-aqui').focus()})}},
 jodi:ok=>`${ok?'':'You found a frog, and a gorgeous one. Good eyes. '}<i>Rana</i> is one frog. <i>Ranas</i> is more than one. And <i>la</i> turned into <i>las</i>. Spanish says "more than one" twice, so you get two chances to catch it.`,
 extra:`<div class="fichas"><h3>Ficha de campo: las ranas</h3>${ficha('ojosrojos')}${ficha('rojaazul')}${ficha('verdenegra')}</div>
 <div class="why"><b>Why "dart frog"?</b> In Colombia, the Emberá people used the poison of three very toxic frogs on the tips of their blowgun darts to hunt. Most dart frogs, like these two, were never used that way. Wild dart frogs get their poison from the tiny ants and mites they eat, so the frogs in the park, which eat crickets, aren't poisonous. <i>Never touch a dart frog in the wild.</i></div>`,
 photo:{src:'/assets/espanol/la-selva/dart-frogs.jpg',alt:'Two real poison dart frogs on a rock, one green and black, one red with blue legs',cap:'Las ranas, de verdad.'},
 next:()=>unlock('g2')});

/* Puerta 2 · La mariposa azul */
gate({id:'g2',n:2,found:'¡FOTO LISTA!',heard:'«la mariposa azul»',
 opts:[{sym:'morpho',n:1,v:'one-blue',k:'morfo',ok:1,saw:'una mariposa azul',label:'one blue butterfly'},{sym:'morpho',n:3,v:'three-blue',k:'tres-morfos',saw:'tres mariposas azules',label:'three blue butterflies'},{sym:'owlB',n:1,v:'owl',k:'buho',saw:'una mariposa gris y café',label:'one gray-brown butterfly with big eye spots'}],
 reveal:async(p,out)=>{const lines={'one-blue':['¡Perfecto! La mariposa azul. Es una morfo azul.','Perfect! The blue butterfly. It\'s a blue morpho.'],
   'three-blue':['¡Qué bonita foto! Pero son tres: las mariposas azules. Yo dije la mariposa azul. Una.','What a pretty photo! But that\'s three: the blue butterflies. I said the blue butterfly. One.'],
   'owl':['Es una mariposa, sí. Pero no es azul. Es gris y café. ¡Mira los ojos!','It is a butterfly, yes. But it isn\'t blue. It\'s gray and brown. Look at the eyes!']}[p.v];
  out.innerHTML=`<div class="dev"><div class="dev-img">${group(p.sym,p.n,null,'<rect width="300" height="200" fill="#CFE3D3"/><ellipse cx="150" cy="210" rx="200" ry="60" fill="#5E8B5A"/>')}</div><span>Tu foto</span></div>${L('Marisol',lines[0],lines[1],false)}`;say(lines[0],'es');await wait(900)},
 jodi:(ok,p)=>`${ok?'':p.v==='owl'?'You found a real beauty; that one is famous. But listen for the color word: <i>azul</i>. ':'Great eye: there were three. But listen to the ending. '}One: <i>la mariposa azul</i>. More than one: <i>las mariposas azules</i>. Even the color gets an ending, and <i>azul</i> adds <b>-es</b>, not just -s.`,
 extra:`<div class="fichas"><h3>Ficha de campo: las mariposas</h3>${ficha('morfo')}${ficha('buho')}${ficha('heliconia')}</div>`,
 photo:{src:'/assets/espanol/la-selva/owl-butterfly.jpg',alt:'A real owl butterfly with big eye spots on a wooden wall',cap:'William didn\'t find the blue one. He found this.'},
 next:()=>{unlock('f1');buildFork()}});

/* Elige tu camino (never scored) */
function buildFork(){if($('#fork-pics').children.length)return;
 const cart=`<svg viewBox="0 0 1200 560" aria-hidden="true">${oxScene()}</svg>`;
 const hums=`<svg viewBox="0 0 300 200" aria-hidden="true"><rect width="300" height="200" fill="#D9E7DC"/><use href="#hum" x="40" y="40" width="110" height="82"/><use href="#hum" x="150" y="80" width="110" height="82"/><ellipse cx="150" cy="190" rx="70" ry="14" fill="#C2261F"/></svg>`;
 pics($('#fork-pics'),[{svg:cart,v:'carreta',label:'the painted oxcart'},{svg:hums,v:'colibries',label:'the hummingbirds'}],(o,b)=>{if(S.fork)return;S.fork=o.v;TM.choice({scenarioIndex:'f1',choiceIndex:['carreta','colibries'].indexOf(o.v),category:'fork',choice:'f1:'+o.v});pushSummary();saveProgress();
  $('#fork-pics').querySelectorAll('.pic').forEach(x=>{x.disabled=true;x.setAttribute('aria-pressed',x===b?'true':'false');x.classList.toggle('sel',x===b)});o.v==='carreta'?forkCart():forkHum()})}
function forkCart(){const out=$('#f1body');out.innerHTML=`${frame('art-ox','0 0 1200 560','Two white oxen in a painted yoke beside a painted oxcart. Pins mark things to explore.')}<div id="ficha-ox" aria-live="polite"></div>
 ${L('Marisol','Miren: los bueyes y la carreta. ¡Qué colores!','Look: the oxen and the oxcart. What colors!',false)}
 <div class="culture"><b>La carreta</b> is a symbol of Costa Rica. Oxcarts once carried the country's coffee over the mountains to the coast.</div>`;
 const svg=$('#art-ox');svg.innerHTML=oxScene()+hotspot('bueyes',340,250,340,212)+hotspot('carreta',900,260,900,222)+hotspot('ruedas',830,400,830,362);wireHot(svg,$('#ficha-ox'));sizePins();
 say('Miren: los bueyes y la carreta. ¡Qué colores!','es');
 out.insertAdjacentHTML('beforeend',`<p class="tip-line">One <i>buey</i>, two <i>bueyes</i>: another word that adds <b>-es</b>.</p>`);
 realPhoto(out,'/assets/espanol/la-selva/oxen.jpg','Two real white oxen with long horns, yoked to a painted red oxcart','Los bueyes, de verdad.');forkDone(out)}
function forkHum(){const out=$('#f1body');out.innerHTML=`${frame('art-hum','0 0 1200 560','Red hummingbird feeders hang from a beam. Tap them to bring the hummingbirds.')}
 ${L('Marisol','Toquen los comederos. ¿Cuántos colibríes vienen?','Tap the feeders. How many hummingbirds come?',false)}<div class="counter" id="hum-count" aria-live="polite">0</div>`;setTimeout(sizePins,0);
 const svg=$('#art-hum');svg.innerHTML=humScene()+`<g class="hot pin" tabindex="0" role="button" aria-label="Tap the feeders" id="feed" data-pm-tap="Terminen la escena: toquen los comederos."><circle class="hit" cx="600" cy="230" r="44" fill="#fff" opacity="0"/><circle class="pulse" cx="600" cy="230" r="20" fill="none" stroke="#FBF6EE" stroke-width="4"/><circle cx="600" cy="230" r="20" fill="#FBF6EE" stroke="#B0773A" stroke-width="4"/><text x="600" y="237" text-anchor="middle" style="font:700 20px sans-serif" fill="#245866">+</text></g>`;
 const W=['un colibrí','dos colibríes','tres colibríes','cuatro colibríes','cinco colibríes','seis colibríes'];let n=0;
 const add=()=>{if(n>=6)return;const p=HUMPOS[n];$('#hums').insertAdjacentHTML('beforeend',`<use href="#hum" x="${p[0]}" y="${p[1]}" width="96" height="72" class="hum-in"/>`);say(W[n],'es');n++;$('#hum-count').textContent=W[n-1];
  if(n===6){$('#feed').removeAttribute('data-pm-tap');$('#hum-count').textContent='¡seis colibríes!';out.insertAdjacentHTML('beforeend',`<p class="tip-line">One <i>colibrí</i>, many <i>colibríes</i>. Words that end in an accented <b>-í</b> usually add <b>-es</b>.</p><div class="fichas">${ficha('colibri')}${ficha('heliconia')}</div>`);forkDone(out)}};
 const f=$('#feed');f.onclick=add;f.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();add()}}}
function forkDone(out){out.insertAdjacentHTML('beforeend',go('fork-next','Sigue ↓'));$('#fork-next').onclick=()=>unlock('g3');pmRefresh()}

/* Puerta 3 · El tucán: tres, not trece */
const plate=n=>{let u='';for(let i=0;i<n;i++)u+=`<use href="#pap" x="${60+(i%5)*38}" y="${70-Math.floor(i/5)*22+((i%2)*4)}" width="40" height="40"/>`;
 return `<svg viewBox="0 0 300 200" aria-hidden="true"><ellipse cx="150" cy="140" rx="130" ry="36" fill="#D8DCDE"/><ellipse cx="150" cy="134" rx="118" ry="30" fill="#EEF1F2"/>${u.replace(/y="(-?\d+)"/g,(m,y)=>`y="${+y+50}"`)}</svg>`};
gate({id:'g3',n:3,found:'¡ESTÁ CONTENTO!',heard:'«tres pedazos»',
 opts:[{svg:plate(3),v:'3',k:'tres',ok:1,saw:'tres pedazos',label:'a plate with 3 pieces of papaya'},{svg:plate(13),v:'13',k:'trece',saw:'trece pedazos',label:'a plate with 13 pieces of papaya'},{svg:plate(2),v:'2',k:'dos',saw:'dos pedazos',label:'a plate with 2 pieces of papaya'}],
 reveal:async(p,out)=>{const NUM=['uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece'];const n=+p.v;
  out.innerHTML=`<div class="feed"><svg viewBox="0 0 600 260" id="feed-svg" role="img" aria-label="Feeding the toucan, one piece at a time"><rect width="600" height="260" rx="14" fill="#CFE0D2"/><path d="M40 210 C200 196 400 196 560 210" stroke="#5B4029" stroke-width="16" stroke-linecap="round" fill="none"/><use href="#toucan" x="40" y="40" width="230" height="195"/><g id="pile"></g></svg><div class="counter" id="feed-count" aria-live="polite"></div></div>`;
  hush();
  for(let i=0;i<n;i++){$('#pile').insertAdjacentHTML('beforeend',`<use href="#pap" x="${300+(i%6)*44}" y="${150-Math.floor(i/6)*34}" width="44" height="44"/>`);$('#feed-count').textContent=NUM[i];sayQ(NUM[i]);await wait(n>10?380:700)}
  let line,en;if(n===3){line='Uno, dos, tres. ¡Perfecto! Está contento.';en='One, two, three. Perfect! He\'s happy.'}
  else if(n===13){line='¡Trece no! Tres. ¡Este tucán va a explotar!';en='Not thirteen! Three. This toucan is going to explode!'}
  else{await wait(300);$('#pile').insertAdjacentHTML('beforeend',`<use href="#pap" x="${300+2*44}" y="150" width="44" height="44"/>`);$('#feed-count').textContent='tres';line='Uno, dos… ¡falta uno! Tres.';en='One, two… one\'s missing! Three.'}
  out.insertAdjacentHTML('beforeend',L('El cuidador',line,en,false));sayQ(line)},
 jodi:(ok,p)=>`${ok?'':p.v==='13'?'Generous! But listen to the end of the word. ':'So close: you counted right, just one short. '}<i>Tres</i> is 3. <i>Trece</i> is 13. Same start, so listen to the end: <i>tres</i> stops short, <i>trece</i> keeps going.`,
 extra:`<div class="fichas"><h3>Ficha de campo: el tucán</h3>${ficha('tucan')}</div>`,
 photo:{src:'/assets/espanol/la-selva/toucan-tray.jpg',alt:'A real toucan with a huge yellow-and-brown bill next to a tray of chopped papaya and fruit',cap:'El tucán y su papaya, de verdad.'},
 next:()=>unlock('cata')});

/* Las cataratas: count five */
{const W=['una catarata','dos cataratas','tres cataratas','cuatro cataratas','cinco cataratas'];let n=0;
 $('#b-bajar2').onclick=()=>{if(n>=5)return;n++;$('#art-gorge').innerHTML=gorge(n);$('#cata-count').textContent=W[n-1];say(W[n-1],'es');
  if(n===5){$('#b-bajar2').hidden=true;$('#b-bajar2').removeAttribute('data-pm-tap');const out=$('#cata-out');const l='¡Cinco cataratas! ¡Estamos mojados!';
   out.innerHTML=L('Marisol',l,'Five waterfalls! We\'re soaked!',false)+`<p class="tip-line"><i>Una catarata</i>, then <i>dos cataratas</i>: the <b>-s</b> shows up as soon as there's more than one.</p><div class="fichas">${ficha('catarata')}</div>`;
   sayQ(l);realPhoto(out,'/assets/espanol/la-selva/waterfall.jpg','William, soaked through, leaning on a railing in front of a roaring waterfall in the cloud forest','Así quedó William.');
   out.insertAdjacentHTML('beforeend',go('cata-next','Sigue ↓'));$('#cata-next').onclick=()=>unlock('g4')}}}

/* Puerta 4 · El lunes en clase */
gate({id:'g4',n:4,found:'¡BIEN!',heard:'«dos ranas y un tucán»',
 opts:[{svg:snap(2,1),v:'2+1',k:'2ranas-1tucan',ok:1,saw:'dos ranas y un tucán',label:'photo with two frogs and one toucan'},{svg:snap(1,2),v:'1+2',k:'1rana-2tucanes',saw:'una rana y dos tucanes',label:'photo with one frog and two toucans'},{svg:snap(2,2),v:'2+2',k:'2ranas-2tucanes',saw:'dos ranas y dos tucanes',label:'photo with two frogs and two toucans'}],
 reveal:async(p,out)=>{const [f,t]=p.v.split('+').map(Number);
  $('#screen').innerHTML=`<g transform="translate(350 80)">${snap(f,t).replace('<svg viewBox="0 0 300 200" aria-hidden="true">','<svg width="480" height="300" viewBox="0 0 300 200">')}</g>`;
  $('#art-class').scrollIntoView({block:'center'});
  const lines={'2+1':['¡Sí! Dos ranas y un tucán. ¡Qué bonito!','Yes! Two frogs and one toucan. How nice!'],'1+2':['¿Dos tucanes? Mmm… yo dije un tucán. Y dos ranas.','Two toucans? Hmm… I said one toucan. And two frogs.'],'2+2':['Dos ranas, sí. Pero un tucán, no dos.','Two frogs, yes. But one toucan, not two.']}[p.v];
  await wait(500);out.innerHTML=L('La profe Daniela',lines[0],lines[1],false);say(lines[0],'es');
  if(!p.ok){await wait(1600);$('#screen').innerHTML=`<g transform="translate(350 80)">${snap(2,1).replace('<svg viewBox="0 0 300 200" aria-hidden="true">','<svg width="480" height="300" viewBox="0 0 300 200">')}</g>`;out.insertAdjacentHTML('beforeend',`<p class="tip-line">She swipes to the right photo: <i>dos ranas y un tucán</i>.</p>`)}},
 jodi:(ok,p)=>`${ok?'':p.v==='1+2'?'You heard both animals. The numbers just swapped places. ':'You got the frogs. Now the toucan: '}<i>Dos ranas</i>: two, and an <b>-s</b>. <i>Un tucán</i>: one, no <b>-es</b>. Every word in the phrase agreed on how many.`,
 next:()=>{unlock('fin');buildEnd()}});

/* The end: your photos, what your Spanish did, Aduana, the passport */
function buildEnd(){if($('#roll-grid').children.length)return;pmWait($('#aduana'),true);T('ev_aduana',{phase:'start',form:'B'});
 $('#roll-grid').innerHTML=S.photos.map(p=>`<figure class="polaroid"><img src="${p.src}" alt="${p.alt}">${p.cap}</figure>`).join('');
 $('#recap').innerHTML=S.gates.map(g=>`<div class="tile ${g.ok?'ok':''}"><span class="tn">Puerta ${g.n}</span><b>You heard ${g.heard}</b><span>You picked: ${g.saw}${g.ok?' ✓':` · It meant: ${g.rightSaw}`}</span></div>`).join('')+
  `<div class="tile"><span class="tn">Tu camino</span><b>${S.fork==='carreta'?'La carreta':'Los colibríes'}</b><span>Never scored. Play again to see the other path.</span></div>`;
 check(ADU,'adu','a',S.adu,passport)}
function passport(){T('ev_aduana',{phase:'done',form:'B',res:S.adu});pmWait($('#aduana'),false);const E=S.emb.reduce((a,b)=>a+b,0),A=S.adu.reduce((a,b)=>a+b,0);
 const skills=[['One or more','<i>Las ranas</i> means more than one, even with no number.'],['Color + plural','<i>Las mariposas azules</i>: the color word gets <b>-es</b> too.'],['Numbers','<i>Tres</i> is 3, <i>trece</i> is 13. Listen to the end.']];
 $('#adu').innerHTML=`<div class="ready"><h2>¡De vuelta en casa!</h2><p>Customs is done.</p></div>`;
 $('#passport').innerHTML=`<div class="pass-book"><div class="pb-head"><b>Pasaporte</b><span>La selva · Costa Rica</span></div>
 <p class="pb-score">Al embarcar: <b>${E} de 3</b>. En la aduana: <b>${A} de 3</b>.</p>
 ${skills.map((s,i)=>{const e=S.emb[i],a=S.adu[i];const st=a&&!e?'<span class="stamp new">¡NUEVO!</span>':a&&e?'<span class="stamp had">YA LO SABÍAS</span>':'<span class="stamp try">PRACTICA</span>';
  return `<div class="pb-row">${st}<div><b>${s[0]}</b>${a?'':`<p>${s[1]}</p>`}</div></div>`}).join('')}
 ${jodi(A===3?'Look at that. You heard "more than one" in the endings, not just in the numbers. That\'s the whole trick.':A>E?'You grew on this trip. Keep listening to the ends of words: that\'s where Spanish tells you how many.':'Listening to the ends of words takes practice. Play again and listen for <i>-s</i>, <i>-es</i> and <i>las</i>.')}
 <div class="row"><button class="ghost" id="b-replay" style="color:#FBF6EE;border-color:#FBF6EE">Juega otra vez · elige otro camino</button></div></div>`;
 $('#b-replay').onclick=()=>{location.href=location.pathname+location.search};$('#passport').scrollIntoView({block:'start'});
 const c=S.gates.filter(g=>g.ok).length;
 TM.complete({finalScore:c,percentage:c*25,summary:{gates:gatesNow(),path:{f1:S.fork||null},mode:S.mode,score:c,checks:checksNow()}});
 if(ST)ST.logCompletion('La selva',{score:c,finalScore:c,maxScore:4});else dlog('game_scores',{gameName:'La selva',completed:true,score:c});saveProgress(true)}

}
</script>
