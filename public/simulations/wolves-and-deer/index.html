<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wolves &amp; Deer · Allgood Academy</title>
<meta name="description" content="A winter survey simulation for grades 6–8. Fly over a snowy valley, count the deer and wolves, and figure out why their numbers rise and fall together.">
<meta name="standards" content="NGSS MS-LS2-2; MS-LS2-1; MS-LS2-4">
<link rel="stylesheet" href="/assets/css/design-tokens.css">
<style>
/* VOICE: a field biologist's winter. Quiet, cold air, a warm notebook.
   IDEA: the aerial winter survey (Isle Royale has flown one every winter since 1958) + the biologist's field notebook.
   PICTURE: a top-down topo map of a snowy valley; deer and wolf packs leave tracks; saplings go from green to browsed brown.
   COLOUR: snow and slate for the land, pine green for the forest, rust deer, slate-grey wolves, brand orange only for actions.
   LAYOUT: the map fills the window; a field notebook floats right; a survey log is clipped to the map's lower left. */
:root{
  --ink:var(--color-ink); --ink2:var(--color-ink-soft); --line:var(--color-hairline);
  --accent:var(--color-teal); --accent-text:var(--color-teal-deep); --cta:var(--color-orange); --cta-d:var(--color-orange-deep); --focus:var(--color-teal-deep);
  --snow1:#F3F7F8; --snow2:#E2EBEE; --topo:#C9D7DD; --lake:#BCD5DF; --lake-edge:#94B6C4;
  --pine:#2E5A4C; --pine2:#41725F; --sapling:#5E8F4E; --browsed:#A6876A;
  --deer:#8A4B2A; --wolf:#3E4A55; --track:#9DB0B9;
  --paper:var(--color-cream); --paper-b:var(--color-cream-border); --rule:#DCE7EB; --margin:color-mix(in srgb, var(--color-orange) 38%, var(--color-cream));
  --hud:color-mix(in srgb, var(--color-surface) 90%, transparent); --card:var(--color-surface); --sel:var(--color-teal-wash);
  --nbw:clamp(300px, 31vw, 400px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme=light]){
  --ink:var(--color-warm-white); --ink2:color-mix(in srgb, var(--color-warm-white) 72%, var(--color-muted)); --line:color-mix(in srgb, var(--color-muted) 40%, var(--color-dark-card));
  --accent-text:var(--color-teal-wash); --focus:var(--color-teal-wash);
  --snow1:#1C2B36; --snow2:#15222B; --topo:#2B3F4C; --lake:#203849; --lake-edge:#355468;
  --pine:#3D7362; --pine2:#4E8774; --sapling:#86B872; --browsed:#8E7762; --deer:#D9925F; --wolf:#C9D3DA; --track:#4C6271;
  --paper:var(--color-dark-card); --paper-b:color-mix(in srgb, var(--color-muted) 40%, var(--color-dark-card)); --rule:color-mix(in srgb, var(--color-muted) 22%, var(--color-dark-card));
  --margin:color-mix(in srgb, var(--color-orange) 45%, var(--color-dark-card));
  --hud:color-mix(in srgb, var(--color-dark-card) 90%, transparent); --card:var(--color-dark); --sel:color-mix(in srgb, var(--color-teal) 30%, var(--color-dark-card));
  color-scheme:dark; } }
:root[data-theme=dark]{
  --ink:var(--color-warm-white); --ink2:color-mix(in srgb, var(--color-warm-white) 72%, var(--color-muted)); --line:color-mix(in srgb, var(--color-muted) 40%, var(--color-dark-card));
  --accent-text:var(--color-teal-wash); --focus:var(--color-teal-wash);
  --snow1:#1C2B36; --snow2:#15222B; --topo:#2B3F4C; --lake:#203849; --lake-edge:#355468;
  --pine:#3D7362; --pine2:#4E8774; --sapling:#86B872; --browsed:#8E7762; --deer:#D9925F; --wolf:#C9D3DA; --track:#4C6271;
  --paper:var(--color-dark-card); --paper-b:color-mix(in srgb, var(--color-muted) 40%, var(--color-dark-card)); --rule:color-mix(in srgb, var(--color-muted) 22%, var(--color-dark-card));
  --margin:color-mix(in srgb, var(--color-orange) 45%, var(--color-dark-card));
  --hud:color-mix(in srgb, var(--color-dark-card) 90%, transparent); --card:var(--color-dark); --sel:color-mix(in srgb, var(--color-teal) 30%, var(--color-dark-card));
  color-scheme:dark; }
*{box-sizing:border-box;min-width:0}
[hidden]{display:none !important}
html,body{margin:0}
body{background:var(--snow2);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--font-display);font-weight:700;line-height:1.15;margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:-1px;padding:0;border:0}

/* Header: the shared Allgood Academy header */
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:50;background:var(--paper);color:var(--ink);border:1px solid var(--paper-b);border-radius:12px;padding:10px 14px;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.2)}

/* The field */
.app{position:relative;height:calc(100vh - 60px);height:calc(100dvh - 60px);min-height:360px;overflow:hidden}
.world{position:absolute;inset:0}
#map{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:14px;top:12px;display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;max-width:calc(100% - var(--nbw) - 44px);z-index:4}
.chip{background:var(--hud);border:1px solid var(--line);border-radius:12px;padding:6px 10px;box-shadow:0 2px 8px rgba(0,0,0,.08);backdrop-filter:blur(4px)}
.chip.yr{display:flex;flex-direction:column;justify-content:center;min-width:86px}
.chip.yr span{font-size:11px;color:var(--ink2);letter-spacing:.3px}
.chip.yr b{font-family:var(--font-display);font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.counts{display:flex;gap:14px;align-items:center}
.cnt{display:flex;flex-direction:column;font-size:11px;color:var(--ink2)}
.cnt b{font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.cnt .k{display:flex;align-items:center;gap:5px}
.dot{display:inline-block;width:12px;height:7px;border-radius:50%}
.dot.deer{background:var(--deer)} .dot.wolf{background:var(--wolf);width:14px;height:5px} .dot.sap{background:var(--sapling);width:8px;height:8px}
.meter{width:64px;height:6px;border-radius:4px;background:var(--snow2);border:1px solid var(--line);margin-top:3px;position:relative;overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--sapling);width:50%}
.meter .dz{position:absolute;top:-2px;bottom:-2px;left:20%;width:2px;background:var(--ink)}
.ctlchip{display:flex;gap:6px;align-items:center}
.hbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;min-height:36px;padding:4px 12px;font-weight:700;font-size:13px;cursor:pointer}
.hbtn[aria-pressed="true"]{background:var(--accent);color:var(--color-surface);border-color:var(--accent)}
.hbtn:disabled{opacity:.45;cursor:not-allowed}
.keyline{font-size:11px;color:var(--ink2);margin-top:2px}

.log{position:absolute;left:14px;bottom:14px;width:min(600px, calc(100% - var(--nbw) - 44px));height:clamp(140px, 30%, 240px);z-index:3;
  background:var(--paper);border:1px solid var(--paper-b);border-radius:6px 14px 14px 6px;box-shadow:0 6px 20px rgba(0,0,0,.16)}
.log::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:6px 0 0 6px;background:var(--pine);opacity:.85}
#logcv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}

.notebook{position:absolute;right:14px;top:12px;bottom:14px;width:var(--nbw);overflow:auto;z-index:5;
  background-color:var(--paper);background-image:linear-gradient(90deg, transparent 30px, var(--margin) 30px, var(--margin) 31.5px, transparent 31.5px);
  border:1px solid var(--paper-b);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:18px 18px 22px 44px;overscroll-behavior:contain}
.tabs{display:flex;gap:5px;list-style:none;padding:0;margin:0 0 12px}
.tabs li{flex:1;height:5px;border-radius:3px;background:var(--paper-b)}
.tabs li.done{background:var(--accent)} .tabs li.now{background:var(--cta)}
.kicker{font-size:11.5px;font-weight:700;color:var(--accent-text);margin:0 0 3px;letter-spacing:.4px}
.notebook h2{font-size:24px;margin:0 0 10px;outline:none}
.notebook p{margin:0 0 10px}
.q{font-weight:700;margin:12px 0 8px}
.radio{display:flex;gap:10px;align-items:flex-start;margin:8px 0 12px;padding:9px 11px;border:1px solid var(--paper-b);border-radius:4px 14px 14px 14px;background:var(--card)}
.radio img{width:38px;height:38px;border-radius:50%;flex:none;background:var(--paper);border:1px solid var(--paper-b)}
.radio .who{display:block;font-size:10.5px;font-weight:700;color:var(--accent-text);letter-spacing:.5px;margin-bottom:2px}
.radio p{margin:0 0 6px}.radio p:last-child{margin:0}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.choices.text{grid-template-columns:1fr}
.choice{position:relative;text-align:left;border:1px solid var(--paper-b);background:var(--card);border-radius:12px;padding:8px 9px 9px;cursor:pointer;display:flex;flex-direction:column;gap:5px;min-height:44px;line-height:1.3;font-size:13.5px}
.choices.text .choice{flex-direction:row;align-items:flex-start;gap:9px;padding:10px 12px}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice[aria-pressed="true"]{border:2px solid var(--accent);padding:7px 8px 8px;background:var(--sel)}
.choices.text .choice[aria-pressed="true"]{padding:9px 11px}
.choice:disabled{cursor:default}
.choice:disabled:not([aria-pressed="true"]){opacity:.55}
.choice .ltr{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:999px;border:1.5px solid var(--accent);color:var(--accent-text);font-weight:700;font-size:12px;flex:none}
.choice[aria-pressed="true"] .ltr{background:var(--accent);color:var(--color-surface)}
.choice .ctop{display:flex;align-items:center;gap:6px}
.choice svg{width:100%;height:40px;display:block}
.choice .tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 7px;margin-left:4px;background:var(--accent);color:var(--color-surface)}
.btn{border:1px solid var(--paper-b);background:var(--card);border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:700;min-height:44px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.small{min-height:36px;padding:5px 11px;font-size:13px}
.btn.cta{background:var(--cta);color:var(--color-surface);border:0;box-shadow:0 4px 0 var(--cta-d);font-size:17px;padding:10px 18px}
.btn.cta:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 var(--cta-d)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.note{font-size:12.5px;color:var(--ink2)}
.goal{border:1.5px dashed var(--ink2);border-radius:12px;padding:9px 12px;margin:8px 0 10px;font-size:13.5px;background:var(--card)}
.goal b{display:block;font-family:var(--font-display);font-size:15px;margin-bottom:2px}
.progress{border-left:4px solid var(--cta);background:var(--card);padding:9px 12px;border-radius:0 12px 12px 0;margin:10px 0;font-size:14px}
.found{margin:10px 0 0}
.found h3{font-family:var(--font-ui);font-size:12px;letter-spacing:.5px;color:var(--accent-text);margin:0 0 6px;outline:none}
.stat{font-family:var(--font-display);font-size:18px;line-height:1.35;margin:0 0 8px}
.stat .d{color:var(--deer)} .stat .w{color:var(--wolf)}
details.why{border-top:1px solid var(--paper-b);padding-top:8px;margin:8px 0}
details.why summary{cursor:pointer;font-weight:700;color:var(--accent-text);font-size:13.5px}
details.why p{margin:8px 0 0;font-size:14px}
.pick{background:var(--card);border:1px solid var(--paper-b);border-radius:12px;padding:10px 12px;margin:6px 0 10px}
.pick label{display:flex;justify-content:space-between;font-weight:700;margin-bottom:2px}
.pick output{font-family:var(--font-display);font-size:20px;color:var(--accent-text);font-variant-numeric:tabular-nums}
.pick input[type=range]{width:100%;accent-color:var(--cta);height:30px;margin:0}
.hints{margin:6px 0 8px;padding-left:20px;font-size:14px}
.attempts{list-style:none;padding:0;margin:8px 0;font-size:13px}
.attempts li{border-bottom:1px dashed var(--paper-b);padding:5px 0}
.dtable{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:14px;background:var(--card);border:1px solid var(--paper-b)}
.dtable th,.dtable td{padding:6px 9px;text-align:left;border-bottom:1px solid var(--paper-b);font-variant-numeric:tabular-nums}
.dtable td:not(:first-child),.dtable th:not(:first-child){text-align:right}
.report dl{margin:4px 0 12px}
.report dt{font-family:var(--font-display);font-weight:700;margin-top:8px}
.report dd{margin:1px 0 0;font-size:14px}
.yours{list-style:none;padding:0;margin:6px 0 12px;font-size:13.5px}
.yours li{border-bottom:1px dashed var(--paper-b);padding:6px 0}
.honest{border:1px dashed var(--ink2);border-radius:12px;padding:9px 12px;margin:10px 0;background:var(--card);font-size:13.5px}
.honest b{font-family:var(--font-display);font-size:15px;display:block;margin-bottom:2px}
.honest p{margin:0 0 6px}
.toolbox{border:1px solid var(--paper-b);border-radius:12px;padding:10px 12px;background:var(--card);margin:10px 0}
.toolbox h3{font-family:var(--font-ui);font-size:12px;letter-spacing:.5px;color:var(--accent-text);margin:0 0 6px}
.tb{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:13px}
.tb .grp{display:flex;gap:5px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--paper-b);border-radius:10px;overflow:hidden}
.seg button{border:0;border-left:1px solid var(--paper-b);background:var(--card);padding:6px 10px;min-height:36px;cursor:pointer;font-size:13px}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--color-surface);font-weight:700}
.vote{border:1px dashed var(--paper-b);border-radius:12px;padding:8px 10px;margin:0 0 10px;background:var(--card)}
.vote summary{cursor:pointer;font-weight:700;font-size:13px}
.vote .vrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:6px}
.vote label{display:flex;align-items:center;gap:4px;font-weight:700}
.vote input{width:100%;min-height:38px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:3px 6px;font-size:16px}
.teach{border-top:1px solid var(--paper-b);margin-top:16px;padding-top:10px;font-size:12px;color:var(--ink2)}
.teach summary{cursor:pointer;font-weight:700}
.teach ul{padding-left:16px;margin:6px 0}
.term{appearance:none;background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--accent-text);text-decoration:underline dotted;text-underline-offset:3px;cursor:help}
.tip{position:absolute;z-index:60;max-width:min(270px,calc(100vw - 24px));background:var(--paper);color:var(--ink);border:1px solid var(--paper-b);border-radius:12px;padding:9px 11px;font-size:13.5px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.tip b{display:block;font-family:var(--font-display);font-size:14.5px}

/* Present mode */
body.present{--nbw:clamp(380px, 38vw, 520px)}
body.present .notebook{font-size:18px}
body.present .notebook h2{font-size:32px}
body.present .choice{font-size:17px}
body.present .choice svg{height:54px}
body.present .choice .ltr{width:28px;height:28px;font-size:15px}
body.present .btn.cta{font-size:21px}
body.present .chip.yr b{font-size:32px}
body.present .cnt b{font-size:22px}

/* Phones held upright and narrow windows: map pinned on top, notebook scrolls under it */
@media (max-width:759px), (orientation:portrait) and (max-width:1000px){
  .app{height:auto;overflow:visible;min-height:0}
  .world{position:sticky;top:60px;height:58vh;height:58svh;z-index:6;border-bottom:1px solid var(--line)}
  .hud{max-width:calc(100% - 16px);left:8px;top:8px;gap:5px;flex-wrap:nowrap}
  .chip{padding:3px 7px;border-radius:10px}
  .chip.yr{min-width:0} .chip.yr span{font-size:10px} .chip.yr b{font-size:16px}
  .cnt{font-size:10px} .cnt b{font-size:13px} .counts{gap:8px}
  .meter{width:44px}
  .hbtn{min-height:32px;padding:3px 8px;font-size:12px}
  .ctlchip{gap:4px}
  .keyline{display:none}
  .log{left:8px;right:8px;bottom:8px;width:auto;height:40%}
  .notebook{position:relative;inset:auto;width:auto;margin:10px;box-shadow:none}
}
@media (max-width:420px){ .choices{gap:6px} .choice{font-size:12.5px} }
@media (max-height:480px) and (orientation:landscape){ .chip.yr b{font-size:18px} .keyline{display:none} .log{height:34%} }
@media (prefers-reduced-motion: reduce){ *{transition:none !important;scroll-behavior:auto !important} }
</style>
<style>
/* Activity row (under the generated site nav): copied verbatim from /simulations/watercycle/ so
   every simulation page has the same row. Change it there and here together. The two lines after the copy pin what the
   header takes from Water Cycle's page rules (header teal, .wrap width, Present widths), so this
   page's own palette and layout cannot move it. */
.top{background:var(--header);color:var(--on-header);position:sticky;top:0;z-index:30;box-shadow:0 2px 6px color-mix(in srgb, var(--color-ink) 18%, transparent)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.wordmark{font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--on-header);text-decoration:none;white-space:nowrap}
.pill{background:var(--color-orange);color:var(--color-surface);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;font-family:var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.top-right{display:flex;align-items:center;gap:6px;flex:none}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:999px;color:var(--color-teal-wash);text-decoration:none}
.iconbtn:hover{background:color-mix(in srgb, var(--color-surface) 12%, transparent);color:var(--color-surface)}
.iconbtn:focus-visible{outline-color:var(--color-surface);outline-offset:-3px}
.iconbtn svg{width:22px;height:22px}
button.iconbtn{appearance:none;border:0;background:transparent;cursor:pointer;padding:0}
.wm-sub{font-family:var(--font-ui);font-size:12px;font-weight:400;opacity:.7;letter-spacing:.5px}
.navbtn{appearance:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;border:1px solid color-mix(in srgb, var(--color-surface) 45%, transparent);background:transparent;color:var(--color-surface);font-weight:700;font-size:13px;cursor:pointer;margin-right:4px}
.navbtn svg{width:18px;height:18px}
.navbtn:hover,.navbtn[aria-pressed="true"]{background:var(--color-surface);color:var(--color-teal-deep)}
.navbtn:focus-visible{outline-color:var(--color-surface)}
body.present .wm-sub,body.present .pill{display:none}
@media (max-width:700px){ .navbtn span{display:none}.navbtn{padding:0 9px} .wm-sub{display:none} .wordmark{font-size:16px} }
@media (max-width:420px){ .wordmark{display:none} .pill{max-width:70vw} }
.top{--header:var(--color-teal);--on-header:var(--color-surface);font-family:var(--font-ui);font-size:16px;line-height:1.55}
.top .wrap{max-width:1180px;margin:0 auto;padding:0 24px} body.present .top .wrap{max-width:none;padding:0 22px}
</style>
<style>
/* Comms (/js/message-hq.js) host styles. message-hq.js builds its inbox from Tailwind
   class names and expects the host page to define .hidden-modal / .visible-modal. These
   pages ship no Tailwind bundle (its preflight reset would restyle them), so the classes
   the inbox actually uses are defined here, scoped to #message-modal. Without this block
   the inbox renders open, unstyled, over the page on every load. */
.modal-transition{transition:opacity .2s ease-in-out,transform .2s ease-in-out}
#message-modal.hidden-modal{opacity:0;pointer-events:none;transform:translateY(-10px)}
#message-modal.visible-modal{opacity:1;pointer-events:auto;transform:none}
#message-modal{padding:24px;font:14px/1.5 Verdana,Geneva,Tahoma,sans-serif;color:var(--color-ink);text-align:left;color-scheme:light}
#message-modal *{box-sizing:border-box} #message-modal .relative{position:relative}
#message-modal h3,#message-modal p{margin:0}
#message-modal button{font:inherit;cursor:pointer;background:none;border:0;color:inherit;padding:0}
#message-modal svg.w-5{width:20px;height:20px} #message-modal svg.w-3{width:12px;height:12px}
#message-modal .bg-white{background:var(--color-surface)}

/* ================= Model =================

   It is an illustration of the pattern, tuned by hand, not a forecast for any real place. */
var FOOD={low:0.5, normal:0.8, rich:1.15}, FOOD_WORD={low:"low",normal:"normal",rich:"rich"};

function Model(){ this.set({}); }
Model.prototype.set=function(o){
  o=o||{}; this.t=0; this.P=o.P!=null?o.P:70; this.D=o.D!=null?o.D:400; this.W=o.W!=null?o.W:14;

function spark(kind){
  var D='var(--deer)', W='var(--wolf)', path=function(pts,col,dash){ return '<polyline fill="none" stroke="'+col+'" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"'+(dash?' stroke-dasharray="1 0"':'')+' points="'+pts+'"/>'; };
  var base='<line x1="2" y1="38" x2="118" y2="38" stroke="var(--paper-b)" stroke-width="1.5"/>', body='';
  var wave=function(amp,mid,ph,col){ var p=[]; for(var i=0;i<=40;i++){ var x=4+i*2.8; p.push(x.toFixed(1)+","+(mid-amp*Math.sin(i/40*6.283*1.6+ph)).toFixed(1)); } return path(p.join(" "),col); };
  if(kind==="up") body=path("4,32 40,26 80,15 116,4",D);
  else if(kind==="level") body=path("4,32 28,22 48,13 70,10 116,10",D);
  else if(kind==="boom") body=path("4,30 22,20 34,8 44,6 56,14 70,26 84,27 100,24 116,26",D);
  else if(kind==="flat") body=path("4,22 40,21 80,23 116,22",D);
  else if(kind==="wipe") body=path("4,10 30,22 52,34 70,37 116,37",D)+path("4,34 26,26 46,22 66,30 86,37 116,37",W);
  else if(kind==="flat2") body=path("4,10 30,18 60,16 116,16",D)+path("4,34 30,28 60,29 116,29",W);
  else if(kind==="waves") body=wave(9,17,0,D)+wave(5,30,-1.1,W);
  else if(kind==="noeffect") body=path("4,10 40,9 80,11 116,10",D)+path("4,33 40,33 80,34 116,33",W);
  else if(kind==="ir_a") body=path("4,8 60,20 116,30",D)+path("4,34 60,24 116,12",W);
  else if(kind==="ir_b") body=path("4,8 50,26 80,37 116,37",D)+path("4,34 50,18 80,26 116,37",W);
  else if(kind==="ir_c") body=path("4,10 116,10",D)+path("4,32 116,32",W);
  else if(kind==="ir_d") body=path("4,12 60,8 116,4",D)+path("4,32 60,32 116,33",W);
  return '<svg viewBox="0 0 120 40" preserveAspectRatio="none" aria-hidden="true">'+base+body+'</svg>';
}

  if(S.picked){
    if(n===4){ var f=R4[S.picked];
      h+='<div class="found"><h3 id="fbh">JODI\'S TAKE</h3>'+radio(f.mood,f.lead)+'<p>It\'s timing. Pups take time to grow into hunters, so wolves keep climbing after the deer start to fall. And hungry wolves take time to die off, so the deer keep dropping for a while too. Linked, but never in step.</p></div>'; }
    else { var g=R5[S.picked];
      h+='<div class="found"><h3 id="fbh">THE 2026 COUNT</h3>'+radio(g.mood,g.lead)+
        '<table class="dtable"><thead><tr><th scope="col"></th><th scope="col">2019</th><th scope="col">2026</th></tr></thead><tbody><tr><td>Wolves</td><td>19 brought in</td><td>about 37</td></tr><tr><td>Moose</td><td>about 2,000</td><td>about 524</td></tr></tbody></table>'+
        '<p>The most wolves since the late 1970s. For the first time in 68 years of counting, the team saw no moose calves.</p>'+
        '<details class="why" open><summary>Was it only the wolves?</summary><p>No. The moose had also eaten their favorite winter food, balsam fir, so hard that it still hasn\'t recovered. Predators and food, together. Scientists are now watching whether the packs can stay in balance with so few moose. You already know what your log would guess next.</p></details></div>'; }
    h+='<p class="note">Tap another answer to compare.</p><div class="row"><button class="btn cta" data-act="next">'+(n===4?"Next season":"Write the field report")+'</button></div>';
  }
  return h;
}
function renderReport(){
  var h='<ol class="tabs" aria-hidden="true"><li class="done"></li><li class="done"></li><li class="done"></li><li class="done"></li><li class="done"></li></ol><p class="kicker">Survey complete</p><h2 id="stitle">Field report</h2>';
  h+='<div class="report"><dl>'+
    '<dt>Predators keep prey in check.</dt><dd>Wolves stop deer from eating all their food.</dd>'+
    '<dt>No predators: boom, then bust.</dt><dd>Deer shoot past what their food can hold, eat it down, and crash.</dd>'+
    '<dt>Predators usually run out first.</dt><dd>When prey get scarce, wolves go hungry and their numbers fall.</dd>'+
    '<dt>Linked waves.</dt><dd>The two lines rise and fall together, wolves a step behind.</dd>'+
    '<dt>Food and weather count too.</dt><dd>Harsh winters and worn-out food push numbers around as much as wolves do.</dd></dl></div>';
  var H=S.history, items=[];
  if(H[1]) items.push('<b>Season 1.</b> You drew "'+esc(H[1].guess)+'." The survey: boom, then crash.');
  if(H[2]) items.push('<b>Season 2.</b> You drew "'+esc(H[2].guess)+'." The survey: waves, wolves a step behind.');
  if(H[3]) items.push('<b>Season 3.</b> You saved the valley in '+H[3].tests+(H[3].tests===1?' flight':' flights')+'.');
  if(H[5]) items.push('<b>Season 5.</b> You picked "'+esc(H[5].guess)+'." The count: about 37 wolves, about 524 moose.');
  if(items.length) h+='<h3 style="font-size:16px;margin:4px 0">Your guesses vs. the survey</h3><ul class="yours"><li>'+items.join('</li><li>')+'</li></ul>';
  h+='<div class="honest"><b>One honest thing</b><p>Cedar Hollow is a model, kept simple on purpose. Real places add disease, ticks, cougars, bears and people.</p><p>Even on Isle Royale, scientists say neither "the wolves did it" nor "the food did it" explains the swings alone. And in Yellowstone, scientists are still debating how far the wolves\' effects reach. That\'s real science, still being worked out.</p></div>';
  h+=radio("happy",'<p>Nice flying, biologist. The valley is yours now. Try a harsh winter, a rich food year, or no wolves at all, and watch your log.</p>');
  h+='<div class="toolbox" aria-label="Field tools"><h3>FIELD TOOLS</h3><div class="tb">'+
    '<span>Wolves</span><span class="grp"><button class="btn small" data-act="w-5">− 5</button><button class="btn small" data-act="w+5">+ 5</button><button class="btn small" data-act="w0">Remove all</button></span>'+
    '<span>Food</span><span class="seg" role="group" aria-label="Food supply">'+["low","normal","rich"].map(function(f){ return '<button data-act="food" data-food="'+f+'" aria-pressed="'+(model.food===f)+'">'+f.charAt(0).toUpperCase()+f.slice(1)+'</button>'; }).join('')+'</span>'+
    '<span>Weather</span><span class="grp"><button class="btn small" data-act="winter">Send a harsh winter</button></span></div></div>';
  h+='<div class="row"><button class="btn" data-act="restart">Start over</button></div>'+teachNotes();
  return h;
}
function teachNotes(){
  return '<details class="teach"><summary>For teachers: standards, sources, privacy</summary>'+
    '<p><b>Standards.</b> NGSS MS-LS2-2 (patterns of interactions, including predatory, across ecosystems). Supports MS-LS2-1 (resources and populations) and MS-LS2-4 (ecosystem changes affect populations).</p>'+
    '<p><b>The model</b> is hand-tuned to show the pattern. It isn\'t a forecast for any real place.</p>'+
    '<p><b>Privacy.</b> No sign-in, nothing typed is stored, class votes are counts only.</p>'+
    '<ul><li>NGSS MS-LS2-2 and LS2.A text (nextgenscience.org; CA Dept. of Education)</li><li>NPS Isle Royale: Wolf &amp; Moose Populations; Predator-Prey Relationships; Why Relocate Wolves</li><li>Michigan Tech Isle Royale Winter Study (2024, 2026 reports); Isle Royale Wolf-Moose Project</li><li>USGS, Nelson &amp; Mech 1986: snow depth and wolf predation on deer</li><li>Minnesota DNR: how winter affects deer survival</li><li>NPS Yellowstone: The Big Scientific Debate: Trophic Cascades</li></ul></details>';
}

/* ---------- flow ---------- */
function peaks(hist, from){ var d=null, wp=null, i;
  for(i=1;i<hist.length-1;i++){ var p=hist[i]; if(p.t<from) continue; if(p.D>=hist[i-1].D && p.D>hist[i+1].D && p.D>300){ d=p; break; } }
  if(d){ for(i=1;i<hist.length-1;i++){ var q=hist[i]; if(q.t<=d.t) continue; if(q.W>=hist[i-1].W && q.W>hist[i+1].W){ wp=q; break; } } }
  return {d:d, w:wp}; }
function enterStep(n){
  if(S.step>=1 && S.step!==n){ activeClock(); track("wd_step_end",{step:S.step, activeMs:Math.round(stepClock.ms)}); }
  S.step=n; S.votes={}; S.voteSent=false; S.pred=null; S.locked=false; S.running=false; S.revealed=false; S.hints=0; S.waitStart=null; S.testing=null; S.picked=null;
  resetClock(); stepHook=null; logv.danger=false; logv.ghost=null; logv.marks=null; logv.mode="valley"; logv.isoLate=false; map.mode="valley"; $("#play").disabled=false; fast=false; $("#speed").setAttribute("aria-pressed","false");
  if(n===0){ model.set({P:70,D:400,W:14}); model.ff(10); setPlaying(true); }
  else if(n===1){ model.set({P:70,D:400,W:14}); model.ff(24); S.introD=model.D; S.introW=model.W; setPlaying(false); $("#play").disabled=true; }
  else if(n===2){ model.set({P:50,D:600,W:0}); setPlaying(false); $("#play").disabled=true; }
  else if(n===3){ model.set({P:60,D:700,W:2+S.release,winters:[8,19]}); setPlaying(false); logv.danger=true; $("#play").disabled=true; }
  else if(n===4){ model.set({P:50,D:600,W:10}); model.ff(40); setPlaying(false); $("#play").disabled=true;
    var pk=peaks(model.hist,3); S.stats={gap: pk.d&&pk.w ? Math.round(pk.w.t-pk.d.t) : 3};
    logv.marks=(pk.d&&pk.w)?[{panel:0,t:pk.d.t,v:pk.d.D,label:"deer peak"},{panel:1,t:pk.w.t,v:pk.w.W,label:"wolf peak"}]:null; }
  else if(n===5){ setPlaying(false); $("#play").disabled=true; map.mode="island"; logv.mode="island"; map.iso={moose:2000,wolves:15}; map.isoT={moose:2000,wolves:15}; }
  else if(n===6){ model.set({P:70,D:400,W:14}); model.ff(15); setPlaying(true); }
  if(n>=1){ track("wd_step_start",{step:n, mode:PRESENT?"class":"solo"}); send("step",null,{step:n}); }
  if(n===6){ var H=S.history; send("complete",null,{summary:{predictionsMatched:(H[1]&&H[1].matched?1:0)+(H[2]&&H[2].matched?1:0), hintsUsed:H.hints||0, attemptsStep3:S.attempts.length, explanationBest:H[4]?H[4].best:false, transferBest:H[5]?H[5].best:false}}); }
  render(); renderHud(); guide.scrollTop=0; map.draw(model,clock,0); logv.draw(model);
  if(n>0) focusEl("#stitle");
}
function startRun(n){
  S.running=true;
  if(n===1){ model.W=0; model.log(); S.waitStart=model.t; logv.ghost={t0:model.t, len:20, v0:model.D, top:Math.max(800, model.D*3.6), f:GHOST[S.pred]}; }
  else { model.W=10; model.log(); S.waitStart=model.t; }
  track("wd_control",{step:n, control:n===1?"remove_wolves":"release_wolves"});
  setPlaying(true); $("#play").disabled=false; render(); focusEl("#act");
}
function reveal(){
  var n=S.step; S.revealed=true; setPlaying(false); $("#play").disabled=true;
  var st=STEPS[n], best=null, pc=null; st.choices.forEach(function(c){ if(c.best) best=c.id; if(c.id===S.pred) pc=c; });
  var matched=S.pred===best; track("wd_reveal",{step:n, prediction:S.pred, matched:matched});
  S.history[n]={guess:pc?pc.t:"", matched:matched};
  render(); announce("The survey results are in."); focusEl("#fbh");
}
function step1Stats(){ var t0=S.waitStart, after=model.hist.filter(function(h){return h.t>=t0;}), pk=after[0], minP=100;
  after.forEach(function(h){ if(h.D>pk.D) pk=h; if(h.P<minP) minP=h.P; }); var post=after.filter(function(h){return h.t>pk.t;}), minA=post.length?post[0].D:pk.D; post.forEach(function(h){ if(h.D<minA) minA=h.D; });
  return {d0:after[0].D, peak:pk.D, peakYrs:Math.max(1,Math.round(pk.t-t0)), minAfter:minA, minP:Math.round(minP)}; }
function step2Stats(){ var pk=peaks(model.hist.filter(function(h){return h.t>=S.waitStart;}), S.waitStart+1); var r=function(v){ return Math.round(v-S.waitStart); }; return {dPeakT:pk.d?r(pk.d.t):"?", wPeakT:pk.w?r(pk.w.t):"?"}; }
function tick(){
  var n=S.step;
  if(Math.floor(clock*4)!==tick.last){ tick.last=Math.floor(clock*4); renderHud(); }
  if((n===1||n===2) && S.running && !S.revealed){ var need=STEPS[n].need, el=$("#wleft"); if(el) el.textContent=Math.min(need,Math.floor(model.t-S.waitStart));
    if(model.t>=S.waitStart+need){ S.stats = n===1?step1Stats():step2Stats(); reveal(); } }
  if(n===3 && S.testing){ var ty=$("#tyear"); if(ty) ty.textContent=Math.min(30,Math.floor(model.t)); if(model.t>=30) finishTest(); }
}
function startTest(){
  var r=S.release; model.set({P:60,D:700,W:2+r,winters:[8,19]}); S.testing={release:r, fail:null};
  stepHook=function(mm){ var T=S.testing; if(!T||T.fail) return; if(mm.P<DANGER.P) T.fail={k:"P",t:mm.t}; else if(mm.D<DANGER.D) T.fail={k:"D",t:mm.t}; else if(mm.W<DANGER.W) T.fail={k:"W",t:mm.t}; };
  if(model.W<DANGER.W) S.testing.fail={k:"W",t:0};
  setPlaying(true); render(); announce("Flying 30 winters.");
}
function finishTest(){
  var T=S.testing; S.testing=null; stepHook=null; setPlaying(false);
  var r=T.release, f=T.fail, reason=null, headline, wn="";
  if(!f) headline="The valley made it 30 winters.";
  else { var many=r>=12; reason = f.k==="P" ? (many?"too_many_boom":"overbrowsed") : f.k==="W" ? (many?"too_many_wolves":"too_few_wolves") : "deer_crash";
    headline={P:"Young trees",D:"Deer",W:"Wolves"}[f.k]+" crossed the danger line in winter "+Math.max(0,Math.floor(f.t))+".";
    [8,19].forEach(function(wy){ if(f.t>=wy && f.t<wy+3) wn='<p>That harsh winter in winter '+wy+' made it harder: deep snow wears deer out, and wolves catch more deer in deep snow.</p>'; }); }
  var a={release:r, success:!f, reason:reason, headline:headline, winterNote:wn}; S.attempts.push(a);
  track("wd_attempt",{step:3, attempt:S.attempts.length, success:!f, failReason:reason, release:r, failLine:f?f.k:null, failYear:f?Math.floor(f.t):null});
  if(!f){ S.solved=true; S.history[3]={tests:S.attempts.length}; }
  render(); announce(headline); focusEl("#fbh");
}
guide.addEventListener("click", function(e){
  var b=e.target.closest("[data-act]"); if(!b||b.disabled) return;
  var act=b.getAttribute("data-act"), n=S.step, st=STEPS[n];
  if(act==="start") enterStep(1);
  else if(act==="present-on") setPresent(true);
  else if(act==="present-off") setPresent(false);
  else if(act==="pick"){ var id=b.getAttribute("data-id");
    if(n===1||n===2){ if(S.locked) return; S.pred=id; render(); var nb=$('[data-id="'+id+'"]',guide); if(nb) nb.focus({preventScroll:true}); }
    else { var ch=null; st.choices.forEach(function(c){ if(c.id===id) ch=c; });
      if(n===4 && S.firstExplain==null){ S.firstExplain=id; S.history[4]={best:!!ch.best}; track("wd_explanation",{step:4, choiceId:id, isBest:!!ch.best, firstTry:true}); }
      if(n===5 && S.firstTransfer==null){ S.firstTransfer=id; S.history[5]={guess:ch.t, best:!!ch.best}; track("wd_transfer",{step:5, choiceId:id, isBest:!!ch.best, firstTry:true}); logv.isoLate=true; map.isoT={moose:524, wolves:37}; }
      if(!S.picked) sendVote(n); var was=!!S.picked; S.picked=id; render(); renderHud(); logv.draw(model);
      if(!was){ announce("Jodi responds."); focusEl("#fbh"); } else { var pb=$('[data-id="'+id+'"]',guide); if(pb) pb.focus({preventScroll:true}); } } }
  else if(act==="lock"){ if(!S.pred) return; S.locked=true; track("wd_prediction",{step:n, choiceId:S.pred, mode:PRESENT?"class":"solo"}); sendVote(n); render(); focusEl("#act"); }
  else if(act==="go") startRun(n);
  else if(act==="hint"){ if(!st.hints||S.hints>=st.hints.length) return; S.hints++; S.history.hints=(S.history.hints||0)+1; track("wd_hint",{step:n, hint:S.hints}); render(); }
  else if(act==="test"){ if(!S.testing) startTest(); }
  else if(act==="next") enterStep(n+1);
  else if(act==="restart"){ send("restart",null,{}); S=freshState(); enterStep(0); }
  else if(act==="w-5") changeWolves(-5); else if(act==="w+5") changeWolves(5); else if(act==="w0") changeWolves(0,true);
  else if(act==="food"){ model.food=b.getAttribute("data-food"); $$('[data-act="food"]',guide).forEach(function(x){ x.setAttribute("aria-pressed",String(x===b)); }); track("wd_control",{step:n, control:"food", value:model.food}); }
  else if(act==="winter"){ if(!model.pendingWinter){ model.pendingWinter=true; if(!playing) setPlaying(true); toast("A harsh winter is on the way."); track("wd_control",{step:n, control:"winter"}); } }
});
guide.addEventListener("input", function(e){
  if(e.target.id==="release"){ S.release=+e.target.value; var o=$("#relOut"); if(o) o.textContent=S.release; if(!S.testing){ model.set({P:60,D:700,W:2+S.release,winters:[8,19]}); renderHud(); } return; }
  var l=e.target.getAttribute&&e.target.getAttribute("data-vote"); if(l){ S.votes=S.votes||{}; S.votes[l]=e.target.value; }
});

/* glossary tips */
var tipEl=$("#tip"), tipFor=null, tipPinned=false;
function showTip(btn){ var g=GLOSSARY[btn.getAttribute("data-term")]; if(!g) return; if(tipFor&&tipFor!==btn) tipFor.setAttribute("aria-expanded","false"); tipFor=btn; btn.setAttribute("aria-expanded","true");
  tipEl.innerHTML="<b>"+esc(g[0])+"</b>"+esc(g[1]); tipEl.hidden=false; var r=btn.getBoundingClientRect(), tw=tipEl.offsetWidth, th=tipEl.offsetHeight;
  tipEl.style.left=Math.max(12,Math.min(r.left+window.scrollX, window.scrollX+document.documentElement.clientWidth-tw-12))+"px";
  var top=r.bottom+window.scrollY+8; if(r.bottom+th+16>window.innerHeight && r.top>th+16) top=r.top+window.scrollY-th-8; tipEl.style.top=top+"px"; }
function hideTip(){ if(tipFor) tipFor.setAttribute("aria-expanded","false"); tipFor=null; tipPinned=false; tipEl.hidden=true; }
document.addEventListener("click", function(e){ var b=e.target.closest(".term"); if(b){ if(tipFor===b&&tipPinned){ hideTip(); return; } showTip(b); tipPinned=true; return; } if(!e.target.closest("#tip")) hideTip(); });
document.addEventListener("mouseover", function(e){ var b=e.target.closest&&e.target.closest(".term"); if(b&&!tipPinned) showTip(b); });
document.addEventListener("mouseout", function(e){ var b=e.target.closest&&e.target.closest(".term"); if(b&&!tipPinned&&!(e.relatedTarget&&b.contains(e.relatedTarget))) hideTip(); });
document.addEventListener("keydown", function(e){ if(e.key==="Escape"&&!tipEl.hidden){ var f=tipFor; hideTip(); if(f) f.focus(); } });
guide.addEventListener("scroll", function(){ if(!tipEl.hidden) hideTip(); }, {passive:true});

/* Present mode */
function setPresent(on){ if(PRESENT===on) return; PRESENT=on; document.body.classList.toggle("present",on);
  $("#presentBtn").setAttribute("aria-pressed",String(on)); $("#presentLabel").textContent=on?"Exit present":"Present"; map.k=logv.k=on?1.3:1;
  track("wd_mode",{mode:on?"class":"solo", step:S.step});
  try{ if(on&&document.documentElement.requestFullscreen&&!document.fullscreenElement) document.documentElement.requestFullscreen().catch(function(){}); if(!on&&document.fullscreenElement&&document.exitFullscreen) document.exitFullscreen().catch(function(){}); }catch(e){}
  render(); setTimeout(redrawAll,120); announce(on?"Present mode on.":"Present mode off."); }
$("#presentBtn").addEventListener("click", function(){ setPresent(!PRESENT); });

var toastT=null;
function toast(msg){ var t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(function(){ t.hidden=true; },3000); }
if(IS_PROD){ var mh=document.createElement("script"); mh.src="/js/message-hq.js"; mh.setAttribute("data-message-source","Simulations: Wolves & Deer"); document.body.appendChild(mh); }
$("#commsBtn").addEventListener("click", function(){ if(window.openComms) window.openComms(); else if(window.openMessageModal) window.openMessageModal(); else toast("Comms opens your Allgood Academy inbox on allgoodacademy.com."); });
document.addEventListener("keydown", function(e){ if(e.ctrlKey||e.metaKey||e.altKey) return; var tag=(e.target.tagName||"").toLowerCase(); if(tag==="input"||tag==="textarea") return;
  var i=LTR.indexOf(String(e.key).toUpperCase()); if(i<0) return; var btns=$$(".choice:not(:disabled)",guide); if(btns[i]) btns[i].click(); });

enterStep(0);
if(location.hash==="#present") setPresent(true);
schedule();
})();
