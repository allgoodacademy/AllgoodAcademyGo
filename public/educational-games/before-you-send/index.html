<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Before You Send — Allgood Academy</title>
<link rel="stylesheet" href="/assets/css/tailwind.min.css">
<script src="/assets/js/lucide.min.js"></script>
<!-- Shared identity module — see /js/auth-core.js. -->
<script type="module" src="/js/auth-core.js"></script>
<!-- Shared identify gate (age question / Sign In / Recruit Code) — see /js/identity-gate.js.
     Loading this does NOT put a login wall on the game: the gate only ever opens when
     something explicitly calls window.AuthGate.offerSave()/ensureIdentified(), same as
     every GoodBlock and Read the Signal. Here that's the end-screen save offer. -->
<script type="module" src="/js/identity-gate.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Required by /js/identity-gate.js's injected #ag-modal — see the identical comment
     in read-the-signal/index.html. Copied verbatim from there. */
  .modal-transition { transition: opacity 0.2s ease-in-out, transform 0.2s ease-in-out; }
  .hidden-modal { opacity: 0; pointer-events: none; transform: translateY(-10px); }
  .visible-modal { opacity: 1; pointer-events: auto; transform: translateY(0); }

  /* Mobile hardening for #ag-modal — same fix as read-the-signal/index.html (a
     backdrop-filter over a busy background is a known cause of an invisible,
     fully-blocking overlay on mobile Safari/Android WebViews). */
  #ag-modal { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
  #ag-modal > div { max-height: 90dvh; max-height: 90vh; overflow-y: auto; }

  :root {
    --teal: #357889;
    --orange: #D34716;
    --cream: #FBF6EE;
    --dark: #0F1923;
    --dark-card: #1C2E3A;
    --muted: #7A909F;
    --warm-white: #F8F4EE;
  }

  /* =============================================
     DASHBOARD CHASSIS — copied verbatim from read-the-signal/index.html, which
     itself is copied verbatim from public/dashboard/index.html. Do not hand-tune
     these values here — change the dashboard, then re-copy to both games.
     ============================================= */
  body {
    font-family: Verdana, sans-serif;
    background-color: #0f172a;
    min-height: 100vh;
    min-height: 100dvh;
    position: relative;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  #bg-video-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -50;
    overflow: hidden;
  }

  #bg-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 1.0;
  }

  .tablet-frame {
    height: 88vh;
    width: auto;
    aspect-ratio: 16/10;
    max-width: min(1700px, 94vw);
    max-height: 96vh;
    min-height: 0;
    min-width: 0;
    background-image:
        radial-gradient(circle at 0% 0%, rgba(211, 71, 22, 0.35) 0%, transparent 30%),
        radial-gradient(circle at 100% 100%, rgba(211, 71, 22, 0.35) 0%, transparent 30%),
        linear-gradient(135deg, #5c5c5c 0%, #d6d6d6 25%, #8a8a8a 50%, #e0e0e0 75%, #5c5c5c 100%);
    border-radius: 12px;
    padding: 12px;
    box-shadow:
        inset 1px 1px 2px rgba(255,255,255, 0.6),
        inset -1px -1px 2px rgba(0,0,0, 0.8),
        0 30px 60px -12px rgba(0, 0, 0, 0.8),
        0 0 0 1px #111;
    border: 1px solid #333;
    position: relative;
    margin: 20px auto;
    transition: width 0.3s, height 0.3s, padding 0.3s;
  }

  .tablet-frame::before {
    content: ''; position: absolute; top: 10px; left: 10px; right: 10px; bottom: 10px;
    border-radius: 6px; background: #111; z-index: 0;
  }

  .screen-container {
    width: 100%; height: 100%;
    background-image: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    position: relative; z-index: 1; overflow: hidden;
    display: flex; flex-direction: column;
    border-radius: 4px; box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
  }

  .navbar-content { flex: 0 0 60px; z-index: 30; background: rgba(15, 25, 35, 0.92); backdrop-filter: blur(5px); border-bottom: 1px solid rgba(255,255,255,0.1); color: white; position: relative; }

  @media (max-width: 640px) {
    body {
        padding: 0;
        align-items: flex-start;
        background-image: none;
        background-color: #f8fafc;
    }
    .tablet-frame {
        width: 100vw !important;
        height: 100vh !important;
        height: 100dvh !important;
        max-width: none !important;
        max-height: none !important;
        border-radius: 0 !important;
        border: none !important;
        padding: 0 !important;
        margin: 0 !important;
        box-shadow: none !important;
        background-image: none !important;
        aspect-ratio: auto !important;
    }
    .tablet-frame::before { display: none; }
    .screen-container {
        border-radius: 0 !important;
        box-shadow: none !important;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
    }
    main { padding: 0 !important; }
  }

  /* Home popover — copied verbatim from read-the-signal/index.html */
  .home-popover-wrap { position: relative; }
  .home-popover {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    background: white;
    border-radius: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    padding: 6px;
    min-width: 190px;
    z-index: 50;
  }
  .home-popover.show { display: block; }
  .home-popover button {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 10px 12px;
    border-radius: 6px;
    font-family: Verdana, sans-serif;
    font-size: 0.82rem;
    font-weight: 700;
    color: #0F1923;
    cursor: pointer;
  }
  .home-popover button:hover { background: #f0f0f0; }

  /* --- Game screen: content area inside the chassis --- */
  .byu-page {
    flex: 1 1 auto;
    position: relative;
    overflow-y: auto;
    background: var(--dark);
    color: var(--cream);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 28px 24px;
  }

  /* ── INTRO ── */
  #intro { text-align: center; max-width: 440px; margin: auto 0; }
  #intro h1 { font-family: Georgia, serif; font-size: clamp(2rem,6vw,2.8rem); font-weight: 700; color: var(--cream); line-height: 1.1; margin-bottom: 12px; }
  #intro h1 em { color: var(--orange); font-style: normal; }
  #intro p { font-size: 13px; color: var(--muted); line-height: 1.65; margin-bottom: 28px; }
  .start-btn {
    background: var(--orange); color: white; border: none;
    padding: 14px 40px; border-radius: 50px;
    font-family: Verdana, sans-serif; font-size: 14px; font-weight: 700;
    cursor: pointer; transition: opacity 0.15s, transform 0.1s;
  }
  .start-btn:hover { opacity: 0.9; transform: scale(1.02); }
  .wordmark { font-family: Georgia, serif; font-size: 0.8rem; color: rgba(255,255,255,0.2); margin-top: 16px; letter-spacing: 0.04em; }

  /* ── GAME ── */
  #game { display: none; width: 100%; max-width: 560px; margin: auto 0; flex-direction: column; align-items: center; }
  .hud { width: 100%; display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .hud-score { font-size: 13px; color: var(--muted); font-weight: 700; }
  .hud-score span { color: var(--cream); font-size: 18px; }
  .hud-progress { display: flex; gap: 5px; }
  .hud-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.15); transition: background 0.3s; }
  .hud-dot.done { background: var(--teal); }
  .hud-dot.current { background: var(--orange); }

  .countdown-bar { width: 100%; height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; margin-bottom: 16px; overflow: hidden; }
  .countdown-fill { height: 100%; border-radius: 2px; background: var(--orange); transition: width 1s linear, background 0.5s; }
  .countdown-fill.urgent { background: #e74c3c; }

  .msg-card { background: var(--warm-white); border-radius: 20px; width: 100%; overflow: hidden; margin-bottom: 20px; animation: cardIn 0.3s ease; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .msg-header { padding: 14px 18px; border-bottom: 1px solid rgba(0,0,0,0.06); display: flex; align-items: center; gap: 10px; }
  .msg-avatar { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; flex-shrink: 0; color: white; }
  .msg-meta { flex: 1; }
  .msg-to { font-size: 11px; color: #888; font-weight: 700; letter-spacing: 0.04em; }
  .msg-recipient { font-size: 13px; font-weight: 700; color: #1a1a1a; margin-top: 1px; }
  .msg-platform { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 10px; letter-spacing: 0.04em; }
  .msg-body { padding: 20px 18px; font-size: 15px; color: #1a1a1a; line-height: 1.65; min-height: 80px; }
  .msg-footer { padding: 10px 18px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .msg-context { font-size: 11px; color: #aaa; font-style: italic; }
  .read-count { font-size: 11px; font-weight: 700; color: var(--teal); cursor: pointer; padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(53,120,137,0.3); background: rgba(53,120,137,0.06); transition: all 0.15s; display: flex; align-items: center; gap: 4px; }
  .read-count:hover { background: rgba(53,120,137,0.12); }
  .read-count.exhausted { color: #aaa; border-color: rgba(0,0,0,0.1); cursor: default; }
  .read-count svg { width: 12px; height: 12px; }

  .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; width: 100%; }
  .action-btn { padding: 16px 8px; border: none; border-radius: 14px; font-family: Verdana, sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; transition: transform 0.1s, opacity 0.1s; display: flex; flex-direction: column; align-items: center; gap: 7px; letter-spacing: 0.02em; }
  .action-btn:hover { transform: scale(1.03); }
  .action-btn svg { width: 20px; height: 20px; }
  .btn-send { background: #fff3f0; color: var(--orange); }
  .btn-edit { background: #f0f6ff; color: #2460a7; }
  .btn-delete { background: #f0fff4; color: #2e7d52; }

  /* ── CONSEQUENCE ── */
  #consequence { display: none; width: 100%; max-width: 560px; margin: auto 0; flex-direction: column; align-items: center; }
  .consequence { width: 100%; animation: cardIn 0.4s ease; text-align: center; }
  .consequence-icon { font-size: 44px; margin-bottom: 16px; display: block; }
  .consequence-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; margin-bottom: 12px; }
  .consequence-scene { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 24px; font-size: 14px; color: rgba(255,255,255,0.75); line-height: 1.75; margin-bottom: 16px; text-align: left; font-family: Georgia, serif; }
  .consequence-mechanism { font-size: 12px; color: var(--muted); line-height: 1.7; margin-bottom: 20px; padding: 14px 16px; background: rgba(255,255,255,0.04); border-radius: 12px; text-align: left; }
  .next-btn { background: var(--teal); color: white; border: none; padding: 14px 36px; border-radius: 50px; font-family: Verdana, sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; width: 100%; transition: opacity 0.15s; }
  .next-btn:hover { opacity: 0.9; }

  /* ── END ── */
  #end { display: none; text-align: center; max-width: 440px; margin: auto 0; }
  .end-score { font-family: Georgia, serif; font-size: clamp(3.5rem,12vw,5rem); font-weight: 700; color: var(--orange); line-height: 1; }
  .end-label { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; font-weight: 700; margin-bottom: 20px; }
  .end-breakdown { background: rgba(255,255,255,0.04); border-radius: 14px; padding: 18px 20px; margin-bottom: 20px; text-align: left; }
  .end-row { display: flex; justify-content: space-between; font-size: 12px; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .end-row:last-child { border: none; }
  .end-row-label { color: var(--muted); }
  .end-row-val { font-weight: 700; color: var(--cream); }
  .jodi-moment { background: var(--teal); border-radius: 14px; padding: 18px 20px; margin-bottom: 20px; text-align: left; }
  .jodi-moment-label { font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.5); letter-spacing: 0.08em; margin-bottom: 6px; }
  .jodi-moment-text { font-family: Georgia, serif; font-size: 13px; color: white; line-height: 1.65; font-style: italic; }
  .play-again-btn { background: var(--orange); color: white; border: none; padding: 14px; border-radius: 50px; font-family: Verdana, sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; width: 100%; margin-bottom: 8px; }
  .hub-btn { background: transparent; color: var(--cream); border: 1px solid rgba(255,255,255,0.15); padding: 12px; border-radius: 50px; font-family: Verdana, sans-serif; font-size: 12px; cursor: pointer; width: 100%; }
</style>
</head>
<body>

<!-- ORBITAL LINK: Static Feed Injection — same space background as the dashboard -->
<div id="bg-video-container">
  <img id="bg-image" src="https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?q=80&w=1172&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Orbital View">
</div>

<main class="flex-grow flex items-center justify-center py-8">
  <div class="tablet-frame">
    <div class="screen-container" id="screen">

      <header class="navbar-content flex items-center justify-between px-6 shadow-md relative z-30">
        <div class="flex items-center overflow-hidden">
          <div class="flex-shrink-0 text-white font-heading font-bold text-lg tracking-tight truncate select-none uppercase">
            ALLGOOD ACADEMY <span class="opacity-60 text-sm font-normal">| Games</span>
          </div>
        </div>
        <div class="flex items-center space-x-1 shrink-0 relative">
          <div class="home-popover-wrap">
            <button id="btn-home" class="text-gray-200 hover:text-white transition-colors p-2 rounded-full hover:bg-white/10" title="Home" onclick="toggleHomePopover(event)">
              <i data-lucide="home" stroke-width="2.25" class="w-[22px] h-[22px]"></i>
            </button>
            <div class="home-popover" id="home-popover">
              <button onclick="window.AuthGate.guardedLeave(() => { window.location.href='/'; })">Return to dashboard</button>
              <button onclick="window.AuthGate.guardedLeave(handleRestartFromPopover)">Restart game</button>
              <button onclick="window.AuthGate.guardedLeave(() => { window.location.href='/educational-games/'; })">Browse games</button>
              <button onclick="window.location.href='/dashboard/?signin=1'">Already have an account? Sign in</button>
            </div>
          </div>
          <button id="btn-games" class="text-gray-200 hover:text-white transition-colors p-2 rounded-full hover:bg-white/10" title="Browse games" onclick="window.AuthGate.guardedLeave(() => { window.location.href='/educational-games/'; })">
            <i data-lucide="gamepad-2" stroke-width="2.25" class="w-[22px] h-[22px]"></i>
          </button>
        </div>
      </header>

      <div class="byu-page">

<!-- INTRO -->
<div id="intro">
  <div style="font-size:48px;margin-bottom:16px">✉️</div>
  <h1>Before You <em>Send.</em></h1>
  <p>10 messages. You have 30 seconds and 3 reads each.<br>Send it, edit it, or delete it — then watch what happens.</p>
  <button class="start-btn" onclick="startGame()">Start</button>
  <div class="wordmark">Allgood Academy · Free for all learners</div>
</div>

<!-- GAME -->
<div id="game">
  <div class="hud">
    <div class="hud-score">Score <span id="scoreVal">0</span></div>
    <div class="hud-progress" id="progressDots"></div>
  </div>
  <div class="countdown-bar"><div class="countdown-fill" id="countdownFill" style="width:100%"></div></div>
  <div class="msg-card" id="msgCard"></div>
  <div class="actions">
    <button class="action-btn btn-send" onclick="choose('send')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2L15 22 11 13 2 9l20-7z"/></svg>
      Send it
    </button>
    <button class="action-btn btn-edit" onclick="choose('edit')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Edit it
    </button>
    <button class="action-btn btn-delete" onclick="choose('delete')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
      Delete it
    </button>
  </div>
</div>

<!-- CONSEQUENCE -->
<div id="consequence"></div>

<!-- END -->
<div id="end"></div>

      </div>
    </div>
  </div>
</main>

<script>
// best: 'send' | 'edit' | 'delete' — the choice the scenario is built to reward.
// category: used for Firestore telemetry only today (no on-screen breakdown yet,
// same as the prototype this shipped from — Ticket 3.1 said don't redesign it).
const scenarios = [
  {
    id: "marcus-group-chat-callout",
    to: "Marcus", platform: "Group Chat", platformColor: "#6c5ce7", platformBg: "#f0eeff", avatar: "M", avatarColor: "#6c5ce7",
    context: "The group chat has 12 people from your class",
    message: "Wait so Marcus did you seriously not put anyone else's name on the project? That's actually insane lol everyone saw it",
    reads: ["Read it once — feels right, you're upset", "Read again — 12 people will see this, including the teacher", "Third read — Marcus will have to respond publicly or look guilty"],
    send: { icon: "😬", label: "Sent.", scene: "The group goes quiet for three seconds. Then someone reacts with 😬. Marcus types 'wow ok' and leaves the chat. Two people DM you privately to say they're on your side. One person screenshots it.", mechanism: "Public call-outs put the other person in performance mode — they have to respond to the audience, not to you. You got attention. You didn't get resolution." },
    edit: { icon: "✏️", label: "Edited.", scene: "You change it to a DM: 'Hey, I noticed my name wasn't on the project. Can we talk?' Marcus responds in 20 minutes. Awkward, but fixable.", mechanism: "Removing the audience changes what's possible. Marcus can actually respond honestly instead of performing for 12 people." },
    del: { icon: "🗑️", label: "Deleted.", scene: "You close the app. You're still frustrated. You bring it up with Marcus before class the next morning. It's uncomfortable for about 90 seconds and then it's done.", mechanism: "Sometimes the message isn't the right tool. The conversation you didn't send made room for one that actually worked." },
    best: "edit", category: "social"
  },
  {
    id: "coach-rivera-playing-time",
    to: "Coach Rivera", platform: "Email", platformColor: "#d34716", platformBg: "#fff3f0", avatar: "C", avatarColor: "#d34716",
    context: "You've been benched for the last three games",
    message: "Coach I've been working really hard and I think it's unfair that I keep getting benched when other players who don't try as hard are starting. I deserve more playing time.",
    reads: ["Read once — feels honest, you mean every word", "Read again — 'I deserve' is doing a lot of work here", "Third read — how does this land if you're the coach?"],
    send: { icon: "😬", label: "Sent.", scene: "Coach reads it before practice. She pulls you aside. The conversation starts with her defending the other players' effort. You spend 20 minutes on the defensive.", mechanism: "'I deserve' signals entitlement even when it isn't meant that way. It puts the coach in a position where she has to disagree with you before she can hear you." },
    edit: { icon: "✏️", label: "Edited.", scene: "You change 'I deserve more playing time' to 'I'd love to talk about what I can do to earn more time.' Coach responds that afternoon and schedules a meeting.", mechanism: "Same frustration, different frame. Asking for guidance instead of asserting a right gets you the conversation you actually wanted." },
    del: { icon: "🗑️", label: "Deleted.", scene: "You wait until after practice and ask to talk in person. It's harder to say out loud — but Coach hears it differently when you're standing in front of her.", mechanism: "Some conversations need a voice, not a text. The vulnerability of saying it in person changes how it's received." },
    best: "edit", category: "social"
  },
  {
    id: "instagram-story-callout",
    to: "Whole School", platform: "Instagram Story", platformColor: "#e1306c", platformBg: "#fef0f5", avatar: "IG", avatarColor: "#e1306c",
    context: "Someone just publicly humiliated your friend",
    message: "Can't believe what just happened in the cafeteria. Some people have zero class. You know who you are. 🙂",
    reads: ["Read once — satisfying, everyone will know", "Read again — 'you know who you are' is vague enough to be deniable but specific enough to sting", "Third read — who else thinks this might be about them?"],
    send: { icon: "😬", label: "Sent.", scene: "37 people watch it in the first hour. Three people DM asking who you mean. One person who thinks it might be about them screenshots it. Your friend asks you to take it down — it's making things worse.", mechanism: "Vague public callouts create three problems: they embarrass the target, they create collateral anxiety for everyone else, and they give you no control over where they go." },
    edit: { icon: "✏️", label: "Edited.", scene: "You post a story about something unrelated — a song, a meme. You text your friend privately: 'That was awful, I'm here.' She responds immediately.", mechanism: "Your friend needed support, not a public performance of loyalty. The private message was actually for her. The story would have been for everyone else." },
    del: { icon: "🗑️", label: "Deleted.", scene: "You put the phone down. You find your friend after school. You sit with her for an hour. She says it's the most helpful thing anyone did all day.", mechanism: "Sometimes the most powerful thing isn't a post. It's presence." },
    best: "edit", category: "social"
  },
  {
    id: "dad-never-listen",
    to: "Dad", platform: "iMessage", platformColor: "#34c759", platformBg: "#f0fff4", avatar: "D", avatarColor: "#2e7d52",
    context: "He said no to something you really wanted",
    message: "You literally never listen to me. Every time I ask for something you just say no without even thinking about it. This is why I don't talk to you about things.",

const jodiMoments = [
  "The message you almost sent is usually the truest version of what you're feeling. The message you actually send is the one that decides what happens next.",
  "Every third read reveals something the first read hid. That's not second-guessing — that's thinking.",
  "Sending the right message to the wrong audience is still the wrong message.",
  "The pause before you send is the most underrated skill in digital communication. Nobody teaches it. Everyone needs it.",
  "Words in writing feel permanent because they are. That's worth a second read."
];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Target: ~4 send, ~4 edit, ~2 delete per session, from a bank of 15 send / 12 edit /
// 3 delete scenarios (30 total). The delete pool is thin (3), so a session can't always
// get a full 2 — slice() just returns what's there rather than throwing.
function buildByuSession(pool) {
  const sendBest = shuffle(pool.filter(s => s.best === 'send'));
  const editBest = shuffle(pool.filter(s => s.best === 'edit'));
  const deleteBest = shuffle(pool.filter(s => s.best === 'delete'));
  const session = [
    ...sendBest.slice(0, 4),
    ...editBest.slice(0, 4),
    ...deleteBest.slice(0, 2)
  ];
  return shuffle(session);
}

let session = [], currentIdx = 0, score = 0;
let timer = null, timeLeft = 30, readsLeft = 3, readsUsed = 1;
let choiceTally = { send: 0, edit: 0, delete: 0 };
let scenarioLog = [];

function show(id) {
  ['intro', 'game', 'consequence', 'end'].forEach(s => {
    document.getElementById(s).style.display = 'none';
  });
  const target = document.getElementById(id);
  target.style.display = 'flex';
  target.style.flexDirection = 'column';
  target.style.alignItems = 'center';
}

// --- Telemetry (Ticket 3.3): one game_sessions document per completed session,
// same sessionStorage-UUID + 90-day-TTL pattern as Read the Signal.
function getSessionId() {
  let id = sessionStorage.getItem('byu_session_id');
  if (!id) {
    id = crypto.randomUUID();
    sessionStorage.setItem('byu_session_id', id);
  }
  return id;
}

async function recordSession() {
  try {
    const AuthCore = window.AuthCore;
    if (!AuthCore) return;

    const { collection, addDoc, serverTimestamp, Timestamp } =
      await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js');

    let user = AuthCore.auth.currentUser;
    if (!user) {
      try { await AuthCore.silentSignIn(); } catch (e) { /* telemetry is best-effort */ }
      user = AuthCore.auth.currentUser;
    }

    let recruitCode = null;
    let studentId = null;
    if (user && !user.isAnonymous) studentId = user.uid;
    if (user) {
      try {
        const account = await AuthCore.getAccount(user.uid);
        if (account && account.recruitCode) recruitCode = account.recruitCode;
      } catch (e) { /* telemetry is best-effort */ }
    }

    const playedAt = new Date();
    const ttl = new Date(playedAt.getTime() + 90 * 24 * 60 * 60 * 1000);

    await addDoc(collection(AuthCore.db, 'game_sessions'), {
      game: 'before-you-send',
      sessionId: getSessionId(),
      recruitCode,
      studentId,
      playedAt: serverTimestamp(),
      ttl: Timestamp.fromDate(ttl),
      scenariosPlayed: scenarioLog.length,
      choices: choiceTally,
      scenarios: scenarioLog
    });
  } catch (e) {
    console.warn('Before You Send telemetry write failed', e);
  }
}

function startGame() {
  window._agSaveOffered = false;
  window._agCompletionReached = false;
  session = buildByuSession(scenarios);
  currentIdx = 0; score = 0;
  choiceTally = { send: 0, edit: 0, delete: 0 };
  scenarioLog = [];
  show('game');
  renderDots();
  renderScenario();
}

function renderDots() {
  const el = document.getElementById('progressDots');
  el.innerHTML = '';
  for (let i = 0; i < session.length; i++) {
    const d = document.createElement('div');
    d.className = 'hud-dot' + (i < currentIdx ? ' done' : i === currentIdx ? ' current' : '');
    el.appendChild(d);
  }
}

function renderScenario() {
  readsLeft = 3;
  readsUsed = 1;
  const s = session[currentIdx];
  document.getElementById('scoreVal').textContent = score;
  renderDots();

  const card = document.getElementById('msgCard');
  card.innerHTML = `
    <div class="msg-header">
      <div class="msg-avatar" style="background:${s.avatarColor}">${s.avatar}</div>
      <div class="msg-meta">
        <div class="msg-to">To</div>
        <div class="msg-recipient">${s.to}</div>
      </div>
      <span class="msg-platform" style="background:${s.platformBg};color:${s.platformColor}">${s.platform}</span>
    </div>
    <div class="msg-body" id="msgText"></div>
    <div class="msg-footer">
      <span class="msg-context">${s.context}</span>
      <button class="read-count" id="readBtn" onclick="reread()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        Read again (${readsLeft - 1} left)
      </button>
    </div>
  `;

  typewriter(s.message, document.getElementById('msgText'));
  startTimer();
}

function typewriter(text, el) {
  el.textContent = '';
  let i = 0;
  const interval = setInterval(() => {
    el.textContent += text[i];
    i++;
    if (i >= text.length) clearInterval(interval);
  }, 22);
}

function reread() {
  if (readsLeft <= 1) return;
  readsLeft--;
  readsUsed++;
  const s = session[currentIdx];
  const msgEl = document.getElementById('msgText');
  const btn = document.getElementById('readBtn');

  const revealIdx = 3 - readsLeft;
  if (s.reads[revealIdx]) {
    msgEl.innerHTML = `<span style="color:#1a1a1a">${s.message}</span><div style="margin-top:12px;padding:10px 12px;background:rgba(53,120,137,0.08);border-left:3px solid #357889;border-radius:0 8px 8px 0;font-size:12px;color:#357889;font-style:italic">${s.reads[revealIdx]}</div>`;
  }

  if (readsLeft <= 1) {
    btn.className = 'read-count exhausted';
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> No reads left`;
  } else {
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> Read again (${readsLeft - 1} left)`;
  }
}

function startTimer() {
  clearInterval(timer);
  timeLeft = 30;
  const fill = document.getElementById('countdownFill');
  fill.style.width = '100%';
  fill.className = 'countdown-fill';

  timer = setInterval(() => {
    timeLeft--;
    const pct = (timeLeft / 30) * 100;
    fill.style.width = pct + '%';
    if (timeLeft <= 10) fill.className = 'countdown-fill urgent';
    if (timeLeft <= 0) {
      clearInterval(timer);
      choose('send'); // auto-send on timeout — impulsive!
    }
  }, 1000);
}

function choose(action) {
  clearInterval(timer);
  const s = session[currentIdx];
  const dataKey = action === 'delete' ? 'del' : action;
  const data = s[dataKey];
  const correct = action === s.best;
  const timeUsed = 30 - timeLeft;

  score += correct ? 10 : 5;
  choiceTally[action] = (choiceTally[action] || 0) + 1;
  scenarioLog.push({ id: s.id, choice: action, bestChoice: s.best, correct, timeUsed, readsUsed });

  showConsequence(data, action);
}

function showConsequence(data, action) {
  show('consequence');
  const el = document.getElementById('consequence');
  const actionLabel = action === 'send' ? 'Sent' : action === 'edit' ? 'Edited' : 'Deleted';
  const actionColor = action === 'send' ? '#d34716' : action === 'edit' ? '#2460a7' : '#2e7d52';

  el.innerHTML = `
    <div class="consequence">
      <span class="consequence-icon">${data.icon}</span>
      <div class="consequence-label" style="color:${actionColor}">${data.label}</div>
      <div class="consequence-scene">${data.scene}</div>
      <div class="consequence-mechanism">${data.mechanism}</div>
      <button class="next-btn" onclick="nextScenario()">${currentIdx < session.length - 1 ? 'Next message →' : 'See results'}</button>
    </div>
  `;
}

function nextScenario() {
  currentIdx++;
  if (currentIdx >= session.length) {
    showEnd();
  } else {
    show('game');
    renderScenario();
  }
}

function showEnd() {
  show('end');
  const el = document.getElementById('end');
  const jodi = jodiMoments[Math.floor(Math.random() * jodiMoments.length)];
  const correctCount = scenarioLog.filter(s => s.correct).length;
  el.innerHTML = `
    <div class="end-score">${score}</div>
    <div class="end-label">OUT OF 100</div>
    <div class="end-breakdown">
      <div class="end-row"><span class="end-row-label">Messages reviewed</span><span class="end-row-val">${session.length}</span></div>
      <div class="end-row"><span class="end-row-label">Right call</span><span class="end-row-val">${correctCount} / ${session.length}</span></div>
      <div class="end-row"><span class="end-row-label">Your approach</span><span class="end-row-val">${score >= 80 ? 'Thoughtful' : score >= 60 ? 'Developing' : 'Impulsive'}</span></div>
    </div>
    <div class="jodi-moment">
      <div class="jodi-moment-label">HEY Y'ALL 💛 FROM JODI</div>
      <div class="jodi-moment-text">"${jodi}"</div>
    </div>
    <button class="play-again-btn" onclick="window.AuthGate.guardedLeave(restartGame)">Play again</button>
    <button class="hub-btn" onclick="window.AuthGate.guardedLeave(() => { window.location.href='/educational-games/'; })">Browse more games</button>
    <div class="wordmark" style="margin-top:16px">Allgood Academy · Free for all learners, always.</div>
  `;

  recordSession();

  // Ticket 3.4's "want to save your progress?" prompt is the existing shared
  // save/claim offer (window.AuthGate.offerSave() — see identity-gate.js's #ag-save
  // panel), the same one every GoodBlock, Challenge, and Read the Signal already
  // use. It already covers this ticket's acceptance criteria: Jodi-voiced offer,
  // a plainly-displayed generated Recruit Code for under-13, a decline option that
  // leaves the completion screen untouched, and it no-ops quietly if the student is
  // already identified. Reusing it here instead of a bespoke one-off UI keeps there
  // being exactly one save/claim flow on the site instead of two that can drift.
  window._agCompletionReached = true;
  if (!window._agSaveOffered && window.AuthGate && window.AuthGate.offerSave) {
    window._agSaveOffered = true;
    setTimeout(() => {
      window.AuthGate.offerSave().catch((e) => console.error('[BeforeYouSend] offerSave failed', e));
    }, 1200);
  }
}

function restartGame() { startGame(); }

function toggleHomePopover(event) {
  event.stopPropagation();
  document.getElementById('home-popover').classList.toggle('show');
}

function closeHomePopover() {
  document.getElementById('home-popover').classList.remove('show');
}

document.addEventListener('click', (e) => {
  const wrap = document.querySelector('.home-popover-wrap');
  if (wrap && !wrap.contains(e.target)) closeHomePopover();
});

function handleRestartFromPopover() {
  closeHomePopover();
  if (document.getElementById('game').style.display === 'flex' ||
      document.getElementById('consequence').style.display === 'flex' ||
      document.getElementById('end').style.display === 'flex') {
    restartGame();
  } else {
    startGame();
  }
}

if (window.lucide) lucide.createIcons();
document.addEventListener('DOMContentLoaded', () => { if (window.lucide) lucide.createIcons(); });
