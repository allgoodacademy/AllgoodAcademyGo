<script type="module">
/* Take the Bait — 3D renderer build.

{id:0,th:0,name:"Fake prize",safe:["x2","Verified sender"],lure:["+200","You WON! Claim now"],tell:"Real prizes don’t rush you. Urgency is the tell."},

{id:5,th:1,name:"Reused password",safe:["+40","New password per site"],lure:["x3","Same password everywhere"],tell:"When every account shares one password, one leak unlocks all of them."},
{id:6,th:2,name:"Forward chain",safe:["+30","Check who posted it"],lure:["x3","Forward to 10 friends"],tell:"“Share before they delete it!” is how fakes spread. Check the source first."},

{id:11,th:3,name:"Bank text link",safe:["x2","Open the bank app"],lure:["+200","“Bank” text with a link"],tell:"Banks don’t text you login links. Go to the app or site yourself."}
];
const LEVELS=[
{name:"Prize scams",tells:[0,1,2,0],mobs:1,speed:6,moving:false},
{name:"Passwords",tells:[3,4,5,3,4],mobs:2,speed:6.4,moving:false},
{name:"Share bait",tells:[6,7,8,6,7],mobs:3,speed:6.8,moving:true},
{name:"Impersonators",tells:[9,10,11,9,10,11],mobs:3,speed:7.2,moving:true},

const $=id=>document.getElementById(id);

const K=(()=>{const cs=getComputedStyle(document.documentElement),g=(n,f)=>(cs.getPropertyValue(n)||"").trim()||f;
  return{teal:g("--color-teal","#357889"),tealDeep:g("--color-teal-deep","#2D6473"),tealWash:g("--color-teal-wash","#E3EDEF"),orange:g("--color-orange","#D34716"),
    cream:g("--color-cream","#FBF6EE"),creamBorder:g("--color-cream-border","#E8DFCE"),ink:g("--color-ink","#17272C"),inkSoft:g("--color-ink-soft","#5C6E75"),
    dark:g("--color-dark","#0F1923"),darkCard:g("--color-dark-card","#1C2E3A"),ui:g("--font-ui","Verdana, Geneva, sans-serif")};})();
const C=$("c"),X=$("fx").getContext("2d");
const RM=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;

let state="home",L=0,lv=LEVELS[0],ev=[],pz=0,camZ=-D,px=0,crowd=START,units=[],T=0,ts=1,slow=0,shake=0,zEnd=0,tower=null;

let AC=null,muted=false;

function tone(f,d,type,v,slide,delay){if(muted)return;const a=ac();if(!a)return;const t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f*slide),t+d);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.12,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.05);}
const sfx={
safe(){tone(660,0.12,"triangle",0.12);tone(990,0.16,"triangle",0.1,0,0.07);},
lure(){[880,1100,1320,1760].forEach((f,i)=>tone(f,0.12,"sine",0.08,0,i*0.05));},
trap(){tone(420,0.6,"sawtooth",0.09,0.25);tone(140,0.4,"square",0.06,0.6,0.05);},
hit(){tone(160,0.18,"square",0.09,0.5);},
dodge(){tone(520,0.08,"triangle",0.07,1.4);},
tick(){tone(rand(200,320),0.05,"square",0.03);},
win(){[523,659,784,1047].forEach((f,i)=>tone(f,0.25,"triangle",0.12,0,i*0.11));},
lose(){[392,330,262].forEach((f,i)=>tone(f,0.3,"triangle",0.1,0,i*0.14));}
};

/* ---------- level building ---------- */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function finalTells(){const bait=shuffle(Object.keys(save.learned).filter(k=>save.learned[k]==="bait").map(Number));const rest=shuffle(TELLS.map(t=>t.id).filter(i=>bait.indexOf(i)<0));return bait.concat(rest).slice(0,8);}
function build(l){
  lv=LEVELS[l];const ids=lv.tells?lv.tells.slice():finalTells();
  ev=[];const gaps=ids.length-1;const slots=shuffle([...Array(gaps).keys()]).slice(0,Math.min(lv.mobs,gaps)).sort((a,b)=>a-b);
  let sim=START,z=44;

    const t=TELLS[id],lureSide=Math.random()<0.5?0:1;

    sim=applyOp(sim,t.safe[0]);
    if(slots.indexOf(i)>=0){
      const n=Math.max(3,Math.round(sim*0.25));sim-=n;
      const w=clamp(0.62*Math.sqrt(Math.min(n,MAXM)),1.4,3.2);
      const x0=rand(-R+w/2+0.2,R-w/2-0.2);

      ev.push(mob);

  });

  ev.sort((a,b)=>a.z-b.z);
  if(typeof sceneBuild==="function"&&typeof gates3!=="undefined")sceneBuild();

/* ---------- crowd ---------- */
function formationHalf(n){return Math.min(R-0.3,0.21*Math.sqrt(Math.max(1,Math.min(n,MAXU))));}

/* ---------- update ---------- */
function update(dr){
  T+=dr;
  if(slow>0){slow-=dr;if(slow<=0)hideJodi();}
  ts+=((slow>0?0.22:1)-ts)*Math.min(1,dr*10);
  const dt=dr*ts;

    const gd=ng?ng.z-pz:99;zoneK+=(((gd<22&&gd>1.5)?0.5:1)-zoneK)*Math.min(1,dr*4);
    pz+=lv.speed*zoneK*dt;
    updChoice(ng,gd);
    for(const e of ev){
      if(e.t==="mob"&&e.amp)e.x=e.x0+Math.sin(T*1.3+e.ph)*e.amp;
    }
    for(const e of ev){
      if(e.done)continue;

      e.done=true;
      if(e.t==="gate"){
        const side=px<0?0:1;e.pick=side;const lure=side===e.lureSide,op=e.opts[side],before=crowd;
        crowd=applyOp(crowd,op[0]);rmStyle="puff";
        pop(fmtOp(op[0]),px,pz+1,lure?"#F6A57F":"#ffffff",1.3);
        burst(px,pz,lure?K.orange:"#9cc7d1",18);
        runLog.push({id:e.id,bait:lure});
        if(lure){e.trap.active=true;e.trap.before=before;sfx.lure();}
        else{sfx.safe();pop("Spotted it",px,pz+1.5,"#bfe3ea",0.7);}
      }else if(e.t==="trap"){
        if(!e.active)continue;
        const from=crowd,to=Math.max(1,Math.round(e.before*TRAP));
        rmStyle="yank";crowd=to;
        showJodi(TELLS[e.id],from,to);slow=3.6;shake=RM?0:0.6;sfx.trap();buzz([40,40,80]);
        pop("-"+(from-to),px,pz+1,"#F6A57F",1.3);
      }else if(e.t==="mob"){
        const hw=formationHalf(crowd);
        if(Math.abs(px-e.x)<e.w*0.5+hw*0.55+0.25){
          e.hit=true;rmStyle="puff";crowd-=e.n;burst(e.x,e.z,K.inkSoft,40);burst(px,pz,K.teal,30);
          pop("-"+e.n,px,pz+1,"#F6A57F",1.3);shake=RM?0:0.45;sfx.hit();buzz(35);
          if(crowd<=0){crowd=0;syncUnits();finish(false);break;}
        }else{e.hit=false;pop("Dodged!",e.x,e.z,"#ffffff",0.8);sfx.dodge();}
      }
    }
    if(state==="play"&&pz>=zEnd-3.2){$("choice").classList.add("hide");state="battle";atTower=true;pz=zEnd-3.2;battleRate=Math.max(crowd,tower.hp)/1.9;acc=0;}
  }else if(state==="battle"){
    pz+=(zEnd-1.6-pz)*Math.min(1,dr*2);
    acc+=battleRate*dr;let k=Math.floor(acc);acc-=k;k=Math.min(k,crowd,tower.hp);
    if(k>0){crowd-=k;tower.hp-=k;rmStyle="puff";tower.flash=0.12;if(Math.random()<0.5)sfx.tick();if(!RM)shake=Math.max(shake,0.18);
      burst(rand(-2,2),zEnd-0.3,Math.random()<0.5?K.teal:K.orange,3);}
    if(crowd<=0||tower.hp<=0)finish(crowd>0&&tower.hp<=0);
  }else if(state==="end"){
    endTimer-=dr;if(won)pz+=(zEnd-0.5-pz)*Math.min(1,dr*2);
    if(endTimer<=0)showResults();
  }else if(state==="home"){
    pz+=4*dr;px=Math.sin(T*0.6)*1.6;
    if(pz>zEnd-14){pz=0;ev.forEach(e=>{e.done=false;e.fade=0;if(e.t==="trap")e.active=false;});}
  }
  camZ=pz-D;
  syncUnits();updUnits(dr);
  tower.flash=Math.max(0,tower.flash-dr);
  for(const e of ev)if(e.t==="gate"&&pz>e.z+0.2)e.fade=Math.min(1,e.fade+dr*5);
  for(let i=pops.length-1;i>=0;i--){const p=pops[i];p.t+=dr;p.y+=dr*1.6;if(p.t>1.1)pops.splice(i,1);}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dr;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vy-=14*dt;if(p.y<0){p.y=0;p.vy*=-0.3;}if(p.life<=0)parts.splice(i,1);}
  for(let i=yanks.length-1;i>=0;i--){const y=yanks[i];y.z+=lv.speed*zoneK*dt;if(y.d>0){y.d-=dr;continue;}y.vy+=9*dr;y.y+=y.vy*dr;if(y.y>14)yanks.splice(i,1);}
  for(let i=conf.length-1;i>=0;i--){const c=conf[i];c.x+=c.vx*dr;c.y+=c.vy*dr;c.r+=c.vr*dr;if(c.y>H+20)conf.splice(i,1);}
  if(state==="play"||state==="battle"){const tot=zEnd;$("prog").style.width=clamp(pz/tot*100,0,100)+"%";}
}

  gChar.scene.updateMatrixWorld(true);
  const byName={};gChar.scene.traverse(o=>{if(o.isMesh)byName[o.name]=o;});
  const bake=(o,full)=>{const g=o.geometry.clone();g.deleteAttribute("tangent");const m=o.matrixWorld.clone();const p=new THREE.Vector3().setFromMatrixPosition(m);if(!full)m.setPosition(0,0,0);g.applyMatrix4(m);return{g,p:full?new THREE.Vector3():p};};
  const torso=bake(byName["torso"],true),ant=byName["antenna"]?bake(byName["antenna"],true):null;
  const {mergeGeometries}=await import("three/addons/utils/BufferGeometryUtils.js");
  const body=ant?mergeGeometries([torso.g,ant.g]):torso.g;
  const P5={body:{g:body,p:new THREE.Vector3()},legL:bake(byName["leg-left"]),legR:bake(byName["leg-right"]),armL:bake(byName["arm-left"]),armR:bake(byName["arm-right"])};
  const bb=new THREE.Box3();for(const k in P5){const g=P5[k].g;g.computeBoundingBox();const b=g.boundingBox.clone().translate(P5[k].p);bb.union(b);}
  const sz=bb.getSize(new THREE.Vector3());
  BS=0.48/Math.max(sz.x,0.001);FOOT=-bb.min.y;CHAR_H=sz.y*BS;
  for(const k in P5){const m=new THREE.InstancedMesh(P5[k].g,charMat,CAP);m.castShadow=true;m.frustumCulled=false;
    for(let i=0;i<CAP;i++)m.setColorAt(i,tc(CROWD));m.count=0;scene.add(m);CH[k]={m,p:P5[k].p};}
}
let tris=0;for(const k in CH){const g=CH[k].m.geometry;tris+=(g.index?g.index.count:g.attributes.position.count)/3;}

const _m=new THREE.Matrix4(),_l=new THREE.Matrix4(),_r=new THREE.Matrix4(),_q=new THREE.Quaternion(),_e=new THREE.Euler(),_p=new THREE.Vector3(),_s=new THREE.Vector3();
let ci=0;
function limb(k,a){const c=CH[k];_r.makeRotationX(a);_r.setPosition(c.p);_l.multiplyMatrices(_m,_r);c.m.setMatrixAt(ci,_l);}
/* x,y,z world; yaw facing; sc size; col css color; ph phase; amp stride; spd cadence; lean forward tilt */
function addChar(x,y,z,yaw,sc,col,ph,amp,spd,lean){
  if(ci>=CAP||sc<=0.01)return;
  const s=BS*sc,cyc=T*spd+ph,bob=Math.abs(Math.sin(cyc))*0.05*amp*sc;
  _e.set(lean||0,yaw,0);_q.setFromEuler(_e);_p.set(x,y+bob+FOOT*s,z);_s.set(s,s,s);_m.compose(_p,_q,_s);
  CH.body.m.setMatrixAt(ci,_m);
  const sw=Math.sin(cyc)*0.75*amp;
  limb("legL",sw);limb("legR",-sw);limb("armL",-sw*0.9);limb("armR",sw*0.9);
  const c=tc(col);for(const k in CH)CH[k].m.setColorAt(ci,c);
  ci++;
}

/* --- hooks + fishing lines for the trap --- */
const hookGeo=(()=>{const arc=new THREE.TorusGeometry(0.32,0.06,6,14,Math.PI*1.25);arc.rotateZ(Math.PI*0.9);
  const shank=new THREE.CylinderGeometry(0.06,0.06,0.7,6);shank.translate(-0.32,0.35,0);
  const barb=new THREE.ConeGeometry(0.09,0.22,6);barb.rotateZ(-0.6);barb.translate(0.3,0.08,0);
  return [arc,shank,barb];})();
const {mergeGeometries}=await import("three/addons/utils/BufferGeometryUtils.js");
const hookMesh=new THREE.InstancedMesh(mergeGeometries(hookGeo.map(g=>{g.deleteAttribute("uv");return g;})),new THREE.MeshLambertMaterial({color:tc(K.inkSoft)}),48);
hookMesh.frustumCulled=false;hookMesh.castShadow=true;hookMesh.count=0;scene.add(hookMesh);
const lineGeo=new THREE.CylinderGeometry(0.018,0.018,1,4);lineGeo.translate(0,0.5,0);

lineMesh.frustumCulled=false;lineMesh.count=0;scene.add(lineMesh);

/* --- particles (v1's burst/puff), as instanced cubes --- */
const partMesh=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshLambertMaterial(),600);
partMesh.frustumCulled=false;partMesh.count=0;partMesh.setColorAt(0,tc(K.teal));scene.add(partMesh);

/* --- scenery: Kenney clouds and grass --- */
const clouds3=[];
{const src=firstMesh(gCloud);for(let i=0;i<7;i++){const m=new THREE.Mesh(src.geometry,src.material);const s=srand(3,6.5);m.scale.set(s,s*0.8,s);
  m.position.set(srand(-40,40),srand(13,24),srand(-70,-100));m.userData.v=srand(0.25,0.7);scene.add(m);clouds3.push(m);}}
const grassSrc=firstMesh(gGrass),GRASS=90,grassData=[];
const grass=new THREE.InstancedMesh(grassSrc.geometry,grassSrc.material,GRASS);grass.frustumCulled=false;grass.receiveShadow=true;scene.add(grass);
for(let i=0;i<GRASS;i++){const side=i%2?1:-1;grassData.push({x:side*srand(R+1.4,R+16),z:srand(0,115),s:srand(1.4,2.6),r:srand(0,6.28)});}

/* --- gates: chunky 3D frames, translucent panels, bold numbers on their faces --- */
const postGeo=new THREE.BoxGeometry(0.3,3.0,0.34);postGeo.translate(0,1.5,0);
var gates3=[],tower3=null;
function gateFace(op){return canvasTex(512,364,(g,w,h)=>{
  const fs=136;g.textAlign="center";g.textBaseline="middle";g.lineJoin="round";
  g.font="900 "+fs+"px "+K.ui;g.lineWidth=fs*0.14;g.strokeStyle="#1d4b57";g.fillStyle="#fff";
  const num=fmtOp(op[0]);g.strokeText(num,w/2,h*0.36);g.fillText(num,w/2,h*0.36);
  const cs=44;g.font="800 "+cs+"px "+K.ui;g.lineWidth=cs*0.24;
  const words=op[1].split(" "),lines=[];let cur="";for(const wd of words){const t=cur?cur+" "+wd:wd;if(g.measureText(t).width>w*0.86&&cur){lines.push(cur);cur=wd;}else cur=t;}if(cur)lines.push(cur);
  lines.slice(0,3).forEach((ln,i)=>{const y=h*0.68+i*cs*1.15;g.strokeText(ln,w/2,y);g.fillText(ln,w/2,y);});
});}
function disposeGroup(gr){gr.traverse(o=>{if(o.isMesh){if(o.geometry!==postGeo&&!o.userData.shared)o.geometry.dispose();const ms=Array.isArray(o.material)?o.material:[o.material];ms.forEach(m=>{if(m.map)m.map.dispose();m.dispose();});}});scene.remove(gr);}
function makeGate(e){
  const gr=new THREE.Group();const frame=lam({color:tc(K.tealDeep),transparent:true}),beam=lam({color:tc(K.teal),transparent:true});
  const sides=[];
  for(let s=0;s<2;s++){
    const x0=s?0.1:-R+0.1,x1=s?R-0.1:-0.1,w=x1-x0,cx=(x0+x1)/2;
    const fill=new THREE.MeshBasicMaterial({color:tc(K.teal),transparent:true,opacity:0.3,depthWrite:false,side:THREE.DoubleSide});
    const pf=new THREE.Mesh(new THREE.PlaneGeometry(w-0.3,2.7),fill);pf.position.set(cx,1.35,0);gr.add(pf);
    const face=new THREE.MeshBasicMaterial({map:gateFace(e.opts[s]),transparent:true,depthWrite:false});
    const pt=new THREE.Mesh(new THREE.PlaneGeometry(w-0.3,(w-0.3)*364/512),face);pt.position.set(cx,1.35,0.03);pt.renderOrder=2;gr.add(pt);
    for(const px0 of[x0,x1]){const p=new THREE.Mesh(postGeo,frame);p.position.set(px0,0,0);p.castShadow=true;gr.add(p);}
    const b=new THREE.Mesh(new THREE.BoxGeometry(w+0.3,0.36,0.4),beam);b.position.set(cx,3.0,0);b.castShadow=true;gr.add(b);
    sides.push({fill,face});
  }
  scene.add(gr);return{e,gr,sides,frame,beam};
}
function makeTower(){
  const gr=new THREE.Group(),body=lam({color:tc(K.darkCard)}),dark=lam({color:tc(K.dark)});
  const box=(w,h,d,m,x,y,z)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;gr.add(o);return o;};
  box(5.6,0.4,2.6,dark,0,0.2,-1.2);                 // plinth
  box(5.0,3.4,2.2,body,0,1.9,-1.2);                 // keep
  for(let i=0;i<5;i++)box(0.72,0.7,0.72,dark,-2.14+i*1.07,3.95,-0.3);      // battlements (front)
  for(let i=0;i<5;i++)box(0.72,0.7,0.72,dark,-2.14+i*1.07,3.95,-2.1);      // battlements (back)
  box(1.7,1.9,0.12,new THREE.MeshBasicMaterial({color:0x070d13}),0,1.15,-0.06); // door

  sign.position.set(0,2.85,-0.09);gr.add(sign);

function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function sceneBuild(){sceneDice(()=>{
  gates3.forEach(g=>disposeGroup(g.gr));gates3=ev.filter(e=>e.t==="gate").map(makeGate);
  if(!tower3)tower3=makeTower();
});}

/* --- camera framing: whole lane visible at the crowd, crowd low on screen --- */
function frameCamera(){
  const aspect=W/Math.max(1,H);camera.aspect=aspect;
  /* Fixed pitch; the field of view is the larger of what keeps the crowd ~80% down the
     screen and what keeps the whole lane width in view at the crowd. A very narrow
     screen pulls the camera back instead of widening past 72°. */
  camBase.set(0,6.7,6.3);
  const dist=camBase.length(),hHalf=Math.atan((R+0.4)/dist);
  let vfov=Math.max(58,2*Math.atan(Math.tan(hHalf)/aspect)*180/Math.PI),k=1;
  if(vfov>72){k=(Math.tan(hHalf)/aspect)/Math.tan(36*Math.PI/180);vfov=72;}
  camera.fov=vfov;camBase.multiplyScalar(k);
  camera.updateProjectionMatrix();
  /* Aim so the crowd (world origin) lands ~78% down the screen on any aspect. */
  let lo=-40,hi=-1;
  for(let i=0;i<24;i++){const mid=(lo+hi)/2;camLook.set(0,0,mid);camera.position.copy(camBase);camera.lookAt(camLook);camera.updateMatrixWorld();
    _v.set(0,0.4,0).project(camera);if(_v.y<-0.56)lo=mid;else hi=mid;}
  camLook.set(0,0,(lo+hi)/2);
}
function onResize3D(){renderer.setSize(W,H,false);frameCamera();}

/* --- 2D overlay: number labels, popups, confetti (v1's drawing code) --- */

let pxPerUnitK=1;
function P(x,y,z){_v.set(x,y,-(z-pz));_d.copy(_v).sub(camera.position);const dz=_d.dot(camFwd);if(dz<0.35)return null;
  _v.project(camera);return{x:(_v.x+1)/2*W,y:(1-_v.y)/2*H,s:pxPerUnitK/dz};}
function rrect(x,y,w,h,r){rr(X,x,y,w,h,r);}
function label(x,y,txt,bg,fs){X.font="900 "+fs+"px "+K.ui;const w=X.measureText(txt).width+fs*0.9,h=fs*1.4;
  X.fillStyle="rgba(0,0,0,.15)";rrect(x-w/2,y-h/2+3,w,h,h/2);X.fill();X.fillStyle=bg;rrect(x-w/2,y-h/2,w,h,h/2);X.fill();
  X.fillStyle="#fff";X.textAlign="center";X.textBaseline="middle";X.fillText(txt,x,y+1);}
function drawPops(){for(const p of pops){const q=P(p.x,p.y,p.z);if(!q)continue;const fs=Math.max(16,q.s*0.9*p.size);X.globalAlpha=clamp(1.6-p.t*1.4,0,1);
  X.font="900 "+fs+"px "+K.ui;X.textAlign="center";X.textBaseline="middle";X.lineWidth=fs*0.16;X.strokeStyle="rgba(23,39,44,.75)";X.strokeText(p.txt,q.x,q.y);X.fillStyle=p.col;X.fillText(p.txt,q.x,q.y);}X.globalAlpha=1;}
function drawConf(){for(const c of conf){X.save();X.translate(c.x,c.y);X.rotate(c.r);X.fillStyle=c.c;X.fillRect(-c.w/2,-c.w/4,c.w,c.w/2);X.restore();}}

/* --- per-frame scene update --- */
const wz=z=>-(z-pz);
let bossFall=0;
function render(){
  /* camera + shake */
  camera.position.copy(camBase);
  if(shake>0){camera.position.x+=rand(-1,1)*shake*0.35;camera.position.y+=rand(-1,1)*shake*0.35;}
  camera.lookAt(camLook);camera.updateMatrixWorld();camera.getWorldDirection(camFwd);
  pxPerUnitK=(H/2)/Math.tan(camera.fov*Math.PI/360);

  /* scrolling surfaces */
  const off=((pz-NEAR)/PERIOD)%1;trackTex.offset.y=off;curbTex.offset.y=off;groundTex.offset.y=off;
  for(const c of clouds3){c.position.x+=c.userData.v*0.016;if(c.position.x>48)c.position.x=-48;}
  for(let i=0;i<GRASS;i++){const g=grassData[i];let z=((g.z+pz)%115+115)%115;_e.set(0,g.r,0);_q.setFromEuler(_e);_p.set(g.x,-0.9,NEAR-z);_s.set(g.s,g.s,g.s);_m.compose(_p,_q,_s);grass.setMatrixAt(i,_m);}
  grass.instanceMatrix.needsUpdate=true;

  /* gates */
  for(const G of gates3){const e=G.e,z=wz(e.z),al=1-e.fade;G.gr.visible=al>0.01&&z<14&&z>-125;if(!G.gr.visible)continue;
    G.gr.position.z=z;G.frame.opacity=al;G.beam.opacity=al;
    G.sides.forEach((sd,s)=>{sd.fill.opacity=(e.pick===s?0.55:0.3)*al;sd.face.opacity=al;});}

  /* tower + boss */
  ci=0;
  if(tower3&&tower){const z=wz(tower.z);tower3.gr.position.z=z;tower3.gr.visible=z>-125;
    const fl=tower.flash>0;tower3.body.color.copy(tc(fl?"#3a5566":K.darkCard));
    tower3.flag.rotation.y=Math.sin(T*2)*0.15;
    const down=(state==="end"||state==="result")&&won;bossFall=down?Math.min(1,bossFall+0.04):0;
    if(tower3.gr.visible){const hit=fl?0.25:0;
      addChar(0,3.95-bossFall*1.2,z-1.2+bossFall*0.6,0,3.4,BOSS,0,state==="battle"?0.5:0.15,state==="battle"?14:3,-bossFall*1.45+hit);}
  }

  /* crowd: stationary near the origin, facing away from the camera */
  const running=state==="play"||state==="home"||state==="battle"||(state==="end"&&won);
  for(let i=0;i<units.length;i++){const u=units[i];addChar(clamp(px+u.ox,-R+0.2,R-0.2),0,-u.oz,Math.PI,u.sc,CROWD,u.ph,running?1:0.1,10,0.08);}

  /* spam crowds */
  for(const e of ev){if(e.t!=="mob"||(e.done&&e.hit))continue;const zc=wz(e.z);if(zc<-118||zc>12)continue;
    for(const u of e.us)addChar(clamp(e.x+u.ox,-R+0.2,R-0.2),0,wz(e.z+u.oz),0,1,SPAM,u.ph,0.7,e.amp?9:5,0);}

  /* hooked runners + hooks + lines */
  let hi=0;
  for(const y of yanks){const x=clamp(y.x,-R,R),z=wz(y.z),top=y.y+CHAR_H+0.05;
    addChar(x,y.y,z,Math.PI,1,CROWD,y.x*9,y.y>0?2.2:1,y.y>0?26:10,y.y>0?-0.35:0.08);
    if(hi<48){const hy=top+(y.d>0?y.d*20:0);
      _e.set(0,0,0);_q.setFromEuler(_e);_p.set(x,hy,z);_s.set(0.7,0.7,0.7);_m.compose(_p,_q,_s);hookMesh.setMatrixAt(hi,_m);
      const len=Math.max(0.1,40-hy);_p.set(x-0.22,hy+0.5,z);_s.set(1,len,1);_m.compose(_p,_q,_s);lineMesh.setMatrixAt(hi,_m);hi++;}}
  hookMesh.count=lineMesh.count=hi;hookMesh.instanceMatrix.needsUpdate=lineMesh.instanceMatrix.needsUpdate=true;

  for(const k in CH){const m=CH[k].m;m.count=ci;m.instanceMatrix.needsUpdate=true;if(m.instanceColor)m.instanceColor.needsUpdate=true;}

  /* particles */
  let pi=0;for(const p of parts){if(pi>=600)break;const s=2*p.s*clamp(p.life*2,0,1);if(s<=0.001)continue;
    _q.identity();_p.set(p.x,p.y,wz(p.z));_s.set(s,s,s);_m.compose(_p,_q,_s);partMesh.setMatrixAt(pi,_m);partMesh.setColorAt(pi,tc(p.col));pi++;}
  partMesh.count=pi;partMesh.instanceMatrix.needsUpdate=true;if(partMesh.instanceColor)partMesh.instanceColor.needsUpdate=true;

  sceneDice(()=>renderer.render(scene,camera));

  /* overlay */
  X.clearRect(0,0,W,H);
  for(const e of ev){if(e.t!=="mob"||e.done)continue;const p=P(e.x,1.9+0.1*Math.sqrt(e.us.length),e.z);if(p&&p.y>0)label(p.x,p.y,String(e.n),K.ink,Math.max(12,p.s*0.6));}
  if(tower&&tower.hp>0){const p=P(0,4.3+CHAR_H*3.4+0.8,tower.z+1.2);if(p&&p.y>0)label(p.x,p.y,String(tower.hp),K.orange,Math.max(14,p.s*0.9));}
  if(crowd>0&&state!=="home"){const p=P(px,1.6+0.12*Math.sqrt(units.length),pz);if(p)label(p.x,p.y,String(crowd),K.teal,Math.max(14,p.s*0.62));}
  drawPops();drawConf();
}

/* --- adaptive quality: drop resolution, then shadow detail, if frames run long --- */
let qAcc=0,qN=0,qStep=0;
function quality(dr){if(state!=="play"&&state!=="battle")return;qAcc+=dr;qN++;if(qN<120)return;const avg=qAcc/qN;qAcc=0;qN=0;
  if(avg>1/42&&qStep<3){qStep++;
    if(qStep===1&&PR>1){PR=1;renderer.setPixelRatio(PR);onResize3D();}
    else if(qStep<=2){PR=Math.max(0.75,PR-0.25);renderer.setPixelRatio(PR);onResize3D();}
    else{renderer.shadowMap.type=THREE.PCFShadowMap;sun.shadow.mapSize.set(512,512);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null;}}}}

/* --- loop (same as v1, plus the quality governor) --- */
let last=performance.now();
function frame(now){const dr=Math.min(0.05,(now-last)/1000);last=now;update(dr);render();quality(dr);requestAnimationFrame(frame);}
window.__ttb3d={tris,get chars(){return ci;}};
sceneDice(()=>resize());
Math.random=GAME_RANDOM;
$("heroImg").src=JODI.neutral;$("jimg").src=JODI.concerned;setMute(false);goHome();
$("play").disabled=false;
requestAnimationFrame(frame);
