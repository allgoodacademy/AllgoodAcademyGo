<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pattern Lab — Allgood Academy</title>
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="description" content="Free CogAT-style practice for grades 5–8. Nine reasoning skills, adaptive difficulty, and the pattern behind every question explained.">

<!-- Shared brand values. Everything design-tokens.css already defines is read from it
     below rather than restated here; see scripts/check-tokens.js, which fails the build
     on a brand literal reappearing inside a <style> block. -->
<link rel="stylesheet" href="/assets/css/design-tokens.css">

<!-- Shared identity module. Pattern Lab never asks anyone to sign in and never opens the
     identify gate — it loads AuthCore only so the telemetry pipe below has a Firebase
     session to write under. See the anonymousSessionOnly() note in /js/auth-core.js. -->
<script type="module" src="/js/auth-core.js"></script>
<!-- Shared telemetry pipe, tagged stream: 'pattern-lab' so these sessions are excludable
     from Insider's funnel and conversion metrics. See TICKET 5 in the block below and the
     `stream` note in /js/telemetry.js. -->
<script type="module" src="/js/telemetry.js"></script>
<!-- DELIBERATELY NOT LOADED: /js/skill-routing.js. Pattern Lab's nine subtests are not in
     the routing vocabulary and must never resolve to a GoodBlock. scripts/check-modules.js
     asserts the absence of this script on a hidden module, and resolve() in
     skill-routing.js refuses a Pattern Lab subtest outright. -->
<style>
:root{
  /* Brand values come from /assets/css/design-tokens.css. The short names below are kept
     because every rule in this file already references them. */
  /* --font-display and --font-ui are NOT restated here: design-tokens.css defines those
     exact names on :root, and it is loaded above, so every var(--font-display) below
     already resolves to the shared stack. */
  --teal:var(--color-teal);
  --teal-deep:var(--color-teal-deep);
  --orange:var(--color-orange);
  --cream:var(--color-cream);
  --dark:var(--color-dark);
  /* Pattern-Lab-specific. No token defines these: the sage is the "above your grade"
     meter fill, --line is a warmer hairline than --color-cream-border, and --muted is a
     warm grey that reads against the cream card (--color-muted is the cool grey the dark
     game chassis uses). */
  --sage:#5E8A6B; --line:#E4DDCE; --muted:#6b6558;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--dark);color:var(--dark);font-family:var(--font-ui);min-height:100vh;}

/* NAV CHROME — the four standalone games' dark navbar, minus every link that leads back
   into the main site. Those games offer "Return to dashboard", "Browse games" and
   "Sign in"; Pattern Lab offers none of them. Its audience arrived from a search result,
   not from allgoodacademy.com, and a full site nav would drop a parent into a page
   written for teachers. The only exits are a restart and the Pattern Lab landing page.
   Values (height, tint, hairline) are the game chassis's own, so the two read as siblings. */
.nav{background:var(--navbar-bg);color:#fff;padding:0 20px;min-height:60px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;border-bottom:1px solid rgba(255,255,255,.1);backdrop-filter:blur(5px);}
.nav .brand{font-family:var(--font-display);font-size:14px;letter-spacing:.01em;white-space:nowrap;}
.nav .brand b{color:var(--orange);font-weight:normal;}
.nav .brand .brand-full::after{content:"|";padding:0 6px 0 4px;opacity:.5;}
.nav .prog{margin-left:auto;font-size:11px;opacity:.7;}
.nav .navlinks{display:flex;align-items:center;gap:4px;margin-left:14px;}
.nav .navlinks a,.nav .navlinks button{color:#e5e7eb;background:none;border:none;font-family:var(--font-ui);font-size:11px;font-weight:bold;letter-spacing:.04em;text-transform:uppercase;text-decoration:none;padding:7px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;}
.nav .navlinks a:hover,.nav .navlinks button:hover{color:#fff;background:rgba(255,255,255,.1);}
@media (max-width:520px){
  .nav{padding:0 12px;gap:8px;}
  /* "ALLGOOD ACADEMY | Pattern Lab" wraps to three lines at 360px and drags the whole bar
     down with it. The product name is what a visitor needs here; the company name is on
     the landing page they came from and in its footer. */
  .nav .brand .brand-full{display:none;}
  .nav .brand{font-size:13px;}
  .nav .navlinks{margin-left:8px;}
  .nav .navlinks a,.nav .navlinks button{padding:6px 7px;font-size:10px;}
}

.stage{max-width:760px;margin:0 auto;padding:26px 20px 60px;}
.card{background:var(--cream);border-radius:12px;padding:30px 32px;box-shadow:0 6px 28px rgba(0,0,0,.28);}

h1{font-family:var(--font-display);font-size:30px;font-weight:bold;margin-bottom:10px;line-height:1.15;}
.rule{width:56px;height:4px;background:var(--orange);margin:14px 0 18px;}
p.lede{font-size:14px;line-height:1.6;margin-bottom:16px;}
.muted{color:var(--muted);font-size:12.5px;line-height:1.55;}

.eyebrow{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);font-weight:bold;margin-bottom:12px;}

.btn{background:var(--teal);color:#fff;border:none;padding:13px 24px;border-radius:7px;font-family:var(--font-ui);font-size:13px;font-weight:bold;cursor:pointer;transition:background .15s;}
.btn:hover{background:var(--teal-deep);}
.btn.orange{background:var(--orange);}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--muted);font-weight:normal;}
.btn:disabled{opacity:.4;cursor:default;}

.grades{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 24px;}
.lens{display:flex;flex-direction:column;gap:9px;margin:18px 0 24px;}
.len{background:#fff;border:2px solid var(--line);border-radius:9px;padding:15px 18px;cursor:pointer;display:flex;align-items:flex-start;gap:16px;transition:all .15s;text-align:left;width:100%;font-family:var(--font-ui);}
.len:hover{border-color:var(--teal);}
.len.sel{border-color:var(--teal);background:#eef5f7;}
.len .n{font-family:var(--font-display);font-size:26px;font-weight:bold;width:44px;text-align:center;flex-shrink:0;color:var(--teal-deep);line-height:1.25;}
.len .w{display:flex;flex-direction:column;gap:4px;min-width:0;}
.len .t{display:block;font-family:var(--font-display);font-size:16px;line-height:1.3;}
.len .d{display:block;font-size:11.5px;color:var(--muted);line-height:1.5;}
.conf{font-size:9px;letter-spacing:.07em;text-transform:uppercase;font-weight:bold;padding:3px 8px;border-radius:12px;margin-left:8px;vertical-align:2px;}
.conf.hi{background:#e7f0e9;color:var(--sage);}
.conf.md{background:#f2ece0;color:#8a6a2a;}
.conf.lo{background:#f0ebe0;color:var(--muted);}
.grade{flex:1;min-width:76px;background:#fff;border:2px solid var(--line);border-radius:9px;padding:16px 8px;text-align:center;cursor:pointer;transition:all .15s;}
.grade:hover{border-color:var(--teal);}
.grade.sel{border-color:var(--teal);background:#eef5f7;}
.grade .g{font-family:var(--font-display);font-size:21px;font-weight:bold;}
.grade .l{font-size:10px;color:var(--muted);margin-top:3px;}

.qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.chip{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:bold;padding:5px 11px;border-radius:20px;background:#e4eef0;color:var(--teal-deep);}
.chip.lv{background:#f2ece0;color:#8a6a2a;}

.stem{font-family:var(--font-display);font-size:23px;line-height:1.5;margin:10px 0 24px;}
.stem .hl{color:var(--orange);font-weight:bold;}
.series{font-family:var(--font-display);font-size:30px;letter-spacing:.08em;text-align:center;padding:22px;background:#fff;border-radius:9px;border:1px solid var(--line);margin:10px 0 24px;overflow-wrap:anywhere;}
.series .q{color:var(--orange);}

.opts{display:flex;flex-direction:column;gap:9px;}
.opt{background:#fff;border:2px solid var(--line);border-radius:9px;padding:14px 18px;text-align:left;cursor:pointer;font-family:var(--font-display);font-size:16px;transition:all .12s;display:flex;align-items:center;gap:13px;}
.opt:hover:not(:disabled){border-color:var(--teal);}
.opt:disabled{cursor:default;}
.opt .k{font-family:var(--font-ui);font-size:10.5px;font-weight:bold;width:21px;height:21px;border-radius:50%;background:#eee6d8;color:var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.opt.right{border-color:var(--sage);background:#f0f6f1;}
.opt.right .k{background:var(--sage);color:#fff;}
.opt.wrong{border-color:var(--orange);background:#fdf1ec;}
.opt.wrong .k{background:var(--orange);color:#fff;}

.numin{display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap;}
/* min-width:0 is load-bearing, not tidying. A flex item's default min-width:auto is its
   intrinsic content width, and this input's is set by a 26px placeholder — so on a phone it
   refused to shrink and pushed the Check button ~140px off the right edge of the page. */
.numin input{flex:1 1 130px;min-width:0;font-family:var(--font-display);font-size:26px;text-align:center;padding:15px;border:2px solid var(--line);border-radius:9px;background:#fff;color:var(--dark);}
.numin input:focus{outline:none;border-color:var(--teal);}

.mech{margin-top:20px;padding:16px 20px;border-radius:9px;background:#fff;border-left:4px solid var(--teal);}
.mech .vt{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:bold;margin-bottom:7px;}
.mech.ok .vt{color:var(--sage);}
.mech.no .vt{color:var(--orange);}
.mech p{font-size:13.5px;line-height:1.6;}
.mech .ans{font-family:var(--font-display);font-size:15px;margin-bottom:6px;}

.foot{display:flex;gap:10px;margin-top:20px;align-items:center;}
.foot .skip{margin-left:auto;font-size:11.5px;color:var(--muted);background:none;border:none;cursor:pointer;text-decoration:underline;}


/* figures */
.figgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:10px auto 24px;max-width:340px;}
.figcell{background:#fff;aspect-ratio:1;display:flex;align-items:center;justify-content:center;padding:10px;}
.figcell.qm{background:#fdf1ec;}
.figcell.qm span{font-family:var(--font-display);font-size:34px;color:var(--orange);}
.figrow{display:flex;gap:9px;justify-content:center;align-items:center;flex-wrap:wrap;margin:10px 0 24px;}
.figrow .fb{background:#fff;border:1px solid var(--line);border-radius:9px;width:84px;height:84px;display:flex;align-items:center;justify-content:center;padding:9px;}
.figrow .sep{font-size:20px;color:var(--muted);}
.figopts{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
.figopt{background:#fff;border:2px solid var(--line);border-radius:9px;padding:9px 6px 7px;cursor:pointer;transition:all .12s;display:flex;flex-direction:column;align-items:center;gap:5px;}
.figopt:hover:not(:disabled){border-color:var(--teal);}
.figopt:disabled{cursor:default;}
.figopt svg{width:100%;height:auto;max-height:62px;}
.figopt .k{font-family:var(--font-ui);font-size:10px;font-weight:bold;width:19px;height:19px;border-radius:50%;background:#eee6d8;color:var(--muted);display:flex;align-items:center;justify-content:center;}
.figopt.right{border-color:var(--sage);background:#f0f6f1;}
.figopt.right .k{background:var(--sage);color:#fff;}
.figopt.wrong{border-color:var(--orange);background:#fdf1ec;}
.figopt.wrong .k{background:var(--orange);color:#fff;}
.fold{display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:wrap;margin:10px 0 24px;}
.fold .fs{background:#fff;border:1px solid var(--line);border-radius:8px;width:76px;height:76px;display:flex;align-items:center;justify-content:center;padding:7px;}
.fold .ar{font-size:17px;color:var(--muted);}
.fold .cap{width:100%;text-align:center;font-size:10.5px;color:var(--muted);margin-top:2px;}


/* skill meters */
.sk{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:8px;}
.sk .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:9px;}
.sk .nm{font-family:var(--font-display);font-size:15px;}
.sk .vb{font-size:11px;font-weight:bold;letter-spacing:.03em;}
.vb.up{color:var(--sage);} .vb.on{color:var(--teal);} .vb.dn{color:var(--orange);} .vb.nd{color:var(--muted);font-weight:normal;}
.meter{display:flex;gap:4px;}
.seg{flex:1;height:26px;border-radius:5px;background:#f0ebe0;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:bold;color:#bdb5a5;letter-spacing:.04em;position:relative;overflow:hidden;}
.seg.cl{background:var(--teal);border-color:var(--teal);color:#fff;}
.seg.cl.above{background:var(--sage);border-color:var(--sage);}
.seg.try{background:#fdf1ec;border-color:var(--orange);color:var(--orange);}
.seg .st{position:relative;z-index:1;}
.sk .sub{font-size:10.5px;color:var(--muted);margin-top:7px;line-height:1.5;}
.startmark{position:absolute;top:0;bottom:0;left:0;width:3px;background:var(--dark);opacity:.35;}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:10.5px;color:var(--muted);margin:14px 0 22px;}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
.summary{background:var(--dark);color:#fff;border-radius:10px;padding:18px 22px;margin-bottom:20px;}
.summary .sh{font-family:var(--font-display);font-size:17px;margin-bottom:8px;}
.summary p{font-size:12.5px;line-height:1.6;color:#c9d6d2;}
.summary b{color:#fff;}

/* skill meters end */
/* report */
.rrow{background:#fff;border:1px solid var(--line);border-radius:9px;padding:15px 18px;margin-bottom:9px;}
.rrow .rt{display:flex;justify-content:space-between;align-items:baseline;gap:12px;}
.rrow .rn{font-family:var(--font-display);font-size:16px;}
.rrow .rv{font-size:12px;font-weight:bold;}
.rv.up{color:var(--sage);} .rv.on{color:var(--teal);} .rv.nd{color:var(--muted);font-weight:normal;}
.rrow .rd{font-size:11.5px;color:var(--muted);margin-top:5px;}
.bt{font-family:var(--font-display);font-size:13px;color:var(--teal-deep);margin:20px 0 9px;letter-spacing:.03em;}
.disc{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted);line-height:1.6;}

/* NARROW WIDTHS
   The SVG figures are the part most likely to break here: four figure options on one row at
   320px leaves ~55px each, and the grid is fixed at three columns because a 3x3 matrix
   reordered into two columns is no longer the puzzle. So the card gives back its padding
   instead, and the option keys shrink rather than the figures. */
@media (max-width:560px){
  .stage{padding:16px 12px 48px;}
  .card{padding:22px 18px;border-radius:10px;}
  h1{font-size:25px;}
  .stem{font-size:19px;margin:10px 0 20px;}
  .series{font-size:24px;padding:16px 12px;}
  .figgrid{max-width:100%;gap:6px;}
  .figcell{padding:6px;}
  .figrow .fb{width:68px;height:68px;padding:7px;}
  .fold .fs{width:62px;height:62px;padding:5px;}
  .figopts{gap:6px;}
  .figopt{padding:7px 3px 5px;}
  .figopt svg{max-height:52px;}
  .figopt .k{width:16px;height:16px;font-size:9px;}
  .opt{font-size:15px;padding:12px 14px;gap:10px;}
  .qmeta{gap:8px;flex-wrap:wrap;}
  .foot{flex-wrap:wrap;gap:8px;}
  .foot .skip{margin-left:0;}
  .foot #stop{margin-left:0 !important;}
  .seg{font-size:9px;}
}
@media (max-width:360px){
  .figrow .fb{width:58px;height:58px;}
  .fold .fs{width:54px;height:54px;}
  .figopt svg{max-height:44px;}
}
</style>
</head>
<body>

<div class="nav">
  <div class="brand"><span class="brand-full">ALLGOOD ACADEMY </span><b>Pattern Lab</b></div>
  <div class="navlinks">
    <button type="button" id="nav-restart">Start over</button>
    <a href="/pattern-lab/">About Pattern Lab</a>
  </div>
  <div class="prog" id="prog"></div>
</div>

<div class="stage"><div class="card" id="card"></div></div>

<script>

// ---------- SVG FIGURE PRIMITIVES ----------
// Every figure is a pure function -> SVG string. Deterministic, no assets.
// Figure ink. Read from design-tokens.css rather than restated, so a brand change reaches
// the SVG figures too; the literals are the fallback for the one case a var cannot cover
// (stylesheet blocked or not yet applied), never a second source of truth.
const _tok = (name, fallback) => {
  try { return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback; }
  catch (e) { return fallback; }
};
const T=_tok('--color-teal','#357889'), O=_tok('--color-orange','#D34716'),
      G='#5E8A6B', D=_tok('--color-dark','#0F1923'), N='none';
const svg=b=>`<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${b}</svg>`;

const F={
  // shapes: fill or outline, optional rotation
  sq:(c,f=1,r=0)=>svg(`<rect x="24" y="24" width="52" height="52" fill="${f?c:N}" stroke="${c}" stroke-width="4" transform="rotate(${r} 50 50)"/>`),
  tri:(c,f=1,r=0)=>svg(`<polygon points="50,20 80,76 20,76" fill="${f?c:N}" stroke="${c}" stroke-width="4" transform="rotate(${r} 50 50)"/>`),
  cir:(c,f=1)=>svg(`<circle cx="50" cy="50" r="27" fill="${f?c:N}" stroke="${c}" stroke-width="4"/>`),
  dia:(c,f=1)=>svg(`<polygon points="50,18 82,50 50,82 18,50" fill="${f?c:N}" stroke="${c}" stroke-width="4"/>`),
  pent:(c,f=1,r=0)=>svg(`<polygon points="50,18 80,40 69,75 31,75 20,40" fill="${f?c:N}" stroke="${c}" stroke-width="4" transform="rotate(${r} 50 50)"/>`),
  hex:(c,f=1)=>svg(`<polygon points="50,18 78,34 78,66 50,82 22,66 22,34" fill="${f?c:N}" stroke="${c}" stroke-width="4"/>`),
  // arrow at rotation r
  arr:(c,r=0)=>svg(`<g transform="rotate(${r} 50 50)"><line x1="50" y1="78" x2="50" y2="26" stroke="${c}" stroke-width="6" stroke-linecap="round"/><polygon points="50,16 38,34 62,34" fill="${c}"/></g>`),
  // n dots in a row
  dots:(c,n)=>{const gap=Math.min(20,76/Math.max(n,1)),r=Math.min(8,gap*0.40);
    return svg(Array.from({length:n},(_,i)=>`<circle cx="${(50+(i-(n-1)/2)*gap).toFixed(2)}" cy="50" r="${r.toFixed(2)}" fill="${c}"/>`).join(''));},
  // square with n dots inside
  sqdots:(c,n)=>{const gap=Math.min(17,52/Math.max(n,1)),r=Math.min(6,gap*0.38);
    return svg(`<rect x="18" y="18" width="64" height="64" fill="${N}" stroke="${c}" stroke-width="4"/>`+
    Array.from({length:n},(_,i)=>`<circle cx="${(50+(i-(n-1)/2)*gap).toFixed(2)}" cy="50" r="${r.toFixed(2)}" fill="${c}"/>`).join(''));},
  // L-shape, rotatable
  ell:(c,r=0)=>svg(`<polygon points="26,22 46,22 46,58 76,58 76,78 26,78" fill="${c}" transform="rotate(${r} 50 50)"/>`),
  // shape with a slice removed (rotatable)
  pac:(c,r=0)=>svg(`<path d="M50,50 L50,20 A30,30 0 1,1 20,50 Z" fill="${c}" transform="rotate(${r} 50 50)"/>`),
  // striped square
  stripe:(c,r=0)=>svg(`<g transform="rotate(${r} 50 50)"><rect x="24" y="24" width="52" height="52" fill="${N}" stroke="${c}" stroke-width="4"/>`+
    [34,44,54,64].map(y=>`<line x1="26" y1="${y}" x2="74" y2="${y}" stroke="${c}" stroke-width="3"/>`).join('')+`</g>`),
  // paper-folding: sheet with fold line + punched holes
  sheet:(holes=[],fold=null)=>svg(`<rect x="14" y="14" width="72" height="72" fill="#fff" stroke="${D}" stroke-width="3"/>`+
    (fold==='v'?`<line x1="50" y1="14" x2="50" y2="86" stroke="${T}" stroke-width="2.5" stroke-dasharray="5,4"/>`:
     fold==='h'?`<line x1="14" y1="50" x2="86" y2="50" stroke="${T}" stroke-width="2.5" stroke-dasharray="5,4"/>`:'')+
    holes.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="6" fill="${O}"/>`).join('')),
  // folded half-sheet (left half shown folded over)
  half:(holes=[],dir='v')=>svg(
    (dir==='v'?`<rect x="14" y="14" width="36" height="72" fill="#fff" stroke="${D}" stroke-width="3"/><line x1="50" y1="14" x2="50" y2="86" stroke="${T}" stroke-width="3"/>`
              :`<rect x="14" y="14" width="72" height="36" fill="#fff" stroke="${D}" stroke-width="3"/><line x1="14" y1="50" x2="86" y2="50" stroke="${T}" stroke-width="3"/>`)+
    holes.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="6" fill="${O}"/>`).join(''))
};

// ---------- ITEM BANK (12 seed items; scales to ~110) ----------
// sub: verbal-analogies | verbal-classification | sentence-completion
//      number-series | number-analogies | number-puzzles
// lvl: 11 | 12 | 13  (13 = combined 13/14)

sty · courage · patience</span><br><span style=\"font-size:16px;color:var(--muted)\">Which belongs with them?</span>","mech":"All are virtues — chosen traits of character. The others are circumstances or gifts.","opts":["wealth","loyalty","fame","talent"],"ans":1},{"id":"V-C-16","sub":"verbal-classification","lvl":12,"type":"mc","stem":"<span class=\"hl\">drizzle · downpour · shower</span><br><span style=\"font-size:16px;color:var(--muted)\">Which belongs with them?</span>","mech":"All describe rainfall at different intensities.","opts":["gale","frost","deluge","breeze"],"ans":2},{"id":"V-C-17","sub":"verbal-classification","lvl":12,"type":"mc","stem":"<span class=\"hl\">chisel · plane · lathe</span><br><span style=\"font-size:16px;color:var(--muted)\">Which belongs with them?</span>","mech":"All are tools that shape material by removing it. The others join material together.","opts":["nail","glue","sander","screw"],"ans":2},{"id":"V-C-18","sub":"verbal-classification","lvl":12,"type":"mc","stem":"<span class=\"hl\">peninsula · isthmus · cape</span><br><span style=\"font-size:16px;color:var(--muted)\">Which belongs with them?</span>","mech":"All are land formations extending into water. The others are bodies of water.","opts":["bay","gulf","strait","promontory"],"ans":3},{"id":"V-C-19","sub":"verbal-classification","lvl":12,"type":"mc","stem":"<span class=\"hl\">astonished · amazed · stunned</span><br><span style=\"font-size:16px;color:var(--muted)\">Which belongs with them?</span>","mech":"All mean overwhelmed by surprise. The others are milder and not surprise-based.","opts":["content","curious","astounded","pleased"],"ans":2},{"id":"V-C-20","sub":"verbal-classification","lvl":12,"type":"mc","stem":"<span class=\"hl\">thesis · hypothesis · premise</span><br><span style=\"font-size:16px;color:var(--muted)\">Which belongs with them?</span>","mech":"All are claims stated before testing. The others come after.","opts":["conclusion","result","evidence","proposition"]," ng anyone affected\" defines the blank. Three options describe the opposite process.","opts":["democratic","transparent","arbitrary","considered"],"ans":2},{"id":"S-C-17","sub":"sentence-completion","lvl":12,"type":"mc","stem":"Rainfall this season was <span class=\"hl\">______</span>, less than half the usual amount for the region.","mech":"The measurement after the comma defines the word precisely.","opts":["excessive","abundant","typical","scarce"],"ans":3},{"id":"S-C-18","sub":"sentence-completion","lvl":12,"type":"mc","stem":"The novel's ending felt <span class=\"hl\">______</span>, resolving in two pages what the previous three hundred had built.","mech":"The contrast between two pages and three hundred is the clue — the pacing collapsed.","opts":["gradual","satisfying","inevitable","abrupt"],"ans":3},{"id":"S-C-19","sub":"sentence-completion","lvl":12,"type":"mc","stem":"He was <span class=\"hl\">______</span> in his praise, mentioning every member of the team by name.","mech":"Naming everyone is the definition of unstinting praise.","opts":["vague","reluctant","sparing","generous"],"ans":3},{"id":"S-C-20","sub":"sentence-completion","lvl":12,"type":"mc","stem":"The instructions were deliberately <span class=\"hl\">______</span>, leaving each team free to solve the problem its own way.","mech":"\"Leaving each team free\" defines the blank — and \"deliberately\" tells you it was a choice.","opts":["detailed","rigid","open-ended","mandatory"],"ans":2},{"id":"S-C-21","sub":"sentence-completion","lvl":12,"type":"mc","stem":"Once a <span class=\"hl\">______</span> port, the town now sees perhaps one cargo ship a year.","mech":"\"Once\" plus \"now\" signals a reversal — the blank must contrast with near-emptiness.","opts":["forgotten","modest","quiet","bustling"],"ans":3},{"id":"S-C-22","sub":"sentence-completion","lvl":12,"type":"mc","stem":"The witness's account was <span class=\"hl\">______</span>, changing in three important details between the first and second  {id:"verbal-analogies",name:"Verbal Analogies",bat:"Verbal"},

const GRADE_LVL={5:11,6:12,7:13,8:13};
// Confidence tiers: a level is always shown, but labelled by how much it rests on.
// Replaces the old hard 5-item gate, which no session length could ever clear
// (9 subtests x 3 rounds = 3 items per subtest at most).
const CONF=n=> n>=5 ? {k:'hi',t:'Solid'} : n>=3 ? {k:'md',t:'Provisional'} : {k:'lo',t:'First impression'};

let S={grade:null,rounds:3,queue:[],idx:0,log:[],lvlBySub:{},answered:false};

/* ─────────────────────────────────────────────────────────────────────────────
   TELEMETRY (Ticket 5)

   Pattern Lab writes through the SAME shared pipe every other module uses
   (/js/telemetry.js → artifacts/{appId}/sessions + /events), tagged
   `stream: 'pattern-lab'`. Insider partitions that stream out of D.sessions and
   D.events before it computes anything, so these sessions cannot reach the funnel,
   the conversion rate, module-visit counts or any Lab Pack report. Nothing here is
   a second pipe — a second pipe is how a stream ends up being counted twice later.

   WHAT IS CAPTURED, AND WHY
   The item levels (L11 / L12 / L13) were assigned by design judgment. Nobody has
   normed them against real students. Every answered item therefore records its
   subtest, its level, whether it was right, and WHICH distractor was chosen when it
   was wrong. If learners clear "L13" items in a subtest at the same rate as its
   "L11" items, that subtest's levelling is wrong and the bank needs recalibrating.
   That is the entire reason this ships free.

   WHAT IS DELIBERATELY NOT HERE
   - No `category` field on a choice event. `category` is the ROUTING vocabulary
     (see /js/skill-routing.js); Pattern Lab's nine subtests are not in it and must
     never be mistaken for it. The field is called `subtest`.
   - No skill-routing.js, on the page or in this file. Nothing here resolves to a
     GoodBlock.
   - No sign-in prompt, no identity gate, no name. See patternLabSession() below.
   ───────────────────────────────────────────────────────────────────────────── */

// The longest session a learner can pick. Telemetry.plan() narrows this to the real
// queue length once they choose, so a 9-item session is never scored out of 27.
const MAX_ITEMS = 27;
const SUBTEST_IDS = SUBS.map(s => s.id);

// Telemetry must never be able to break a question. Every call goes through here: if the
// pipe never loaded, or a write throws, the practice session is unaffected.
const tele = (fn, ...args) => {
  try { if (window.Telemetry && typeof window.Telemetry[fn] === 'function') window.Telemetry[fn](...args); }
  catch (e) { /* ignore */ }
};

/* A uid, and nothing else.
 *
 * firestore.rules #10/#11 only accept a write that names request.auth.uid, so the pipe
 * needs a Firebase session. Every other module gets one from guestStart()/silentSignIn(),
 * which also write a users/{uid} profile with a nickname — for Pattern Lab that would
 * both contradict "no account" and add a phantom learner to Insider's user counts, which
 * is the exact thing Ticket 5 exists to prevent. anonymousSessionOnly() signs in
 * anonymously and stops there: no profile document, no display name, no ag_account
 * routing flag, nothing tied to a person. */
async function patternLabSession() {
    try {
        const core = window.AuthCore;
        if (core && core.anonymousSessionOnly) await core.anonymousSessionOnly();
    } catch (e) {
        // A blocked or failed sign-in costs the calibration data for this visit and
        // nothing else. The practice session itself does not depend on it.
        console.warn('[PatternLab] anonymous telemetry session unavailable', e);
    }
}

// auth-core.js and telemetry.js are module scripts and have not necessarily run when this
// classic script does. Poll briefly rather than racing them — the same pattern the four
// games use; if neither ever arrives, the game plays exactly as it does now with no data.
function initTelemetry(tries) {
  if (window.Telemetry && window.AuthCore) {
    window.Telemetry.init({ module: 'pattern-lab', gameName: 'Pattern Lab', stepsTotal: MAX_ITEMS, stream: 'pattern-lab' });
    patternLabSession();
    return;
  }
  if ((tries || 0) > 100) return;
  setTimeout(() => initTelemetry((tries || 0) + 1), 50);
}
initTelemetry(0);
const card=()=>document.getElementById('card');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function begin(){
  SUBS.forEach(s=>S.lvlBySub[s.id]=GRADE_LVL[S.grade]);
  S.queue=buildQueue(); S.idx=0; S.log=[];
  // The learner picks the session length AFTER the page has opened, so the real step
  // denominator is only knowable here. See the plan() note in /js/telemetry.js.
  tele('plan', S.queue.length);
  tele('track','pattern_lab_start',{grade:S.grade,startLevel:GRADE_LVL[S.grade],items:S.queue.length});
  render();
}

// Seed bank is small, so build a queue that covers every subtest, nearest-level-first.
function buildQueue(){
  // 3 rounds x 9 subtests = 27 items, adaptively levelled, no repeats within a session
  const used=new Set(); const q=[];
  for(let round=0;round<(S.rounds||3);round++){
    SUBS.forEach(sub=>{
      const want=S.lvlBySub[sub.id];
      // prefer exact level, then nearest
      const pool=BANK.filter(b=>b.sub===sub.id&&!used.has(b.id))
        .sort((a,b)=>Math.abs(a.lvl-want)-Math.abs(b.lvl-want)||(Math.random()-.5));
      if(pool.length){const pick=pool[Math.floor(Math.random()*Math.min(4,pool.length))];used.add(pick.id);q.push({...pick,_round:round});}
    });
  }
  return q;
}

// re-pick the remaining queue whenever a subtest's level changes
function reLevel(){
  const used=new Set(S.log.map(l=>l.id));
  for(let i=S.idx+1;i<S.queue.length;i++){
    const sub=S.queue[i].sub, want=S.lvlBySub[sub];
    if(S.queue[i].lvl===want) {used.add(S.queue[i].id); continue;}
    const pool=BANK.filter(b=>b.sub===sub&&b.lvl===want&&!used.has(b.id)&&!S.queue.slice(0,i).some(x=>x.id===b.id));
    if(pool.length){const pick=pool[Math.floor(Math.random()*pool.length)];S.queue[i]={...pick,_round:S.queue[i]._round};}
    used.add(S.queue[i].id);
  }
}

function render(){
  if(S.idx>=S.queue.length) return report();
  const q=S.queue[S.idx]; S.answered=false;
  const sub=SUBS.find(s=>s.id===q.sub);
  document.getElementById('prog').textContent=`${S.idx+1} / ${S.queue.length}`;

  const fig = x => x ? eval(x) : '';
  const figOpts = () => `<div class="figopts">${q.opts.map((o,i)=>
      `<button class="figopt" data-i="${i}">${fig(o)}<span class="k">${'ABCD'[i]}</span></button>`).join('')}</div>`;

  let body;
  if(q.type==='matrix'){
    body = `<div class="figgrid">${q.cells.map(c=>
        c ? `<div class="figcell">${fig(c)}</div>` : `<div class="figcell qm"><span>?</span></div>`).join('')}</div>`
      + `<p class="muted" style="text-align:center;margin-bottom:16px">Which figure completes the grid?</p>` + figOpts();
  } else if(q.type==='figclass'){
    body = `<div class="figrow">${q.given.map(g=>`<div class="fb">${fig(g)}</div>`).join('')}<span class="sep">+</span><div class="fb" style="background:#fdf1ec"><span style="font-family:var(--font-display);font-size:28px;color:var(--orange)">?</span></div></div>`
      + `<p class="muted" style="text-align:center;margin-bottom:16px">Which figure belongs with the first three?</p>` + figOpts();
  } else if(q.type==='fold'){
    const punchedHalf = eval(`F.half(${JSON.stringify(q.punched)},'${q.fold}')`);
    const blank = q.fold==='v' ? eval("F.sheet([],'v')") : eval("F.sheet([],'h')");
    body = `<div class="fold">
        <div class="fs">${blank}</div><span class="ar">→</span>
        <div class="fs">${punchedHalf}</div><span class="ar">→</span>
        <div class="fs" style="background:#fdf1ec"><span style="font-family:var(--font-display);font-size:26px;color:var(--orange)">?</span></div>
        <div class="cap">folded &nbsp;·&nbsp; punched &nbsp;·&nbsp; unfolded</div>
      </div>`
      + `<p class="muted" style="text-align:center;margin-bottom:16px">The paper is folded, punched, then opened. What does it look like?</p>` + figOpts();
  } else if(q.type==='num'){
    body = (q.series
        ? `<div class="series">${q.series.map(n=>n==='?'?'<span class="q">?</span>':esc(n)).join(' &nbsp;·&nbsp; ')}</div>`
        : `<div class="stem">${q.stem}</div>`)
      + `<div class="numin"><input id="na" type="text" inputmode="numeric" placeholder="Your answer" autocomplete="off"><button class="btn" id="sub">Check</button></div>`;
  } else {
    body = `<div class="stem">${q.stem}</div>
       <div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${'ABCD'[i]}</span>${esc(o)}</button>`).join('')}</div>`;
  }

  card().innerHTML=`
    <div class="qmeta"><span class="chip">${esc(sub.name)}</span><span class="chip lv">Level ${q.lvl}${q.lvl===13?'/14':''}</span></div>
    ${body}
    <div id="after"></div>`;

  if(q.type==='num'){
    const inp=document.getElementById('na');
    inp.focus();
    const go=()=>answer(inp.value.trim());
    document.getElementById('sub').onclick=go;
    inp.onkeydown=e=>{if(e.key==='Enter')go();};
  } else if(q.type==='mc'){
    card().querySelector('.opts').onclick=e=>{
      const b=e.target.closest('.opt'); if(!b||S.answered)return;
      answer(+b.dataset.i);
    };
  } else {
    card().querySelector('.figopts').onclick=e=>{
      const b=e.target.closest('.figopt'); if(!b||S.answered)return;

    };

}

function answer(val){
  if(S.answered)return; S.answered=true;
  const q=S.queue[S.idx];
  const correct = q.type==='num' ? String(val)===String(q.ans) : val===q.ans;

  S.log.push({id:q.id,sub:q.sub,lvl:q.lvl,correct});

  /* The per-item record this whole thing ships free for (Ticket 5).
     `chosen` is the DISTRACTOR: which wrong option was picked, by index for a
     multiple-choice or figure item and by the typed string for a numeric one. Without it
     a wrong answer says only "L13 Number Analogies was missed", which cannot tell a badly
     levelled item from a badly written distractor that every learner falls for.
     Deliberately `subtest`, not `category` — see the TELEMETRY note above. */
  tele('step', S.idx + 1);
  tele('choice', {
    itemId: q.id,
    subtest: q.sub,
    level: q.lvl,
    itemType: q.type,
    correct,
    chosen: q.type === 'num' ? String(val).slice(0, 24) : (typeof val === 'number' ? val : null),
    answer: q.type === 'num' ? String(q.ans) : q.ans,
    // The level this subtest was sitting at when the item was served, so an adaptive
    // path can be reconstructed rather than inferred from the item's own level.
    servedAt: S.lvlBySub[q.sub],
    grade: S.grade,
  });

  // adaptive: step the subtest's working level
  const before=S.lvlBySub[q.sub];
  if(correct && S.lvlBySub[q.sub]<13) S.lvlBySub[q.sub]++;
  else if(!correct && S.lvlBySub[q.sub]>11) S.lvlBySub[q.sub]--;
  if(S.lvlBySub[q.sub]!==before) reLevel();

  const visual = q.type==='matrix'||q.type==='figclass'||q.type==='fold';
  if(q.type==='mc'){
    card().querySelectorAll('.opt').forEach((b,i)=>{
      b.disabled=true;
      if(i===q.ans)b.classList.add('right');
      else if(i===val)b.classList.add('wrong');
    });
  } else if(visual){
    card().querySelectorAll('.figopt').forEach((b,i)=>{
      b.disabled=true;
      if(i===q.ans)b.classList.add('right');
      else if(i===val)b.classList.add('wrong');
    });
  } else {
    document.getElementById('na').disabled=true;
    document.getElementById('sub').disabled=true;
  }

  const ansTxt = q.type==='num' ? esc(q.ans) : visual ? 'option '+'ABCD'[q.ans] : esc(q.opts[q.ans]);
  document.getElementById('after').innerHTML=`
    <div class="mech ${correct?'ok':'no'}">
      <div class="vt">${correct?'Correct':'The answer was '+ansTxt}</div>
      ${!correct&&q.type==='num'?'':''}
      <p>${q.mech}</p>
    </div>
    <div class="foot">
      <button class="btn" id="nx">${S.idx+1>=S.queue.length?'See your results →':'Next →'}</button>
      <button class="skip" id="sk">Skip explanation</button>
      <button class="skip" id="stop" style="margin-left:14px">Stop &amp; see results</button>
    </div>`;
  document.getElementById('nx').onclick=()=>{S.idx++;render();};
  document.getElementById('sk').onclick=()=>{S.idx++;render();};
  document.getElementById('stop').onclick=()=>{S.idx=S.queue.length;render();};
}

function report(){
  document.getElementById('prog').textContent='';
  const base=GRADE_LVL[S.grade];
  const LV=[11,12,13];
  const lvName=l=>l===13?'13/14':String(l);

  const rows=SUBS.map(s=>{
    const mine=S.log.filter(l=>l.sub===s.id);
    const per={};
    LV.forEach(l=>{
      const at=mine.filter(m=>m.lvl===l);
      per[l]={n:at.length, ok:at.filter(m=>m.correct).length};
    });
    const cleared=LV.filter(l=>per[l].ok>0);
    const top=cleared.length?Math.max(...cleared):null;
    return {s,mine,per,top,n:mine.length,conf:CONF(mine.length),answered:mine.length>0};
  });

  // headline: strongest vs weakest among cells with enough data
  const solid=rows.filter(r=>r.answered&&r.top);
  let head='';
  if(solid.length>=2){
    const hi=solid.reduce((a,b)=>b.top>a.top?b:a);
    const lo=solid.reduce((a,b)=>b.top<a.top?b:a);
    head = hi.top===lo.top
      ? `<div class="summary"><div class="sh">Even across the board</div><p>You landed at <b>Level ${lvName(hi.top)}</b> in every skill with enough data. That's a consistent profile \u2014 no single area pulling ahead or lagging.</p></div>`
      : `<div class="summary"><div class="sh">Your strongest and weakest</div><p>You reached <b>Level ${lvName(hi.top)}</b> in <b>${esc(hi.s.name)}</b> and <b>Level ${lvName(lo.top)}</b> in <b>${esc(lo.s.name)}</b>. Being stronger in one kind of reasoning than another is normal and common \u2014 it's the most useful thing this shows you.</p></div>`;
  }

  let html=`<div class="eyebrow">Your results</div>
    <h1>Nine skills, measured separately</h1><div class="rule"></div>
    ${head}
    <div class="legend">
      <span><i style="background:var(--teal)"></i>Cleared</span>
      <span><i style="background:var(--sage)"></i>Above your grade</span>
      <span><i style="background:#fdf1ec;border:1px solid var(--orange)"></i>Tried, not cleared</span>
      <span><i style="background:#f0ebe0;border:1px solid var(--line)"></i>Not reached</span>
      <span><i style="background:var(--dark);opacity:.35"></i>Your grade's start</span>
    </div>
    <p class="muted" style="margin:-8px 0 20px">Each skill is labelled by how much it rests on: <strong>First impression</strong> (1\u20132 questions), <strong>Provisional</strong> (3\u20134), <strong>Solid</strong> (5+). A longer session moves these up.</p>`;

  const bats=['Verbal','Quantitative','Nonverbal'];
  bats.forEach(bat=>{
    const inBat=rows.filter(r=>r.s.bat===bat);
    if(!inBat.length)return;
    html+=`<div class="bt">${esc(bat)}</div>`;
    inBat.forEach(r=>{
      let vb,vc;
      if(!r.answered){ vb='Not answered'; vc='nd'; }
      else if(!r.top){ vb='Below Level 11'; vc='dn'; }
      else if(r.top>base){ vb='Level '+lvName(r.top)+' \u2191'; vc='up'; }
      else if(r.top===base){ vb='Level '+lvName(r.top); vc='on'; }
      else { vb='Level '+lvName(r.top); vc='dn'; }

      const segs=LV.map(l=>{
        const c=r.per[l];
        let cls='seg', label='L'+lvName(l);
        if(c.ok>0){ cls+=' cl'+(l>base?' above':''); }
        else if(c.n>0){ cls+=' try'; }
        const mark = l===base ? '<span class="startmark"></span>' : '';
        const cnt = c.n>0 ? ` <span style="opacity:.75;font-weight:normal">${c.ok}/${c.n}</span>` : '';
        return `<div class="${cls}">${mark}<span class="st">${label}${cnt}</span></div>`;
      }).join('');

      const sub = !r.answered
        ? `This skill didn't come up in your session.`
        : r.top
          ? `Answered Level ${lvName(r.top)} items correctly${r.top>base?' \u2014 above where your grade starts':''}. Based on ${r.n} question${r.n===1?'':'s'}${r.n<3?' \u2014 a longer session would firm this up':''}.`
          : `No items answered correctly at Level 11 yet. Based on ${r.n} question${r.n===1?'':'s'}.`;

      html+=`<div class="sk">
        <div class="top"><span class="nm">${esc(r.s.name)}${r.answered?`<span class="conf ${r.conf.k}">${r.conf.t}</span>`:''}</span><span class="vb ${vc}">${vb}</span></div>
        <div class="meter">${segs}</div>
        <div class="sub">${sub}</div>
      </div>`;
    });
  });

  html+=`<div class="foot" style="margin-top:24px"><button class="btn orange" id="again">Practice again \u2192</button></div>
    <!-- TICKET 4 — word for word the same paragraph as public/pattern-lab/index.html.
         scripts/check-invariants.js compares the two and fails on any difference. Each
         clause does a specific job (names the mark's owner, disclaims sponsorship,
         disclaims endorsement, states the questions are original, disclaims predictive
         validity). Do not reword it. -->
    <div class="disc" id="cogat-disclaimer">Cognitive Abilities Test™ (CogAT®) is a registered trademark of Riverside Assessments, LLC and its affiliates ("Riverside"). Riverside does not sponsor or endorse any Allgood Academy products or programs, nor has this product been reviewed, certified, or approved by Riverside. Pattern Lab uses original practice materials only, not actual test questions, and is not a predictor of official CogAT results.</div>`;

  card().innerHTML=html;
  document.getElementById('again').onclick=()=>{ tele('restart'); start(); };

  /* Roll-up for THIS visit. Merged onto the session document rather than only written as
     an event, so a later calibration pass can read a whole session in one document.
     Nothing here is a score, a percentile or a prediction — it is per-subtest counts of
     what was served and what was cleared, which is what the levelling question needs. */
  const perSub = {};
  SUBTEST_IDS.forEach(id => {
    const mine = S.log.filter(l => l.sub === id);
    if (!mine.length) return;
    perSub[id] = { served: mine.length, correct: mine.filter(m => m.correct).length };
    [11,12,13].forEach(l => {
      const at = mine.filter(m => m.lvl === l);
      if (at.length) perSub[id]['l' + l] = { served: at.length, correct: at.filter(m => m.correct).length };
    });
  });
  tele('complete', {
    grade: S.grade,
    startLevel: GRADE_LVL[S.grade],
    itemsAnswered: S.log.length,
    itemsPlanned: S.queue.length,
    stoppedEarly: S.log.length < S.queue.length,
    summary: { stream: 'pattern-lab', grade: S.grade, itemsAnswered: S.log.length, bySubtest: perSub },
  });
}

document.getElementById('nav-restart').onclick=()=>{ tele('restart'); start(); };

start();
</script>
</body>
</html>
