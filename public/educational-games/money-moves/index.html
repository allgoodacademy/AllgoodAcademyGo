<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Money Moves — Allgood Academy</title>
<link rel="stylesheet" href="/assets/css/tailwind.min.css">
<script src="/assets/js/lucide.min.js"></script>
<!-- Shared identity module — see /js/auth-core.js. -->
<script type="module" src="/js/auth-core.js"></script>
<!-- Shared identity gate (age question / Sign In / Recruit Code) — see /js/identity-gate.js.
     Loading this does NOT put a login wall on the game: the gate only ever opens when
     something explicitly calls window.AuthGate.offerSave()/ensureIdentified(), same as
     every GoodBlock and the other three games. Here that's the end-screen save offer. -->
<script type="module" src="/js/identity-gate.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Required by /js/identity-gate.js's injected #ag-modal — copied verbatim from the
     other three games. */
  .modal-transition { transition: opacity 0.2s ease-in-out, transform 0.2s ease-in-out; }
  .hidden-modal { opacity: 0; pointer-events: none; transform: translateY(-10px); }
  .visible-modal { opacity: 1; pointer-events: auto; transform: translateY(0); }

  /* Mobile hardening for #ag-modal — same fix as the other three games (a backdrop-filter
     over a busy background is a known cause of an invisible, fully-blocking overlay on
     mobile Safari/Android WebViews). */
  #ag-modal { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
  #ag-modal > div { max-height: 90dvh; max-height: 90vh; overflow-y: auto; }

  :root {
    --teal: #357889;
    --orange: #D34716;
    --cream: #FBF6EE;
    --dark: #0F1923;
    --dark-card: #1C2E3A;
    --muted: #7A909F;
    --warm-white: #F8F4EE;
    --smart: #2E7D52;
    --smart-bg: #E8F5EE;
    --costly: #C0392B;
    --costly-bg: #FDEAEA;
  }

  /* =============================================
     DASHBOARD CHASSIS — copied verbatim from before-you-send/index.html, which itself
     is copied verbatim from public/dashboard/index.html. Do not hand-tune these values
     here — change the dashboard, then re-copy to all four games.
     ============================================= */
  body {
    font-family: Verdana, sans-serif;
    background-color: #0f172a;
    min-height: 100vh;
    min-height: 100dvh;
    position: relative;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  #bg-video-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -50;
    overflow: hidden;
  }

  #bg-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 1.0;
  }

  .tablet-frame {
    height: 88vh;
    width: auto;
    aspect-ratio: 16/10;
    max-width: min(1700px, 94vw);
    max-height: 96vh;
    min-height: 0;
    min-width: 0;
    background-image:
        radial-gradient(circle at 0% 0%, rgba(211, 71, 22, 0.35) 0%, transparent 30%),
        radial-gradient(circle at 100% 100%, rgba(211, 71, 22, 0.35) 0%, transparent 30%),
        linear-gradient(135deg, #5c5c5c 0%, #d6d6d6 25%, #8a8a8a 50%, #e0e0e0 75%, #5c5c5c 100%);
    border-radius: 12px;
    padding: 12px;
    box-shadow:
        inset 1px 1px 2px rgba(255,255,255, 0.6),
        inset -1px -1px 2px rgba(0,0,0, 0.8),
        0 30px 60px -12px rgba(0, 0, 0, 0.8),
        0 0 0 1px #111;
    border: 1px solid #333;
    position: relative;
    margin: 20px auto;
    transition: width 0.3s, height 0.3s, padding 0.3s;
  }

  .tablet-frame::before {
    content: ''; position: absolute; top: 10px; left: 10px; right: 10px; bottom: 10px;
    border-radius: 6px; background: #111; z-index: 0;
  }

  .screen-container {
    width: 100%; height: 100%;
    background-image: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    position: relative; z-index: 1; overflow: hidden;
    display: flex; flex-direction: column;
    border-radius: 4px; box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
  }

  .navbar-content { flex: 0 0 60px; z-index: 30; background: rgba(15, 25, 35, 0.92); backdrop-filter: blur(5px); border-bottom: 1px solid rgba(255,255,255,0.1); color: white; position: relative; }

  @media (max-width: 640px) {
    body {
        padding: 0;
        align-items: flex-start;
        background-image: none;
        background-color: #f8fafc;
    }
    .tablet-frame {
        width: 100vw !important;
        height: 100vh !important;
        height: 100dvh !important;
        max-width: none !important;
        max-height: none !important;
        border-radius: 0 !important;
        border: none !important;
        padding: 0 !important;
        margin: 0 !important;
        box-shadow: none !important;
        background-image: none !important;
        aspect-ratio: auto !important;
    }
    .tablet-frame::before { display: none; }
    .screen-container {
        border-radius: 0 !important;
        box-shadow: none !important;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
    }
    main { padding: 0 !important; }
  }

  /* Home popover — copied verbatim from the other three games */
  .home-popover-wrap { position: relative; }
  .home-popover {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    background: white;
    border-radius: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    padding: 6px;
    min-width: 190px;
    z-index: 50;
  }
  .home-popover.show { display: block; }
  .home-popover button {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 10px 12px;
    border-radius: 6px;
    font-family: Verdana, sans-serif;
    font-size: 0.82rem;
    font-weight: 700;
    color: #0F1923;
    cursor: pointer;
  }
  .home-popover button:hover { background: #f0f0f0; }

  /* --- Game screen: content area inside the chassis --- */
  .mm-page {
    flex: 1 1 auto;
    position: relative;
    overflow-y: auto;
    background: var(--dark);
    color: var(--cream);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 28px 24px;
  }

  /* ── INTRO ── */
  #intro { text-align: center; max-width: 440px; margin: auto 0; }
  #intro h1 { font-family: Georgia, serif; font-size: clamp(2rem,6vw,2.8rem); font-weight: 700; color: var(--cream); line-height: 1.1; margin-bottom: 12px; }
  #intro h1 em { color: var(--orange); font-style: normal; }
  #intro p { font-size: 13px; color: var(--muted); line-height: 1.65; margin-bottom: 28px; }
  .start-btn {
    background: var(--orange); color: white; border: none;
    padding: 14px 40px; border-radius: 50px;
    font-family: Verdana, sans-serif; font-size: 14px; font-weight: 700;
    cursor: pointer; transition: opacity 0.15s, transform 0.1s;
  }
  .start-btn:hover { opacity: 0.9; transform: scale(1.02); }
  .wordmark { font-family: Georgia, serif; font-size: 0.8rem; color: rgba(255,255,255,0.2); margin-top: 16px; letter-spacing: 0.04em; }

  /* ── GAME (no timer — this game is deliberate, not fast) ── */
  #game { display: none; width: 100%; max-width: 540px; margin: auto 0; flex-direction: column; align-items: center; }
  .hud { width: 100%; display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .hud-score { font-size: 13px; color: var(--muted); font-weight: 700; }
  .hud-score span { color: var(--cream); font-size: 18px; }
  .hud-progress { display: flex; gap: 5px; }
  .hud-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.15); transition: background 0.3s; }
  .hud-dot.done { background: var(--teal); }
  .hud-dot.current { background: var(--orange); }

  .scenario-card { background: var(--warm-white); border-radius: 18px; width: 100%; overflow: hidden; margin-bottom: 16px; animation: cardIn 0.3s ease; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .card-header { padding: 14px 18px; border-bottom: 1px solid rgba(0,0,0,0.06); display: flex; align-items: center; gap: 10px; }
  .card-avatar { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .card-meta { flex: 1; min-width: 0; }
  .card-who { font-size: 12px; font-weight: 700; color: #0F1923; }
  .card-context { font-size: 10px; color: #8a9fac; }
  .card-category { font-size: 9px; font-weight: 700; padding: 3px 8px; border-radius: 10px; letter-spacing: 0.04em; white-space: nowrap; }
  .card-body { padding: 18px; }
  .card-situation { font-size: 14px; color: #0F1923; line-height: 1.6; margin-bottom: 12px; font-family: Georgia, serif; }
  .card-detail { font-size: 11px; color: #555; padding: 10px 12px; background: #f0ece6; border-radius: 8px; line-height: 1.55; }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-bottom: 10px; }
  .choice-btn { padding: 16px 12px; border: none; border-radius: 14px; font-family: Verdana, sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; transition: transform 0.1s; display: flex; flex-direction: column; align-items: center; gap: 7px; letter-spacing: 0.01em; }
  .choice-btn:hover { transform: scale(1.03); }
  .choice-btn .icon { font-size: 22px; }
  .btn-smart { background: var(--smart-bg); color: var(--smart); }
  .btn-costly { background: var(--costly-bg); color: var(--costly); }
  .hint { text-align: center; font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }

  /* ── CONSEQUENCE ── */
  #consequence { display: none; width: 100%; max-width: 540px; margin: auto 0; flex-direction: column; align-items: center; }
  .consequence { width: 100%; animation: cardIn 0.4s ease; text-align: center; }
  .consequence-icon { font-size: 44px; margin-bottom: 14px; display: block; }
  .consequence-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; margin-bottom: 10px; }
  .consequence-scene { background: rgba(255,255,255,0.05); border-radius: 14px; padding: 20px; font-size: 13px; color: rgba(255,255,255,0.8); line-height: 1.75; margin-bottom: 14px; text-align: left; font-family: Georgia, serif; }
  .consequence-mechanism { font-size: 11px; color: var(--muted); line-height: 1.65; margin-bottom: 20px; padding: 14px 16px; background: rgba(255,255,255,0.04); border-radius: 12px; text-align: left; }
  .next-btn { background: var(--teal); color: white; border: none; padding: 13px 32px; border-radius: 50px; font-family: Verdana, sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; width: 100%; }

  /* ── END ── */
  #end { display: none; text-align: center; max-width: 440px; margin: auto 0; }
  .end-score { font-family: Georgia, serif; font-size: clamp(3rem,12vw,5rem); font-weight: 700; color: var(--orange); line-height: 1; }
  .end-label { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; font-weight: 700; margin-bottom: 20px; }
  .end-breakdown { width: 100%; background: rgba(255,255,255,0.04); border-radius: 14px; padding: 18px 20px; margin-bottom: 16px; text-align: left; }
  .end-row { display: flex; justify-content: space-between; font-size: 12px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .end-row:last-child { border: none; }
  .end-row-label { color: var(--muted); }
  .end-row-val { font-weight: 700; color: var(--cream); }
  .jodi-moment { width: 100%; background: var(--teal); border-radius: 14px; padding: 18px 20px; margin-bottom: 16px; text-align: left; }
  .jodi-moment-label { font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.5); letter-spacing: 0.08em; margin-bottom: 6px; }
  .jodi-moment-text { font-family: Georgia, serif; font-size: 13px; color: white; line-height: 1.65; font-style: italic; }
  .deeper-card { width: 100%; background: rgba(53,120,137,0.14); border: 1px solid rgba(53,120,137,0.35); border-radius: 14px; padding: 18px 20px; margin-bottom: 16px; text-align: left; }
  .deeper-label { font-size: 10px; font-weight: 700; color: var(--teal); letter-spacing: 0.08em; margin-bottom: 8px; }
  .deeper-msg { font-size: 12px; color: rgba(255,255,255,0.75); line-height: 1.65; margin-bottom: 14px; }
  .deeper-btn { background: var(--teal); color: white; border: none; padding: 12px; border-radius: 50px; font-family: Verdana, sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; width: 100%; }
  .play-again-btn { background: var(--orange); color: white; border: none; padding: 14px; border-radius: 50px; font-family: Verdana, sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; width: 100%; margin-bottom: 8px; }
  .hub-btn { background: transparent; color: var(--cream); border: 1px solid rgba(255,255,255,0.15); padding: 12px; border-radius: 50px; font-family: Verdana, sans-serif; font-size: 12px; cursor: pointer; width: 100%; }
</style>
</head>
<body>

<!-- ORBITAL LINK: Static Feed Injection — same space background as the dashboard -->
<div id="bg-video-container">
  <img id="bg-image" src="https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?q=80&w=1172&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Orbital View">
</div>

<main class="flex-grow flex items-center justify-center py-8">
  <div class="tablet-frame">
    <div class="screen-container" id="screen">

      <header class="navbar-content flex items-center justify-between px-6 shadow-md relative z-30">
        <div class="flex items-center overflow-hidden">
          <div class="flex-shrink-0 text-white font-heading font-bold text-lg tracking-tight truncate select-none uppercase">
            ALLGOOD ACADEMY <span class="opacity-60 text-sm font-normal">| Games</span>
          </div>
        </div>
        <div class="flex items-center space-x-1 shrink-0 relative">
          <div class="home-popover-wrap">
            <button id="btn-home" class="text-gray-200 hover:text-white transition-colors p-2 rounded-full hover:bg-white/10" title="Home" onclick="toggleHomePopover(event)">
              <i data-lucide="home" stroke-width="2.25" class="w-[22px] h-[22px]"></i>
            </button>
            <div class="home-popover" id="home-popover">
              <button onclick="window.AuthGate.guardedLeave(() => { window.location.href='/'; })">Return to dashboard</button>
              <button onclick="window.AuthGate.guardedLeave(handleRestartFromPopover)">Restart game</button>
              <button onclick="window.AuthGate.guardedLeave(() => { window.location.href='/educational-games/'; })">Browse games</button>
              <button onclick="window.location.href='/dashboard/?signin=1'">Already have an account? Sign in</button>
            </div>
          </div>
          <button id="btn-games" class="text-gray-200 hover:text-white transition-colors p-2 rounded-full hover:bg-white/10" title="Browse games" onclick="window.AuthGate.guardedLeave(() => { window.location.href='/educational-games/'; })">
            <i data-lucide="gamepad-2" stroke-width="2.25" class="w-[22px] h-[22px]"></i>
          </button>
        </div>
      </header>

      <div class="mm-page">

<!-- INTRO -->
<div id="intro">
  <div style="font-size:48px;margin-bottom:16px">💸</div>
  <h1>Money <em>Moves.</em></h1>
  <p>10 real money situations. One question each time:<br>Smart move or costly mistake?</p>
  <button class="start-btn" onclick="startGame()">Start</button>
  <div class="wordmark">Allgood Academy · Free for all learners</div>
</div>

<!-- GAME -->
<div id="game">
  <div class="hud">
    <div class="hud-score">Score <span id="scoreVal">0</span></div>
    <div class="hud-progress" id="progressDots"></div>
  </div>
  <div class="scenario-card" id="scenarioCard"></div>
  <div class="choices">
    <button class="choice-btn btn-smart" onclick="choose('smart')">
      <span class="icon">✅</span>Smart Move
    </button>
    <button class="choice-btn btn-costly" onclick="choose('costly')">
      <span class="icon">💸</span>Costly Mistake
    </button>
  </div>
  <div class="hint">Is this a smart move or a costly mistake?</div>
</div>

<!-- CONSEQUENCE -->
<div id="consequence"></div>

<!-- END -->
<div id="end"></div>

      </div>
    </div>
  </div>
</main>

<script>
// answer: 'smart' | 'costly' — the choice the scenario is built to reward.
// category: one of the 9 Money as a Skill categories — used for the Firestore
// telemetry categories map and the end-screen adaptive routing (Ticket 4).
const scenarios = [
  { id:"you-you-just-got-your-first-paycheck", who:"You", avatar:"👤", avatarBg:"#EEF6F9", category:"First Paycheck",
    situation:`You just got your first paycheck — $240 from your part-time job. Your friends are going to Six Flags this weekend. Tickets are $85. You have $0 in savings.`, detail:`You've been wanting to go all summer. Everyone's going.`,
    answer:"costly",
    smart:{ scene:`You tell your friends you'll catch the next one. You put $100 in savings, keep $140 for the month. Three weeks later your car needs a $90 repair. You cover it without asking your parents.`, mechanism:`The first thing you do with money you earn defines a habit. Spending everything before you save means the next emergency finds you empty.` },
    costly:{ scene:`You go. It's a great day. Two weeks later your phone screen cracks. Repair is $120. You have $4 left. You borrow from your mom and don't pay her back until March.`, mechanism:`Spending before saving isn't enjoying your money — it's borrowing against your future self. The fun was real. The debt was realer.` }
  },
  { id:"jordan-a-store-offers-jordan-a-credit", who:"Jordan", avatar:"J", avatarBg:"#f0eeff", category:"Predatory Offer",
    situation:`A store offers Jordan a credit card: 0% interest for 12 months on a $400 gaming setup. After 12 months, interest jumps to 29.99% on any remaining balance.`, detail:`Jordan plans to pay it off 'eventually.' Monthly minimum is $15.`,
    answer:"costly",
    smart:{ scene:`Jordan passes. Saves $35/month for 12 months instead. Buys the setup outright. Owns it with no strings attached.`, mechanism:`0% interest is a timer, not a gift. If you don't pay the full balance before month 13, the interest rate applies retroactively to the original amount in many cases.` },
    costly:{ scene:`Jordan pays the minimum. At month 13, $280 is still owed. The 29.99% rate kicks in. Jordan pays $84 in interest that year — on a purchase that was supposed to be free to finance.`, mechanism:`'0% interest' is one of the most misunderstood financial offers. Read the fine print before you sign anything.` }
  },
  { id:"you-your-cousin-made-800-last-month", who:"You", avatar:"👤", avatarBg:"#EEF6F9", category:"Investment Curiosity",
    situation:`Your cousin made $800 last month on crypto. He says Bitcoin is about to 'go crazy again' and you should put your $300 savings in now.`, detail:`He made money last month. He lost $1,200 the month before that.`,
    answer:"costly",
    smart:{ scene:`You ask one more question: 'What happened the month before?' He gets quiet. You keep your $300. It's not exciting, but it's yours.`, mechanism:`Past gains from a single person are not a strategy. Crypto can rise 40% and fall 60% in the same month. Your $300 emergency fund is worth more than a lottery ticket.` },
    costly:{ scene:`You invest $300. Bitcoin drops 45% in three weeks. Your $300 is now $165. Your cousin says 'just hold it, it'll come back.' You needed that money for your school trip deposit.`, mechanism:`Taking investment advice from someone who isn't accountable for your losses is a costly mistake — even when they mean well.` }
  },
  { id:"alex-the-friend-group-is-planning-a", who:"Alex", avatar:"A", avatarBg:"#E8F5EE", category:"Peer Pressure",
    situation:`The friend group is planning a spring break trip. Cost: $350 each. Alex has $200 saved. Everyone's already committed. Alex doesn't want to be the only one left out.`, detail:`There's a payment plan available: $175 now, $175 in 60 days.`,
    answer:"costly",
    smart:{ scene:`Alex says 'I'm in for next time — I don't have the full amount yet.' Two friends admit they're also stretching. The trip happens. Alex has a good week at home and $200 still in savings.`, mechanism:`FOMO is expensive. The friends who went came back broke and stressed. Alex started summer with a head start.` },
    costly:{ scene:`Alex takes the payment plan. Pays $175 now. 60 days later, the $175 is due. Alex's hours got cut at work. Asks parents. Gets a lecture. Pays late.`, mechanism:`A payment plan is still a commitment. If the money isn't there in 60 days, the plan becomes a debt.` }
  },
  { id:"you-your-job-offers-a-roth-ira", who:"You", avatar:"👤", avatarBg:"#EEF6F9", category:"Long-Term Thinking",
    situation:`Your job offers a Roth IRA option. You're 17. You'd contribute $50/month. You don't really understand what a Roth IRA is.`, detail:`Your manager says 'you won't miss the $50, trust me.'`,
    answer:"smart",
    smart:{ scene:`You sign up. You don't really feel the $50. At 65, assuming average market returns, that $50/month started at 17 is worth over $340,000. You didn't get rich. You just started early.`, mechanism:`Compound interest rewards time more than amount. $50/month at 17 beats $500/month at 40. This is the one financial decision where starting late genuinely costs you.` },
    costly:{ scene:`You pass. $50 feels too important right now. You spend it on nothing specific. At 40 you start contributing. Your balance at 65 is a fraction of what it would have been.`, mechanism:`Retirement feels irrelevant at 17. That's exactly why starting then matters so much. The cost of waiting isn't paid now — it's paid later.` }
  },
  { id:"morgan-morgan-gets-a-student-credit-card", who:"Morgan", avatar:"M", avatarBg:"#FCE4EC", category:"Credit Basics",
    situation:`Morgan gets a student credit card with a $500 limit. Buys $480 in clothes. Makes the minimum payment of $15 next month.`, detail:`Interest rate: 24.99% APR. Morgan figures they'll 'pay it off eventually.'`,
    answer:"costly",
    smart:{ scene:`Morgan uses the card for one $40 purchase, pays it in full that month. Credit score starts building. No interest paid. The card works for Morgan.`, mechanism:`A credit card used correctly is a tool that builds your credit score for free. Used incorrectly, it's a 24.99% loan.` },
    costly:{ scene:`A year later Morgan has paid $180 in minimums. Still owes $390. Has paid $90 in interest. The clothes are worth $0. The debt is still real.`, mechanism:`Minimum payments on high-interest debt are designed to keep you paying as long as possible. The credit card company profits every month you don't pay in full.` }
  },
  { id:"you-you-re-starting-a-job-hr-asks", who:"You", avatar:"👤", avatarBg:"#EEF6F9", category:"Financial Conversations",
    situation:`You're starting a job. HR asks if you want to fill out a W-4. You have no idea what it is. You nod and take the form.`, detail:`You could ask HR to walk you through it — or guess and hope for the best.`,
    answer:"smart",
    smart:{ scene:`You say 'I haven't filled one of these out before — can you walk me through it?' HR spends four minutes explaining. You fill it out correctly and understand what it means. Next time someone asks you about a W-4, you actually know.`, mechanism:`Asking a question costs nothing. Every professional you'll ever work with has answered a basic question for a new employee. Nobody expects you to know everything on day one.` },
    costly:{ scene:`You guess. You fill it out wrong. For months your paycheck is off. You don't know why. You're too embarrassed to ask. It takes your mom three phone calls to HR to sort it out.`, mechanism:`Pretending to understand something you don't is the most common and most costly financial habit. The embarrassment of asking lasts thirty seconds. The cost of not knowing can last much longer.` }
  },
  { id:"sam-sam-is-80-short-on-rent", who:"Sam", avatar:"S", avatarBg:"#FFF3E0", category:"Predatory Offer",

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Ticket 1: enforce ~50/50 smart/costly split per session (5 smart, 5 costly), same
// filter-shuffle-slice pattern as buildSession() in Read the Signal.
function buildMoneySession(pool) {
  const smartBest = shuffle(pool.filter(s => s.answer === 'smart'));
  const costlyBest = shuffle(pool.filter(s => s.answer === 'costly'));
  const picked = [...smartBest.slice(0, 5), ...costlyBest.slice(0, 5)];
  return shuffle(picked);
}

// --- Telemetry (Ticket 2): one game_sessions document per completed session, same
// sessionStorage-UUID + 90-day-TTL pattern as the other three games.
function getSessionId() {
  let id = sessionStorage.getItem('mm_session_id');
  if (!id) {
    id = crypto.randomUUID();
    sessionStorage.setItem('mm_session_id', id);
  }
  return id;
}

async function recordSession() {
  try {
    const AuthCore = window.AuthCore;
    if (!AuthCore) return;

    const { collection, addDoc, serverTimestamp, Timestamp } =
      await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js');

    let user = AuthCore.auth.currentUser;
    if (!user) {
      try { await AuthCore.silentSignIn(); } catch (e) { /* telemetry is best-effort */ }
      user = AuthCore.auth.currentUser;
    }

    let recruitCode = null;
    let studentId = null;
    if (user && !user.isAnonymous) studentId = user.uid;
    if (user) {
      try {
        const account = await AuthCore.getAccount(user.uid);
        if (account && account.recruitCode) recruitCode = account.recruitCode;
      } catch (e) { /* telemetry is best-effort */ }
    }

    const playedAt = new Date();
    const ttl = new Date(playedAt.getTime() + 90 * 24 * 60 * 60 * 1000);
    const correct = scenarioLog.filter(s => s.correct).length;

    await addDoc(collection(AuthCore.db, 'game_sessions'), {
      game: 'money-moves',
      sessionId: getSessionId(),
      recruitCode,
      studentId,
      playedAt: serverTimestamp(),
      ttl: Timestamp.fromDate(ttl),
      scenariosPlayed: scenarioLog.length,
      correct,
      categories: categoryStats
    });
  } catch (e) {
    console.warn('Money Moves telemetry write failed', e);
  }
}

function startGame() {
  window._agSaveOffered = false;
  window._agCompletionReached = false;
  session = buildMoneySession(scenarios);
  currentIdx = 0; score = 0;

  scenarioLog = [];

    <div class="card-header">
      <div class="card-avatar" style="background:${s.avatarBg}">${s.avatar}</div>
      <div class="card-meta">
        <div class="card-who">${s.who}</div>
        <div class="card-context">${s.category}</div>
      </div>
      <span class="card-category" style="background:${s.avatarBg};color:#0F1923">${s.category}</span>
    </div>
    <div class="card-body">
      <div class="card-situation">${s.situation}</div>
      ${s.detail ? `<div class="card-detail">${s.detail}</div>` : ''}
    </div>
  `;
}

function choose(pick) {
  const s = session[currentIdx];
  const correct = pick === s.answer;

  if (!categoryStats[s.category]) categoryStats[s.category] = { played: 0, correct: 0 };
  categoryStats[s.category].played++;
  if (correct) { categoryStats[s.category].correct++; score += 10; }

  scenarioLog.push({ id: s.id, category: s.category, correct });

  const data = pick === 'smart' ? s.smart : s.costly;
  showConsequence(data, correct, pick);
}

function showConsequence(data, correct, pick) {
  show('consequence');
  const el = document.getElementById('consequence');

  let verdictIcon, verdictText, verdictColor;
  if (correct && pick === 'smart') {
    verdictIcon = '✅'; verdictText = 'Good read — that was the smart move.'; verdictColor = '#2E7D52';
  } else if (correct && pick === 'costly') {
    verdictIcon = '✅'; verdictText = 'Good read — you spotted the costly mistake.'; verdictColor = '#2E7D52';
  } else if (!correct && pick === 'smart') {
    verdictIcon = '❌'; verdictText = 'Not quite — that one cost more than it looked.'; verdictColor = '#C0392B';
  } else {
    verdictIcon = '❌'; verdictText = 'Not quite — that was actually the smart move.'; verdictColor = '#C0392B';
  }

  el.innerHTML = `
    <div class="consequence">
      <span class="consequence-icon">${verdictIcon}</span>
      <div class="consequence-label" style="color:${verdictColor}">${verdictText}</div>
      <div class="consequence-scene">${data.scene}</div>
      <div class="consequence-mechanism">${data.mechanism}</div>
      <button class="next-btn" onclick="nextScenario()">${currentIdx < session.length - 1 ? 'Next situation →' : 'See results'}</button>
    </div>
  `;
}

function nextScenario() {
  currentIdx++;
  if (currentIdx >= session.length) {
    showEnd();
  } else {
    show('game');
    renderScenario();
  }
}

// Ticket 4: route to the GoodBlock matching this session's weakest category.
const DEEPER_MESSAGES = {
  'Predatory Offer': "Predatory offers caught you. The Money as a Skill lab breaks down exactly how 0% interest, payday loans, and payment plans actually work.",
  'Investment Curiosity': "Investment decisions were your toughest calls. The Money as a Skill lab teaches you how to think about risk before anyone asks you to put money in.",
  'Peer Pressure': "Peer pressure around money is real and expensive. The Money as a Skill lab covers making calls when everyone else is going a different direction.",
  'Taking Ownership': "Taking ownership of your financial literacy is the first skill. The Money as a Skill lab is exactly where to start building it seriously."
};
const DEFAULT_DEEPER_MSG = "The Money as a Skill lab goes deeper on the decisions you just practiced — with Jodi walking you through the real cost of each call.";

function showEnd() {
  show('end');
  const el = document.getElementById('end');
  const jodi = jodiMoments[Math.floor(Math.random() * jodiMoments.length)];
  const correctCount = scenarioLog.filter(s => s.correct).length;
  const rating = score >= 80 ? 'Money-smart' : score >= 60 ? 'Getting there' : 'Time to learn';

  const withAccuracy = Object.entries(categoryStats)
    .filter(([, s]) => s.played - s.correct > 0)
    .map(([cat, s]) => [cat, s.correct / s.played]);
  const worst = withAccuracy.length ? withAccuracy.sort((a, b) => a[1] - b[1])[0] : null;
  const deeperMsg = worst ? (DEEPER_MESSAGES[worst[0]] || DEFAULT_DEEPER_MSG) : DEFAULT_DEEPER_MSG;

  el.innerHTML = `
    <div class="end-score">${score}</div>
    <div class="end-label">OUT OF 100</div>
    <div class="end-breakdown">
      <div class="end-row"><span class="end-row-label">Situations reviewed</span><span class="end-row-val">${session.length}</span></div>
      <div class="end-row" style="margin-top:4px"><span class="end-row-label">Your read</span><span class="end-row-val">${rating}</span></div>
    </div>
    <div class="jodi-moment">
      <div class="jodi-moment-label">HEY Y'ALL 💛 FROM JODI</div>
      <div class="jodi-moment-text">"${jodi}"</div>
    </div>
    <div class="deeper-card">
      <div class="deeper-label">WANT TO GO DEEPER?</div>
      <div class="deeper-msg">${deeperMsg}</div>
      <button class="deeper-btn" onclick="window.AuthGate.guardedLeave(() => { window.location.href='${deeperLink}'; })">Try the Money as a Skill Lab →</button>
    </div>
    <button class="play-again-btn" onclick="window.AuthGate.guardedLeave(restartGame)">Play again</button>
    <button class="hub-btn" onclick="window.AuthGate.guardedLeave(() => { window.location.href='/educational-games/'; })">Browse more games</button>
    <div class="wordmark" style="margin-top:16px">Allgood Academy · Free for all learners, always.</div>
  `;

  recordSession();

  // Same shared save/claim offer as the other three games (window.AuthGate.offerSave()) —
  // one save flow across the site instead of a bespoke one for each game.
  window._agCompletionReached = true;
  if (!window._agSaveOffered && window.AuthGate && window.AuthGate.offerSave) {
    window._agSaveOffered = true;
    setTimeout(() => {
      window.AuthGate.offerSave().catch((e) => console.error('[MoneyMoves] offerSave failed', e));
    }, 1200);
  }
}

function restartGame() { startGame(); }

function toggleHomePopover(event) {
  event.stopPropagation();
  document.getElementById('home-popover').classList.toggle('show');
}

function closeHomePopover() {
  document.getElementById('home-popover').classList.remove('show');
}

document.addEventListener('click', (e) => {
  const wrap = document.querySelector('.home-popover-wrap');
  if (wrap && !wrap.contains(e.target)) closeHomePopover();
});

function handleRestartFromPopover() {
  closeHomePopover();
  if (document.getElementById('game').style.display === 'flex' ||
      document.getElementById('consequence').style.display === 'flex' ||
      document.getElementById('end').style.display === 'flex') {
    restartGame();
  } else {
    startGame();
  }
}

if (window.lucide) lucide.createIcons();
document.addEventListener('DOMContentLoaded', () => { if (window.lucide) lucide.createIcons(); });
</script>
</body>
</html>
