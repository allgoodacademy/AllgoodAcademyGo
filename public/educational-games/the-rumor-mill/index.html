<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Rumor Mill — Allgood Academy</title>
<link rel="stylesheet" href="/assets/css/tailwind.min.css">
<script src="/assets/js/lucide.min.js"></script>
<!-- Shared identity module — see /js/auth-core.js. -->
<script type="module" src="/js/auth-core.js"></script>
<!-- Shared identity gate (age question / Sign In / Recruit Code) — see /js/identity-gate.js.
     Loading this does NOT put a login wall on the game: the gate only ever opens when
     something explicitly calls window.AuthGate.offerSave()/ensureIdentified(), same as
     every GoodBlock, Read the Signal, and Before You Send. Here that's the end-screen
     save offer. -->
<script type="module" src="/js/identity-gate.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Required by /js/identity-gate.js's injected #ag-modal — copied verbatim from
     read-the-signal/index.html and before-you-send/index.html. */
  .modal-transition { transition: opacity 0.2s ease-in-out, transform 0.2s ease-in-out; }
  .hidden-modal { opacity: 0; pointer-events: none; transform: translateY(-10px); }
  .visible-modal { opacity: 1; pointer-events: auto; transform: translateY(0); }

  /* Mobile hardening for #ag-modal — same fix as the other two games (a backdrop-filter
     over a busy background is a known cause of an invisible, fully-blocking overlay on
     mobile Safari/Android WebViews). */
  #ag-modal { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
  #ag-modal > div { max-height: 90dvh; max-height: 90vh; overflow-y: auto; }

  :root {
    --teal: #357889;
    --orange: #D34716;
    --cream: #FBF6EE;
    --dark: #0F1923;
    --dark-card: #1C2E3A;
    --muted: #7A909F;
    --warm-white: #F8F4EE;
    --true-color: #2E7D52;
    --false-color: #C0392B;
  }

  /* =============================================
     DASHBOARD CHASSIS — copied verbatim from before-you-send/index.html, which itself
     is copied verbatim from public/dashboard/index.html. Do not hand-tune these values
     here — change the dashboard, then re-copy to all three games.
     ============================================= */
  body {
    font-family: Verdana, sans-serif;
    background-color: #0f172a;
    min-height: 100vh;
    min-height: 100dvh;
    position: relative;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  #bg-video-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -50;
    overflow: hidden;
  }

  #bg-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 1.0;
  }

  .tablet-frame {
    height: 88vh;
    width: auto;
    aspect-ratio: 16/10;
    max-width: min(1700px, 94vw);
    max-height: 96vh;
    min-height: 0;
    min-width: 0;
    background-image:
        radial-gradient(circle at 0% 0%, rgba(211, 71, 22, 0.35) 0%, transparent 30%),
        radial-gradient(circle at 100% 100%, rgba(211, 71, 22, 0.35) 0%, transparent 30%),
        linear-gradient(135deg, #5c5c5c 0%, #d6d6d6 25%, #8a8a8a 50%, #e0e0e0 75%, #5c5c5c 100%);
    border-radius: 12px;
    padding: 12px;
    box-shadow:
        inset 1px 1px 2px rgba(255,255,255, 0.6),
        inset -1px -1px 2px rgba(0,0,0, 0.8),
        0 30px 60px -12px rgba(0, 0, 0, 0.8),
        0 0 0 1px #111;
    border: 1px solid #333;
    position: relative;
    margin: 20px auto;
    transition: width 0.3s, height 0.3s, padding 0.3s;
  }

  .tablet-frame::before {
    content: ''; position: absolute; top: 10px; left: 10px; right: 10px; bottom: 10px;
    border-radius: 6px; background: #111; z-index: 0;
  }

  .screen-container {
    width: 100%; height: 100%;
    background-image: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    position: relative; z-index: 1; overflow: hidden;
    display: flex; flex-direction: column;
    border-radius: 4px; box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
  }

  .navbar-content { flex: 0 0 60px; z-index: 30; background: rgba(15, 25, 35, 0.92); backdrop-filter: blur(5px); border-bottom: 1px solid rgba(255,255,255,0.1); color: white; position: relative; }

  @media (max-width: 640px) {
    body {
        padding: 0;
        align-items: flex-start;
        background-image: none;
        background-color: #f8fafc;
    }
    .tablet-frame {
        width: 100vw !important;
        height: 100vh !important;
        height: 100dvh !important;
        max-width: none !important;
        max-height: none !important;
        border-radius: 0 !important;
        border: none !important;
        padding: 0 !important;
        margin: 0 !important;
        box-shadow: none !important;
        background-image: none !important;
        aspect-ratio: auto !important;
    }
    .tablet-frame::before { display: none; }
    .screen-container {
        border-radius: 0 !important;
        box-shadow: none !important;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
    }
    main { padding: 0 !important; }
  }

  /* Home popover — copied verbatim from the other two games */
  .home-popover-wrap { position: relative; }
  .home-popover {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    background: white;
    border-radius: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    padding: 6px;
    min-width: 190px;
    z-index: 50;
  }
  .home-popover.show { display: block; }
  .home-popover button {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 10px 12px;
    border-radius: 6px;
    font-family: Verdana, sans-serif;
    font-size: 0.82rem;
    font-weight: 700;
    color: #0F1923;
    cursor: pointer;
  }
  .home-popover button:hover { background: #f0f0f0; }

  /* --- Game screen: content area inside the chassis --- */
  .trm-page {
    flex: 1 1 auto;
    position: relative;
    overflow-y: auto;
    background: var(--dark);
    color: var(--cream);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 28px 24px;
  }

  /* ── INTRO ── */
  #intro { text-align: center; max-width: 440px; margin: auto 0; }
  #intro h1 { font-family: Georgia, serif; font-size: clamp(2rem,6vw,2.8rem); font-weight: 700; color: var(--cream); line-height: 1.1; margin-bottom: 12px; }
  #intro h1 em { color: var(--orange); font-style: normal; }
  #intro p { font-size: 13px; color: var(--muted); line-height: 1.65; margin-bottom: 28px; }
  .start-btn {
    background: var(--orange); color: white; border: none;
    padding: 14px 40px; border-radius: 50px;
    font-family: Verdana, sans-serif; font-size: 14px; font-weight: 700;
    cursor: pointer; transition: opacity 0.15s, transform 0.1s;
  }
  .start-btn:hover { opacity: 0.9; transform: scale(1.02); }
  .wordmark { font-family: Georgia, serif; font-size: 0.8rem; color: rgba(255,255,255,0.2); margin-top: 16px; letter-spacing: 0.04em; }

  /* ── GAME ── */
  #game { display: none; width: 100%; max-width: 560px; margin: auto 0; flex-direction: column; align-items: center; }

  /* Network visualization */
  .network { width: 100%; height: 110px; position: relative; margin-bottom: 14px; flex-shrink: 0; }
  .network svg { width: 100%; height: 100%; }
  .node-circle { fill: rgba(255,255,255,0.08); stroke: rgba(255,255,255,0.15); stroke-width: 1.5; transition: all 0.4s; }
  .node-circle.you { fill: rgba(53,120,137,0.3); stroke: var(--teal); stroke-width: 2; }
  .node-circle.lit-true { fill: rgba(46,125,82,0.4); stroke: var(--true-color); stroke-width: 2; }
  .node-circle.lit-false { fill: rgba(192,57,43,0.4); stroke: var(--false-color); stroke-width: 2; }
  .node-circle.lit-stopped { fill: rgba(255,255,255,0.15); stroke: rgba(255,255,255,0.4); stroke-width: 2; }
  .node-label { fill: rgba(255,255,255,0.4); font-size: 9px; font-family: Verdana,sans-serif; text-anchor: middle; }
  .node-label.you-label { fill: var(--teal); font-weight: 700; }
  .edge { stroke: rgba(255,255,255,0.08); stroke-width: 1; transition: stroke 0.4s; }
  .edge.active-true { stroke: var(--true-color); stroke-width: 1.5; opacity: 0.6; }
  .edge.active-false { stroke: var(--false-color); stroke-width: 1.5; opacity: 0.6; }
  .edge.active-stopped { stroke: rgba(255,255,255,0.35); stroke-width: 1.5; opacity: 0.6; }

  .hud { width: 100%; display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .hud-score { font-size: 13px; color: var(--muted); font-weight: 700; }
  .hud-score span { color: var(--cream); font-size: 18px; }
  .hud-progress { display: flex; gap: 5px; }
  .hud-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.15); transition: background 0.3s; }
  .hud-dot.done { background: var(--teal); }
  .hud-dot.current { background: var(--orange); }

  .countdown-bar { width: 100%; height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; margin-bottom: 14px; overflow: hidden; }
  .countdown-fill { height: 100%; border-radius: 2px; background: var(--teal); transition: width 1s linear, background 0.5s; }
  .countdown-fill.urgent { background: #e74c3c; }

  .msg-card { background: var(--warm-white); border-radius: 20px; width: 100%; overflow: hidden; margin-bottom: 14px; animation: cardIn 0.3s ease; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .msg-header { padding: 12px 16px; border-bottom: 1px solid rgba(0,0,0,0.06); display: flex; align-items: center; gap: 10px; }
  .msg-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; color: white; }
  .msg-meta { flex: 1; min-width: 0; }
  .msg-sender { font-size: 13px; font-weight: 700; color: #0F1923; }
  .msg-sub { font-size: 10px; color: #8a9fac; }
  .forward-count { display: flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 10px; flex-shrink: 0; white-space: nowrap; }
  .fc-low { background: #f0f4f6; color: #7A909F; }
  .fc-mid { background: #FFF3E0; color: #E65100; }
  .fc-high { background: #FDEAEA; color: #C0392B; }
  .msg-body { padding: 14px 16px; font-size: 14px; color: #1a1a1a; line-height: 1.6; }
  .msg-claim { font-weight: 700; color: #0F1923; margin-bottom: 6px; }
  .msg-detail { font-size: 11px; color: #555; margin-top: 8px; padding: 8px 10px; background: #f0ece6; border-radius: 6px; font-style: italic; }
  .msg-source { display: flex; align-items: center; gap: 5px; margin-top: 8px; font-size: 10px; color: #8a9fac; }

  .verify-panel { display: none; background: var(--dark-card); border-radius: 14px; width: 100%; padding: 16px; margin-bottom: 14px; animation: cardIn 0.25s ease; }
  .verify-label { font-size: 10px; font-weight: 700; color: var(--teal); letter-spacing: 0.06em; margin-bottom: 8px; }
  .verify-result { font-size: 13px; color: var(--cream); line-height: 1.6; }
  .verify-loading { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
  .verify-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); animation: vdot 1s ease-in-out infinite; }
  .verify-dot:nth-child(2) { animation-delay: 0.2s; }
  .verify-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes vdot { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }

  .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; width: 100%; }
  .action-btn { padding: 16px 8px; border: none; border-radius: 14px; font-family: Verdana, sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; transition: transform 0.1s, opacity 0.1s; display: flex; flex-direction: column; align-items: center; gap: 7px; letter-spacing: 0.02em; }
  .action-btn:hover { transform: scale(1.03); }
  .action-btn svg { width: 20px; height: 20px; }
  .btn-forward { background: #fff3f0; color: var(--orange); }
  .btn-verify { background: #EEF6F9; color: var(--teal); }
  .btn-verify.verifying { opacity: 0.6; cursor: not-allowed; }
  .btn-verify.done { background: #e8f5ee; color: var(--true-color); }
  .btn-stop { background: #f0f4f6; color: #555; }

  /* ── CONSEQUENCE ── */
  #consequence { display: none; width: 100%; max-width: 560px; margin: auto 0; flex-direction: column; align-items: center; }
  .consequence { width: 100%; animation: cardIn 0.4s ease; text-align: center; }
  .consequence-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; margin-bottom: 12px; }
  .consequence-scene { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 24px; font-size: 14px; color: rgba(255,255,255,0.75); line-height: 1.75; margin-bottom: 16px; text-align: left; font-family: Georgia, serif; }
  .consequence-mechanism { font-size: 12px; color: var(--muted); line-height: 1.7; margin-bottom: 20px; padding: 14px 16px; background: rgba(255,255,255,0.04); border-radius: 12px; text-align: left; }
  .next-btn { background: var(--teal); color: white; border: none; padding: 14px 36px; border-radius: 50px; font-family: Verdana, sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; width: 100%; transition: opacity 0.15s; }
  .next-btn:hover { opacity: 0.9; }

  /* ── END ── */
  #end { display: none; text-align: center; max-width: 440px; margin: auto 0; }
  .end-score { font-family: Georgia, serif; font-size: clamp(3.5rem,12vw,5rem); font-weight: 700; color: var(--orange); line-height: 1; }
  .end-label { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; font-weight: 700; margin-bottom: 20px; }
  .end-breakdown { width: 100%; background: rgba(255,255,255,0.04); border-radius: 14px; padding: 18px 20px; margin-bottom: 20px; text-align: left; }
  .end-row { display: flex; justify-content: space-between; font-size: 12px; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .end-row:last-child { border: none; }
  .end-row-label { color: var(--muted); }
  .end-row-val { font-weight: 700; color: var(--cream); }
  .jodi-moment { width: 100%; background: var(--teal); border-radius: 14px; padding: 18px 20px; margin-bottom: 20px; text-align: left; }
  .jodi-moment-label { font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.5); letter-spacing: 0.08em; margin-bottom: 6px; }
  .jodi-moment-text { font-family: Georgia, serif; font-size: 13px; color: white; line-height: 1.65; font-style: italic; }
  .deeper-card { width: 100%; background: rgba(53,120,137,0.14); border: 1px solid rgba(53,120,137,0.35); border-radius: 14px; padding: 18px 20px; margin-bottom: 20px; text-align: left; }
  .deeper-label { font-size: 10px; font-weight: 700; color: var(--teal); letter-spacing: 0.08em; margin-bottom: 8px; }
  .deeper-msg { font-size: 12px; color: rgba(255,255,255,0.75); line-height: 1.65; margin-bottom: 14px; }
  .deeper-btn { background: var(--teal); color: white; border: none; padding: 12px; border-radius: 50px; font-family: Verdana, sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; width: 100%; }
  .play-again-btn { background: var(--orange); color: white; border: none; padding: 14px; border-radius: 50px; font-family: Verdana, sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; width: 100%; margin-bottom: 8px; }
  .hub-btn { background: transparent; color: var(--cream); border: 1px solid rgba(255,255,255,0.15); padding: 12px; border-radius: 50px; font-family: Verdana, sans-serif; font-size: 12px; cursor: pointer; width: 100%; }
</style>
</head>
<body>

<!-- ORBITAL LINK: Static Feed Injection — same space background as the dashboard -->
<div id="bg-video-container">
  <img id="bg-image" src="https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?q=80&w=1172&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Orbital View">
</div>

<main class="flex-grow flex items-center justify-center py-8">
  <div class="tablet-frame">
    <div class="screen-container" id="screen">

      <header class="navbar-content flex items-center justify-between px-6 shadow-md relative z-30">
        <div class="flex items-center overflow-hidden">
          <div class="flex-shrink-0 text-white font-heading font-bold text-lg tracking-tight truncate select-none uppercase">
            ALLGOOD ACADEMY <span class="opacity-60 text-sm font-normal">| Games</span>
          </div>
        </div>
        <div class="flex items-center space-x-1 shrink-0 relative">
          <div class="home-popover-wrap">
            <button id="btn-home" class="text-gray-200 hover:text-white transition-colors p-2 rounded-full hover:bg-white/10" title="Home" onclick="toggleHomePopover(event)">
              <i data-lucide="home" stroke-width="2.25" class="w-[22px] h-[22px]"></i>
            </button>
            <div class="home-popover" id="home-popover">
              <button onclick="window.AuthGate.guardedLeave(() => { window.location.href='/'; })">Return to dashboard</button>
              <button onclick="window.AuthGate.guardedLeave(handleRestartFromPopover)">Restart game</button>
              <button onclick="window.AuthGate.guardedLeave(() => { window.location.href='/educational-games/'; })">Browse games</button>
              <button onclick="window.location.href='/dashboard/?signin=1'">Already have an account? Sign in</button>
            </div>
          </div>
          <button id="btn-games" class="text-gray-200 hover:text-white transition-colors p-2 rounded-full hover:bg-white/10" title="Browse games" onclick="window.AuthGate.guardedLeave(() => { window.location.href='/educational-games/'; })">
            <i data-lucide="gamepad-2" stroke-width="2.25" class="w-[22px] h-[22px]"></i>
          </button>
        </div>
      </header>

      <div class="trm-page">

<!-- INTRO -->
<div id="intro">
  <div style="font-size:48px;margin-bottom:16px">🌀</div>
  <h1>The Rumor <em>Mill.</em></h1>
  <p>10 messages. Forward it, verify it, or stop it here.<br>Everything you forward spreads — truth and damage alike.</p>
  <button class="start-btn" onclick="startGame()">Start</button>
  <div class="wordmark">Allgood Academy · Free for all learners</div>
</div>

<!-- GAME -->
<div id="game">
  <div class="network" id="network"></div>
  <div class="hud">
    <div class="hud-score">Score <span id="scoreVal">0</span></div>
    <div class="hud-progress" id="progressDots"></div>
  </div>
  <div class="countdown-bar"><div class="countdown-fill" id="timerFill" style="width:100%"></div></div>
  <div class="msg-card" id="msgCard"></div>
  <div class="verify-panel" id="verifyPanel"></div>
  <div class="actions">
    <button class="action-btn btn-forward" onclick="choose('forward')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2L15 22 11 13 2 9l20-7z"/></svg>
      Forward
    </button>
    <button class="action-btn btn-verify" id="verifyBtn" onclick="doVerify()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      Verify
    </button>
    <button class="action-btn btn-stop" onclick="choose('stop')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      Stop it
    </button>
  </div>
</div>

<!-- CONSEQUENCE -->
<div id="consequence"></div>

<!-- END -->
<div id="end"></div>

      </div>
    </div>
  </div>
</main>

<script>
// truth: whether the claim is real. category: misinformation | accuracy | reputation —
// used for Firestore telemetry only (no on-screen breakdown, same scope as Before You Send).
const scenarios = [
  { id:"unknown-breaking-lincoln-high-is-cancelling", sender:"Unknown", avatarColor:"#8a9fac", avatarText:"?",
    sub:`Forwarded 47 times · Unknown source`, forwardCount:47,
    claim:`BREAKING: Lincoln High is cancelling finals this semester due to a 'grading system error.' Admin confirmed it this morning.`, detail:`No link. No screenshot. Just a claim.`, source:`Anonymous · 0 followers`,
    truth:false,
    verifyResult:`The Lincoln High website shows no announcement. The district's official Twitter posted this morning about a normal exam schedule.`,
    forward:{ scene:`The message reaches 847 people by afternoon. Students skip studying. Finals happen as scheduled. Three people fail who would have passed.`, mechanism:`Virality isn't verification. The message spread because it was exciting, not because it was true.` },
    stop:{ scene:`You don't forward it. Two people who got it from other sources ask you about it. You say you're not sure it's real. They check. It isn't.`, mechanism:`Stopping a message at your node isn't doing nothing. It's doing the right thing.` },
    category:"misinformation"
  },
  { id:"maya-chen-psa-there-s-a-guy-following", sender:"Maya Chen", avatarColor:"#357889", avatarText:"M",
    sub:`Forwarded 3 times · Friend`, forwardCount:3,
    claim:`PSA: There's a guy following students home from the bus stop on Oak Street. Two people reported it to the school already. Stay safe.`, detail:`Sent from a friend you trust.`, source:`Maya Chen · 312 followers`,
    truth:true,
    verifyResult:`The school sent an alert two hours later confirming the report and advising students to walk in groups.`,
    forward:{ scene:`More students see it. Several change their routes. The person is identified and reported to police the next day.`, mechanism:`Some information spreads because it should. This was safety-relevant and accurate.` },
    stop:{ scene:`You stop it. Students who use that bus stop don't know. Two more incidents happen that week.`, mechanism:`Stopping accurate safety information causes real harm. Verify before you stop — this one was worth forwarding.` },
    category:"accuracy"
  },
  { id:"sports-insider-22-your-school-s-football-coach-jus", sender:"Sports_Insider_22", avatarColor:"#D34716", avatarText:"SI",
    sub:`Forwarded 124 times · Account you don't follow`, forwardCount:124,
    claim:`Your school's football coach just got fired for stealing from the booster fund. My cousin works there and confirmed it.`, detail:`No news source. No school statement.`, source:`Sports_Insider_22 · Account created 3 weeks ago`,

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Ticket 5: enforce ~50/50 true/false split per session (5 true, 5 false), same
// filter-shuffle-slice pattern as buildSession() in Read the Signal.
function buildRumorSession(pool) {
  const trueBest = shuffle(pool.filter(s => s.truth));
  const falseBest = shuffle(pool.filter(s => !s.truth));
  const picked = [...trueBest.slice(0, 5), ...falseBest.slice(0, 5)];
  return shuffle(picked);
}

function fcClassFor(n) {
  return n < 10 ? 'fc-low' : n < 100 ? 'fc-mid' : 'fc-high';
}

// --- Telemetry: one game_sessions document per completed session, same
// sessionStorage-UUID + 90-day-TTL pattern as the other two games.
function getSessionId() {
  let id = sessionStorage.getItem('trm_session_id');
  if (!id) {
    id = crypto.randomUUID();
    sessionStorage.setItem('trm_session_id', id);
  }
  return id;
}

async function recordSession() {
  try {
    const AuthCore = window.AuthCore;
    if (!AuthCore) return;

    const { collection, addDoc, serverTimestamp, Timestamp } =
      await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js');

    let user = AuthCore.auth.currentUser;
    if (!user) {
      try { await AuthCore.silentSignIn(); } catch (e) { /* telemetry is best-effort */ }
      user = AuthCore.auth.currentUser;
    }

    let recruitCode = null;
    let studentId = null;
    if (user && !user.isAnonymous) studentId = user.uid;
    if (user) {
      try {
        const account = await AuthCore.getAccount(user.uid);
        if (account && account.recruitCode) recruitCode = account.recruitCode;
      } catch (e) { /* telemetry is best-effort */ }
    }

    const playedAt = new Date();
    const ttl = new Date(playedAt.getTime() + 90 * 24 * 60 * 60 * 1000);
    const correct = scenarioLog.filter(s => s.correct).length;

    await addDoc(collection(AuthCore.db, 'game_sessions'), {
      game: 'the-rumor-mill',
      sessionId: getSessionId(),
      recruitCode,
      studentId,
      playedAt: serverTimestamp(),
      ttl: Timestamp.fromDate(ttl),
      scenariosPlayed: scenarioLog.length,
      correct,
      choices: choiceTally,
      misinfoForwarded,
      truthStopped,
      verifyUsed: verifyUsedCount,
      scenarios: scenarioLog
    });
  } catch (e) {
    console.warn('The Rumor Mill telemetry write failed', e);
  }
}

function renderNetwork(action, truth) {
  const el = document.getElementById('network');
  if (!el) return;
  const W = 560, H = 110;
  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;

  edges.forEach(([a, b]) => {
    const pa = nodePositions[a], pb = nodePositions[b];
    let cls = 'edge';
    if (action === 'forward' && a >= 1) cls += truth ? ' active-true' : ' active-false';
    if (action === 'stop' && a >= 1) cls += ' active-stopped';
    svg += `<line class="${cls}" x1="${pa.x}" y1="${pa.y}" x2="${pb.x}" y2="${pb.y}"/>`;
  });

  nodePositions.forEach((n, i) => {
    let circleCls = 'node-circle';
    if (n.you) circleCls += ' you';
    else if (action === 'forward' && i >= 1) circleCls += truth ? ' lit-true' : ' lit-false';
    else if (action === 'stop' && i >= 1) circleCls += ' lit-stopped';
    const labelCls = n.you ? 'node-label you-label' : 'node-label';
    svg += `<circle class="${circleCls}" cx="${n.x}" cy="${n.y}" r="13"/>`;
    if (n.label) svg += `<text class="${labelCls}" x="${n.x}" y="${n.y + 4}">${n.label}</text>`;
  });

  svg += '</svg>';
  el.innerHTML = svg;
}

function startTimer() {
  clearInterval(timer);
  timeLeft = 30;
  const fill = document.getElementById('timerFill');
  fill.style.width = '100%';
  fill.className = 'countdown-fill';
  timer = setInterval(() => {
    timeLeft--;
    fill.style.width = (timeLeft / 30 * 100) + '%';
    if (timeLeft <= 10) fill.className = 'countdown-fill urgent';
    if (timeLeft <= 0) { clearInterval(timer); choose('forward'); } // auto-forward on timeout — impulsive!
  }, 1000);
}

function doVerify() {
  if (verifying || verified) return;
  verifying = true;
  verifyUsedCount++;
  const vBtn = document.getElementById('verifyBtn');
  vBtn.className = 'action-btn btn-verify verifying';
  vBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>Checking...`;

  const panel = document.getElementById('verifyPanel');
  panel.style.display = 'block';
  panel.innerHTML = `<div class="verify-label">VERIFYING</div><div class="verify-loading"><div class="verify-dot"></div><div class="verify-dot"></div><div class="verify-dot"></div></div>`;

  // Pause the timer during verify — resumes below with 12 seconds left. 1.5s rather
  // than a longer wait: the timer is paused either way, but this still needs to read
  // as "checking something real," just not slow enough to feel like a load stall.
  clearInterval(timer);

  setTimeout(() => {
    verified = true; verifying = false;
    const s = session[currentIdx];
    panel.innerHTML = `<div class="verify-label">FACT CHECK</div><div class="verify-result">${s.verifyResult}</div>`;
    vBtn.className = 'action-btn btn-verify done';
    vBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px"><polyline points="20 6 9 17 4 12"/></svg>Verified`;
    timeLeft = 12;
    const fill = document.getElementById('timerFill');
    fill.style.width = (12 / 30 * 100) + '%';
    fill.className = 'countdown-fill urgent';
    timer = setInterval(() => {
      timeLeft--;
      fill.style.width = (timeLeft / 30 * 100) + '%';
      if (timeLeft <= 0) { clearInterval(timer); choose('forward'); }
    }, 1000);
  }, 1500);
}

function choose(action) {
  clearInterval(timer);
  const s = session[currentIdx];
  const data = action === 'forward' ? s.forward : s.stop;
  const timeUsed = 30 - timeLeft;

  // Scoring: +10 for correct call, +3 for incorrect call after verifying
  // (you had the information and still got it wrong).
  let correct = false;
  if (action === 'forward' && s.truth) { correct = true; score += 10; }
  else if (action === 'stop' && !s.truth) { correct = true; score += 10; }
  else if (verified) { score += 3; }

  choiceTally[action] = (choiceTally[action] || 0) + 1;
  if (action === 'forward' && !s.truth) misinfoForwarded++;
  if (action === 'stop' && s.truth) truthStopped++;

  scenarioLog.push({ id: s.id, truth: s.truth, choice: action, correct, verifyUsed: verified, timeUsed });

  showConsequence(data, action, s.truth);
}

function showConsequence(data, action, truth) {
  show('consequence');
  const el = document.getElementById('consequence');
  const actionColor = action === 'forward' ? (truth ? '#2E7D52' : '#C0392B') : '#7A909F';
  const actionLabel = action === 'forward' ? (truth ? 'Forwarded — and it was true.' : 'Forwarded — and it was false.') : 'Stopped here.';

  el.innerHTML = `
    <div class="consequence">
      <div class="network" id="consequenceNetwork"></div>
      <div class="consequence-label" style="color:${actionColor}">${actionLabel}</div>
      <div class="consequence-scene">${data.scene}</div>
      <div class="consequence-mechanism">${data.mechanism}</div>
      <button class="next-btn" onclick="nextScenario()">${currentIdx < session.length - 1 ? 'Next message →' : 'See results'}</button>
    </div>
  `;
  renderNetwork(action, truth);
  document.getElementById('consequenceNetwork').innerHTML = document.getElementById('network').innerHTML;
}

function nextScenario() {
  currentIdx++;
  if (currentIdx >= session.length) {
    showEnd();
  } else {
    show('game');
    renderScenario();
  }
}

function showEnd() {
  show('end');
  const el = document.getElementById('end');
  const jodi = jodiMoments[Math.floor(Math.random() * jodiMoments.length)];
  const correctCount = scenarioLog.filter(s => s.correct).length;
  const rating = score >= 80 ? 'Sharp reader' : score >= 50 ? 'Getting there' : 'Needs work';

  // Ticket 5: adaptive routing based on this session's pattern.
  let deeperMsg;
  if (misinfoForwarded >= 4) {
    deeperMsg = "Your network spread some false information. The Digital Citizenship lab goes deeper on reading a source before you share.";
  } else if (truthStopped >= 3) {
    deeperMsg = "You stopped some things that were worth sharing. The Digital Citizenship lab helps you tell the difference.";
  } else {
    deeperMsg = "The Digital Citizenship lab sharpens the instincts you just practiced — source evaluation, claim checking, knowing when to stop the chain.";
  }
  deeperLink = '/jsh/digital-decisions-lab/digital-citizenship/';

  el.innerHTML = `
    <div class="end-score">${score}</div>
    <div class="end-label">OUT OF 100</div>
    <div class="end-breakdown">
      <div class="end-row"><span class="end-row-label">Messages reviewed</span><span class="end-row-val">${session.length}</span></div>
      <div class="end-row"><span class="end-row-label">Right call</span><span class="end-row-val">${correctCount} / ${session.length}</span></div>
      <div class="end-row"><span class="end-row-label">Your read</span><span class="end-row-val">${rating}</span></div>
    </div>
    <div class="jodi-moment">
      <div class="jodi-moment-label">HEY Y'ALL 💛 FROM JODI</div>
      <div class="jodi-moment-text">"${jodi}"</div>
    </div>
    <div class="deeper-card">
      <div class="deeper-label">WANT TO GO DEEPER?</div>
      <div class="deeper-msg">${deeperMsg}</div>
      <button class="deeper-btn" onclick="window.AuthGate.guardedLeave(() => { window.location.href='${deeperLink}'; })">Open the lab →</button>
    </div>
    <button class="play-again-btn" onclick="window.AuthGate.guardedLeave(restartGame)">Play again</button>
    <button class="hub-btn" onclick="window.AuthGate.guardedLeave(() => { window.location.href='/educational-games/'; })">Browse more games</button>
    <div class="wordmark" style="margin-top:16px">Allgood Academy · Free for all learners, always.</div>
  `;

  recordSession();

  // Same shared save/claim offer as the other two games (window.AuthGate.offerSave()) —
  // one save flow across the site instead of a bespoke one for each game.
  window._agCompletionReached = true;
  if (!window._agSaveOffered && window.AuthGate && window.AuthGate.offerSave) {
    window._agSaveOffered = true;
    setTimeout(() => {
      window.AuthGate.offerSave().catch((e) => console.error('[TheRumorMill] offerSave failed', e));
    }, 1200);
  }
}

function restartGame() { startGame(); }

function toggleHomePopover(event) {
  event.stopPropagation();
  document.getElementById('home-popover').classList.toggle('show');
}

function closeHomePopover() {
  document.getElementById('home-popover').classList.remove('show');
}

document.addEventListener('click', (e) => {
  const wrap = document.querySelector('.home-popover-wrap');
  if (wrap && !wrap.contains(e.target)) closeHomePopover();
});

function handleRestartFromPopover() {
  closeHomePopover();
  if (document.getElementById('game').style.display === 'flex' ||
      document.getElementById('consequence').style.display === 'flex' ||
      document.getElementById('end').style.display === 'flex') {
    restartGame();
  } else {
    startGame();
  }
}

if (window.lucide) lucide.createIcons();
document.addEventListener('DOMContentLoaded', () => { if (window.lucide) lucide.createIcons(); });
</script>
</body>
</html>
