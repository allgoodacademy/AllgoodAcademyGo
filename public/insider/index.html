        const GAMES = [

        const gameByModule = Object.fromEntries(GAMES.map(g => [g.module, g]));

        // ------------------------------------------------------------------

        // Which telemetry streams this dashboard's numbers are computed from. A session or

        // ------------------------------------------------------------------

        const DAY = 24 * 60 * 60 * 1000;
        function esc(str) { const div = document.createElement('div'); div.textContent = str == null ? '' : String(str); return div.innerHTML; }
        function toMs(ts) {
            if (!ts) return 0;
            if (typeof ts === 'number') return ts;
            if (ts.toDate) return ts.toDate().getTime();
            if (ts.seconds) return ts.seconds * 1000;
            return 0;
        }
        function fmtDate(ms) { return ms ? new Date(ms).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '—'; }
        function fmtDateTime(ms) { return ms ? new Date(ms).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '—'; }
        function fmtAgo(ms) {
            if (!ms) return '—';
            const diff = Date.now() - ms;
            if (diff < 60e3) return 'just now';
            if (diff < 3600e3) return Math.round(diff / 60e3) + 'm ago';
            if (diff < DAY) return Math.round(diff / 3600e3) + 'h ago';
            if (diff < 30 * DAY) return Math.round(diff / DAY) + 'd ago';
            return fmtDate(ms);
        }
        function fmtDuration(ms) {
            if (!ms || ms < 1000) return '0m';
            const m = Math.round(ms / 60000);
            if (m < 1) return '<1m';
            if (m < 60) return m + 'm';
            return Math.floor(m / 60) + 'h ' + (m % 60) + 'm';
        }
        function pct(n, d) { return d ? Math.round((n / d) * 100) : 0; }
        function median(arr) {
            if (!arr.length) return 0;
            const s = [...arr].sort((a, b) => a - b);
            const mid = Math.floor(s.length / 2);
            return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
        }
        function mean(arr) { return arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0; }
        function rangeStart() { return rangeDays ? Date.now() - rangeDays * DAY : 0; }
        function inRange(ms) { return ms >= rangeStart(); }
        function rangeLabel() { return rangeDays ? `last ${rangeDays} days` : 'all time'; }
        function stars(r) { return r ? `<span class="text-amber-400">${'★'.repeat(r)}${'☆'.repeat(Math.max(0, 5 - r))}</span>` : '<span class="text-slate-300 italic">no rating</span>'; }

        const GENERIC_NAMES = ['Agent Learner', 'Guest', 'Learner', 'Agent', 'Anonymous'];
        function userType(u) {
            if (u.role === 'teacher') return 'Teacher';
            if (u.ageTier === 'under13') return 'Learner Recruit';
            if (u.ageTier === '13plus' || (u.email && !u.isGuest)) return '13+ Account';
            return 'Guest';
        }
        const TYPE_STYLE = {
            'Teacher': 'bg-indigo-100 text-indigo-700',
            'Learner Recruit': 'bg-emerald-100 text-emerald-700',
            '13+ Account': 'bg-sky-100 text-sky-700',
            'Guest': 'bg-slate-100 text-slate-500',
        };
        function typeBadge(t) { return `<span class="px-2 py-0.5 rounded-full text-[9px] font-bold uppercase whitespace-nowrap ${TYPE_STYLE[t] || TYPE_STYLE.Guest}">${esc(t)}</span>`; }
        function statusChip(status) {
            if (status === 'completed') return '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[9px] font-bold uppercase bg-emerald-100 text-emerald-700"><i data-lucide="check-circle-2" class="w-3 h-3"></i>Completed</span>';
            if (status === 'in_progress') return '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[9px] font-bold uppercase bg-amber-100 text-amber-700"><i data-lucide="clock" class="w-3 h-3"></i>In progress</span>';
            return '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[9px] font-bold uppercase bg-slate-100 text-slate-400"><i data-lucide="circle" class="w-3 h-3"></i>Not started</span>';
        }
        function card(title, body, extra = '') {
            return `<div class="bg-white rounded-lg shadow"><div class="p-4 border-b border-slate-100 flex items-center justify-between gap-2 flex-wrap"><h2 class="font-bold text-slate-800 text-xs uppercase tracking-wide">${title}</h2>${extra}</div><div class="p-4">${body}</div></div>`;
        }
        function tile(label, value, sub = '') {
            return `<div class="bg-white rounded-lg shadow p-4"><p class="text-[10px] uppercase tracking-wide text-slate-400 font-bold">${label}</p><p class="text-2xl font-bold text-slate-800 mt-1">${value}</p>${sub ? `<p class="text-[10px] text-slate-400 mt-0.5">${sub}</p>` : ''}</div>`;
        }
        function emptyMsg(text) { return `<p class="text-xs text-slate-400 italic">${text}</p>`; }

        // Tooltip shared by every chart.
        const tip = $('tooltip');
        document.addEventListener('mousemove', (e) => {
            const t = e.target.closest && e.target.closest('[data-tip]');
            if (t) {
                tip.textContent = t.getAttribute('data-tip');
                tip.classList.remove('hidden');
                tip.style.left = Math.min(window.innerWidth - tip.offsetWidth - 8, e.clientX + 12) + 'px';
                tip.style.top = (e.clientY + 14) + 'px';
            } else tip.classList.add('hidden');
        });

        // ------------------------------------------------------------------
        // CHARTS — single-series, one brand hue, thin marks, recessive axes.
        // ------------------------------------------------------------------
        // Fixed 400-unit-wide viewBox scaled uniformly, so text never stretches.
        function barChart({ series, labels, tips, height = 130, yLabel = '' }) {
            const n = series.length;
            if (!n) return emptyMsg('No data yet.');
            const max = Math.max(1, ...series);
            const W = 400, padB = 16, padT = 14, plotH = height - padB;
            const gap = Math.max(1.5, Math.min(6, 120 / n)), bw = W / n;
            const maxIdx = series.indexOf(max);
            let bars = '', xl = '';
            const every = n > 16 ? Math.ceil(n / 8) : (n > 8 ? 2 : 1);
            series.forEach((v, i) => {
                const h = (v / max) * (plotH - padT);
                const x = i * bw + gap / 2, y = plotH - h, w = Math.max(1, bw - gap);
                bars += `<rect class="bar" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" fill="${BRAND}" data-tip="${esc(tips[i])}"></rect>`;
                if (i === maxIdx && v > 0) bars += `<text x="${(x + w / 2).toFixed(1)}" y="${(y - 3).toFixed(1)}" font-size="9" text-anchor="middle" fill="#334155" font-weight="700">${v}</text>`;
                if (i % every === 0 || i === n - 1) xl += `<text x="${(x + w / 2).toFixed(1)}" y="${height - 4}" font-size="8" text-anchor="middle" fill="#94a3b8">${esc(labels[i])}</text>`;
            });
            const grid = [0.25, 0.5, 0.75].map(f => { const y = (plotH - f * (plotH - padT)).toFixed(1); return `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#e2e8f0" stroke-width="0.8"></line>`; }).join('');
            return `<div class="w-full"><svg viewBox="0 0 ${W} ${height}" class="w-full h-auto">${grid}<line x1="0" x2="${W}" y1="${plotH}" y2="${plotH}" stroke="#cbd5e1" stroke-width="1"></line>${bars}${xl}</svg>${yLabel ? `<p class="text-[10px] text-slate-400 mt-1">${yLabel}</p>` : ''}</div>`;
        }

        // Horizontal funnel: % of learners who reached each step.
        function funnelChart(rows) {
            if (!rows.length) return emptyMsg('No step data yet.');
            const max = Math.max(1, ...rows.map(r => r.count));
            return `<div class="space-y-1.5">${rows.map(r => `
                <div class="flex items-center gap-2 text-[11px]">
                    <div class="w-28 shrink-0 text-slate-500 truncate" title="${esc(r.label)}">${esc(r.label)}</div>
                    <div class="flex-1 bg-slate-100 rounded h-4 overflow-hidden"><div class="hbar h-4 rounded" style="width:${pct(r.count, max)}%;background:${BRAND}" data-tip="${esc(r.tip)}"></div></div>
                    <div class="w-20 shrink-0 text-right text-slate-600 font-bold">${r.count} <span class="text-slate-400 font-normal">(${r.pct}%)</span></div>
                </div>`).join('')}</div>`;
        }

        // Rating distribution 1–5 as tiny horizontal bars.
        function ratingBars(dist, total) {
            return `<div class="space-y-1">${[5, 4, 3, 2, 1].map(r => `
                <div class="flex items-center gap-2 text-[11px]"><span class="w-6 text-amber-500 font-bold">${r}★</span>
                <div class="flex-1 bg-slate-100 rounded h-2.5 overflow-hidden"><div class="h-2.5 rounded" style="width:${pct(dist[r] || 0, total)}%;background:${BRAND}"></div></div>
                <span class="w-8 text-right text-slate-500">${dist[r] || 0}</span></div>`).join('')}</div>`;

        // ------------------------------------------------------------------
        // DATA LOADING
        // ------------------------------------------------------------------
        function setLoading(msg) {
            const el = $('loading-strip');
            if (!msg) { el.classList.add('hidden'); return; }
            el.textContent = msg; el.classList.remove('hidden');

        async function safe(name, fn) {
            try { const r = await fn(); delete D.errors[name]; return r; }
            catch (e) {
                console.error(`[Insider] ${name} failed`, e);
                D.errors[name] = e.code === 'permission-denied'
                    ? 'Permission denied — the latest firestore.rules (collection-group + telemetry rules) may not be deployed yet.'
                    : e.code === 'failed-precondition'
                        ? 'Needs a one-time Firestore index — open the browser console for the link, create it, then Refresh.'
                        : (e.message || String(e));
                return [];
            }
        }

        async function loadEverything() {
            setLoading('Loading data…');
            $('page').innerHTML = `<div class="space-y-4">${[1, 2, 3].map(() => '<div class="skeleton rounded-lg h-24"></div>').join('')}</div>`;

            const [users, classrooms, messages, feedback, launches, scores, attempts, progress, sessions, events] = await Promise.all([
                safe('users', async () => (await getDocs(collection(db, 'artifacts', appId, 'users'))).docs.map(d => ({ uid: d.id, ...d.data() }))),
                safe('classrooms', async () => (await getDocs(collection(db, 'artifacts', appId, 'classrooms'))).docs.map(d => ({ code: d.id, ...d.data() }))),
                safe('messages', async () => (await getDocs(query(collection(db, 'artifacts', appId, 'messages'), orderBy('timestamp', 'desc'), limit(300)))).docs.map(d => ({ id: d.id, ...d.data() }))),
                safe('course_feedback', async () => (await getDocs(query(collection(db, 'artifacts', appId, 'course_feedback'), orderBy('timestamp', 'desc'), limit(1000)))).docs.map(d => ({ id: d.id, ...d.data() }))),
                safe('launches', async () => (await getDocs(collectionGroup(db, 'launches'))).docs.map(d => ({ uid: d.ref.parent.parent.id, ...d.data() }))),

            // Equality-only filters: served by Firestore's automatic single-field index, so no

            const [ttbSessions, ttbEvents] = await Promise.all([
                safe('take-the-bait sessions', async () => (await getDocs(query(collection(db, 'artifacts', appId, 'sessions'), where('module', '==', 'take-the-bait'), limit(5000)))).docs.map(d => ({ id: d.id, ...d.data() }))),

            ]);

            // Simulations: one sessions + one events query per stream (equality only, so the
            // automatic single-field index serves them; no composite index needed).
            const simData = await Promise.all(SIMS.map(async sim => {
                const [ss, ee] = await Promise.all([
                    safe(`${sim.stream} sessions`, async () => (await getDocs(query(collection(db, 'artifacts', appId, 'sessions'), where('stream', '==', sim.stream), limit(5000)))).docs.map(d => ({ id: d.id, ...d.data() }))),
                    safe(`${sim.stream} events`, async () => (await getDocs(query(collection(db, 'artifacts', appId, 'events'), where('stream', '==', sim.stream), limit(10000)))).docs.map(d => ({ id: d.id, ...d.data() }))),
                ]);

                ee.forEach(x => { x.ms = toMs(x.ts) || x.clientTs || 0; });
                return [sim.stream, { sessions: ss, events: ee }];

            // Español: one sessions + one events query for the shared 'espanol' stream.
            const [esSessions, esEvents] = await Promise.all([
                safe('espanol sessions', async () => (await getDocs(query(collection(db, 'artifacts', appId, 'sessions'), where('stream', '==', 'espanol'), limit(5000)))).docs.map(d => ({ id: d.id, ...d.data() }))),
                safe('espanol events', async () => (await getDocs(query(collection(db, 'artifacts', appId, 'events'), where('stream', '==', 'espanol'), limit(10000)))).docs.map(d => ({ id: d.id, ...d.data() }))),
            ]);
            esSessions.forEach(x => { x.startMs = toMs(x.startedAt); x.lastMs = toMs(x.lastSeenAt); });
            esEvents.forEach(x => { x.ms = toMs(x.ts) || x.clientTs || 0; });

            // Help Center: one events query (equality only). Read by the Help page alone.
            const helpEvents = await safe('help events', async () => (await getDocs(query(collection(db, 'artifacts', appId, 'events'), where('module', '==', 'help'), limit(10000)))).docs.map(d => ({ id: d.id, ...d.data() })));
            helpEvents.forEach(x => { x.ms = toMs(x.ts) || x.clientTs || 0; });

            // Games: one sessions query per game (equality only, like Take the Bait's).
            const gameData = await Promise.all(GAMES.filter(g => g.module !== 'take-the-bait').map(async g => {
                const ss = await safe(`${g.module} sessions`, async () => (await getDocs(query(collection(db, 'artifacts', appId, 'sessions'), where('module', '==', g.module), limit(5000)))).docs.map(d => ({ id: d.id, ...d.data() })));
                ss.forEach(x => { x.startMs = toMs(x.startedAt); x.lastMs = toMs(x.lastSeenAt); });
                return [g.module, ss];
            }));

            /* THE EXCLUSION, DONE ONCE.
               Pattern Lab (/educational-games/pattern-lab/) writes to the same two
               collections as everything else, tagged stream: 'pattern-lab'. Its sessions
               must not reach module visits, completion counts, time-on-task, the activity
               chart, the per-course funnel, the user index or any Lab Pack figure — they
               would inflate "game sessions" and deflate the game→GoodBlock conversion rate,
               which is the metric the whole funnel thesis rests on.

               in each of the ~20 places sessions are read. A filter added per call site is
               a filter somebody forgets on the twenty-first. */
            const funnelSessions = sessions.filter(inFunnel);
            const funnelEvents = events.filter(inFunnel);
            const offFunnel = {
                sessions: sessions.filter(s => !inFunnel(s)),
                events: events.filter(e => !inFunnel(e)),
                // game_scores carry no stream, so an off-funnel game's rows are split by gameName.
                scores: scores.filter(s => OFF_FUNNEL_GAMENAMES.has(s.gameName)),
            };
            const funnelScores = scores.filter(s => !OFF_FUNNEL_GAMENAMES.has(s.gameName));

            Object.assign(D, {
                users, classrooms, messages, feedback, launches, scores: funnelScores, attempts, progress,
                sessions: funnelSessions, events: funnelEvents, offFunnel, loadedAt: Date.now(),
                ttb: { sessions: ttbSessions, events: ttbEvents },
                sims: Object.fromEntries(simData),
                help: helpEvents,
                espanol: { sessions: esSessions, events: esEvents, scores: scores.filter(x => ESPANOL.some(st => st.gameNames.includes(x.gameName))) },
                games: Object.fromEntries(gameData),
            });
            // Every game_scores row whose gameName is a game's, core or off-funnel, for the Games page only.
            const gameNameSet = new Set(GAMES.flatMap(g => g.gameNames));
            D.gameScores = scores.filter(s => gameNameSet.has(s.gameName)).map(s => ({ ...s, ms: toMs(s.lastUpdated) }));
            D.ttb.sessions.forEach(s => { s.startMs = toMs(s.startedAt); s.lastMs = toMs(s.lastSeenAt); });
            D.ttb.events.forEach(e => { e.ms = toMs(e.ts) || e.clientTs || 0; });
            D.offFunnel.sessions.forEach(s => { s.startMs = toMs(s.startedAt); s.lastMs = toMs(s.lastSeenAt); });
            D.offFunnel.events.forEach(e => { e.ms = toMs(e.ts) || e.clientTs || 0; });

            // Normalise timestamps once.
            D.users.forEach(u => { u.lastLoginMs = toMs(u.lastLogin); u.name = u.displayName || '—'; u.isGeneric = !u.displayName || GENERIC_NAMES.includes(u.displayName); });
            D.launches.forEach(l => { l.ms = toMs(l.timestamp); l.course = courseByLaunchName[l.courseName] || null; });
            D.scores.forEach(s => { s.ms = toMs(s.lastUpdated); s.course = courseByGameName[s.gameName] || null; });
            D.attempts.forEach(a => { a.ms = toMs(a.timestamp); });
            D.progress.forEach(p => { p.ms = toMs(p.lastUpdated); p.course = courseBySlug[p.slug] || null; });
            D.sessions.forEach(s => { s.startMs = toMs(s.startedAt); s.lastMs = toMs(s.lastSeenAt); s.course = courseBySlug[s.module] || courseByGameName[s.gameName] || null; });
            D.events.forEach(e => { e.ms = toMs(e.ts) || e.clientTs || 0; });
            D.messages.forEach(m => { m.ms = toMs(m.timestamp); });
            D.feedback.forEach(f => { f.ms = toMs(f.timestamp); f.course = courseByGameName[f.gameName] || null; });

            // Attach a gameName to legacy scenario attempts via their parent game_scores doc.
            const scoreBySession = {};
            D.scores.forEach(s => scoreBySession[s.uid + '|' + s.sessionId] = s);
            D.attempts.forEach(a => { const s = scoreBySession[a.uid + '|' + a.sessionId]; a.course = s ? s.course : null; });

            buildUserIndex();
            setLoading('');
            $('loaded-at').textContent = 'Loaded ' + new Date(D.loadedAt).toLocaleTimeString();
        }

        // Per-user rollup across every source. Done once per load, not per render.
        function buildUserIndex() {
            userIndex = {};
            D.users.forEach(u => {
                userIndex[u.uid] = {
                    ...u, type: userType(u),
                    launches: [], scores: [], sessions: [], progress: [], messages: [], feedback: [],
                    courseStatus: {}, totalActiveMs: 0, completedCount: 0, startedCount: 0, lastActiveMs: u.lastLoginMs || 0,
                };
            });
            const ensure = (uid) => {
                if (!userIndex[uid]) userIndex[uid] = { uid, name: '(deleted or unknown user)', email: '—', role: 'student', type: 'Guest', isGeneric: true, orphan: true, launches: [], scores: [], sessions: [], progress: [], messages: [], feedback: [], courseStatus: {}, totalActiveMs: 0, completedCount: 0, startedCount: 0, lastActiveMs: 0, lastLoginMs: 0 };
                return userIndex[uid];
            };
            D.launches.forEach(l => { const u = ensure(l.uid); u.launches.push(l); u.lastActiveMs = Math.max(u.lastActiveMs, l.ms); });
            D.scores.forEach(s => { const u = ensure(s.uid); u.scores.push(s); u.lastActiveMs = Math.max(u.lastActiveMs, s.ms); });
            D.progress.forEach(p => { const u = ensure(p.uid); u.progress.push(p); u.lastActiveMs = Math.max(u.lastActiveMs, p.ms); });
            D.sessions.forEach(s => { const u = ensure(s.uid); u.sessions.push(s); u.totalActiveMs += (s.activeMs || 0); u.lastActiveMs = Math.max(u.lastActiveMs, s.lastMs, s.startMs); });
            D.messages.forEach(m => { if (m.senderUid) ensure(m.senderUid).messages.push(m); });
            D.feedback.forEach(f => { if (f.uid) ensure(f.uid).feedback.push(f); });

            Object.values(userIndex).forEach(u => {
                COURSES.forEach(c => {
                    const st = { status: 'not_started', bestScore: null, furthestStep: 0, sessions: 0, activeMs: 0, lastMs: 0, launches: 0 };
                    u.launches.forEach(l => { if (l.course === c) { st.launches++; st.lastMs = Math.max(st.lastMs, l.ms); } });
                    u.scores.forEach(s => {
                        if (s.course !== c) return;
                        st.status = st.status === 'completed' ? 'completed' : 'in_progress';
                        if (c.isComplete(s)) st.status = 'completed';
                        const sc = c.scoreOf(s); if (sc !== null) st.bestScore = st.bestScore === null ? sc : Math.max(st.bestScore, sc);
                        st.lastMs = Math.max(st.lastMs, s.ms);
                    });
                    u.progress.forEach(p => {
                        if (p.course !== c) return;
                        if (st.status === 'not_started') st.status = 'in_progress';
                        st.furthestStep = Math.max(st.furthestStep, c.progressStep(p));
                        st.lastMs = Math.max(st.lastMs, p.ms);
                    });
                    u.sessions.forEach(s => {
                        if (s.course !== c) return;
                        st.sessions++; st.activeMs += (s.activeMs || 0);
                        if (st.status === 'not_started') st.status = 'in_progress';
                        if (s.completed) st.status = 'completed';
                        st.furthestStep = Math.max(st.furthestStep, s.maxStep || 0);
                        st.lastMs = Math.max(st.lastMs, s.lastMs, s.startMs);
                    });
                    if (st.status === 'completed') st.furthestStep = c.stepsTotal;
                    u.courseStatus[c.id] = st;
                    if (st.status === 'completed') u.completedCount++;
                    if (st.status !== 'not_started') u.startedCount++;
                });
            });
        }

        // ------------------------------------------------------------------
        // COURSE ANALYTICS (respects the date range for time-stamped activity)
        // ------------------------------------------------------------------
        function courseStats(c) {
            const start = rangeStart();
            const launches = D.launches.filter(l => l.course === c && l.ms >= start);
            const sessions = D.sessions.filter(s => s.course === c && s.startMs >= start);
            const scores = D.scores.filter(s => s.course === c && s.ms >= start);
            const feedback = D.feedback.filter(f => f.course === c && f.ms >= start);
            const attempts = D.attempts.filter(a => a.course === c && a.ms >= start);

            // Learners = anyone with any activity on this course (all time, so status is fair),
            // narrowed to those active in range for the range-based numbers.
            const learnersAll = Object.values(userIndex).filter(u => u.courseStatus[c.id] && u.courseStatus[c.id].status !== 'not_started');
            const activeUids = new Set([...launches.map(l => l.uid), ...sessions.map(s => s.uid), ...scores.map(s => s.uid)]);
            const learnersInRange = learnersAll.filter(u => activeUids.has(u.uid) || (u.courseStatus[c.id].lastMs >= start));
            const completed = learnersAll.filter(u => u.courseStatus[c.id].status === 'completed');
            const completedInRange = learnersInRange.filter(u => u.courseStatus[c.id].status === 'completed');

            // Visits: telemetry sessions (new) ∪ legacy per-visit game_scores docs not covered by a session.
            const sessionIds = new Set(sessions.map(s => s.sessionId || s.id));
            const legacyVisits = scores.filter(s => !sessionIds.has(s.sessionId));
            const visits = sessions.length + legacyVisits.length;

            const timed = sessions.filter(s => (s.activeMs || 0) > 0).map(s => s.activeMs);
            const timedCompleted = sessions.filter(s => s.completed && (s.activeMs || 0) > 0).map(s => s.activeMs);

            const bestScores = learnersAll.map(u => u.courseStatus[c.id].bestScore).filter(v => v !== null);
            const rated = feedback.filter(f => typeof f.rating === 'number');
            const dist = {}; rated.forEach(f => dist[f.rating] = (dist[f.rating] || 0) + 1);

            // Funnel: furthest step reached per learner (all-time), bucketed for long modules.
            const bucket = c.stepBucket || 1;
            const steps = [];
            for (let s = bucket; s <= c.stepsTotal; s += bucket) steps.push(s);
            if (steps[steps.length - 1] !== c.stepsTotal) steps.push(c.stepsTotal);
            const funnel = steps.map(s => {
                const count = learnersAll.filter(u => u.courseStatus[c.id].furthestStep >= s).length;
                return { label: (bucket === 1 ? `Step ${s}` : `≥ ${s}`) + (s === c.stepsTotal ? ' (end)' : ''), count, pct: pct(count, learnersAll.length), tip: `${count} of ${learnersAll.length} learners reached ${s} ${c.stepLabel}` };
            });
            funnel.unshift({ label: 'Started', count: learnersAll.length, pct: 100, tip: `${learnersAll.length} learners have opened this module` });

            // Hardest scenarios (games only): lowest average score per scenarioIndex.
            const byScenario = {};
            attempts.forEach(a => {
                if (typeof a.scenarioIndex !== 'number') return;
                const k = a.scenarioIndex;
                if (!byScenario[k]) byScenario[k] = { idx: k, question: a.question || `Scenario ${k}`, n: 0, sum: 0 };
                byScenario[k].n++; byScenario[k].sum += (typeof a.score === 'number' ? a.score : 0);
            });
            const scenarioRows = Object.values(byScenario).map(r => ({ ...r, avg: r.n ? r.sum / r.n : 0 })).sort((a, b) => a.avg - b.avg);

            // Entry + device mix.
            const entry = {}, device = {};
            sessions.forEach(s => { entry[s.entry || 'unknown'] = (entry[s.entry || 'unknown'] || 0) + 1; device[s.device || 'unknown'] = (device[s.device || 'unknown'] || 0) + 1; });

            return {
                launches: launches.length, sessions: sessions.length, visits, legacyVisits: legacyVisits.length,
                learnersAll: learnersAll.length, learnersInRange: learnersInRange.length,
                completed: completed.length, completedInRange: completedInRange.length,
                completionRate: pct(completed.length, learnersAll.length),
                avgScore: bestScores.length ? Math.round(mean(bestScores)) : null, scoredCount: bestScores.length,
                medianTime: median(timed), meanTime: mean(timed), medianTimeCompleted: median(timedCompleted), timedCount: timed.length,
                rating: rated.length ? (mean(rated.map(f => f.rating))).toFixed(1) : null, ratingCount: rated.length, dist, feedback,
                funnel, scenarioRows, entry, device,
            };
        }

        // Weekly buckets (last N weeks) of a list of ms timestamps.
        function weeklySeries(msList, weeks = 12) {
            const now = Date.now();
            const series = new Array(weeks).fill(0), labels = [], tips = [];
            for (let i = 0; i < weeks; i++) {
                const end = now - (weeks - 1 - i) * 7 * DAY;
                const d = new Date(end - 6 * DAY);
                labels.push(d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }));
            }
            msList.forEach(ms => {
                if (!ms) return;
                const idx = weeks - 1 - Math.floor((now - ms) / (7 * DAY));
                if (idx >= 0 && idx < weeks) series[idx]++;
            });
            series.forEach((v, i) => tips.push(`Week of ${labels[i]}: ${v}`));
            return { series, labels, tips };
        }
        function dailySeries(msList, days = 30) {
            const now = Date.now();
            const series = new Array(days).fill(0), labels = [], tips = [];
            for (let i = 0; i < days; i++) {
                const d = new Date(now - (days - 1 - i) * DAY);
                labels.push(d.toLocaleDateString(undefined, { month: 'numeric', day: 'numeric' }));
            }
            msList.forEach(ms => {
                if (!ms) return;
                const idx = days - 1 - Math.floor((now - ms) / DAY);
                if (idx >= 0 && idx < days) series[idx]++;
            });
            series.forEach((v, i) => tips.push(`${labels[i]}: ${v}`));
            return { series, labels, tips };
        }

        // ------------------------------------------------------------------
        // ROUTER
        // ------------------------------------------------------------------
        const TITLES = { overview: 'Overview', users: 'Users', courses: 'Courses', games: 'Games', takethebait: 'Take the Bait', simulations: 'Simulations', espanol: 'Español', help: 'Help Center', sources: 'Where visits come from', classrooms: 'Classrooms', inbox: 'Inbox', feedback: 'Course Feedback', tools: 'Tools' };
        function route() {
            if (mainView.classList.contains('hidden')) return;
            const hash = location.hash.replace(/^#\/?/, '');
            const [section, arg] = hash.split('/');
            const page = TITLES[section] ? section : 'overview';
            document.querySelectorAll('.nav-link').forEach(a => a.classList.toggle('active', a.dataset.route === (page === 'takethebait' ? 'games' : page)));
            $('page-title').textContent = TITLES[page];
            const render = { overview: renderOverview, users: renderUsers, courses: () => arg ? renderCourseDetail(arg) : renderCourses, games: () => renderGames(arg), takethebait: () => gamesBackLink() + renderTakeTheBait(), simulations: () => renderSimulations(arg), espanol: () => renderEspanol(arg), help: renderHelp, sources: () => renderSources(arg), classrooms: renderClassrooms, inbox: renderInbox, feedback: renderFeedback, tools: renderTools }[page];
            const out = typeof render === 'function' ? render() : '';
            $('page').innerHTML = typeof out === 'function' ? out() : out;
            if (window.lucide) lucide.createIcons();
            bindPage(page, arg);
            if (page === 'users' && arg) openUserDrawer(arg); else closeDrawer();
        }
        window.addEventListener('hashchange', route);
        $('btn-refresh').onclick = async () => { await loadEverything(); route(); };
        $('range-picker').addEventListener('click', (e) => {
            const b = e.target.closest('[data-range]'); if (!b) return;
            rangeDays = parseInt(b.dataset.range, 10);
            document.querySelectorAll('#range-picker .chip').forEach(c => c.classList.toggle('active', c === b));
            route();
        });

        function errorStrip() {
            const keys = Object.keys(D.errors);
            if (!keys.length) return '';
            return `<div class="bg-amber-50 border border-amber-200 rounded-lg p-3 text-[11px] text-amber-800 mb-4"><p class="font-bold uppercase tracking-wide text-[10px] mb-1">Some data sources didn't load</p>${keys.map(k => `<p><span class="font-mono font-bold">${esc(k)}</span> — ${esc(D.errors[k])}</p>`).join('')}</div>`;
        }

        // ------------------------------------------------------------------
        // PAGE: OVERVIEW
        // ------------------------------------------------------------------
        function renderOverview() {
            const now = Date.now(), start = rangeStart();
            const users = Object.values(userIndex).filter(u => !u.orphan);
            const active24 = users.filter(u => now - u.lastActiveMs < DAY).length;
            const active7 = users.filter(u => now - u.lastActiveMs < 7 * DAY).length;
            const newInRange = users.filter(u => u.lastLoginMs >= start).length;
            const sessionsInRange = D.sessions.filter(s => s.startMs >= start);
            const launchesInRange = D.launches.filter(l => l.ms >= start);
            const completionsInRange = D.scores.filter(s => s.course && s.course.isComplete(s) && s.ms >= start).length + D.sessions.filter(s => s.completed && s.startMs >= start && !D.scores.some(sc => sc.sessionId === s.sessionId)).length;
            const rated = D.feedback.filter(f => typeof f.rating === 'number' && f.ms >= start);
            const activeMs = sessionsInRange.reduce((a, s) => a + (s.activeMs || 0), 0);

            const daily = dailySeries([...sessionsInRange.map(s => s.startMs), ...D.launches.filter(l => l.ms >= start && !sessionsInRange.some(s => s.uid === l.uid && Math.abs(s.startMs - l.ms) < 5 * 60e3)).map(l => l.ms)], rangeDays && rangeDays <= 30 ? rangeDays : 30);

            const courseRows = COURSES.map(c => ({ c, s: courseStats(c) }));
            const latestMessages = D.messages.slice(0, 5);

            return `
                ${errorStrip()}
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                    ${tile('Total accounts', users.length, `${users.filter(u => !u.isGeneric).length} with a real name`)}
                    ${tile('Active (7d)', active7, `${active24} in the last 24h`)}
                    ${tile('Module visits', sessionsInRange.length + launchesInRange.length, `${rangeLabel()} · ${fmtDuration(activeMs)} of active learning`)}
                    ${tile('Completions', completionsInRange, `${rangeLabel()} · avg rating ${rated.length ? (mean(rated.map(f => f.rating)).toFixed(1) + '★') : '—'}`)}
                </div>
                ${uniqueTiles()}
                <div class="grid lg:grid-cols-3 gap-4 mb-6">
                    <div class="lg:col-span-2">${card(`Activity by day · ${rangeDays && rangeDays <= 30 ? rangeLabel() : 'last 30 days'}`, barChart({ ...daily, height: 110, yLabel: 'Module visits per day (telemetry sessions + dashboard launches)' }))}</div>
                    ${card('Who is here', `<div class="space-y-2 text-xs">${['Learner Recruit', '13+ Account', 'Teacher', 'Guest'].map(t => { const n = users.filter(u => u.type === t).length; return `<div class="flex items-center justify-between"><span>${typeBadge(t)}</span><span class="font-bold text-slate-700">${n} <span class="text-slate-400 font-normal">(${pct(n, users.length)}%)</span></span></div>`; }).join('')}<div class="flex items-center justify-between pt-2 border-t border-slate-100"><span class="text-slate-500">New sign-ins ${rangeLabel()}</span><span class="font-bold text-slate-700">${newInRange}</span></div><div class="flex items-center justify-between"><span class="text-slate-500">Classrooms</span><span class="font-bold text-slate-700">${D.classrooms.length}</span></div></div>`)}
                </div>
                ${card('Courses at a glance', `<div class="overflow-x-auto"><table class="w-full text-xs"><thead class="text-slate-400 uppercase tracking-wide text-[10px]"><tr><th class="text-left font-bold py-2 pr-4">Course</th><th class="text-right font-bold py-2 px-2">Learners</th><th class="text-right font-bold py-2 px-2">Completed</th><th class="text-right font-bold py-2 px-2">Rate</th><th class="text-right font-bold py-2 px-2">Avg score</th><th class="text-right font-bold py-2 px-2">Median time</th><th class="text-right font-bold py-2 px-2">Rating</th><th class="text-right font-bold py-2 pl-2">Visits (${rangeLabel()})</th></tr></thead><tbody>${courseRows.map(({ c, s }) => `
                    <tr class="border-t border-slate-50 hover:bg-slate-50 cursor-pointer" onclick="location.hash='#/courses/${c.id}'">
                        <td class="py-2 pr-4 font-bold text-slate-700">${esc(c.name)}<span class="block text-[10px] text-slate-400 font-normal">${esc(c.category)}</span></td>
                        <td class="py-2 px-2 text-right">${s.learnersAll}</td>
                        <td class="py-2 px-2 text-right">${s.completed}</td>
                        <td class="py-2 px-2 text-right font-bold">${s.completionRate}%</td>
                        <td class="py-2 px-2 text-right">${s.avgScore !== null ? s.avgScore + '%' : '<span class="text-slate-300">n/a</span>'}</td>
                        <td class="py-2 px-2 text-right">${s.timedCount ? fmtDuration(s.medianTime) : '<span class="text-slate-300">—</span>'}</td>
                        <td class="py-2 px-2 text-right">${s.rating ? s.rating + '★ <span class="text-slate-400">(' + s.ratingCount + ')</span>' : '<span class="text-slate-300">—</span>'}</td>
                        <td class="py-2 pl-2 text-right">${s.visits + s.launches}</td>
                    </tr>`).join('')}</tbody></table></div>`, `<a href="#/courses" class="text-[10px] font-bold uppercase tracking-wide text-[#357889] hover:underline">Open Courses →</a>`)}
                <div class="grid lg:grid-cols-2 gap-4 mt-6">
                    ${card('Latest messages', latestMessages.length ? latestMessages.map(m => messageRow(m)).join('') : emptyMsg('No messages yet.'), `<a href="#/inbox" class="text-[10px] font-bold uppercase tracking-wide text-[#357889] hover:underline">Inbox →</a>`)}
                    ${card('Recent activity', recentActivity(), '<span class="text-[10px] text-slate-400">telemetry event stream</span>')}
                </div>`;
        }

        function recentActivity() {
            const rows = D.events.slice(0, 12);
            if (!rows.length) return emptyMsg('No telemetry events yet — they start flowing once a learner opens a module after this deploy.');
            const label = { module_open: 'opened', step: 'reached step', choice: 'answered a scenario in', module_complete: 'completed' };
            return `<div class="space-y-1.5">${rows.map(e => {
                const u = userIndex[e.uid];
                const c = courseBySlug[e.module] || courseByGameName[e.gameName];
                const stepTxt = e.event === 'step' && e.meta && e.meta.step ? ` ${e.meta.step}` : '';
                return `<div class="text-xs flex items-center justify-between gap-2"><span class="truncate"><a href="#/users/${esc(e.uid)}" class="font-bold text-slate-700 hover:underline">${esc(u ? u.name : 'Unknown')}</a> <span class="text-slate-500">${label[e.event] || esc(e.event)}${stepTxt}</span> <span class="text-slate-700">${esc(c ? c.name : (e.gameName || e.module || ''))}</span></span><span class="text-[10px] text-slate-400 shrink-0">${fmtAgo(e.ms)}</span></div>`;
            }).join('')}</div>`;
        }

        // ------------------------------------------------------------------
        // UNIQUE STUDENTS (Overview). Distinct uids in the selected range, per kind of thing.
        // ------------------------------------------------------------------
        function uniqueTiles() {
            const start = rangeStart();
            const gameUids = new Set(GAMES.flatMap(g => [...gameStats(g).players]));
            const simUids = new Set(SIMS.flatMap(sim => simStats(sim).sessions.map(s => s.uid)).filter(Boolean));
            const isLesson = c => c && /lab/i.test(c.category);
            const lessonUids = new Set([
                ...D.sessions.filter(s => isLesson(s.course) && (s.startMs || 0) >= start).map(s => s.uid),
                ...D.launches.filter(l => isLesson(l.course) && l.ms >= start).map(l => l.uid),
            ].filter(Boolean));
            const note = `different students · ${rangeLabel()}`;
            return `<div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                <a href="#/games" class="block">${tile('Students who played a game', gameUids.size, note)}</a>
                <a href="#/simulations" class="block">${tile('Students who used a simulation', simUids.size, note)}</a>
                <a href="#/courses" class="block">${tile('Students who started a lesson', lessonUids.size, note)}</a>
            </div>`;
        }

        // ------------------------------------------------------------------
        // PAGE: GAMES (read-only; reads D.games, D.ttb and D.gameScores, never the core arrays)
        // ------------------------------------------------------------------
        function gameStats(g) {
            const start = rangeStart();
            const raw = g.module === 'take-the-bait' ? D.ttb.sessions : (D.games[g.module] || []);
            const sessions = raw.filter(s => (s.startMs || 0) >= start);
            const names = new Set(g.gameNames);
            const sids = new Set(sessions.map(s => s.sessionId).filter(Boolean));
            const scores = D.gameScores.filter(s => names.has(s.gameName) && s.ms >= start);
            const legacy = scores.filter(s => !sids.has(s.sessionId));   // plays recorded only as a score row
            const players = new Set([...sessions.map(s => s.uid), ...scores.map(s => s.uid)].filter(Boolean));
            // Take the Bait opens one session per level and never sets `completed`; a level it
            // finished is one with a level_end event (the same rule as its own page).
            const ttbEnded = g.module === 'take-the-bait' ? new Set(D.ttb.events.filter(e => e.event === 'level_end').map(e => e.sessionId)) : null;
            const finished = new Set([
                ...sessions.filter(s => s.completed || (ttbEnded && ttbEnded.has(s.sessionId))).map(s => s.sessionId),
                ...scores.filter(s => s.completed || s.complete).map(s => s.sessionId),
            ].filter(Boolean)).size;
            const times = sessions.map(s => s.activeMs).filter(x => typeof x === 'number' && x > 0);
            const pcts = scores.map(s => s.percentage).filter(x => typeof x === 'number');
            const last = Math.max(0, ...sessions.map(s => s.lastMs || s.startMs || 0), ...scores.map(s => s.ms || 0));
            return { g, sessions, scores, players, plays: sessions.length + legacy.length, finished,
                medTime: times.length ? median(times) : null, avgScore: pcts.length ? Math.round(mean(pcts)) : null, last,
                playMs: [...sessions.map(s => s.startMs), ...legacy.map(s => s.ms)] };
        }
        function gamesBackLink() {
            return `<a href="#/games" class="inline-block text-[10px] font-bold uppercase tracking-wide text-[#357889] hover:underline mb-3">← All games</a>`;
        }
        function renderGames(arg) {
            if (arg) return renderGameDetail(arg);
            const all = GAMES.map(gameStats);
            const th = 'text-right font-bold py-1 px-2', dash = '<span class="text-slate-300">—</span>';
            const everyone = new Set(all.flatMap(x => [...x.players]));
            const plays = all.reduce((a, x) => a + x.plays, 0);
            const table = `<div class="overflow-x-auto"><table class="w-full text-xs"><thead class="text-slate-400 uppercase tracking-wide text-[10px]"><tr><th class="text-left font-bold py-1">Game</th><th class="${th}">Players</th><th class="${th}">Plays</th><th class="${th}">Finished</th><th class="${th}">Median time</th><th class="${th}">Avg score</th><th class="${th}">Last played</th></tr></thead><tbody>${all.map(x => `<tr class="border-t border-slate-50 hover:bg-slate-50 cursor-pointer" onclick="location.hash='${x.g.detail || '#/games/' + x.g.module}'"><td class="py-1.5 pr-2"><span class="font-bold text-slate-700">${esc(x.g.name)}</span></td><td class="text-right px-2 font-bold">${x.players.size}</td><td class="text-right px-2">${x.plays}</td><td class="text-right px-2">${x.plays ? `${x.finished} <span class="text-slate-400">(${pct(x.finished, x.plays)}%)</span>` : dash}</td><td class="text-right px-2">${x.medTime ? fmtDuration(x.medTime) : dash}</td><td class="text-right px-2">${x.avgScore !== null ? x.avgScore + '%' : dash}</td><td class="text-right px-2 text-slate-500">${x.last ? fmtAgo(x.last) : dash}</td></tr>`).join('')}</tbody></table></div>
                <p class="text-[10px] text-slate-400 mt-2">Players = different students. A student who plays on two devices without a save code counts twice. Plays = sessions (a session opens at a player's first interaction), plus older plays recorded only as a score. Take the Bait and Pattern Lab stay out of the lesson figures on the other pages; the four funnel games and the three Challenges also appear under Courses.</p>`;
            return `${errorStrip()}
                <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-6">
                    ${tile('Students who played a game', everyone.size, `different students · ${rangeLabel()}`)}
                    ${tile('Plays', plays, rangeLabel())}
                    ${tile('Games', GAMES.length, 'on the games page, plus Pattern Lab')}
                </div>
                ${card(`Every game · ${rangeLabel()}`, table)}`;
        }
        function renderGameDetail(id) {
            const g = gameByModule[id];
            if (!g) return gamesBackLink() + emptyMsg('Unknown game.');
            if (g.detail) { location.hash = g.detail; return ''; }
            const x = gameStats(g), n = x.sessions.length;
            const trend = weeklySeries(x.playMs, 12);
            const total = g.stepsTotal || Math.max(0, ...x.sessions.map(s => s.stepsTotal || 0));
            const reach = total ? Array.from({ length: total }, (_, i) => i + 1).map(k => { const c = x.sessions.filter(s => (s.maxStep || 0) >= k).length; return { label: `Step ${k}`, pct: pct(c, n), n: c, tip: `${c} of ${n} plays reached step ${k}` }; }) : [];
            const buckets = [[0, 49], [50, 69], [70, 89], [90, 100]].map(([a, b]) => { const c = x.scores.filter(s => typeof s.percentage === 'number' && s.percentage >= a && s.percentage <= b).length; return { label: `${a}–${b}%`, n: c }; });
            const scored = buckets.reduce((a, b) => a + b.n, 0);
            return `${gamesBackLink()}${errorStrip()}
                <div class="flex items-baseline gap-2 mb-4"><h2 class="font-bold text-slate-800 text-lg">${esc(g.name)}</h2><span class="text-[10px] text-slate-400 uppercase">${esc(g.kind)}</span>${g.url ? `<a href="${g.url}" target="_blank" rel="noopener" class="text-[10px] font-bold uppercase tracking-wide text-[#357889] hover:underline ml-2">Open game ↗</a>` : ''}</div>
                <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">
                    ${tile('Players', x.players.size, `different students · ${rangeLabel()}`)}
                    ${tile('Plays', x.plays, rangeLabel())}
                    ${tile('Finished', x.plays ? pct(x.finished, x.plays) + '%' : '—', `${x.finished} of ${x.plays}`)}
                    ${tile('Median time', x.medTime ? fmtDuration(x.medTime) : '—', 'active time per play')}
                    ${tile('Avg score', x.avgScore !== null ? x.avgScore + '%' : '—', `${x.scores.length} scored play${x.scores.length === 1 ? '' : 's'}`)}
                </div>
                <div class="grid lg:grid-cols-2 gap-4">
                    ${card('Plays per week · last 12 weeks', barChart({ ...trend, height: 110 }))}
                    ${card('How far they got', reach.length && n ? hbarRows(reach, r => `${r.pct}% <span class="text-slate-400 font-normal">(${r.n})</span>`) : emptyMsg('No step data in this range.'))}
                    ${card('Score spread', scored ? hbarRows(buckets.map(b => ({ ...b, pct: pct(b.n, scored), tip: `${b.n} of ${scored} scored plays` })), r => `${r.n}`) : emptyMsg('No scores in this range.'))}
                </div>`;
        }

        // ------------------------------------------------------------------
        // PAGE: TAKE THE BAIT (off-funnel; reads only D.ttb, never the core arrays)
        // ------------------------------------------------------------------
        const TTB_TECH = { rush: 'The Rush', toogood: 'Too Good', disguise: 'The Disguise', login: 'The Login Trap', secret: 'The Secret', feelings: 'Big Feelings', crowd: 'The Crowd', ask: 'The Ask' };
        function hbarRows(rows, fmt) {
            if (!rows.length) return emptyMsg('No plays in this range yet.');
            return `<div class="space-y-1.5">${rows.map(r => `<div class="flex items-center gap-2 text-[11px]"><div class="w-36 shrink-0 text-slate-600 truncate" title="${esc(r.label)}">${esc(r.label)}</div><div class="flex-1 bg-slate-100 rounded h-3.5 overflow-hidden"><div class="h-3.5 rounded" style="width:${Math.max(0, Math.min(100, r.pct))}%;background:${r.color || BRAND}" data-tip="${esc(r.tip || '')}"></div></div><div class="w-24 shrink-0 text-right text-slate-600 font-bold">${fmt(r)}</div></div>`).join('')}</div>`;
        }
        function renderTakeTheBait() {
            const start = rangeStart();
            const sessions = D.ttb.sessions.filter(s => (s.startMs || 0) >= start);
            const events = D.ttb.events.filter(e => e.ms >= start);
            const ev = name => events.filter(e => e.event === name && e.meta);
            const starts = ev('level_start'), ends = ev('level_end'), choices = ev('choice'), rob = ev('real_or_bait');
            const players = new Set(sessions.map(s => s.uid)).size;

            // Completion by level
            const lv = [1, 2, 3, 4, 5].map(n => {
                const st = starts.filter(e => e.meta.level === n).length, en = ends.filter(e => e.meta.level === n), won = en.filter(e => e.meta.won).length;
                const dur = en.map(e => e.meta.durationMs).filter(x => typeof x === 'number');
                return { n, started: st, finished: en.length, won, winRate: pct(won, en.length), medDur: dur.length ? median(dur) : null };
            });
            // Device
            const dev = {}; sessions.forEach(s => { const d = s.device || 'unknown'; dev[d] = (dev[d] || 0) + 1; });
            // Discernment
            const withBait = choices.filter(e => Array.isArray(e.meta.techniques) && e.meta.techniques.length);
            const avoided = withBait.filter(e => e.meta.outcome !== 'bait').length;
            const withReal = choices.filter(e => Array.isArray(e.meta.cardsReal) && e.meta.cardsReal.includes(true));
            const trusted = withReal.filter(e => e.meta.pickedReal === true).length;
            const overScroll = choices.filter(e => e.meta.outcome === 'over_scroll').length;
            const bothReal = choices.filter(e => Array.isArray(e.meta.cardsReal) && e.meta.cardsReal.every(Boolean)).length;
            const checkPairs = choices.filter(e => e.meta.usedCheck).length;
            // Bait rate per technique: first exposure vs later exposures, per player
            const seen = {}, tech = {};
            [...choices].sort((a, b) => a.ms - b.ms).forEach(e => {
                (e.meta.techniques || []).forEach(k => {
                    const key = e.uid + '|' + k, first = !seen[key]; seen[key] = true;
                    const t = tech[k] || (tech[k] = { firstN: 0, firstBait: 0, laterN: 0, laterBait: 0 });
                    const baited = e.meta.outcome === 'bait' && e.meta.technique === k;
                    if (first) { t.firstN++; if (baited) t.firstBait++; } else { t.laterN++; if (baited) t.laterBait++; }
                });
            });
            const techRows = Object.keys(TTB_TECH).map(k => ({ k, ...(tech[k] || { firstN: 0, firstBait: 0, laterN: 0, laterBait: 0 }) }));
            // Real or Bait accuracy by level
            const robLv = [1, 2, 3, 4, 5].map(n => { const r = rob.filter(e => e.meta.level === n); const c = r.filter(e => e.meta.correct).length; return { label: `Level ${n}`, pct: pct(c, r.length), n: r.length, c, tip: `${c} of ${r.length} answers correct` }; });
            // Speed setting
            const sp = { relaxed: 0, normal: 0, fast: 0 }; ends.forEach(e => { const k = e.meta.speedSetting; if (k in sp) sp[k]++; });
            const spTotal = sp.relaxed + sp.normal + sp.fast;

            const th = 'text-right font-bold py-1 px-2';
            return `${errorStrip()}
                <p class="text-[11px] text-slate-500 mb-4">Take the Bait reports on its own telemetry stream (<span class="font-mono">take-the-bait</span>) and is in none of the core figures on the other pages. ${rangeLabel()} · refresh to pick up plays from the last minute.</p>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                    ${tile('Plays', sessions.length, `${players} player${players === 1 ? '' : 's'} · one session per level`)}
                    ${tile('Levels finished', ends.length, `${ends.filter(e => e.meta.won).length} won`)}
                    ${tile('Bait spotted', withBait.length ? pct(avoided, withBait.length) + '%' : '—', `${avoided} of ${withBait.length} bait messages`)}
                    ${tile('Real messages trusted', withReal.length ? pct(trusted, withReal.length) + '%' : '—', `${trusted} of ${withReal.length} real messages`)}
                </div>
                <div class="grid lg:grid-cols-2 gap-4 mb-6">
                    ${card('Completion by level', `<table class="w-full text-xs"><thead class="text-slate-400 uppercase tracking-wide text-[10px]"><tr><th class="text-left font-bold py-1">Level</th><th class="${th}">Started</th><th class="${th}">Finished</th><th class="${th}">Won</th><th class="${th}">Win rate</th><th class="${th}">Median time</th></tr></thead><tbody>${lv.map(r => `<tr class="border-t border-slate-50"><td class="py-1.5 font-bold text-slate-700">Level ${r.n}</td><td class="text-right px-2">${r.started}</td><td class="text-right px-2">${r.finished}</td><td class="text-right px-2">${r.won}</td><td class="text-right px-2 font-bold">${r.finished ? r.winRate + '%' : '—'}</td><td class="text-right px-2">${r.medDur ? fmtDuration(r.medDur) : '—'}</td></tr>`).join('')}</tbody></table>`)}
                    ${card('Discernment', `<div class="space-y-2 text-xs">
                        <div class="flex justify-between"><span class="text-slate-500">Bait spotted (called it bait)</span><span class="font-bold">${withBait.length ? pct(avoided, withBait.length) + '%' : '—'}</span></div>
                        <div class="flex justify-between"><span class="text-slate-500">Real messages trusted (called it real)</span><span class="font-bold">${withReal.length ? pct(trusted, withReal.length) + '%' : '—'}</span></div>
                        <div class="flex justify-between"><span class="text-slate-500">Over-caution: called a real message bait</span><span class="font-bold">${bothReal ? pct(overScroll, bothReal) + '%' : '—'} <span class="text-slate-400 font-normal">(${overScroll} of ${bothReal})</span></span></div>
                        <div class="flex justify-between"><span class="text-slate-500">Battles won (of levels finished)</span><span class="font-bold">${ends.length ? pct(ends.filter(e => e.meta.won).length, ends.length) + '%' : '—'}</span></div>
                        <p class="text-[10px] text-slate-400 pt-2 border-t border-slate-100">Each level is a Mob Control battle followed by three Real or Bait? messages from that level's content; these figures come from those answers. Both numbers matter: calling everything bait is not discernment.</p></div>`)}
                </div>
                <div class="grid lg:grid-cols-2 gap-4 mb-6">
                    ${card('Bait rate by technique · first exposure vs later', `<table class="w-full text-xs"><thead class="text-slate-400 uppercase tracking-wide text-[10px]"><tr><th class="text-left font-bold py-1">Technique</th><th class="${th}">First time</th><th class="${th}">Later</th></tr></thead><tbody>${techRows.map(r => `<tr class="border-t border-slate-50"><td class="py-1.5 font-bold text-slate-700">${esc(TTB_TECH[r.k])}</td><td class="text-right px-2">${r.firstN ? pct(r.firstBait, r.firstN) + '%' : '—'} <span class="text-slate-400">(${r.firstBait}/${r.firstN})</span></td><td class="text-right px-2">${r.laterN ? pct(r.laterBait, r.laterN) + '%' : '—'} <span class="text-slate-400">(${r.laterBait}/${r.laterN})</span></td></tr>`).join('')}</tbody></table><p class="text-[10px] text-slate-400 mt-2">Per player: the first message in which they met a technique, against every later one. A falling rate means the tell is landing.</p>`)}
                    ${card('Real or Bait? accuracy by level', hbarRows(robLv.filter(r => r.n), r => `${r.pct}% <span class="text-slate-400 font-normal">(${r.c}/${r.n})</span>`))}
                </div>
                <div class="grid lg:grid-cols-2 gap-4">
                    ${card('Device', hbarRows(Object.entries(dev).sort((a, b) => b[1] - a[1]).map(([k, n]) => ({ label: k, pct: pct(n, sessions.length), n, tip: `${n} sessions` })), r => `${r.n} <span class="text-slate-400 font-normal">(${r.pct}%)</span>`))}
                    ${card('Speed setting (levels finished)', hbarRows(spTotal ? [['relaxed', 'Relaxed'], ['normal', 'Normal'], ['fast', 'Fast']].map(([k, l]) => ({ label: l, pct: pct(sp[k], spTotal), n: sp[k], tip: `${sp[k]} levels` })) : [], r => `${r.n} <span class="text-slate-400 font-normal">(${r.pct}%)</span>`))}
                </div>`;
        }

        // ------------------------------------------------------------------
        // PAGE: HELP CENTER (reads only D.help: module 'help', stream 'help')
        // Storyboard: claude/help-center-storyboard-v1.0.md. The headline is "Helped": a real
        // success (assigned, saved, joined…) within 10 minutes of reading an article or touring.
        // Search words exist only for teachers (help.js never records a student's words).
        // ------------------------------------------------------------------
        function renderHelp() {
            const start = rangeStart();
            const H = D.help.filter(e => e.ms >= start && e.meta);
            const ev = name => H.filter(e => e.event === name);
            const th = 'text-right font-bold py-1 px-2', dash = '<span class="text-slate-300">—</span>';
            const count = (arr, key) => { const m = new Map(); arr.forEach(e => { const k = key(e); if (k != null && k !== '') m.set(k, (m.get(k) || 0) + 1); }); return [...m.entries()].sort((a, b) => b[1] - a[1]); };
            const opens = ev('help_open'), searches = ev('help_search'), arts = ev('help_article'), reads = ev('help_read'), votes = ev('help_vote'), stuck = ev('help_stuck'), tours = ev('help_tour'), cuts = ev('help_shortcut'), wins = ev('help_success');
            const noRes = searches.filter(e => !e.meta.found);
            const tq = searches.filter(e => e.meta.q);
            const artName = id => (HELP_ARTICLES.find(a => a.id === id) || {}).title || id;
            const tourStarts = tours.filter(e => e.meta.event === 'start'), tourDone = tours.filter(e => e.meta.event === 'done');
            const helpedPct = pct(wins.length, new Set(arts.map(e => e.uid + '|' + e.meta.article)).size + tourStarts.length);

            const topQ = count(tq, e => e.meta.q.toLowerCase()).slice(0, 12);
            const missQ = count(noRes.filter(e => e.meta.q), e => e.meta.q.toLowerCase()).slice(0, 12);
            const missOther = noRes.filter(e => !e.meta.q).length;
            const qList = (rows, empty) => rows.length ? `<div class="space-y-1 text-xs">${rows.map(([q, n]) => `<div class="flex justify-between gap-2"><span class="text-slate-700 truncate">${esc(q)}</span><span class="font-bold">${n}</span></div>`).join('')}</div>` : emptyMsg(empty);

            const artRows = HELP_ARTICLES.map(a => {
                const o = arts.filter(e => e.meta.article === a.id), r = reads.filter(e => e.meta.article === a.id).map(e => e.meta.secs).filter(x => typeof x === 'number');
                const up = votes.filter(e => e.meta.article === a.id && e.meta.vote === 'up').length, down = votes.filter(e => e.meta.article === a.id && e.meta.vote === 'down').length;
                const people = new Set(o.map(e => e.uid)).size, won = wins.filter(e => e.meta.article === a.id).length;
                return { a, opens: o.length, people, med: r.length ? median(r) : null, up, down, won, stuck: stuck.filter(e => e.meta.article === a.id).length };
            }).sort((x, y) => y.opens - x.opens);
            const artTable = `<div class="overflow-x-auto"><table class="w-full text-xs"><thead class="text-slate-400 uppercase tracking-wide text-[10px]"><tr><th class="text-left font-bold py-1">Article</th><th class="${th}">Opens</th><th class="${th}">Median read</th><th class="${th}">👍</th><th class="${th}">👎</th><th class="${th}">Helped</th><th class="${th}">Still stuck</th></tr></thead><tbody>${artRows.map(x => `<tr class="border-t border-slate-50"><td class="py-1.5 pr-2"><span class="font-bold text-slate-700">${esc(x.a.title)}</span> <span class="text-[10px] text-slate-400 uppercase">${x.a.who === 'teacher' ? 'Teachers' : 'Students'}</span></td><td class="text-right px-2">${x.opens || dash}</td><td class="text-right px-2">${x.med != null ? x.med + 's' : dash}</td><td class="text-right px-2">${x.up || dash}</td><td class="text-right px-2">${x.down || dash}</td><td class="text-right px-2 font-bold">${x.a.success ? (x.people ? `${x.won} <span class="text-slate-400 font-normal">(${pct(x.won, x.people)}%)</span>` : dash) : '<span class="text-slate-300" title="No success event for this article">n/a</span>'}</td><td class="text-right px-2">${x.stuck || dash}</td></tr>`).join('')}</tbody></table></div>
                <p class="text-[10px] text-slate-400 mt-2">Helped = a real success (e.g. something assigned, a save code made, a class joined) within 10 minutes of reading, counted against the number of different people who opened the article. Read rarely followed by success? Rewrite it.</p>`;

            const tourCards = Object.entries(HELP_TOURS).map(([id, t]) => {
                const tt = tours.filter(e => e.meta.tour === id);
                // One run = a start and what follows it from the same person and visit, up to their next start.
                // Furthest step per run, so Back/forward and Skip can't count a step twice.
                const runs = [], open = new Map();
                [...tt].sort((a, b) => a.ms - b.ms).forEach(e => {
                    const k = e.uid + '|' + (e.sessionId || '');
                    if (e.meta.event === 'start') { const r = { max: 1, end: null }; runs.push(r); open.set(k, r); return; }
                    const r = open.get(k); if (!r) return;
                    r.max = Math.max(r.max, Number(e.meta.step) || 1);
                    if (e.meta.event !== 'step' && e.meta.event !== 'skip') { r.end = e.meta.event; open.delete(k); }
                });
                const started = runs.length;
                const reached = n => runs.filter(r => r.max >= n).length;
                const done = runs.filter(r => r.end === 'done').length, already = runs.filter(r => r.end === 'already').length;
                const quits = count(tt.filter(e => e.meta.event === 'exit'), e => e.meta.step);
                const rows = t.steps.map((st, i) => ({ label: `Step ${i + 1}`, pct: pct(reached(i + 1), started), n: reached(i + 1), tip: st.text.replace(/\*\*/g, '') })).concat([{ label: 'Finished', pct: pct(done, started), n: done, tip: 'Reached the end' }]);
                return card(`Tour: ${esc(t.title)} · ${t.who === 'teacher' ? 'teachers' : 'students'}`, started ? hbarRows(rows, r => `${r.pct}% <span class="text-slate-400 font-normal">(${r.n})</span>`) + `<p class="text-[10px] text-slate-400 mt-2">${quits.length ? `Most people who quit, quit at <b>step ${quits[0][0]}</b> (${quits[0][1]}).` : 'Nobody has quit this tour.'}${already ? ` ${already} were already saved.` : ''}</p>` : emptyMsg('Nobody has started this tour in this range.'));
            }).join('');

            const viewRows = count(opens.filter(e => e.meta.mode === 'panel'), e => e.meta.view).slice(0, 8);
            const maxV = viewRows.length ? viewRows[0][1] : 1;
            return `${errorStrip()}
                <p class="text-[11px] text-slate-500 mb-4">The Help Center reports on its own stream (<span class="font-mono">help</span>) and is in none of the other pages' figures. ${rangeLabel()}.</p>
                <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-6">
                    ${tile('Help opened', opens.length, `${new Set(opens.map(e => e.uid)).size} different people`)}
                    ${tile('Searches', searches.length, `${noRes.length} found nothing`)}
                    ${tile('Articles opened', arts.length, `median read ${reads.length ? median(reads.map(e => e.meta.secs || 0)) + 's' : '—'}`)}
                    ${tile('Tours finished', `${tourDone.length} / ${tourStarts.length}`, tourStarts.length ? `${pct(tourDone.length, tourStarts.length)}% of tours started` : 'none started yet')}
                    ${tile('Helped', wins.length, `${helpedPct}% · success within 10 min`)}
                    ${tile('"Still stuck"', stuck.length, 'pressed "Message us"')}
                </div>
                <div class="grid lg:grid-cols-2 gap-4 mb-6">
                    ${card('Searches that found nothing · write these next', qList(missQ, 'No teacher searches came up empty.') + (missOther ? `<p class="text-[10px] text-slate-400 mt-2">Plus ${missOther} from students or visitors (their words are never recorded).</p>` : ''))}
                    ${card('Top teacher searches', qList(topQ, 'No teacher searches in this range.'))}
                </div>
                <div class="mb-6">${card('Every article', artTable)}</div>
                <div class="grid lg:grid-cols-3 gap-4 mb-6">${tourCards}</div>
                <div class="grid lg:grid-cols-2 gap-4">
                    ${card('Where help gets opened (dashboard view)', viewRows.length ? hbarRows(viewRows.map(([v, n]) => ({ label: v, pct: pct(n, maxV), n })), r => `${r.n}`) : emptyMsg('Nobody has opened the ? panel in this range.'))}
                    ${card('"Do it for me" shortcuts', (() => { const rows = count(cuts, e => e.meta.shortcut); return rows.length ? `<div class="space-y-1 text-xs">${rows.map(([k, n]) => `<div class="flex justify-between"><span class="text-slate-700">${esc((HELP_SHORTCUTS[k] || {}).label || k)}</span><span class="font-bold">${n}</span></div>`).join('')}</div>` : emptyMsg('No shortcuts used in this range.'); })())}
                </div>`;
        }

        // ------------------------------------------------------------------

        function storyStats(st) {

            const classN = sessions.filter(x => x.summary && x.summary.mode === 'class').length;

        }

        // ------------------------------------------------------------------

        function simStats(sim) {

            const tried = Object.values(bySess), firstOk = tried.filter(a => a.some(e => e.meta.attempt === 1 && e.meta.success)).length, everOk = tried.filter(a => a.some(e => e.meta.success)).length;
            const counts = tried.map(a => a.length), fail = {};
            att.filter(e => !e.meta.success).forEach(e => { const k = e.meta.failReason || 'other'; fail[k] = (fail[k] || 0) + 1; });
            const failN = Object.values(fail).reduce((a, b) => a + b, 0);

            const row = (l, v) => `<div class="flex justify-between"><span class="text-slate-500">${l}</span><span class="font-bold">${v}</span></div>`;
            return `${errorStrip()}
                <p class="text-[11px] text-slate-500 mb-4">Each simulation reports on its own telemetry stream and is in none of the core figures on the other pages. ${rangeLabel()} · tests from the team count too, so a handful of sessions right after a release may be us.</p>

        // ------------------------------------------------------------------
        // PAGE: USERS
        // ------------------------------------------------------------------
        const USER_FILTERS = [
            ['all', 'All'], ['Learner Recruit', 'Learner Recruits'], ['13+ Account', '13+ Accounts'], ['Teacher', 'Teachers'], ['Guest', 'Guests'],

        ];
        const USER_SORTS = {
            lastActive: ['Last active', u => u.lastActiveMs],
            launches: ['Most launches', u => u.launches.length + u.sessions.length],
            completed: ['Most completions', u => u.completedCount],

        function filteredUsers() {

            if (f === 'classroom') list = list.filter(u => !!u.classroomCode);
            else if (f === 'active7') list = list.filter(u => now - u.lastActiveMs < 7 * DAY);
            else if (f === 'completed') list = list.filter(u => u.completedCount > 0);
            else if (f !== 'all') list = list.filter(u => u.type === f);

        // ------------------------------------------------------------------
        // PAGE: WHERE VISITS COME FROM (2026-11-25)

        function renderSources(arg) {

            const label = (s) => s.gameName || s.module || '—';
            const top3 = (list) => { const c = new Map(); list.forEach(s => c.set(label(s), (c.get(label(s)) || 0) + 1)); return [...c.entries()].sort((a, b) => b[1] - a[1]).slice(0, 3).map(([n, k]) => `${esc(n)} <span class="text-slate-400">${k}</span>`).join(' · '); };

            let detail = '';
            const pick = arg ? decodeURIComponent(arg) : '';
            if (pick && groups.has(pick)) {
                const byCamp = new Map();
                groups.get(pick).forEach(s => { const c = (s.source && s.source.utmCampaign) || '(no campaign)'; if (!byCamp.has(c)) byCamp.set(c, []); byCamp.get(c).push(s); });
                detail = card(`${esc(pick)} · by campaign`, `<table class="w-full text-xs"><thead class="text-slate-400 uppercase tracking-wide text-[10px]"><tr><th class="text-left font-bold py-1">Campaign</th><th class="${th}">Sessions</th><th class="${th}">Finished</th><th class="text-left font-bold py-1 px-2">Top things played</th></tr></thead><tbody>${[...byCamp.entries()].sort((a, b) => b[1].length - a[1].length).map(([c, list]) => `<tr class="border-t border-slate-50"><td class="py-1.5 font-mono">${esc(c)}</td><td class="text-right px-2">${list.length}</td><td class="text-right px-2">${list.filter(s => s.completed).length}</td><td class="px-2">${top3(list)}</td></tr>`).join('')}</tbody></table>`);
            }
            const how = `<p class="text-[10px] text-slate-400 mt-2">Tag links so they show up here: <span class="font-mono">?src=email&amp;utm_campaign=outreach-2026-11</span>, <span class="font-mono">?src=facebook</span>, <span class="font-mono">?src=tpt</span>. A session opens at a learner's first interaction. Finished = reached the last step. Cookie-free: only the tag and the referring site's name are kept.</p>`;

                        <div><h3 class="font-bold text-slate-800 text-xs uppercase tracking-wide mb-2">Score history</h3>${scores.length ? `<div class="space-y-1">${scores.map(s => `<div class="text-xs flex items-center justify-between gap-2 border border-slate-100 rounded px-2 py-1.5"><span class="font-bold text-slate-700 truncate">${esc(s.gameName)}</span><span class="text-slate-500 shrink-0">${[typeof s.percentage === 'number' ? s.percentage + '%' : (typeof s.finalScore === 'number' ? s.finalScore + ' pts' : ''), s.rank ? esc(s.rank) : '', (s.completed || s.complete) ? 'completed ✓' : ''].filter(Boolean).join(' · ')}</span><span class="text-[10px] text-slate-400 shrink-0">${fmtAgo(s.ms)}</span></div>`).join('')}</div>` : emptyMsg('No score records.')}</div>
