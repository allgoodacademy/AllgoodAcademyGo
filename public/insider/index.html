        /* MISSION CONTROL PRO — the Plan control (2026-11-25). Since the Stripe webhook
           (functions/), payments turn Pro on by themselves; this is the manual override. Writes teacher_plans/{uid}, which only
           this admin allowlist can write (firestore.rules #13). Pro = plan 'pro' and proUntil in
           the future; Mission Control and storage.rules both read exactly that. */
        const planOf = (uid) => (D.plans || {})[uid] || null;
        const planUntilMs = (p) => p && p.proUntil ? toMs(p.proUntil) : 0;
        const planIsPro = (p) => !!p && p.plan === 'pro' && planUntilMs(p) > Date.now();
        function planChip(p) {
            if (!p || p.plan !== 'pro') return '<span class="px-2 py-0.5 rounded-full text-[9px] font-bold uppercase bg-slate-100 text-slate-500">Free</span>';
            return planIsPro(p) ? '<span class="px-2 py-0.5 rounded-full text-[9px] font-bold uppercase bg-allgood-primary text-white">Pro</span>'
                : '<span class="px-2 py-0.5 rounded-full text-[9px] font-bold uppercase bg-amber-100 text-amber-700">Pro ended</span>';
        }
        function planControl(u) {
            const p = planOf(u.uid);
            const until = planUntilMs(p) || (Date.now() + 365 * DAY);
            const iso = new Date(until).toISOString().slice(0, 10);
            return `<div class="border border-slate-200 rounded-lg p-3">
                <div class="flex items-center justify-between gap-2"><h3 class="font-bold text-slate-800 text-xs uppercase tracking-wide">Mission Control plan</h3>${planChip(p)}</div>
                <p class="text-[11px] text-slate-500 mt-1">Stripe payments turn Pro on by themselves. Use this to override: Founding Teachers, invoices, or a payment listed under Payments to match (Tools).${p && p.grantedBy ? ` Last set by ${esc(p.grantedBy)}.` : ''}</p>
                ${(() => { const mine = unmatchedRows().filter(r => r.user && r.user.uid === u.uid && !r.done); return mine.length ? `<div class="mt-2 rounded border border-amber-200 bg-amber-50 p-2"><p class="text-[10px] uppercase font-bold text-amber-700 mb-1">Payments to match for this email</p>${unmatchedTable(mine)}</div>` : ''; })()}
                <div class="grid grid-cols-2 gap-2 mt-2 text-xs">
                    <label class="flex flex-col gap-1"><span class="text-[10px] uppercase text-slate-400 font-bold">Plan</span>
                        <select id="plan-plan" class="border border-slate-200 rounded px-2 py-1.5"><option value="free"${p && p.plan === 'pro' ? '' : ' selected'}>Free</option><option value="pro"${p && p.plan === 'pro' ? ' selected' : ''}>Pro</option></select></label>
                    <label class="flex flex-col gap-1"><span class="text-[10px] uppercase text-slate-400 font-bold">Pro until</span>
                        <input id="plan-until" type="date" value="${iso}" class="border border-slate-200 rounded px-2 py-1"></label>
                    <label class="col-span-2 flex flex-col gap-1"><span class="text-[10px] uppercase text-slate-400 font-bold">Note</span>
                        <input id="plan-note" type="text" maxlength="500" value="${esc((p && p.note) || '')}" placeholder="Paste the Stripe payment ID or client_reference_id." class="border border-slate-200 rounded px-2 py-1.5">
                        <span class="text-[10px] text-slate-400">Paste the Stripe payment ID or client_reference_id. Mission Control sends the teacher's uid to Stripe as client_reference_id, so it matches the UID above.</span></label>
                </div>
                <button id="plan-save" data-uid="${esc(u.uid)}" class="mt-2 bg-[#357889] hover:bg-[#2D6473] text-white font-bold py-1.5 px-3 rounded text-[10px] uppercase tracking-wide">Save plan</button>
                <span id="plan-status" class="text-[11px] ml-2"></span>
            </div>`;
        }
        async function savePlan(uid) {
            const status = $('plan-status');
            const plan = $('plan-plan').value;
            const day = $('plan-until').value;
            if (plan === 'pro' && !day) { status.textContent = 'Pick an end date.'; status.className = 'text-[11px] ml-2 text-red-600'; return; }
            // End of the chosen day, local time, so "until Nov 30" includes Nov 30.
            const untilMs = day ? new Date(`${day}T23:59:59`).getTime() : 0;
            const data = {
                plan,
                proUntil: plan === 'pro' ? Timestamp.fromMillis(untilMs) : null,
                grantedBy: (auth.currentUser && auth.currentUser.email) || 'admin',
                note: $('plan-note').value.trim().slice(0, 500),
                updatedAt: serverTimestamp(),
            };
            status.textContent = 'Saving…'; status.className = 'text-[11px] ml-2 text-slate-500';
            try {
                await setDoc(doc(db, 'artifacts', appId, 'teacher_plans', uid), data);
                D.plans = { ...(D.plans || {}), [uid]: { uid, ...data, proUntil: data.proUntil, updatedAt: Date.now() } };
                status.textContent = plan === 'pro' ? `Saved — Pro until ${new Date(untilMs).toLocaleDateString()}.` : 'Saved — free plan.';
                status.className = 'text-[11px] ml-2 text-emerald-700';
            } catch (e) {
                console.error('[Insider] saving plan failed', e);
                status.textContent = `Not saved: ${e.code || e.message}`;
                status.className = 'text-[11px] ml-2 text-red-600';
            }
        }
        /* Payments to match: Stripe payments the webhook couldn't tie to an account (no uid and
           no account with that email, or not paid yet). A row reads "Pro on" once an account with
           that email has an active plan, so the list clears itself as the founder works it. */
        const UNMATCHED_REASON = {
            no_account: 'No account with this email',
            not_paid_yet: 'Checkout not paid yet',
            renewal_no_account: 'Renewal, no account found',
            refund_no_account: 'Refund, no account found',
        };
        function unmatchedRows() {
            const byEmail = {};
            Object.values(userIndex).forEach(u => { if (u.email) byEmail[String(u.email).toLowerCase()] = u; });
            return (D.unmatched || []).map(r => {
                const u = r.email ? byEmail[String(r.email).toLowerCase()] : null;
                return { ...r, user: u || null, done: !!u && planIsPro(planOf(u.uid)) };
            });
        }
        function unmatchedTable(rows) {
            const money = (r) => typeof r.amount === 'number' ? `${(r.amount / 100).toFixed(2)} ${esc(String(r.currency || '').toUpperCase())}` : '—';
            return `<table class="w-full text-xs"><thead class="text-slate-400 uppercase tracking-wide text-[10px]"><tr><th class="text-left font-bold py-1">Paid</th><th class="text-left font-bold py-1 px-2">Email</th><th class="text-right font-bold py-1 px-2">Amount</th><th class="text-left font-bold py-1 pl-2">Why</th></tr></thead><tbody>${rows.map(r => `<tr class="border-t border-slate-50${r.user ? ' hover:bg-slate-50 cursor-pointer' : ''}"${r.user ? ` onclick="location.hash='#/users/${esc(r.user.uid)}'"` : ''}><td class="py-1.5">${fmtDate(toMs(r.date))}</td><td class="px-2"><span class="font-bold text-slate-700">${esc(r.email || '(no email)')}</span>${r.user ? `<span class="block text-[10px] text-slate-400">Account: ${esc(r.user.name || r.user.uid)}</span>` : ''}</td><td class="px-2 text-right">${money(r)}</td><td class="pl-2">${r.done ? '<span class="px-2 py-0.5 rounded-full text-[9px] font-bold uppercase bg-emerald-100 text-emerald-700">Pro on</span>' : `<span class="text-slate-500">${esc(UNMATCHED_REASON[r.reason] || r.reason || '')}</span><span class="block text-[10px] text-slate-400 font-mono">${esc(r.stripeId || '')}</span>`}</td></tr>`).join('')}</tbody></table>`;
        }
        function paymentsToMatchCard() {
            const rows = unmatchedRows();
            const open = rows.filter(r => !r.done);
            const body = rows.length
                ? `<p class="text-[11px] text-slate-500 mb-2">Stripe payments that couldn't be tied to a Mission Control account. Find the teacher in Users and set Pro with the Plan control (paste the Stripe ID in the note). A row shows "Pro on" once an account with that email is Pro.</p>${unmatchedTable(rows)}`
                : emptyMsg('Nothing to match. Every Stripe payment so far turned Pro on by itself.');
            return card(`Payments to match · ${open.length} open`, body);
        }
        function proTeachersCard() {
            const rows = Object.values(D.plans || {}).filter(p => p.plan === 'pro')
                .sort((a, b) => planUntilMs(b) - planUntilMs(a));
            const body = rows.length ? `<table class="w-full text-xs"><thead class="text-slate-400 uppercase tracking-wide text-[10px]"><tr><th class="text-left font-bold py-1">Teacher</th><th class="text-left font-bold py-1 px-2">Plan</th><th class="text-right font-bold py-1 px-2">Until</th><th class="text-left font-bold py-1 pl-2">Note</th></tr></thead><tbody>${rows.map(p => { const u = userIndex[p.uid]; return `<tr class="border-t border-slate-50 hover:bg-slate-50 cursor-pointer" onclick="location.hash='#/users/${esc(p.uid)}'"><td class="py-1.5"><span class="font-bold text-slate-700">${esc(u ? u.name : p.uid)}</span><span class="block text-[10px] text-slate-400">${esc(u && u.email ? u.email : '')}</span></td><td class="px-2">${planChip(p)}</td><td class="px-2 text-right">${planUntilMs(p) ? new Date(planUntilMs(p)).toLocaleDateString() : '—'}</td><td class="pl-2 text-slate-500">${esc(p.note || '')}</td></tr>`; }).join('')}</tbody></table>`
                : emptyMsg('No Pro teachers yet. Open a teacher in Users and set their plan.');
            return card(`Pro teachers · ${rows.filter(planIsPro).length} active`, body);
        }
        function closeDrawer() {
            $('drawer').classList.add('closed');
            $('drawer-backdrop').classList.add('hidden');
            if (location.hash.startsWith('#/users/')) history.replaceState(null, '', '#/users');
        }
        $('drawer-backdrop').onclick = closeDrawer;

        // ------------------------------------------------------------------
        // PAGE: COURSES
        // ------------------------------------------------------------------
        function renderCourses() {
            return `${errorStrip()}<div class="grid md:grid-cols-2 gap-4">${COURSES.map(c => {
                const s = courseStats(c);

        // ------------------------------------------------------------------
        // CSV EXPORT
        // ------------------------------------------------------------------
        function toCSV(rows, columns) {
            const q = v => { if (v == null) return ''; const s = typeof v === 'object' ? JSON.stringify(v) : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
            return [columns.join(','), ...rows.map(r => columns.map(c => q(typeof r[c] === 'function' ? r[c]() : r[c])).join(','))].join('\n');
        }
        function download(name, text) {
            const blob = new Blob([text], { type: 'text/csv;charset=utf-8' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        }
        const iso = ms => ms ? new Date(ms).toISOString() : '';
        function usersCSVRows(list) {
            return list.map(u => {
                const row = { uid: u.uid, name: u.name, email: u.email || '', type: u.type, role: u.role, ageTier: u.ageTier || '', classroomCode: u.classroomCode || '', recruitCode: u.recruitCode || '', lastLogin: iso(u.lastLoginMs), lastActive: iso(u.lastActiveMs), dashboardLaunches: u.launches.length, sessions: u.sessions.length, totalActiveMinutes: Math.round(u.totalActiveMs / 60000), modulesStarted: u.startedCount, modulesCompleted: u.completedCount };
                COURSES.forEach(c => { const st = u.courseStatus[c.id]; row[c.id + '_status'] = st.status; row[c.id + '_step'] = st.furthestStep; row[c.id + '_bestScore'] = st.bestScore == null ? '' : st.bestScore; row[c.id + '_minutes'] = Math.round(st.activeMs / 60000); });
                return row;
            });
        }
        function exportData(kind) {
            const stamp = new Date().toISOString().slice(0, 10);
            let rows, cols;
            switch (kind) {
                case 'users': rows = usersCSVRows(Object.values(userIndex).filter(u => !u.orphan)); cols = Object.keys(rows[0] || { uid: 1 }); break;
                case 'sessions': rows = D.sessions.map(s => ({ sessionId: s.sessionId || s.id, uid: s.uid, module: s.module, gameName: s.gameName, role: s.role, ageTier: s.ageTier, isGuest: s.isGuest, startedAt: iso(s.startMs), lastSeenAt: iso(s.lastMs), activeMinutes: Math.round((s.activeMs || 0) / 60000 * 10) / 10, maxStep: s.maxStep, stepsTotal: s.stepsTotal, completed: s.completed, device: s.device, entry: s.entry })); cols = ['sessionId', 'uid', 'module', 'gameName', 'role', 'ageTier', 'isGuest', 'startedAt', 'lastSeenAt', 'activeMinutes', 'maxStep', 'stepsTotal', 'completed', 'device', 'entry']; break;
                /* PATTERN LAB ITEM-LEVEL EXPORT (off-funnel, so it is in none of the rows above).
                   One row per answered item: which subtest, which level the item was
                   labelled, whether it was cleared, and which distractor was chosen when it
                   was not. The L11/L12/L13 labels were assigned by design judgment and have
                   never been normed against real students — if a subtest's "L13" items clear
                   at the same rate as its "L11" items, that subtest's levelling is wrong and
                   the bank needs recalibrating. This export is how that gets checked. */
                case 'pattern-lab-items':
                    rows = D.offFunnel.events
                        .filter(e => e.event === 'choice' && e.meta && e.meta.subtest)
                        .map(e => ({
                            ts: iso(e.ms), sessionId: e.sessionId, stream: e.stream || '',
                            itemId: e.meta.itemId || '', subtest: e.meta.subtest,
                            level: e.meta.level, itemType: e.meta.itemType || '',
                            grade: e.meta.grade, servedAt: e.meta.servedAt,
                            correct: e.meta.correct, chosen: e.meta.chosen, answer: e.meta.answer,
                            device: e.device,
                        }));
                    cols = ['ts', 'sessionId', 'stream', 'itemId', 'subtest', 'level', 'itemType', 'grade', 'servedAt', 'correct', 'chosen', 'answer', 'device'];
                    break;
                case 'events': rows = D.events.map(e => ({ ts: iso(e.ms), uid: e.uid, module: e.module, gameName: e.gameName, sessionId: e.sessionId, event: e.event, step: e.step, meta: e.meta, device: e.device, entry: e.entry })); cols = ['ts', 'uid', 'module', 'gameName', 'sessionId', 'event', 'step', 'meta', 'device', 'entry']; break;
                case 'scores': rows = D.scores.map(s => ({ uid: s.uid, sessionId: s.sessionId, gameName: s.gameName, finalScore: s.finalScore, maxScore: s.maxScore, percentage: s.percentage, rank: s.rank, completed: s.completed || s.complete || '', isCertified: s.isCertified || '', lastUpdated: iso(s.ms) })); cols = ['uid', 'sessionId', 'gameName', 'finalScore', 'maxScore', 'percentage', 'rank', 'completed', 'isCertified', 'lastUpdated']; break;
                case 'attempts': rows = D.attempts.map(a => ({ uid: a.uid, sessionId: a.sessionId, gameName: a.course ? a.course.name : '', scenarioIndex: a.scenarioIndex, question: a.question, choiceIndex: a.choiceIndex, score: a.score, effectiveness: a.effectiveness, cashImpact: a.cashImpact, timestamp: iso(a.ms) })); cols = ['uid', 'sessionId', 'gameName', 'scenarioIndex', 'question', 'choiceIndex', 'score', 'effectiveness', 'cashImpact', 'timestamp']; break;
                case 'launches': rows = D.launches.map(l => ({ uid: l.uid, courseName: l.courseName, targetUrl: l.targetUrl, timestamp: iso(l.ms) })); cols = ['uid', 'courseName', 'targetUrl', 'timestamp']; break;
                case 'feedback': rows = D.feedback.map(f => ({ uid: f.uid, name: f.name, gameName: f.gameName, rating: f.rating, feedback: f.feedback, timestamp: iso(f.ms) })); cols = ['uid', 'name', 'gameName', 'rating', 'feedback', 'timestamp']; break;
                case 'messages': rows = D.messages.map(m => ({ senderUid: m.senderUid, senderName: m.senderName, senderEmail: m.senderEmail, replyTo: m.replyTo || '', source: m.source, message: m.message, isGuest: m.isGuest, timestamp: iso(m.ms) })); cols = ['senderUid', 'senderName', 'senderEmail', 'source', 'message', 'isGuest', 'timestamp']; break;
                default: return;
            }
            download(`insider-${kind}-${stamp}.csv`, toCSV(rows, cols));
        }

        // ------------------------------------------------------------------
        // PAGE EVENT BINDING
        // ------------------------------------------------------------------
        function bindPage(page, arg) {
            const p = $('page');
            if (page === 'users') {
                p.querySelector('#user-filters').addEventListener('click', (e) => { const b = e.target.closest('[data-filter]'); if (!b) return; usersView.filter = b.dataset.filter; route(); });
                p.querySelector('#user-sort').addEventListener('change', (e) => { usersView.sort = e.target.value; usersView.dir = e.target.value === 'name' ? 'asc' : 'desc'; route(); });
                let t; p.querySelector('#user-search').addEventListener('input', (e) => { clearTimeout(t); t = setTimeout(() => { usersView.search = e.target.value; const pos = e.target.selectionStart; route(); const inp = $('user-search'); inp.focus(); inp.setSelectionRange(pos, pos); }, 250); });
                p.querySelector('#btn-export-users').onclick = () => { const rows = usersCSVRows(filteredUsers()); download(`insider-users-${usersView.filter}-${new Date().toISOString().slice(0, 10)}.csv`, toCSV(rows, Object.keys(rows[0] || { uid: 1 }))); };
                p.querySelectorAll('tr[data-uid]').forEach(tr => tr.onclick = () => { location.hash = '#/users/' + tr.dataset.uid; });
            }
            if (page === 'courses' && arg) {
                const b = p.querySelector('#btn-export-course');
                if (b) b.onclick = () => { const c = courseBySlug[arg]; const rows = usersCSVRows(Object.values(userIndex).filter(u => u.courseStatus[c.id].status !== 'not_started')); download(`insider-${c.id}-learners-${new Date().toISOString().slice(0, 10)}.csv`, toCSV(rows, Object.keys(rows[0] || { uid: 1 }))); };
            }
            if (page === 'inbox') {
                p.querySelector('#inbox-source').addEventListener('change', (e) => { inboxView.source = e.target.value; route(); });
                let t; p.querySelector('#inbox-search').addEventListener('input', (e) => { clearTimeout(t); t = setTimeout(() => { inboxView.search = e.target.value; const pos = e.target.selectionStart; route(); const inp = $('inbox-search'); inp.focus(); inp.setSelectionRange(pos, pos); }, 250); });
            }
            if (page === 'feedback') {
                p.querySelector('#feedback-course').addEventListener('change', (e) => { feedbackView.course = e.target.value; route(); });
            }
            if (page === 'tools') {
                p.querySelectorAll('[data-export]').forEach(b => b.onclick = () => exportData(b.dataset.export));
                p.querySelector('#btn-delete-user').onclick = () => deleteUserData($('delete-uid-input').value.trim(), $('delete-status'));
            }
        }

        // ------------------------------------------------------------------
        // DELETION-REQUEST TOOL: removes every record tied to a uid.
        // ------------------------------------------------------------------
        async function deleteUserData(uid, statusEl) {
            statusEl.className = 'text-xs mt-2 text-slate-400';
            if (!uid) { statusEl.textContent = 'Enter a UID first.'; statusEl.className = 'text-xs mt-2 text-red-500'; return; }
            const u = userIndex[uid];
            if (!confirm(`Permanently delete ALL data for ${u ? u.name + ' (' + uid + ')' : uid}? This cannot be undone.`)) return;
            statusEl.textContent = 'Deleting…';
            try {
                let n = 0;
                const wipe = async (snap) => { for (const d of snap.docs) { await deleteDoc(d.ref); n++; } };
                for (const sub of ['game_scores', 'launches', 'feedback_inbox', 'module_progress', 'continuity_bank']) {
                    const subSnap = await getDocs(collection(db, 'artifacts', appId, 'users', uid, sub));
                    for (const d of subSnap.docs) {
                        if (sub === 'game_scores') await wipe(await getDocs(collection(d.ref, 'scenario_attempts')));
                        await deleteDoc(d.ref); n++;
                    }
                }
                await wipe(await getDocs(query(collection(db, 'artifacts', appId, 'messages'), where('senderUid', '==', uid))));
                await wipe(await getDocs(query(collection(db, 'artifacts', appId, 'course_feedback'), where('uid', '==', uid))));
                await wipe(await getDocs(query(collection(db, 'artifacts', appId, 'sessions'), where('uid', '==', uid))));
                await wipe(await getDocs(query(collection(db, 'artifacts', appId, 'events'), where('uid', '==', uid))));
                if (u && u.recruitCode) { try { await deleteDoc(doc(db, 'artifacts', appId, 'recruit_codes', u.recruitCode)); n++; } catch (e) { console.warn('recruit code delete failed', e); } }
                await deleteDoc(doc(db, 'artifacts', appId, 'users', uid)); n++;
                statusEl.textContent = `Done — deleted ${n} record(s) for ${uid}. Reloading…`;
                statusEl.className = 'text-xs mt-2 text-emerald-600';
                closeDrawer();
                await loadEverything(); route();
            } catch (e) {
                console.error('Deletion failed', e);
                statusEl.textContent = 'Deletion failed — check the browser console.';
                statusEl.className = 'text-xs mt-2 text-red-500';
            }
        }

        if (window.lucide) lucide.createIcons();
    </script>
