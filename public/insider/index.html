                    <div class="lg:col-span-2">${card('By course', byCourse.length ? `<div class="grid sm:grid-cols-2 gap-2">${byCourse.map(b => `<div class="border border-slate-100 rounded p-3 flex items-center justify-between"><span class="text-xs font-bold text-slate-700">${esc(b.n)}</span><span class="text-xs text-slate-500">${b.avg ? b.avg + '★' : '—'} <span class="text-slate-400">(${b.count})</span></span></div>`).join('')}</div><p class="text-[10px] text-slate-400 mt-3">Only modules that show the end-of-module rating prompt appear here (Digital Decisions today). Wiring the same prompt into Jolene's and the labs would fill the rest in.</p>` : emptyMsg('No course feedback yet.'))}</div>
                </div>
                ${card(`Comments · ${list.length}`, list.length ? list.map(feedbackRow).join('') : emptyMsg('No feedback matches.'), `<select id="feedback-course" class="border border-slate-200 rounded px-2 py-1 text-xs"><option value="all">All courses</option>${names.map(n => `<option value="${esc(n)}" ${feedbackView.course === n ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>`)}`;
        }

        // ------------------------------------------------------------------
        // PAGE: TOOLS
        // ------------------------------------------------------------------
        function renderTools() {
            const src = (name, n) => `<div class="flex items-center justify-between text-xs border-b border-slate-50 py-1.5"><span class="font-mono text-slate-600">${name}</span><span>${D.errors[name] ? `<span class="text-amber-600 font-bold">error</span>` : `<span class="text-slate-700 font-bold">${n}</span> <span class="text-slate-400">docs</span>`}</span></div>`;
            return errorStrip() + `
                <div class="grid lg:grid-cols-2 gap-4">
                    ${card('Export to your BI tool', `
                        <p class="text-xs text-slate-500 mb-3">Each button downloads a CSV you can drop into Google Sheets, Looker Studio, Excel or any BI tool. Column names match the Firestore fields.</p>
                        <div class="flex flex-wrap gap-2">
                            ${[['users', 'Users (with rollups)'], ['sessions', 'Sessions (time on task)'], ['events', 'Events (raw stream)'], ['scores', 'Scores'], ['attempts', 'Scenario attempts'], ['launches', 'Launches'], ['feedback', 'Course feedback'], ['messages', 'Messages']].map(([k, l]) => `<button data-export="${k}" class="text-[10px] font-bold uppercase tracking-wide border border-slate-200 rounded px-3 py-1.5 hover:border-[#357889] hover:text-[#357889]">${l}</button>`).join('')}
                        </div>
                        <p class="text-[10px] text-slate-400 mt-3">For live, always-on dashboards instead of exports, see <span class="font-mono">docs/insider-analytics.md</span> in the repo — it walks through the Firestore → BigQuery → Looker Studio path.</p>`)}
                    ${card('Data sources loaded', `${src('users', D.users.length)}${src('classrooms', D.classrooms.length)}${src('launches', D.launches.length)}${src('game_scores', D.scores.length)}${src('scenario_attempts', D.attempts.length)}${src('module_progress', D.progress.length)}${src('sessions', D.sessions.length)}${src('events', D.events.length)}${src('messages', D.messages.length)}${src('course_feedback', D.feedback.length)}<p class="text-[10px] text-slate-400 mt-3">Loaded ${D.loadedAt ? new Date(D.loadedAt).toLocaleString() : '—'}. Sessions and events are capped at the most recent 5,000 / 3,000.</p>`)}
                </div>
                <div class="mt-4">${card('Delete a user\'s data', `
                    <p class="text-[11px] text-slate-500 mb-3">Permanently deletes a user's profile, scores, launches, progress, continuity bank, telemetry sessions/events, messages, feedback and recruit code. Use only to fulfil a deletion request — this cannot be undone. You can also do this from any user's profile drawer.</p>
                    <div class="flex flex-col sm:flex-row gap-3">
                        <input id="delete-uid-input" type="text" placeholder="User UID" class="flex-1 border border-slate-200 rounded px-3 py-2 text-xs font-mono focus:outline-none focus:border-red-400">
                        <button id="btn-delete-user" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded text-xs uppercase tracking-wide">Delete user's data</button>
                    </div>
                    <p id="delete-status" class="text-xs mt-3"></p>`)}</div>`;
        }

        // ------------------------------------------------------------------
        // CSV EXPORT
        // ------------------------------------------------------------------
        function toCSV(rows, columns) {
            const q = v => { if (v == null) return ''; const s = typeof v === 'object' ? JSON.stringify(v) : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
            return [columns.join(','), ...rows.map(r => columns.map(c => q(typeof r[c] === 'function' ? r[c]() : r[c])).join(','))].join('\n');
        }
        function download(name, text) {
            const blob = new Blob([text], { type: 'text/csv;charset=utf-8' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        }
        const iso = ms => ms ? new Date(ms).toISOString() : '';
        function usersCSVRows(list) {
            return list.map(u => {
                const row = { uid: u.uid, name: u.name, email: u.email || '', type: u.type, role: u.role, ageTier: u.ageTier || '', classroomCode: u.classroomCode || '', recruitCode: u.recruitCode || '', lastLogin: iso(u.lastLoginMs), lastActive: iso(u.lastActiveMs), dashboardLaunches: u.launches.length, sessions: u.sessions.length, totalActiveMinutes: Math.round(u.totalActiveMs / 60000), modulesStarted: u.startedCount, modulesCompleted: u.completedCount };
                COURSES.forEach(c => { const st = u.courseStatus[c.id]; row[c.id + '_status'] = st.status; row[c.id + '_step'] = st.furthestStep; row[c.id + '_bestScore'] = st.bestScore == null ? '' : st.bestScore; row[c.id + '_minutes'] = Math.round(st.activeMs / 60000); });
                return row;
            });
        }
        function exportData(kind) {
            const stamp = new Date().toISOString().slice(0, 10);
            let rows, cols;
            switch (kind) {
                case 'users': rows = usersCSVRows(Object.values(userIndex).filter(u => !u.orphan)); cols = Object.keys(rows[0] || { uid: 1 }); break;
                case 'sessions': rows = D.sessions.map(s => ({ sessionId: s.sessionId || s.id, uid: s.uid, module: s.module, gameName: s.gameName, role: s.role, ageTier: s.ageTier, isGuest: s.isGuest, startedAt: iso(s.startMs), lastSeenAt: iso(s.lastMs), activeMinutes: Math.round((s.activeMs || 0) / 60000 * 10) / 10, maxStep: s.maxStep, stepsTotal: s.stepsTotal, completed: s.completed, device: s.device, entry: s.entry })); cols = ['sessionId', 'uid', 'module', 'gameName', 'role', 'ageTier', 'isGuest', 'startedAt', 'lastSeenAt', 'activeMinutes', 'maxStep', 'stepsTotal', 'completed', 'device', 'entry']; break;
                case 'events': rows = D.events.map(e => ({ ts: iso(e.ms), uid: e.uid, module: e.module, gameName: e.gameName, sessionId: e.sessionId, event: e.event, step: e.step, meta: e.meta, device: e.device, entry: e.entry })); cols = ['ts', 'uid', 'module', 'gameName', 'sessionId', 'event', 'step', 'meta', 'device', 'entry']; break;
                case 'scores': rows = D.scores.map(s => ({ uid: s.uid, sessionId: s.sessionId, gameName: s.gameName, finalScore: s.finalScore, maxScore: s.maxScore, percentage: s.percentage, rank: s.rank, completed: s.completed || s.complete || '', isCertified: s.isCertified || '', lastUpdated: iso(s.ms) })); cols = ['uid', 'sessionId', 'gameName', 'finalScore', 'maxScore', 'percentage', 'rank', 'completed', 'isCertified', 'lastUpdated']; break;
                case 'attempts': rows = D.attempts.map(a => ({ uid: a.uid, sessionId: a.sessionId, gameName: a.course ? a.course.name : '', scenarioIndex: a.scenarioIndex, question: a.question, choiceIndex: a.choiceIndex, score: a.score, effectiveness: a.effectiveness, cashImpact: a.cashImpact, timestamp: iso(a.ms) })); cols = ['uid', 'sessionId', 'gameName', 'scenarioIndex', 'question', 'choiceIndex', 'score', 'effectiveness', 'cashImpact', 'timestamp']; break;
                case 'launches': rows = D.launches.map(l => ({ uid: l.uid, courseName: l.courseName, targetUrl: l.targetUrl, timestamp: iso(l.ms) })); cols = ['uid', 'courseName', 'targetUrl', 'timestamp']; break;
                case 'feedback': rows = D.feedback.map(f => ({ uid: f.uid, name: f.name, gameName: f.gameName, rating: f.rating, feedback: f.feedback, timestamp: iso(f.ms) })); cols = ['uid', 'name', 'gameName', 'rating', 'feedback', 'timestamp']; break;
                case 'messages': rows = D.messages.map(m => ({ senderUid: m.senderUid, senderName: m.senderName, senderEmail: m.senderEmail, source: m.source, message: m.message, isGuest: m.isGuest, timestamp: iso(m.ms) })); cols = ['senderUid', 'senderName', 'senderEmail', 'source', 'message', 'isGuest', 'timestamp']; break;
                default: return;
            }
            download(`insider-${kind}-${stamp}.csv`, toCSV(rows, cols));
        }

        // ------------------------------------------------------------------
        // PAGE EVENT BINDING
        // ------------------------------------------------------------------
        function bindPage(page, arg) {
            const p = $('page');
            if (page === 'users') {
                p.querySelector('#user-filters').addEventListener('click', (e) => { const b = e.target.closest('[data-filter]'); if (!b) return; usersView.filter = b.dataset.filter; route(); });
                p.querySelector('#user-sort').addEventListener('change', (e) => { usersView.sort = e.target.value; usersView.dir = e.target.value === 'name' ? 'asc' : 'desc'; route(); });
                let t; p.querySelector('#user-search').addEventListener('input', (e) => { clearTimeout(t); t = setTimeout(() => { usersView.search = e.target.value; const pos = e.target.selectionStart; route(); const inp = $('user-search'); inp.focus(); inp.setSelectionRange(pos, pos); }, 250); });
                p.querySelector('#btn-export-users').onclick = () => { const rows = usersCSVRows(filteredUsers()); download(`insider-users-${usersView.filter}-${new Date().toISOString().slice(0, 10)}.csv`, toCSV(rows, Object.keys(rows[0] || { uid: 1 }))); };
                p.querySelectorAll('tr[data-uid]').forEach(tr => tr.onclick = () => { location.hash = '#/users/' + tr.dataset.uid; });
            }
            if (page === 'courses' && arg) {
                const b = p.querySelector('#btn-export-course');
                if (b) b.onclick = () => { const c = courseBySlug[arg]; const rows = usersCSVRows(Object.values(userIndex).filter(u => u.courseStatus[c.id].status !== 'not_started')); download(`insider-${c.id}-learners-${new Date().toISOString().slice(0, 10)}.csv`, toCSV(rows, Object.keys(rows[0] || { uid: 1 }))); };
            }
            if (page === 'inbox') {
                p.querySelector('#inbox-source').addEventListener('change', (e) => { inboxView.source = e.target.value; route(); });
                let t; p.querySelector('#inbox-search').addEventListener('input', (e) => { clearTimeout(t); t = setTimeout(() => { inboxView.search = e.target.value; const pos = e.target.selectionStart; route(); const inp = $('inbox-search'); inp.focus(); inp.setSelectionRange(pos, pos); }, 250); });
            }
            if (page === 'feedback') {
                p.querySelector('#feedback-course').addEventListener('change', (e) => { feedbackView.course = e.target.value; route(); });
            }
            if (page === 'tools') {
                p.querySelectorAll('[data-export]').forEach(b => b.onclick = () => exportData(b.dataset.export));
                p.querySelector('#btn-delete-user').onclick = () => deleteUserData($('delete-uid-input').value.trim(), $('delete-status'));
            }
        }

        // ------------------------------------------------------------------
        // DELETION-REQUEST TOOL: removes every record tied to a uid.
        // ------------------------------------------------------------------
        async function deleteUserData(uid, statusEl) {
            statusEl.className = 'text-xs mt-2 text-slate-400';
            if (!uid) { statusEl.textContent = 'Enter a UID first.'; statusEl.className = 'text-xs mt-2 text-red-500'; return; }
            const u = userIndex[uid];
            if (!confirm(`Permanently delete ALL data for ${u ? u.name + ' (' + uid + ')' : uid}? This cannot be undone.`)) return;
            statusEl.textContent = 'Deleting…';
            try {
                let n = 0;
                const wipe = async (snap) => { for (const d of snap.docs) { await deleteDoc(d.ref); n++; } };
                for (const sub of ['game_scores', 'launches', 'feedback_inbox', 'module_progress', 'continuity_bank']) {
                    const subSnap = await getDocs(collection(db, 'artifacts', appId, 'users', uid, sub));
                    for (const d of subSnap.docs) {
                        if (sub === 'game_scores') await wipe(await getDocs(collection(d.ref, 'scenario_attempts')));
                        await deleteDoc(d.ref); n++;
                    }
                }
                await wipe(await getDocs(query(collection(db, 'artifacts', appId, 'messages'), where('senderUid', '==', uid))));
                await wipe(await getDocs(query(collection(db, 'artifacts', appId, 'course_feedback'), where('uid', '==', uid))));
                await wipe(await getDocs(query(collection(db, 'artifacts', appId, 'sessions'), where('uid', '==', uid))));
                await wipe(await getDocs(query(collection(db, 'artifacts', appId, 'events'), where('uid', '==', uid))));
                if (u && u.recruitCode) { try { await deleteDoc(doc(db, 'artifacts', appId, 'recruit_codes', u.recruitCode)); n++; } catch (e) { console.warn('recruit code delete failed', e); } }
                await deleteDoc(doc(db, 'artifacts', appId, 'users', uid)); n++;
                statusEl.textContent = `Done — deleted ${n} record(s) for ${uid}. Reloading…`;
                statusEl.className = 'text-xs mt-2 text-emerald-600';
                closeDrawer();
                await loadEverything(); route();
            } catch (e) {
                console.error('Deletion failed', e);
                statusEl.textContent = 'Deletion failed — check the browser console.';
                statusEl.className = 'text-xs mt-2 text-red-500';
            }
        }

        if (window.lucide) lucide.createIcons();
    </script>
</body>
</html>
